<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque Rallye — Roadbook, Leg 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23F8F4E8'/%3E%3Ccircle cx='32' cy='50' r='4' fill='%23221F1A'/%3E%3Cpath d='M32 50V22l16-10' fill='none' stroke='%23C93A2E' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --cock:#26221C;--roll:#F8F4E8;--roll2:#EDE6D2;--ink:#221F1A;--mut:#7A7364;
  --red:#C93A2E;--red-dk:#9C2B21;--line:#CFC5A8;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--cock) radial-gradient(ellipse at 50% -10%,rgba(120,100,70,.4),transparent 55%);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(201,58,46,.4)}
a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--red);word-break:break-word}
a:hover{color:var(--red);border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

/* the roll of paper */
.roll{max-width:780px;margin:26px auto 84px;position:relative}
.roll::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:70%;height:14px;background:var(--roll);border-radius:50% 50% 0 0/100% 100% 0 0;
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.15)}
.rollin{
  background:var(--roll);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 60px rgba(180,165,120,.18);
  padding:clamp(14px,3.4vw,34px) clamp(12px,3.4vw,32px);
  border-left:1px solid var(--line);border-right:1px solid var(--line);
}
.rollin::before{content:"";display:block;height:6px;margin:-8px -6px 14px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 20px);opacity:.15}

.plate{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:4px}
.plate .ev{font-family:var(--mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--red)}
.plate h1{font-size:clamp(26px,6vw,42px);font-weight:900;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.plate .leg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

section{margin-top:22px}
.sect-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sect-h .bx{font-family:var(--mono);font-size:10px;letter-spacing:.16em;background:var(--ink);color:var(--roll);padding:2px 8px;text-transform:uppercase}
.sect-h h2{font-size:clamp(16px,3.6vw,22px);font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.sect-h .sub{margin-left:auto;font-size:12px;color:var(--mut);font-style:italic}
.tray{border:2px solid var(--ink);background:rgba(255,255,255,.35)}

/* 0.00 — start control (ask) */
.start{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:14px}
@media(max-width:520px){.start{grid-template-columns:1fr}}
.kmcell{border-right:2px solid var(--ink);padding-right:12px;text-align:right}
.kmcell b{display:block;font-family:var(--mono);font-size:clamp(19px,4.4vw,26px);font-weight:700}
.kmcell span{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.start .tt{font-size:clamp(19px,4.6vw,29px);font-weight:900;text-transform:uppercase;line-height:1.08}
.start .org{margin-top:5px;font-size:13px}
.start .desc{margin-top:6px;font-size:12.5px;font-style:italic;color:var(--mut);max-width:56ch}
.start .flag{display:inline-block;margin-top:8px;background:var(--ink);color:var(--roll);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:3px 10px}

/* crew notes = audience */
.notes{display:grid;grid-template-columns:.9fr 1.1fr;gap:0}
@media(max-width:640px){.notes{grid-template-columns:1fr}}
.notes .L{padding:14px;border-right:2px solid var(--ink)}
@media(max-width:640px){.notes .L{border-right:none;border-bottom:2px solid var(--ink)}}
.notes .R{padding:14px}
.notes .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--red)}
.notes .lean{font-size:clamp(22px,5vw,34px);font-weight:900;text-transform:uppercase;line-height:1.04}
.notes .conf{margin-top:6px;font-family:var(--mono);font-size:12px}
.notes .conf b{color:var(--red);font-size:16px}
.notes .sig{margin-top:8px;font-size:12px;color:var(--mut)}
.notes .sig b{color:var(--ink)}
.called{margin-top:8px;font-size:12.5px;font-style:italic}
.called b{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.hab{display:grid;gap:0}
.hab .rw{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.hab .rw:last-child{border-bottom:none}
.hab .ch{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.hab .nt{font-size:12.5px;font-style:italic;color:var(--mut)}

/* roadbook rows = strategies */
.rbook{border:2px solid var(--ink)}
.rbrow{display:grid;grid-template-columns:84px 66px 1fr 128px;gap:12px;align-items:center;
  padding:10px 12px;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.35)}
.rbrow:nth-child(odd){background:rgba(255,255,255,.6)}
.rbrow:last-child{border-bottom:none}
.rbrow.sel{background:rgba(201,58,46,.08)}
.rbrow .tu{border:2px solid var(--ink);background:var(--roll);width:60px;height:60px;position:relative}
.rbrow.sel .tu::after{content:"";position:absolute;inset:-6px;border:3px solid var(--red);border-radius:50%;
  transform:rotate(-8deg);opacity:.9;pointer-events:none}
.rbrow .nt .nm{font-size:clamp(15px,3.2vw,19px);font-weight:900;text-transform:uppercase;line-height:1.08}
.rbrow .nt .an{font-size:11.5px;font-style:italic;color:var(--mut)}
.rbrow .nt .rw{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:5px;font-size:11px}
.rbrow .nt .rw .ch{font-family:var(--mono);font-size:10px}
.rbrow .nt .rw .ch b{color:var(--red)}
.rbrow .nt .rw .ch i{color:var(--mut);font-style:italic}
.rbrow .nt .fm{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.rbrow .nt .wn{font-size:11px;font-style:italic;color:var(--red-dk);margin-top:4px}
.rbrow .nt .wn::before{content:"▲ ";font-style:normal}
.rbrow .tc{text-align:right;border-left:1.5px dashed var(--line);padding-left:10px}
.rbrow .tc .tt2{font-family:var(--mono);font-size:clamp(15px,3.4vw,19px);font-weight:700}
.rbrow .tc .tt2 span{font-size:10px;color:var(--mut);display:block;letter-spacing:.14em;text-transform:uppercase}
.rbrow .tc .fit{margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--mut)}
.rbrow .tc .fit b{color:var(--red)}
@media(max-width:640px){
  .rbrow{grid-template-columns:64px 66px 1fr}
  .rbrow .tc{grid-column:3;border-left:none;border-top:1.5px dashed var(--line);text-align:left;padding:8px 0 0;display:flex;gap:14px;align-items:baseline}
  .kmcell{border-right:none;border-bottom:2px solid var(--ink);text-align:left;padding:0 0 4px}
}

/* scrubbed notes = ruled out */
.scrub{display:grid;gap:8px;padding:10px}
.scrow{border:2px solid var(--mut);background:repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0 8px,transparent 8px 16px);
  padding:9px 14px;display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;opacity:.75}
.scrow .no{font-family:var(--mono);font-size:11px;color:var(--mut)}
.scrow .nm{font-weight:800;text-transform:uppercase;font-size:14px}
.scrow .nm s{text-decoration-color:var(--red);text-decoration-thickness:2.5px}
.scrow .why{font-size:11.5px;font-style:italic;color:var(--mut)}
.scrow .st{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--red);border:2px solid var(--red);
  padding:3px 8px;transform:rotate(4deg);text-transform:uppercase;white-space:nowrap}
@media(max-width:560px){.scrow{grid-template-columns:1fr}.scrow .st{justify-self:start}}

/* service park = brief + creatives */
.svc{display:grid;grid-template-columns:.92fr 1.08fr;gap:0}
@media(max-width:720px){.svc{grid-template-columns:1fr}}
.svcard{padding:16px;border-right:2px solid var(--ink)}
@media(max-width:720px){.svcard{border-right:none;border-bottom:2px solid var(--ink)}}
.svcard .no1{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--red)}
.svcard h3{font-size:clamp(19px,4.4vw,27px);font-weight:900;text-transform:uppercase;line-height:1.06;margin-top:3px}
.svcard .ang{font-size:12.5px;font-style:italic;color:var(--mut);margin-top:4px}
.svcard dl{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;margin-top:12px;font-size:12.5px}
.svcard dt{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);padding-top:4px}
.svcard dd{border-bottom:1px solid var(--line);padding-bottom:6px}
.svcard .km{font-weight:800;font-size:14.5px}
.svcard .ok{margin-top:12px;display:inline-block;border:2.5px solid var(--red);color:var(--red);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:4px 12px;transform:rotate(-3deg)}
.parc{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;align-content:start}
@media(max-width:430px){.parc{grid-template-columns:1fr}}
.pf{border:2px solid var(--ink);background:#fff;padding:5px 5px 7px;transition:transform .14s ease}
.pf:hover{transform:translateY(-3px) rotate(.5deg)}
.pf .iw{aspect-ratio:4/3;overflow:hidden;background:var(--roll2)}
.pf img{width:100%;height:100%;object-fit:cover}
.pf .h{font-size:11.5px;font-weight:600;line-height:1.3;margin-top:6px}
.pf .p{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:2px}
.pf .p b{border:1.5px solid var(--red);padding:0 5px;font-weight:400}
.pcap{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);padding:10px 12px 0}

/* livery = palette */
.livery{display:flex;flex-wrap:wrap;gap:16px;padding:14px;align-items:flex-end}
.liv{width:104px}
.liv .sw{height:30px;border:2px solid var(--ink);
  background:repeating-linear-gradient(-45deg,var(--c) 0 10px,var(--roll) 10px 20px)}
.liv .n{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:5px}
.liv .hx{font-family:var(--mono);font-size:9px;color:var(--mut)}
.livery .fnote{width:100%;font-size:11.5px;font-style:italic;color:var(--mut)}

/* time controls = qloo stamps */
.tcs{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(12px,3vw,24px);padding:14px;align-items:start}
@media(max-width:720px){.tcs{grid-template-columns:1fr}}
.stamps{display:flex;flex-wrap:wrap;gap:12px}
.stp{width:150px;border:2.5px solid var(--red);color:var(--red);padding:8px 10px;text-align:center;
  font-family:var(--mono);border-radius:4px;transform:rotate(var(--r,-2deg));opacity:.92}
.stp .ep{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;border-bottom:1.5px solid var(--red);padding-bottom:4px}
.stp .tm2{font-size:13px;font-weight:700;margin-top:5px}
.stp .ms{font-size:9px;letter-spacing:.1em;margin-top:2px}
.stp .md{display:inline-block;border:1.5px solid var(--red);font-size:8px;letter-spacing:.18em;padding:0 6px;margin-top:5px;text-transform:uppercase}
.stamps .note{width:100%;font-size:11.5px;font-style:italic;color:var(--mut)}
.hot{border:2px solid var(--ink);background:rgba(255,255,255,.4);padding:12px 16px}
.hot h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.hot .dv{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em;border-bottom:1.5px solid var(--line);padding:6px 0 2px}
.hot .rw{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
.hot .rw:last-child{border-bottom:none}
.hot .rw .v{font-family:var(--mono);font-size:11px;color:var(--mut)}

/* next = regs */
.regs{display:flex;flex-wrap:wrap;gap:10px;padding:14px}
.regs button{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:9px 18px;
  font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;
  transition:background .12s ease,color .12s ease,transform .12s ease}
.regs button:hover{background:var(--ink);color:var(--roll)}
.regs button:active{transform:translateY(2px)}
.regs .sub{width:100%;font-style:italic;color:var(--mut);font-size:12.5px}
.alsoc{margin-top:10px;padding:0 14px 14px;font-size:12.5px;color:var(--mut)}
.alsoc b{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:4px}
.alsoc span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dotted var(--mut)}
.foot{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--roll);opacity:.6;margin-top:26px}
.empty{border:2px solid var(--ink);padding:40px;text-align:center;font-style:italic;color:var(--mut);margin-top:20px}
</style>
</head>
<body>
<div class="roll">
  <div class="rollin">
    <header class="plate">
      <div class="ev">Rallye Marque · route approved</div>
      <h1>Roadbook</h1>
      <div class="leg" id="leg">—</div>
    </header>
    <main id="app"></main>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script src="./data.js"></script>
<script src="./media-data.js"></script>
<script src="./dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'./'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dshort=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}catch(e){return '—'}};

const PALETTE=[
  {n:'Marker Red',h:'#C93A2E'},{n:'Roll Paper',h:'#F8F4E8'},{n:'Kraft Dash',h:'#26221C'},
  {n:'Dust Note',h:'#CFC5A8'},{n:'Fuel Grey',h:'#7A7364'}
];
const CREAT=[6,2,10,12].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];
const DATE=dshort(B.createdAt||B.fetchedAt);
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
const prompt=((B.sub&&B.sub.prompt)||B.title||'').trim();

/* tulip diagrams — ball at bottom = entry, heavy arrow = direction to leave */
const TULIPS=[
 '<svg viewBox="0 0 60 60" width="56" height="56"><line x1="8" y1="30" x2="24" y2="30" stroke="var(--mut)" stroke-width="2"/><line x1="36" y1="30" x2="52" y2="30" stroke="var(--mut)" stroke-width="2"/><circle cx="30" cy="52" r="3.4" fill="var(--ink)"/><path d="M30 52V14" stroke="var(--ink)" stroke-width="3.4" fill="none"/><path d="M30 8l-5 9h10z" fill="var(--red)"/></svg>',
 '<svg viewBox="0 0 60 60" width="56" height="56"><line x1="30" y1="30" x2="52" y2="30" stroke="var(--mut)" stroke-width="2"/><line x1="46" y1="18" x2="46" y2="42" stroke="var(--mut)" stroke-width="2"/><circle cx="30" cy="52" r="3.4" fill="var(--ink)"/><path d="M30 52V30H14" stroke="var(--ink)" stroke-width="3.4" fill="none"/><path d="M8 30l9-5v10z" fill="var(--red)"/></svg>',
 '<svg viewBox="0 0 60 60" width="56" height="56"><line x1="30" y1="40" x2="30" y2="14" stroke="var(--mut)" stroke-width="2"/><circle cx="30" cy="52" r="3.4" fill="var(--ink)"/><path d="M30 52V38L48 16" stroke="var(--ink)" stroke-width="3.4" fill="none"/><path d="M53 10l-9 3 6 7z" fill="var(--red)"/></svg>',
 '<svg viewBox="0 0 60 60" width="56" height="56"><circle cx="30" cy="30" r="11" fill="none" stroke="var(--mut)" stroke-width="2"/><line x1="19" y1="30" x2="8" y2="30" stroke="var(--mut)" stroke-width="2"/><line x1="30" y1="19" x2="30" y2="10" stroke="var(--mut)" stroke-width="2"/><circle cx="30" cy="52" r="3.4" fill="var(--ink)"/><path d="M30 52V41M37 24L50 12" stroke="var(--ink)" stroke-width="3.4" fill="none"/><path d="M54 8l-9 2 5 8z" fill="var(--red)"/></svg>'];

document.getElementById('leg').innerHTML='<span>LEG 1 · SECTION A</span><span>ROLL '+esc(String(B.id||'').slice(0,4).toUpperCase())+'</span><span>ISSUED '+DATE+'</span><span>READ BOTTOM-UP ONLY IN FOG</span>';
document.getElementById('foot').textContent='RALLYE MARQUE · THE ORGANISER\'S WORD IS FINAL';

const M=document.getElementById('app');
const sec=(bx,title,sub,inner)=>{if(!inner)return;
  M.appendChild(el('<section><div class="sect-h"><span class="bx">'+esc(bx)+'</span><h2>'+esc(title)+'</h2><span class="sub">'+esc(sub)+'</span></div><div class="tray">'+inner+'</div></section>'))};

/* km 0.00 = ask */
sec('0.00','Start Control','crew signs on here — the clock is running',
'<div class="start"><div class="kmcell"><b>0.00</b><span>km · TC-0</span></div>'+
'<div><div class="tt">'+esc(prompt)+'</div>'+
'<div class="org">Organiser '+(U?'<a href="'+esc(U)+'">'+esc(U)+'</a>':'—')+' · entrant '+esc((B.urlContext&&B.urlContext.title)||'—')+'</div>'+
'<p class="desc">'+esc(((B.urlContext&&B.urlContext.description)||''))+'</p>'+
'<span class="flag">Start order '+esc(String(B.id||'').slice(0,4).toUpperCase())+' · '+esc(DATE)+'</span></div></div>');

/* crew notes = audience */
if(AR&&AR.lean){
  const conf=Math.round((AR.lean.confidence||0)*100);
  sec('NOTES','Crew Notes — read of the ground','the co-driver\'s survey before the flag drops',
  '<div class="notes"><div class="L">'+
  '<div class="lbl">Surface read</div><div class="lean">'+esc(AR.lean.label)+'</div>'+
  '<div class="conf">pace-note confidence <b>'+conf+'%</b></div>'+
  '<div class="sig"><b>Recce tells:</b> '+(AR.lean.signals||[]).map(s=>esc(s)).join(' · ')+'</div>'+
  '<div class="called"><b>Called notes</b>'+(AR.vibeWords||[]).map(w=>esc(w)).join(' · ')+'</div>'+
  '</div><div class="R"><div class="lbl" style="margin-bottom:6px">Terrain they run fastest</div>'+
  '<div class="hab">'+(AR.mediaHabits||[]).map(h=>'<div class="rw"><span class="ch">'+esc(h.channel)+'</span><span class="nt">'+esc(h.note)+'</span></div>').join('')+'</div>'+
  '</div></div>');
}

/* roadbook = strategies */
if(strats.length){
  let km=0;
  const rows=strats.map((s,i)=>{
    km+=((s.reach&&s.reach.estViews)||0)/100000; // cumulative stage km
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    const tgt=Math.round(25+((s.reach&&s.reach.estViews)||0)/10000); // target minutes flavour
    return '<div class="rbrow'+(i===sel?' sel':'')+'">'+
    '<div class="kmcell"><b>'+km.toFixed(2)+'</b><span>km</span></div>'+
    '<div class="tu">'+TULIPS[i%TULIPS.length]+'</div>'+
    '<div class="nt"><div class="nm">'+esc(s.title)+(i===sel?' <span style="font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:.16em">◉ MARKED</span>':'')+'</div>'+
    '<div class="an">'+esc(s.angle||'')+'</div>'+
    '<div class="rw">'+(s.channels||[]).map(c=>'<span class="ch"><b>'+esc(c.name)+'</b> '+f2(c.fit)+' <i>'+esc(c.why||'')+'</i></span>').join('')+'</div>'+
    '<div class="fm">SURFACE '+(s.formats||[]).map(f=>esc(f)).join(' + ').toUpperCase()+'</div>'+
    (s.watchouts&&s.watchouts[0]?'<div class="wn">'+esc(s.watchouts[0])+'</div>':'')+
    '</div>'+
    '<div class="tc"><div class="tt2">'+views(s.reach&&s.reach.estViews)+'<span>target reach</span></div>'+
    '<div class="fit">avg pace <b>'+f2(fit)+'</b></div></div>'+
    '</div>';
  }).join('');
  sec('RB','The Roadbook','read top to bottom — tulips tell you where to turn',
  '<div class="rbook">'+rows+'</div>');
}

/* scrubbed = ruled out */
if(anti.length){
  sec('XX','Scrubbed Notes','wrong turns crossed out in recce — do not follow',
  '<div class="scrub">'+anti.map((a,i)=>'<div class="scrow"><div class="no">note '+String.fromCharCode(87+i)+'</div>'+
  '<div><div class="nm"><s>'+esc(a.title)+'</s> <span style="font-family:var(--mono);font-weight:400;font-size:10px;color:var(--mut)">· '+esc(a.channel)+'</span></div>'+
  '<div class="why">'+esc(a.whyNot)+'</div></div>'+
  '<span class="st">Wrong way</span></div>').join('')+'</div>');
}

/* service park = brief + creatives */
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('SVC','Service Park','20 minutes — check the card, look at the bodywork',
  '<div class="svc"><div class="svcard">'+
  (br?'<div class="no1">Service card · crew '+esc(selS.title)+'</div><h3>'+esc(br.title)+'</h3>'+
  '<div class="ang">'+esc(br.angle)+'</div>'+
  '<dl><dt>Crew</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Radio call</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Sponsor</dt><dd>'+esc(selS.heroSignal||'—')+' colours · pace '+f2((selS.audienceFit&&selS.audienceFit.score)||0)+'</dd></dl>'+
  '<span class="ok">Scrutineered · passed</span>'
  :'<div class="ang">Card not filled in.</div>')+
  '</div>'+
  '<div><div class="pcap">Parc fermé — body panels photographed before the start</div>'+
  '<div class="parc">'+CREAT.map(m=>'<figure class="pf"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">panel by <b>'+esc(m.provider)+'</b></div></figcaption></figure>').join('')+'</div></div></div>');
}

/* livery = palette */
sec('LIV','Livery Swatches','stripes on the service barge — match at a glance',
  '<div class="livery">'+PALETTE.map(s=>'<div class="liv"><div class="sw" style="--c:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="hx">'+s.h.toUpperCase()+'</div></div>').join('')+
  '<div class="fnote">Vinyl cut to order — livery must survive gravel at full chat.</div></div>');

/* time controls = qloo */
if(calls.length||affs.length){
  sec('TC','Time Control Stamps','every stamp reconciled — Qloo timing, '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' clock',
  '<div class="tcs"><div class="stamps">'+
  calls.map((c,i)=>'<div class="stp" style="--r:'+((i%3)-1)*3+'deg"><div class="ep">TC-'+(i+1)+' · '+esc(c.endpoint)+'</div>'+
  '<div class="tm2">'+esc((c.at||'').slice(11,19))+'Z</div>'+
  '<div class="ms">transit '+esc(c.tookMs)+' ms · '+esc(c.n)+' readings · '+esc(Object.keys(c.params||{}).length)+' fields</div>'+
  '<span class="md">'+esc(c.mode)+'</span></div>').join('')+
  '<div class="note">'+(calls.length||0)+' controls stamped and reconciled at regroup — no crew may query a live clock.</div></div>'+
  '<div class="hot"><h4>Spectator hotspots — where the crowd stands</h4>'+affs.map(g=>'<div class="dv">'+esc(String(g.type).replace('urn:entity:',''))+'</div>'+
  (g.entities||[]).slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+(e.affinity||0).toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* regs = next */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
sec('REG','Next in the Regulations','fill in the form, pay the entry',
  '<div class="regs">'+['Enter the ad spot','Submit the landing page','File the media plan','Re-run — next rally'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">Entries close at first car — the steward keeps the list.</div></div>'+
  (others.length?'<div class="alsoc"><b>Other crews entered</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

if(!M.children.length)M.appendChild(el('<div class="empty">Roll never printed — data.js lost in the service park.</div>'));
})();
</script>
</body>
</html>
