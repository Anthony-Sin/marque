<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARQUE VIDEO — Staff Picks · Rhode peptide lip tint → Gen Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231B1B1B'/%3E%3Crect x='8' y='18' width='48' height='30' rx='3' fill='%23EFE6D0'/%3E%3Crect x='8' y='18' width='48' height='8' fill='%23C93B2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#E8E0CC;
  --beige2:#DFD5BC;
  --tape:#1C1C1E;
  --tape2:#26262A;
  --cream:#EFE6D0;
  --ink:#22201B;
  --ink2:#6B6350;
  --yel:#F2C230;
  --red:#C0392B;
  --wood:#8A5E35;
  --wood-dk:#6E4626;
  --sans:'Oswald','Arial Narrow',Impact,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--beige);
  background-image:repeating-linear-gradient(90deg,rgba(34,32,27,.025) 0 2px,transparent 2px 6px);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.5;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--yel);color:var(--ink)}
a{color:var(--ink);border-bottom:2px solid var(--red);text-decoration:none}
a:hover{color:var(--red)}
a:focus-visible,button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
button{font-family:var(--sans);cursor:pointer}
img{display:block}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ============ STOREFRONT ============ */
.store{
  background:var(--tape);color:var(--cream);
  border-bottom:6px solid var(--yel);
}
.store .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:26px 20px}
.marquee-sign{
  border:3px solid var(--cream);padding:12px 22px;
  box-shadow:0 0 0 3px var(--tape),0 0 0 6px var(--cream);
  text-align:center;
}
.marquee-sign h1{font-size:clamp(26px,5vw,46px);font-weight:700;letter-spacing:.18em;line-height:1}
.marquee-sign .sub{font-size:10px;letter-spacing:.42em;color:var(--yel);margin-top:6px}
.open-tag{
  margin-left:auto;text-align:right;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#bdb49b;line-height:2;
}
.open-tag .op{display:inline-block;border:2px solid var(--red);color:var(--red);padding:4px 14px;font-weight:700;letter-spacing:.3em;font-size:13px;transform:rotate(-2deg)}
.open-tag b{color:var(--cream)}

/* ============ AISLE SECTIONS ============ */
.aisle{margin:34px 0}
.aisle-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.aisle-head .cat{
  background:var(--ink);color:var(--beige);font-size:10px;font-weight:700;letter-spacing:.24em;
  padding:4px 10px;white-space:nowrap;
}
.aisle-head h2{font-size:clamp(17px,2.6vw,24px);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.aisle-head .note{margin-left:auto;font-size:10px;letter-spacing:.18em;color:var(--ink2);text-transform:uppercase;white-space:nowrap}

/* index card — the ask */
.req{
  background:var(--cream);border:1px solid var(--ink2);
  box-shadow:4px 4px 0 rgba(34,32,27,.25);
  display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
}
.req .c{padding:20px 22px}
.req .c:first-child{border-right:1px dashed var(--ink2)}
.req .stamp-h{font-size:10px;letter-spacing:.3em;color:var(--red);font-weight:700;text-transform:uppercase}
.req .prompt{font-size:clamp(19px,2.8vw,30px);font-weight:700;letter-spacing:.04em;line-height:1.25;margin-top:10px}
.req .prompt .arr{color:var(--red)}
.req .kv{display:grid;grid-template-columns:76px 1fr;gap:5px 12px;font-size:11.5px}
.req .kv dt{color:var(--ink2);font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding-top:2px}
.req .kv dd{min-width:0;overflow-wrap:anywhere}
.rule-l{height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px);margin:14px 0;opacity:.4}

/* member profile — audience */
.member{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.85fr);gap:18px}
.mcard{
  background:var(--cream);border:1px solid var(--ink2);box-shadow:4px 4px 0 rgba(34,32,27,.22);padding:18px 20px;
}
.mcard .mh{font-size:10px;letter-spacing:.3em;color:var(--ink2);text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:12px;font-weight:700}
.lean-big{font-size:clamp(24px,3vw,36px);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.lean-conf{font-size:12px;color:var(--ink2);margin-top:2px}
.lean-conf b{color:var(--red);font-size:22px}
.sigline{padding:7px 0;border-bottom:1px dotted var(--ink2);font-size:11.5px;color:var(--ink2)}
.sigline::before{content:"» ";color:var(--red)}
.habit{display:grid;grid-template-columns:88px 1fr;gap:3px 12px;padding:8px 0;border-bottom:1px dotted var(--ink2);font-size:11.5px}
.habit:last-child{border-bottom:none}
.habit b{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:10px;padding-top:1px}
.habit span{color:var(--ink2)}
.genres{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.genre{
  background:var(--tape);color:var(--yel);font-size:10px;font-weight:700;letter-spacing:.12em;
  padding:4px 10px;transform:rotate(-1deg);
}
.genre:nth-child(2n){transform:rotate(1.5deg);background:var(--red);color:var(--cream)}
.barcode{
  height:44px;margin-top:14px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);
}
.barcode-t{font-size:9px;letter-spacing:.34em;color:var(--ink2);margin-top:4px}

/* ============ SHELF + TAPES ============ */
.shelf{position:relative;padding-bottom:26px}
.tapes{display:grid;grid-template-columns:repeat(4,minmax(150px,205px));gap:18px;align-items:end;justify-content:space-between}
.tape{
  background:var(--tape);color:var(--cream);
  border:1px solid #000;
  box-shadow:0 3px 0 #000,6px 6px 0 rgba(34,32,27,.28);
  min-height:340px;display:grid;grid-template-columns:minmax(0,1fr) 92px;position:relative;
  transition:transform .18s;
}
.tape:hover{transform:translateY(-6px)}
.tape .spine-t{
  writing-mode:vertical-rl;transform:rotate(180deg);
  padding:16px 10px;display:flex;align-items:center;justify-content:flex-start;gap:10px;
  border-right:1px solid #3a3a40;min-width:0;
}
.tape .spine-t .ttl{font-size:19px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.1}
.tape .spine-t .ang{font-size:9px;letter-spacing:.26em;color:#9d957f;text-transform:uppercase}
.tape .data{
  padding:16px 10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;
}
.tape .brand{
  font-size:7.5px;letter-spacing:.24em;color:#9d957f;border-bottom:1px solid #3a3a40;padding-bottom:6px;
}
.tape .catno{font-size:8.5px;letter-spacing:.16em;color:#9d957f}
.tape .fit{font-size:34px;font-weight:700;line-height:1;color:var(--yel)}
.tape .fit small{font-size:9px;color:#9d957f;letter-spacing:.14em;display:block;margin-top:2px}
.tape .chl{font-size:9px;letter-spacing:.06em;padding:3px 0;border-bottom:1px dotted #3a3a40;display:flex;justify-content:space-between}
.tape .chl b{color:var(--cream)}
.tape .rt{margin-top:auto;font-size:10px;letter-spacing:.12em;border:1px solid #3a3a40;padding:4px 7px;text-align:center}
.tape .rt b{display:block;font-size:13px;color:var(--cream)}
.tape .rt small{font-size:7.5px;color:#9d957f;letter-spacing:.18em}
.tape .fmt{font-size:8px;color:#8b8574;letter-spacing:.08em;line-height:1.5}
.tape .gtab{
  position:absolute;top:0;left:0;right:0;height:12px;
}
.tape:nth-child(4n+1) .gtab{background:var(--red)}
.tape:nth-child(4n+2) .gtab{background:var(--yel)}
.tape:nth-child(4n+3) .gtab{background:#4E7A5A}
.tape:nth-child(4n+4) .gtab{background:#3D5A80}
.tape.sel{transform:translateY(-14px);box-shadow:0 3px 0 #000,10px 12px 0 rgba(34,32,27,.35)}
.tape.sel:hover{transform:translateY(-20px)}
.starburst{
  position:absolute;top:-20px;right:-14px;width:88px;height:88px;z-index:3;
  background:var(--yel);color:var(--ink);
  clip-path:polygon(50% 0%,61% 12%,76% 7%,80% 22%,95% 24%,91% 39%,100% 50%,91% 61%,95% 76%,80% 78%,76% 93%,61% 88%,50% 100%,39% 88%,24% 93%,20% 78%,5% 76%,9% 61%,0% 50%,9% 39%,5% 24%,20% 22%,24% 7%,39% 12%);
  display:flex;align-items:center;justify-content:center;text-align:center;
  transform:rotate(8deg);
}
.starburst span{font-size:10px;font-weight:700;letter-spacing:.1em;line-height:1.15;width:70%}
.watchtag{font-size:8px;color:#c9b8a0;letter-spacing:.05em;border-left:2px solid var(--red);padding-left:5px;line-height:1.4}
.ledge{
  height:22px;margin-top:6px;
  background:linear-gradient(180deg,var(--wood) 0%,var(--wood-dk) 100%);
  border:1px solid #4c3018;border-radius:2px;
  box-shadow:0 4px 0 rgba(34,32,27,.3);
  position:relative;
}
.ledge::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:1px solid rgba(255,235,200,.25)}

/* damaged bin */
.bin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.junk{
  background:var(--tape2);color:#9d957f;border:1px solid #000;padding:14px;position:relative;
  box-shadow:4px 4px 0 rgba(34,32,27,.25);opacity:.92;
}
.junk .xtape{
  position:absolute;top:8px;right:8px;width:44px;height:44px;pointer-events:none;
}
.junk .xtape::before,.junk .xtape::after{
  content:"";position:absolute;left:50%;top:0;width:10px;height:44px;background:rgba(192,57,43,.85);transform:translateX(-50%) rotate(45deg);
}
.junk .xtape::after{transform:translateX(-50%) rotate(-45deg)}
.junk h4{font-size:13px;color:var(--cream);letter-spacing:.06em;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
.junk .ch{font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin:3px 0 8px;color:#7d7663}
.junk p{font-size:10.5px;color:#8b8574;line-height:1.55}
.junk .fee{margin-top:9px;font-size:8.5px;letter-spacing:.18em;color:var(--red);text-transform:uppercase;font-weight:700}

/* output — preview monitor + rental slip */
.out{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);gap:22px}
.slip{
  background:var(--cream);border:1px solid var(--ink2);padding:20px 22px;align-self:start;
  box-shadow:4px 4px 0 rgba(34,32,27,.22);position:relative;
}
.slip::before{content:"RENTAL SLIP";position:absolute;top:-9px;left:18px;background:var(--red);color:var(--cream);font-size:9px;font-weight:700;letter-spacing:.26em;padding:2px 10px}
.slip h3{font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:.05em;line-height:1.15;margin-top:8px}
.slip .angle{font-size:11.5px;color:var(--ink2);margin-top:9px;line-height:1.6}
.slip .kv{margin-top:12px}
.slip .km{font-size:14px;font-weight:700;border:3px solid var(--ink);padding:9px 13px;margin-top:12px;text-align:center;letter-spacing:.04em}
.slip .src{font-size:9px;letter-spacing:.2em;color:var(--ink2);margin-top:12px;text-transform:uppercase}
.crtrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.crt{
  background:var(--tape);border:1px solid #000;padding:7px;
  box-shadow:4px 4px 0 rgba(34,32,27,.3);transition:transform .16s;
}
.crt:hover{transform:translateY(-4px)}
.crt .scr{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid #3a3a40}
.crt img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05) saturate(1.05)}
.crt .scr::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
             linear-gradient(180deg,rgba(255,255,255,.06),transparent 30%);
}
.crt .scr .osk{position:absolute;top:4px;left:6px;font-size:7.5px;color:rgba(255,255,255,.85);letter-spacing:.2em;z-index:2;text-shadow:1px 1px 0 #000}
.crt .scr .rec{position:absolute;top:4px;right:6px;font-size:7.5px;color:#fff;letter-spacing:.16em;z-index:2;display:flex;align-items:center;gap:4px;text-shadow:1px 1px 0 #000}
.crt .scr .rec i{width:7px;height:7px;border-radius:50%;background:var(--red);display:block}
.crt .cap{padding:8px 2px 2px;color:var(--cream);font-size:10px}
.crt .cap .h{min-height:2.6em;line-height:1.35;letter-spacing:.03em}
.crt .cap .p{display:flex;justify-content:space-between;margin-top:5px;font-size:8px;letter-spacing:.16em;color:#9d957f;text-transform:uppercase}
.crt .cap .p b{color:var(--yel)}

/* label stock palette */
.stock{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.stock .sw{
  background:var(--cream);border:1px solid var(--ink2);padding:8px;text-align:center;
  box-shadow:3px 3px 0 rgba(34,32,27,.2);transition:transform .15s;
}
.stock .sw:hover{transform:rotate(-1.5deg)}
.stock .chip{height:56px;border:1px solid var(--ink)}
.stock .n{font-size:11px;font-weight:700;margin-top:7px;letter-spacing:.04em}
.stock .h{font-size:8.5px;letter-spacing:.16em;color:var(--ink2)}

/* membership card provenance */
.mship{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.plastic{
  background:linear-gradient(160deg,#2E2E33,#1B1B1F);color:var(--cream);
  border-radius:12px;border:1px solid #000;padding:20px 22px;
  box-shadow:6px 6px 0 rgba(34,32,27,.3);
}
.plastic .stripe{height:26px;background:#0e0e10;margin:0 -22px 14px;border-top:1px solid #3a3a40;border-bottom:1px solid #3a3a40}
.plastic .ph{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.plastic .ph .nm{font-size:15px;font-weight:700;letter-spacing:.14em}
.plastic .ph .lvl{font-size:9px;letter-spacing:.24em;color:var(--yel)}
.plastic .mid{font-size:8.5px;letter-spacing:.2em;color:#9d957f;margin:10px 0 14px}
table.stamps{width:100%;border-collapse:collapse;font-size:9.5px}
table.stamps th{text-align:left;font-size:7.5px;letter-spacing:.2em;color:#9d957f;font-weight:400;text-transform:uppercase;border-bottom:1px solid #3a3a40;padding:0 8px 5px 0}
table.stamps td{border-bottom:1px dotted #3a3a40;padding:6px 8px 6px 0;vertical-align:top}
table.stamps .ep{color:var(--yel);font-weight:500}
table.stamps .pm{display:block;font-size:7.5px;color:#7d7663;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plastic .bc{height:34px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--cream) 0 2px,transparent 2px 5px,var(--cream) 5px 6px,transparent 6px 8px,var(--cream) 8px 11px,transparent 11px 13px)}
.plastic .bc-t{font-size:8px;letter-spacing:.32em;color:#9d957f;margin-top:4px}
.affback{background:var(--cream);border:1px solid var(--ink2);padding:18px 20px;box-shadow:4px 4px 0 rgba(34,32,27,.22)}
.affback .mh{font-size:10px;letter-spacing:.3em;color:var(--ink2);text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:12px;font-weight:700}
.aff{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11px;padding:4px 0;align-items:baseline}
.aff .tp{font-size:8px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;width:48px;flex-shrink:0}
.aff .nm{font-weight:700;letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aff .v{color:var(--red);font-weight:700}
.aff .bar{flex-basis:100%;height:5px;background:var(--beige2);border:1px solid var(--ink2)}
.aff .bar i{display:block;height:100%;background:var(--tape)}

/* next — checkout */
.next-row{display:flex;flex-wrap:wrap;gap:14px}
.nbtn{
  background:var(--yel);border:2px solid var(--ink);color:var(--ink);
  padding:12px 22px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  box-shadow:4px 4px 0 var(--ink);transition:all .12s;
}
.nbtn:hover{background:var(--ink);color:var(--yel)}
.nbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

footer{border-top:3px solid var(--ink);margin-top:40px;padding:18px 0 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2)}

/* ---------- responsive ---------- */
@media(max-width:1020px){
  .tapes{grid-template-columns:repeat(2,minmax(160px,240px));justify-content:space-evenly}
  .tape{min-height:290px}
  .member{grid-template-columns:1fr}
  .out{grid-template-columns:1fr}
  .crtrow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bin{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stock{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mship{grid-template-columns:1fr}
  .req{grid-template-columns:1fr}
  .req .c:first-child{border-right:none;border-bottom:1px dashed var(--ink2)}
}
@media(max-width:520px){
  .tapes{grid-template-columns:minmax(0,260px);justify-content:center}
  .tape{min-height:250px}
  .crtrow,.bin{grid-template-columns:1fr}
  .stock{grid-template-columns:repeat(2,minmax(0,1fr))}
  .starburst{width:72px;height:72px;top:-14px;right:-8px}
  .open-tag{margin-left:0;text-align:left}
  .aisle-head .note{display:none}
  .plastic,.affback{min-width:0}
  table.stamps .pm{max-width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="store"><div class="wrap">
  <div class="marquee-sign"><h1>MARQUE VIDEO</h1><div class="sub">STRATEGY → CAMPAIGN → RESULT</div></div>
  <div class="open-tag"><span class="op">OPEN LATE</span><br>
  <span id="store-meta">MEMBERSHIP HAS ITS PRIVILEGES</span></div>
</div></header>

<main class="wrap" id="aisles"></main>

<footer class="wrap" style="display:flex">
  <span>MARQUE VIDEO — EST. 2026 · PLEASE REWIND</span>
  <span id="foot-meta">NO LATE FEES ON GOOD IDEAS</span>
</footer>

<script src="./data.js"></script>
<script src="./media-data.js"></script>
<script src="./dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'./'):'';
const pct=x=>Math.round((x||0)*100);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[10,4,14,1].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||(s.reach&&s.reach.estViews)>(strats[b].reach&&strats[b].reach.estViews||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;

document.getElementById('store-meta').innerHTML=
  'MEMBER MQ-'+esc((B.id||'________').slice(0,8).toUpperCase())+' · '+(B.createdAt?new Date(B.createdAt).toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'—')+'<br><b>'+esc(B.title||'—')+'</b>';

const M=document.getElementById('aisles');
const aisle=(cat,title,note,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="aisle"><div class="aisle-head"><span class="cat">'+esc(cat)+'</span><h2>'+esc(title)+'</h2><span class="note">'+esc(note)+'</span></div>'+body+'</section>'));
};

/* 01 — the ask */
if(B.sub||B.urlContext){
  const u=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url)||'';
  aisle('FRONT DESK','Rental Request','FORM 01-A',
    '<div class="req"><div class="c"><div class="stamp-h">Customer request — in writing</div>'+
    '<p class="prompt">'+esc((B.sub&&B.sub.prompt)||B.title||'').replace(/→/g,'<span class="arr">→</span>')+'</p>'+
    (u?'<div class="rule-l"></div><p style="font-size:11.5px">SOURCE TAPE: <a href="'+esc(u)+'">'+esc(u)+'</a></p>':'')+'</div>'+
    '<div class="c"><div class="stamp-h">Box art (verified)</div><div class="rule-l"></div>'+
    '<dl class="kv"><dt>TITLE</dt><dd>'+esc(B.urlContext&&B.urlContext.title||'—')+'</dd>'+
    '<dt>CATALOG</dt><dd>MQ-'+esc((B.id||'________').slice(0,8).toUpperCase())+'</dd>'+
    '<dt>SYNOPSIS</dt><dd>'+esc(B.urlContext&&B.urlContext.description||'—')+'</dd></dl></div></div>');
}

/* 02 — member profile */
if(AR&&AR.lean){
  aisle('MEMBER FILE','Customer Profile','KEPT UNDER THE COUNTER',
    '<div class="member">'+
      '<div class="mcard"><div class="mh">Rental type</div>'+
      '<div class="lean-big">'+esc(AR.lean.label||'—')+'</div>'+
      '<div class="lean-conf">match confidence <b>'+pct(AR.lean.confidence)+'</b>/100</div>'+
      '<div style="margin-top:10px">'+(AR.lean.signals||[]).map(s=>'<div class="sigline">'+esc(s)+'</div>').join('')+'</div></div>'+
      '<div class="mcard"><div class="mh">Rental history — where they watch</div>'+
      (AR.mediaHabits||[]).map(h=>'<div class="habit"><b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span></div>').join('')+'</div>'+
      '<div class="mcard"><div class="mh">Preferred genres</div>'+
      '<div class="genres">'+(AR.vibeWords||[]).map(w=>'<span class="genre">'+esc(w)+'</span>').join('')+'</div>'+
      '<div class="barcode"></div><div class="barcode-t">MEMBER MQ-'+esc((B.id||'________').slice(0,8).toUpperCase())+' · PAID UP</div></div>'+
    '</div>');
}

/* 03 — staff picks shelf */
if(strats.length){
  aisle('NEW RELEASES','Staff Picks Shelf','4 TAPES · ONE GOES HOME',
    '<div class="shelf"><div class="tapes">'+strats.map((s,i)=>
      '<article class="tape'+(i===sel?' sel':'')+'">'+(i===sel?'<div class="starburst"><span>STAFF<br>PICK</span></div>':'')+'<i class="gtab"></i>'+
      '<div class="spine-t"><span class="ttl">'+esc(s.title)+'</span><span class="ang">'+esc(s.angle)+'</span></div>'+
      '<div class="data"><div class="brand">MARQUE<br>HOME VIDEO</div>'+
      '<div class="catno">CAT '+esc((s.id||'').toUpperCase())+'-0'+(i+1)+(i===sel?' ★':'')+'</div>'+
      '<div class="fit">'+pct(s.audienceFit&&s.audienceFit.score)+'<small>AUDIENCE<br>SCORE</small></div>'+
      (s.channels||[]).map(c=>'<div class="chl"><span>'+esc(c.name).toUpperCase()+'</span><b>'+pct(c.fit)+'%</b></div>'+
        (c.why?'<div class="fmt">SIG '+esc(c.why)+'</div>':'')).join('')+
      '<div class="fmt">'+esc((s.formats||[]).join(' · ')).toUpperCase()+'</div>'+
      ((s.watchouts&&s.watchouts[0])?'<div class="watchtag">'+esc(s.watchouts[0])+'</div>':'')+
      (s.reach?'<div class="rt"><b>'+views(s.reach.estViews)+'</b><small>EST. VIEWS</small></div>':'')+
      '</div></article>').join('')+
    '</div><div class="ledge"></div>'+
    (selS_basis(strats[sel])?'<p style="font-size:10px;letter-spacing:.14em;color:var(--ink2);margin-top:10px">STAFF NOTE — '+esc(strats[sel].reach.basis)+'</p>':'')+
    '</div>');
}
function selS_basis(s){return !!(s&&s.reach&&s.reach.basis)}

/* 04 — damaged bin */
const anti=B.antiStrategies||[];
if(anti.length){
  aisle('RETURNS BIN','Do Not Rent','DAMAGED · UNWATCHABLE · LOST',
    '<div class="bin">'+anti.map(a=>
      '<div class="junk"><i class="xtape"></i><h4>'+esc(a.title)+'</h4>'+
      '<div class="ch">FORMAT '+esc(a.channel).toUpperCase()+'</div>'+
      '<p>'+esc(a.whyNot)+'</p><div class="fee">REWIND FEE — WAIVED</div></div>').join('')+
    '</div>');
}

/* 05 — output */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  aisle('PREVIEW MONITOR','Out This Week','RENTAL SLIP + SCREENERS',
    '<div class="out">'+
      (br?'<div class="slip"><h3>'+esc(br.title)+'</h3>'+
      '<p class="angle">'+esc(br.angle)+'</p>'+
      '<div class="rule-l"></div>'+
      '<dl class="kv"><dt>RENTED TO</dt><dd>'+esc(br.audience)+'</dd>'+
      '<dt>FROM TAPE</dt><dd>'+esc(selS.title)+' — SIG '+esc(selS.heroSignal||'—')+'</dd></dl>'+
      '<div class="km">“'+esc(br.keyMessage)+'”</div>'+
      '<p class="src">DUE BACK — NEVER. KEEP THE GLOW.</p></div>':'')+
      '<div class="crtrow">'+CREAT.map((m,i)=>
        '<figure class="crt"><div class="scr"><span class="osk">PLAY ► CH-0'+(i+1)+'</span><span class="rec"><i></i>DUB</span>'+
        '<img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
        '<figcaption class="cap"><div class="h">'+esc(m.head)+'</div><div class="p"><span>DUBBED BY</span><b>'+esc(m.provider)+'</b></div></figcaption></figure>').join('')+
      '</div>'+
    '</div>');
}

/* 06 — label stock */
aisle('SUPPLIES','Label Stock','OFFICIAL MARQUE VIDEO SLEEVE INKS',
  '<div class="stock">'+PALETTE.map(s=>
    '<div class="sw"><div class="chip" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">'+s.h.toUpperCase()+'</div></div>').join('')+
  '</div>');

/* 07 — provenance */
const QB=B.qlooBundle;
if(B.evidence||QB){
  const affs=(QB&&QB.affinities)||[];
  aisle('BACK OFFICE','Membership Record','EVERY CHECKOUT STAMPED',
    '<div class="mship"><div class="plastic">'+
    '<div class="stripe"></div>'+
    '<div class="ph"><span class="nm">MARQUE VIDEO CLUB</span><span class="lvl">GOLD MEMBER · '+(QB&&QB.mode?QB.mode.toUpperCase():'LIVE')+'</span></div>'+
    '<div class="mid">CARD MQ-'+esc((B.id||'________').slice(0,8).toUpperCase())+' · CHECKOUT LEDGER — '+calls.length+' STAMPS · '+(B.fetchedAt?new Date(B.fetchedAt).toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}):'—')+'</div>'+
    '<table class="stamps"><thead><tr><th>COUNTER</th><th>N</th><th>MS</th><th>STAMP</th></tr></thead><tbody>'+
    calls.map(c=>'<tr><td><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+kv[1]).join(' '))+'</span></td>'+
      '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td style="color:var(--yel);letter-spacing:.14em">'+esc((c.mode||'').toUpperCase())+'</td></tr>').join('')+
    '</tbody></table>'+
    '<div class="bc"></div><div class="bc-t">MQ · '+esc(B.id||'—')+'</div></div>'+
    '<div class="affback"><div class="mh">Taste card — measured affinities</div>'+
    affs.map(g=>g.entities.slice(0,4).map(e=>'<div class="aff"><span class="tp">'+esc(g.type.replace('urn:entity:',''))+'</span><span class="nm">'+esc(e.name)+'</span><span class="v">'+e.affinity.toFixed(2)+'</span><div class="bar"><i style="width:'+pct(e.affinity)+'%"></i></div></div>').join('')).join('')+
    '</div></div>');
}

/* 08 — next */
aisle('CHECKOUT','Take It Home','CHOOSE THE NEXT RENTAL',
  '<div class="next-row">'+
  ['CAMPAIGN MICROSITE','BRANDBOOK PDF','VIDEO CUT','PERFORMANCE PLAN'].map(x=>'<button class="nbtn">'+x+'</button>').join('')+
  '</div>');
})();
</script>
</body>
</html>
