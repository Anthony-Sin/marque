<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque Almanac — Tide Tables for the Campaign Passage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23F6EFDC'/%3E%3Cpath d='M6 20h52M6 32h52M6 44h52' stroke='%231E3A5F' stroke-width='3'/%3E%3Cpath d='M10 32q11-9 22 0t22 0' fill='none' stroke='%23A8362A' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,600;0,800;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6EFDC;--paper2:#EFE5C6;--navy:#1E3A5F;--navy2:#31547E;
  --red:#A8362A;--mut:#7A6F55;--rule:#B9AC86;
  --f:'Vollkorn',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#2A2620 radial-gradient(ellipse at 50% -10%,rgba(90,80,55,.6),transparent 60%);
  color:var(--navy);font-family:var(--f);font-size:15.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(168,54,42,.4)}
a{color:var(--navy);text-decoration:none;border-bottom:1.5px solid var(--red);word-break:break-word}
a:hover{color:var(--red);border-color:var(--navy)}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}
.book{max-width:960px;margin:0 auto 84px;padding:0 clamp(8px,2.4vw,22px)}

/* the printed page */
.page{
  background:var(--paper);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 80px rgba(185,172,134,.25);
  border:1px solid var(--rule);
  padding:clamp(16px,4vw,42px) clamp(14px,4vw,44px);
  position:relative;
}
.page::before{content:"";position:absolute;inset:7px;border:1.5px solid var(--navy);pointer-events:none}
.page::after{content:"";position:absolute;inset:10px;border:.75px solid var(--navy);pointer-events:none}
.cover{text-align:center;padding:clamp(14px,3vw,26px) 0 8px}
.cover .al{font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--red);font-weight:600}
.cover h1{font-size:clamp(30px,6.4vw,52px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1;margin-top:6px}
.cover .rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px auto 6px;max-width:520px}
.cover .rule::before,.cover .rule::after{content:"";flex:1;height:0;border-top:1.5px solid var(--navy);border-bottom:.75px solid var(--navy);padding-top:2px}
.cover .rule span{font-size:12px;letter-spacing:.34em;text-transform:uppercase}
.cover .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}

section{margin-top:26px}
.sect-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sect-h .no{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--paper);background:var(--navy);padding:3px 9px;text-transform:uppercase}
.sect-h h2{font-size:clamp(18px,3.8vw,25px);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.sect-h .sub{margin-left:auto;font-size:12.5px;color:var(--mut);font-style:italic}
.panel{border:1.5px solid var(--navy);background:rgba(255,255,255,.25);padding:clamp(14px,3vw,24px)}

/* I — the passage ordered (ask) */
.ordered{text-align:center}
.ordered .small{font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--red)}
.ordered h3{font-size:clamp(24px,5.4vw,38px);font-weight:800;text-transform:uppercase;line-height:1.08;margin-top:4px}
.ordered .vessel{margin-top:8px;font-size:14px;font-style:italic;color:var(--navy2)}
.ordered .reg{display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:center;margin-top:12px;font-size:13px}
.ordered .reg b{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);display:block;font-weight:600}
.ordered .desc{max-width:560px;margin:8px auto 0;font-size:13.5px;font-style:italic;color:var(--navy2)}
.ordered .desc::before{content:"“"}.ordered .desc::after{content:"”"}

/* II — port conditions (audience) */
.cond{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(14px,3vw,30px)}
@media(max-width:660px){.cond{grid-template-columns:1fr}}
.cond .set{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--red);font-weight:600}
.cond .lean{font-size:clamp(26px,5.4vw,40px);font-weight:800;text-transform:uppercase;line-height:1.02}
.cond .gauge{margin-top:10px;display:flex;align-items:center;gap:10px}
.cond .gauge .tr{flex:1;height:10px;border:1.5px solid var(--navy);position:relative;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(30,58,95,.25) 24px 25px)}
.cond .gauge .tr i{position:absolute;inset:1px auto 1px 1px;background:var(--navy)}
.cond .gauge b{font-family:var(--mono);font-size:13px}
.cond .sig{margin-top:10px;font-size:13px}
.cond .sig b{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:2px}
.vibes{margin-top:10px;font-size:13.5px;font-style:italic;color:var(--navy2)}
.vibes b{font-style:normal;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.habits{border:1.5px solid var(--navy)}
.habits .hh{background:var(--navy);color:var(--paper);font-size:10px;letter-spacing:.3em;text-transform:uppercase;padding:5px 12px}
.habits .rw{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 12px;border-bottom:1px dashed var(--rule);align-items:baseline}
.habits .rw:last-child{border-bottom:none}
.habits .ch{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.habits .nt{font-size:13px;font-style:italic;color:var(--navy2)}

/* III — THE TABLE (strategies) */
.ttable{border:1.5px solid var(--navy)}
.thead,.trow{display:grid;grid-template-columns:44px 1.45fr .85fr .8fr 1.25fr 1fr;gap:10px;align-items:center}
.thead{background:var(--navy);color:var(--paper);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:7px 12px}
.trow{padding:11px 12px;border-bottom:1px dashed var(--rule)}
.trow:last-child{border-bottom:none}
.trow:nth-child(odd){background:rgba(185,172,134,.12)}
.trow.sel{background:rgba(168,54,42,.08);box-shadow:inset 3px 0 0 var(--red)}
.cell .cl{display:none;font-family:var(--mono);font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.tno{font-size:clamp(17px,3.4vw,22px);font-weight:800;text-align:center}
.tstn .nm{font-size:clamp(16px,3.2vw,20px);font-weight:800;text-transform:uppercase;line-height:1.08}
.tstn .ang{font-size:12px;font-style:italic;color:var(--navy2)}
.tstn .fmt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.trange svg{display:block;width:64px;height:22px}
.trange b{font-family:var(--mono);font-size:12.5px}
.thw b{font-size:clamp(17px,3.4vw,21px);font-weight:800;font-variant-numeric:tabular-nums}
.thw span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.tchan .cw{font-size:12px;line-height:1.4}
.tchan .cw b{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.tchan .cw i{color:var(--mut);font-style:italic}
.trmk{font-size:11.5px;font-style:italic;color:var(--navy2);line-height:1.4}
.tnote{margin-top:8px;font-size:12px;font-style:italic;color:var(--mut);text-align:center}
@media(max-width:780px){
  .thead{display:none}
  .trow{grid-template-columns:34px 1fr 1fr;row-gap:12px}
  .cell{grid-column:span 1}
  .cell.wide{grid-column:2/-1}
  .cell .cl{display:block}
  .tno{grid-row:1/3;text-align:left}
}

/* IV — cautions (ruled out) */
.cautions{border:2.5px solid var(--red);padding:14px;background:rgba(168,54,42,.05)}
.cautions .cap{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);text-align:center;margin-bottom:10px;font-weight:700}
.cau{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--rule);align-items:baseline}
.cau:last-child{border-bottom:none}
.cau .nm{font-weight:800;text-transform:uppercase;font-size:14px}
.cau .nm s{text-decoration-color:var(--red);text-decoration-thickness:2px}
.cau .nm span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:400;margin-top:2px}
.cau .why{font-size:12.5px;font-style:italic;color:var(--navy2)}
@media(max-width:560px){.cau{grid-template-columns:1fr;gap:2px}}

/* V — notice to mariners + plates (brief & creatives) */
.nmwrap{display:grid;grid-template-columns:.92fr 1.08fr;gap:clamp(14px,3vw,28px);align-items:start}
@media(max-width:760px){.nmwrap{grid-template-columns:1fr}}
.notice{border:2px solid var(--navy);padding:16px 18px;position:relative;background:var(--paper)}
.notice::before{content:"";position:absolute;inset:4px;border:1px solid var(--navy);pointer-events:none}
.notice .no1{text-align:center;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);font-weight:600}
.notice h3{text-align:center;font-size:clamp(20px,4.4vw,28px);font-weight:800;text-transform:uppercase;line-height:1.08;margin-top:4px}
.notice .ang{text-align:center;font-size:13px;font-style:italic;color:var(--navy2);margin-top:5px}
.notice dl{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;margin-top:12px;font-size:13px}
.notice dt{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);padding-top:4px}
.notice dd{border-bottom:1px solid var(--rule);padding-bottom:6px}
.notice .km{font-weight:800;font-size:15px}
.notice .seal{width:56px;height:56px;border:2px solid var(--red);border-radius:50%;margin:14px auto 0;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:7.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);transform:rotate(-8deg);font-weight:700;padding:6px}
.plates{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:430px){.plates{grid-template-columns:1fr}}
.plate{border:1.5px solid var(--navy);background:#fff;padding:6px 6px 8px;transition:transform .14s ease}
.plate:hover{transform:translateY(-3px)}
.plate .iw{aspect-ratio:4/3;overflow:hidden;border:1px solid var(--rule);background:var(--paper2)}
.plate img{width:100%;height:100%;object-fit:cover}
.plate .h{font-size:12px;font-weight:600;line-height:1.3;margin-top:7px}
.plate .p{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:2px}
.plate .p b{border:1px solid var(--red);padding:0 6px;border-radius:8px;font-weight:600}
.plates-cap{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin-bottom:8px;font-weight:600}

/* VI — ink specimens (palette) */
.inks{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.ink .sw{width:88px;height:44px;border:1.5px solid var(--navy)}
.ink .n{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:5px}
.ink .hx{font-family:var(--mono);font-size:9.5px;color:var(--mut)}
.inks .fnote{width:100%;font-size:12px;font-style:italic;color:var(--mut)}

/* VII — computations & observations (qloo) */
.obs{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(14px,3vw,26px)}
@media(max-width:760px){.obs{grid-template-columns:1fr}}
.obs table{width:100%;border-collapse:collapse;font-size:12.5px}
.obs th{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:2px solid var(--navy)}
.obs td{padding:6px;border-bottom:1px dashed var(--rule);vertical-align:top}
.obs td.mono{font-family:var(--mono);font-size:11px}
.obs .ok{display:inline-block;font-size:8.5px;letter-spacing:.16em;border:1.5px solid var(--red);color:var(--red);padding:0 6px;text-transform:uppercase;margin-top:2px}
.obsnote{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:10px}
@media(max-width:560px){
  .obs th:nth-child(5),.obs td:nth-child(5){display:none}
  .obs td{padding:6px 4px}
  .obs td.mono{font-size:10px}
}
.refs{border:1.5px solid var(--navy);background:rgba(255,255,255,.3);padding:12px 16px}
.refs h4{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.refs .dv{font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.08em;border-bottom:1.5px solid var(--rule);padding:6px 0 2px}
.refs .rw{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.refs .rw:last-child{border-bottom:none}
.refs .rw .v{font-family:var(--mono);font-size:11.5px;color:var(--mut)}

/* VIII — order coupons (next) */
.coupons{display:flex;flex-wrap:wrap;gap:12px}
.coupons button{border:1.5px dashed var(--navy);background:transparent;color:var(--navy);padding:10px 18px;
  font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  transition:background .12s ease,color .12s ease,transform .12s ease}
.coupons button:hover{background:var(--navy);color:var(--paper)}
.coupons button:active{transform:translateY(2px)}
.coupons .sub{width:100%;font-style:italic;color:var(--mut);font-size:13px}
.alsoc{margin-top:12px;font-size:13px;color:var(--mut)}
.alsoc b{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:4px}
.alsoc span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dotted var(--mut)}
.foot{text-align:center;font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--mut);margin-top:30px;font-family:var(--mono)}
.empty{border:1.5px solid var(--navy);padding:40px;text-align:center;font-style:italic;color:var(--mut);margin-top:20px}
</style>
</head>
<body>
<div class="book">
  <div class="page">
    <header class="cover">
      <div class="al">The Marque Almanac</div>
      <h1>Tide Tables</h1>
      <div class="rule"><span>for the campaign passage</span></div>
      <div class="meta" id="meta">—</div>
    </header>
    <main id="app"></main>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script src="./data.js"></script>
<script src="./media-data.js"></script>
<script src="./dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'./'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dshort=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}catch(e){return '—'}};

const PALETTE=[
  {n:'Admiralty Ink',h:'#1E3A5F'},{n:'Almanac Red',h:'#A8362A'},{n:'Laid Paper',h:'#F6EFDC'},
  {n:'Chart Sand',h:'#B9AC86'},{n:'Fog Grey',h:'#7A6F55'}
];
const CREAT=[4,1,10,14].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];
const DATE=dshort(B.createdAt||B.fetchedAt);
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
const prompt=((B.sub&&B.sub.prompt)||B.title||'').trim();
const ROMAN=['I','II','III','IV','V','VI','VII','VIII'];

document.getElementById('meta').innerHTML='<span>EDITION '+esc(String(B.id||'').slice(0,4).toUpperCase())+'</span><span>COMPUTED '+DATE+'</span><span>PRICE: ONE STRATEGY</span>';
document.getElementById('foot').textContent='PRINTED FOR THE HARBOURMASTER · MARQUE ALMANAC OFFICE';

const M=document.getElementById('app');
let n=0;
const sec=(title,sub,inner)=>{if(!inner)return;n++;
  M.appendChild(el('<section><div class="sect-h"><span class="no">'+ROMAN[n-1]+'.</span><h2>'+esc(title)+'</h2><span class="sub">'+esc(sub)+'</span></div><div class="panel">'+inner+'</div></section>'))};

/* I — the passage ordered */
sec('The Passage Ordered','read aloud at the quayside before casting off',
'<div class="ordered"><div class="small">Voyage commissioned · '+esc(DATE)+'</div>'+
'<h3>'+esc(prompt)+'</h3>'+
'<div class="reg">'+
'<div>Port of registry<b>'+(U?'<a href="'+esc(U)+'">'+esc(U)+'</a>':'—')+'</b></div>'+
'<div>Registered owner<b>'+esc((B.urlContext&&B.urlContext.title)||'—')+'</b></div>'+
'</div>'+
'<p class="desc">'+esc(((B.urlContext&&B.urlContext.description)||''))+'</p></div>');

/* II — port conditions */
if(AR&&AR.lean){
  const conf=Math.round((AR.lean.confidence||0)*100);
  sec('Port Conditions','state of the water where this audience swims',
  '<div class="cond"><div>'+
  '<div class="set">Prevailing set</div><div class="lean">'+esc(AR.lean.label)+'</div>'+
  '<div class="gauge"><span class="tr"><i style="width:'+conf+'%"></i></span><b>prediction holds '+conf+'× /100</b></div>'+
  '<div class="sig"><b>Logged at the pierhead</b>'+(AR.lean.signals||[]).map(s=>esc(s)).join(' · ')+'</div>'+
  '<div class="vibes"><b>Swell words</b>'+(AR.vibeWords||[]).map(w=>esc(w)).join(', ')+'</div>'+
  '</div>'+
  '<div class="habits"><div class="hh">Working channels &amp; the set of each</div>'+
  (AR.mediaHabits||[]).map(h=>'<div class="rw"><span class="ch">'+esc(h.channel)+'</span><span class="nt">'+esc(h.note)+'</span></div>').join('')+
  '</div></div>');
}

/* III — the table of stations */
if(strats.length){
  sec('Table of Stations','heights are predicted est. views; ranges measured against the audience',
  '<div class="ttable"><div class="thead"><span>No.</span><span>Station</span><span>Range · curve</span><span>High water</span><span>Channels sounded</span><span>Remarks</span></div>'+
  strats.map((s,i)=>{
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    const amp=(3+fit*8).toFixed(1);
    const curve='<svg viewBox="0 0 64 22" aria-hidden="true"><path d="M2 12 Q 17 '+(12-amp)+' 32 12 T 62 12" fill="none" stroke="var(--navy)" stroke-width="2"/><circle cx="2" cy="12" r="1.8" fill="var(--red)"/><circle cx="62" cy="12" r="1.8" fill="var(--red)"/></svg>';
    return '<div class="trow'+(i===sel?' sel':'')+'">'+
    '<div class="cell tno">'+ROMAN[i]+'.</div>'+
    '<div class="cell tstn"><span class="cl">Station</span><div class="nm">'+esc(s.title)+'</div><div class="ang">'+esc(s.angle||'')+(i===sel?' — <span style="color:var(--red);font-style:normal;font-weight:700">recommended station</span>':'')+'</div><div class="fmt">rig: '+(s.formats||[]).map(f=>esc(f)).join(' · ')+'</div></div>'+
    '<div class="cell trange"><span class="cl">Range</span>'+curve+'<b>'+f2(fit)+'</b></div>'+
    '<div class="cell thw"><span class="cl">High water</span><b>'+views(s.reach&&s.reach.estViews)+'</b><span>est. views</span></div>'+
    '<div class="cell tchan"><span class="cl">Channels sounded</span>'+(s.channels||[]).map(c=>'<div class="cw"><b>'+esc(c.name)+'</b> '+f2(c.fit)+' <i>'+esc(c.why||'')+'</i></div>').join('')+'</div>'+
    '<div class="cell trmk wide"><span class="cl">Remarks</span>'+esc((s.watchouts&&s.watchouts[0])||'')+(s.reach&&s.reach.basis?'<br><span style="color:var(--mut)">Sounding: '+esc(s.reach.basis)+'</span>':'')+'</div>'+
    '</div>';
  }).join('')+'</div>'+
  '<p class="tnote">Heights computed on '+esc((B.evidence&&B.evidence.source)||'tensor')+' datum — do not interpolate beyond the stated range.</p>');
}

/* IV — cautions */
if(anti.length){
  sec('Cautions','passages struck from this edition — do not attempt',
  '<div class="cautions"><div class="cap">※ These waters are not to be used for navigation ※</div>'+
  anti.map(a=>'<div class="cau"><div class="nm"><s>'+esc(a.title)+'</s><span>closed · '+esc(a.channel)+'</span></div>'+
  '<div class="why">'+esc(a.whyNot)+'</div></div>').join('')+'</div>');
}

/* V — notice to mariners + plates */
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('Notice to Mariners','posted at the custom-house door — read before sailing',
  '<div class="nmwrap"><div class="notice">'+
  (br?'<div class="no1">Notice to Mariners · from station '+esc(selS.title)+'</div><h3>'+esc(br.title)+'</h3>'+
  '<div class="ang">'+esc(br.angle)+'</div>'+
  '<dl><dt>To whom</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>The word</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Signal</dt><dd>flown from '+esc(selS.heroSignal||'—')+' · range '+f2((selS.audienceFit&&selS.audienceFit.score)||0)+'</dd></dl>'+
  '<div class="seal">Marque Almanac Office</div>'
  :'<div class="ang">No notice posted.</div>')+
  '</div>'+
  '<div><div class="plates-cap">Plates I–IV · printed from the publisher\'s blocks</div>'+
  '<div class="plates">'+CREAT.map((m,i)=>'<figure class="plate"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">plate '+ROMAN[i]+' · struck by <b>'+esc(m.provider)+'</b></div></figcaption></figure>').join('')+'</div></div></div>');
}

/* VI — ink specimens */
sec('Ink Specimens','the printer\'s colours for this edition',
  '<div class="inks">'+PALETTE.map(s=>'<div class="ink"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="hx">'+s.h.toUpperCase()+'</div></div>').join('')+
  '<div class="fnote">Drawn down on laid paper; allow a full minute for the red to dry.</div></div>');

/* VII — computations & observations */
if(calls.length||affs.length){
  sec('Computations & Observations','the workings behind the predictions — Qloo engine, '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live'),
  '<div class="obs"><div><table><tr><th>Instrument</th><th>Observed</th><th>Elapsed</th><th>Readings</th><th>Fields</th></tr>'+
  calls.map((c,i)=>'<tr><td><b>OBS-'+ROMAN[i]+'</b> '+esc(c.endpoint)+'<br><span class="ok">'+esc(c.mode)+'</span></td>'+
  '<td class="mono">'+esc((c.at||'').slice(11,19))+'Z</td><td class="mono">'+esc(c.tookMs)+' ms</td><td class="mono">n='+esc(c.n)+'</td><td class="mono">'+esc(Object.keys(c.params||{}).length)+'</td></tr>').join('')+'</table>'+
  '<p class="obsnote">'+(calls.length||0)+' observations reduced at the office — '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' instruments, checked twice before going to press.</p></div>'+
  '<div class="refs"><h4>Reference stations</h4>'+affs.map(g=>'<div class="dv">'+esc(String(g.type).replace('urn:entity:',''))+'</div>'+
  (g.entities||[]).slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+(e.affinity||0).toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* VIII — further orders */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
sec('Orders & Further Tables','return the coupon, receive the next page',
  '<div class="coupons">'+['Cut the advertisement','Compose the landing page','Book the passage plan','Sail it again — revised'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">Tear along the dotted line — the office replies by return tide.</div></div>'+
  (others.length?'<div class="alsoc"><b>Other almanacs in print</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

if(!M.children.length)M.appendChild(el('<div class="empty">The presses stood silent — data.js was lost to the sea.</div>'));
})();
</script>
</body>
</html>
