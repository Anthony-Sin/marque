<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Marque — Strategy Mountain Trail Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23EAF1F7'/%3E%3Cpath d='M6 56 26 14l8 12 6-8 18 38z' fill='%231E3A52'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#EAF1F7;--snow:#FDFCF8;--navy:#1E3A52;--navy2:#33526E;
  --rust:#D6482B;--mut:#6B7F92;--line:#C3D2DE;
  --green:#2E8B57;--blue:#2B6BB3;--blk:#22272B;
  --f:'Nunito','Trebuchet MS','Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--sky);color:var(--navy);font-family:var(--f);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:rgba(214,72,43,.2)}
a{color:var(--rust);text-decoration:none;border-bottom:1.5px solid var(--rust)}
a:hover{color:var(--navy);border-color:var(--navy)}
a:focus-visible,button:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.resort{max-width:1180px;margin:0 auto 70px;padding:0 clamp(10px,2.4vw,24px)}
.mast{
  margin-top:20px;background:var(--snow);border:2.5px solid var(--navy);border-radius:14px;
  padding:clamp(14px,2.8vw,24px) clamp(16px,3.4vw,30px);
  display:grid;grid-template-columns:auto 1fr auto;gap:clamp(14px,3vw,28px);align-items:center;
  box-shadow:0 5px 0 rgba(30,58,82,.16);
}
.mast .logo{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.mast .logo svg{display:block}
.mast .logo .ln{font-size:10px;color:var(--mut);letter-spacing:.22em}
.mast .mid h1{font-size:clamp(24px,4.6vw,40px);font-weight:800;letter-spacing:.01em;line-height:1.05}
.mast .mid .ask{font-size:clamp(15px,2.4vw,19px);font-style:italic;color:var(--navy2);margin-top:4px}
.mast .mid .url{font-family:var(--mono);font-size:10px;margin-top:5px;overflow-wrap:anywhere}
.ticket{background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;transform:rotate(1.5deg)}
.ticket b{display:block;font-size:15px;letter-spacing:.06em;margin-top:3px}
.ticket .d{color:#BFD2E2;margin-top:3px;font-size:9px}
@media(max-width:700px){.mast{grid-template-columns:1fr;text-align:center}.mast .logo{align-items:center}.ticket{justify-self:center}}

.mapgrid{display:grid;grid-template-columns:2.1fr .9fr;gap:clamp(12px,2.4vw,22px);margin-top:16px;align-items:start}
@media(max-width:860px){.mapgrid{grid-template-columns:1fr}}
.mapbox{background:var(--snow);border:2.5px solid var(--navy);border-radius:14px;overflow:hidden;box-shadow:0 5px 0 rgba(30,58,82,.16)}
.mapscroll{overflow-x:auto}
.mapscroll svg{display:block;width:100%;min-width:640px;height:auto}
.legend{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--snow);border:2.5px solid var(--navy);border-radius:14px;padding:14px 18px;box-shadow:0 4px 0 rgba(30,58,82,.14)}
.panel h3{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);margin-bottom:9px}
.panel .lg{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14.5px}
.panel .lg svg{flex:0 0 auto}
.panel .note{font-size:13.5px;font-style:italic;color:var(--mut);margin-top:6px}
.snow .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.snow .row:last-child{border-bottom:none}
.snow .row b{font-weight:800}
.snow .row .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);padding-top:4px;flex:0 0 96px}
.regs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.regs span{font-size:12.5px;font-weight:700;border:1.5px solid var(--navy);border-radius:999px;padding:2px 11px;background:var(--sky)}
.closed li{list-style:none;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:14px 1fr;gap:8px}
.closed li:last-child{border-bottom:none}
.closed .x{color:var(--rust);font-weight:800}
.closed li p{color:var(--mut);font-style:italic;font-size:12.5px}
.closed li b{font-weight:800}

.sec{margin-top:16px}
.panel .h2{font-size:clamp(20px,3.4vw,28px);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px}
.lodge{display:grid;grid-template-columns:1fr;gap:16px}
.briefcard{background:var(--sky);border:2px solid var(--navy);border-radius:12px;padding:16px 20px}
.briefcard .bt{font-size:clamp(22px,4vw,32px);font-weight:800;line-height:1.05}
.briefcard .lede{font-style:italic;margin:7px 0 12px}
.briefcard dl{display:grid;grid-template-columns:110px 1fr;gap:5px 14px;font-size:14.5px}
.briefcard dt{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--rust);padding-top:4px}
.briefcard dd{border-bottom:1px dashed var(--line);padding-bottom:6px}
.briefcard .km{font-weight:800}
.stubs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.stubs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.stubs{grid-template-columns:1fr}}
.stub{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:7px 7px 0;transform:rotate(-.6deg);transition:transform .15s ease;position:relative}
.stub:nth-child(2n){transform:rotate(.7deg)}
.stub:hover{transform:rotate(0) scale(1.03)}
.stub::before{content:"";position:absolute;top:-2px;left:14%;right:14%;height:8px;background:var(--snow);border:2px solid var(--navy);border-top:none;border-radius:0 0 8px 8px}
.stub .iw{aspect-ratio:1/1;overflow:hidden;border-radius:6px;border:1px solid var(--line)}
.stub .iw img{width:100%;height:100%;object-fit:cover}
.stub figcaption{padding:7px 2px 8px}
.stub .h{font-size:13px;font-weight:700;line-height:1.35}
.stub .p{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--rust);text-transform:uppercase;margin-top:2px}

.jackets{display:flex;flex-wrap:wrap;gap:14px}
.jk{width:112px;text-align:center}
.jk .sw{height:56px;border:2.5px solid var(--navy);border-radius:10px 10px 18px 18px;position:relative}
.jk .sw::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:rgba(30,58,82,.35)}
.jk .n{font-size:13.5px;font-weight:700;margin-top:7px;line-height:1.25}
.jk .h{font-family:var(--mono);font-size:9px;color:var(--mut)}

.patrol{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(14px,3vw,24px)}
@media(max-width:780px){.patrol{grid-template-columns:1fr}}
.radio{font-family:var(--mono);font-size:10.5px}
.radio .lr{padding:6px 0;border-bottom:1px dashed var(--line)}
.radio b{color:var(--rust);font-size:11px}
.radio .pm{color:var(--mut);overflow-wrap:anywhere;display:block}
.radio .me{display:flex;gap:12px;color:var(--mut);flex-wrap:wrap}
.ranks{border:2px solid var(--navy);border-radius:10px;padding:12px 16px;background:#fff}
.ranks h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);margin-bottom:6px}
.ranks .dv{font-weight:800;text-transform:uppercase;font-size:14px;border-bottom:2px solid var(--navy);padding:7px 0 3px}
.ranks .rw{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px dotted var(--line)}
.ranks .rw:last-child{border-bottom:none}
.ranks .rw .v{font-family:var(--mono);font-size:11px;color:var(--mut)}

.passrow{display:flex;flex-wrap:wrap;gap:10px}
.passrow button{border:2.5px solid var(--navy);background:var(--snow);padding:10px 20px;border-radius:999px;font-weight:800;font-size:14.5px;transition:background .12s ease,color .12s ease,transform .12s ease}
.passrow button:hover{background:var(--rust);border-color:var(--rust);color:#fff}
.passrow button:active{transform:translateY(2px)}
.others{margin-top:12px;font-size:14px;color:var(--mut)}
.others b{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);display:block;margin-bottom:5px}
.others span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dashed var(--mut)}
.foot{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin-top:26px}
.empty{padding:40px;text-align:center;font-style:italic;color:var(--mut)}
</style>
</head>
<body>
<div class="resort">
  <header class="mast">
    <div class="logo">
      <svg width="72" height="52" viewBox="0 0 72 52"><path d="M4 48 24 8l8 13 6-9 30 36z" fill="#1E3A52"/><path d="M24 8l8 13-5 4-7-9z" fill="#EAF1F7"/></svg>
      <div>CAMP</div><div>MARQUE</div><div class="ln">est. mmxxvi</div>
    </div>
    <div class="mid">
      <h1>Strategy Mountain — Official Trail Map</h1>
      <div class="ask" id="s-ask"></div>
      <div class="url" id="s-url"></div>
    </div>
    <div class="ticket">Day ticket<b id="s-no"></b><span class="d" id="s-date"></span></div>
  </header>

  <div class="mapgrid">
    <div class="mapbox"><div class="mapscroll" id="map"></div></div>
    <div class="legend">
      <div class="panel" id="legend"></div>
      <div class="panel snow" id="snow"></div>
      <div class="panel closed" id="closed"></div>
    </div>
  </div>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script src="./data.js"></script>
<script src="./media-data.js"></script>
<script src="./dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'./'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).toUpperCase()}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Crème Fraîche',h:'#F3E6CE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[1,4,10,14].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-ask').textContent='Today’s lift served: “'+((B.sub&&B.sub.prompt)||B.title||'')+'”';
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
document.getElementById('s-url').innerHTML=U?'shuttle from: <a href="'+esc(U)+'">'+esc(U)+'</a> — '+esc((B.urlContext&&B.urlContext.title)||''):'';
document.getElementById('s-no').textContent='Nº '+String(B.id||'—').slice(0,8).toUpperCase();
document.getElementById('s-date').textContent=dt(B.createdAt||B.fetchedAt);
document.getElementById('foot').textContent='CAMP MARQUE RESORT AUTHORITY · SKI WITH A FRIEND · LIFTS CLOSE AT DUSK';

const DIFF=s=>s>=0.95?{k:'blk',n:'black diamond'}:s>=0.94?{k:'blue',n:'blue square'}:{k:'green',n:'green circle'};
const MARK={green:'<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="#2E8B57"/></svg>',
            blue:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="2" width="14" height="14" fill="#2B6BB3"/></svg>',
            blk:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x="3.4" y="3.4" width="11.2" height="11.2" transform="rotate(45 9 9)" fill="#22272B"/></svg>'};

/* ——— the mountain ——— */
if(strats.length){
  /* run geometry: each run = path from summit to base + channel towers + label anchor */
  const GEO=[
    {d:'M470,120 C440,190 380,230 340,300 S250,430 210,560',towers:[[0.30],[0.72]],label:[308,352],end:[205,578],side:'left'},
    {d:'M470,120 C455,205 425,275 420,360 S410,500 400,568',towers:[[0.34],[0.78]],label:[392,408],end:[398,586],side:'left'},
    {d:'M470,120 C505,200 545,250 575,320 S640,470 660,568',towers:[[0.32],[0.74]],label:[612,356],end:[664,586],side:'right'},
    {d:'M470,120 C540,185 610,240 665,300 S780,460 800,568',towers:[[0.36],[0.78]],label:[706,330],end:[804,586],side:'right'}
  ];
  const order=strats.map((s,i)=>({s:s,i:i,d:GEO[i%GEO.length]}));
  /* closed runs on the north face (right rim) */
  const closedGeo=[{x1:820,y1:250,x2:880,y2:330},{x1:855,y1:350,x2:900,y2:430},{x1:810,y1:440,x2:860,y2:515},{x1:880,y1:480,x2:930,y2:560}];

  let svg='<svg viewBox="0 0 1000 640" role="img" aria-label="Trail map of Strategy Mountain">';
  svg+='<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE9F4"/><stop offset="1" stop-color="#F4F8FB"/></linearGradient></defs>';
  svg+='<rect width="1000" height="640" fill="url(#sky)"/>';
  /* back ridge */
  svg+='<path d="M0,470 L150,300 L290,400 L470,130 L640,370 L800,240 L1000,440 L1000,640 L0,640 Z" fill="#C7D8E6"/>';
  /* main face */
  svg+='<path d="M0,640 L120,420 L300,520 L470,130 L620,450 L820,330 L1000,520 L1000,640 Z" fill="#FDFCF8" stroke="#B9CBDC" stroke-width="2"/>';
  /* snowcap */
  svg+='<path d="M425,180 L470,130 L516,182 L498,196 L470,168 L444,196 Z" fill="#fff" stroke="#B9CBDC" stroke-width="1.5"/>';
  /* trees */
  const trees=[[60,560],[100,600],[150,540],[70,470],[250,600],[540,560],[700,600],[760,540],[930,600],[955,540],[880,600],[350,600]];
  svg+=trees.map(t=>'<path d="M'+t[0]+','+t[1]+' l-9,20 h6 l-8,16 h22 l-8,-16 h6 z" fill="#7FA3BC" opacity=".8"/>').join('');
  /* lift line base→summit */
  svg+='<line x1="500" y1="606" x2="470" y2="146" stroke="#D6482B" stroke-width="2.5" stroke-dasharray="8 6"/>';
  [0.2,0.45,0.7].forEach(f=>{
    const x=500+(470-500)*f,y=606+(146-606)*f;
    svg+='<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')"><line x1="0" y1="0" x2="0" y2="9" stroke="#D6482B" stroke-width="2"/><rect x="-7" y="9" width="14" height="9" rx="2" fill="#D6482B"/></g>';
  });
  svg+='<text x="512" y="590" font-size="12" font-style="italic" fill="#D6482B" transform="rotate(-80 512 590)">the strategy lift</text>';
  /* summit flag */
  svg+='<line x1="470" y1="130" x2="470" y2="96" stroke="#1E3A52" stroke-width="2.5"/><path d="M470,96 h34 l-8,9 8,9 h-34 z" fill="#D6482B"/>';
  svg+='<text x="470" y="86" font-size="13" font-weight="800" text-anchor="middle" fill="#1E3A52">SUMMIT — THE CAMPAIGN</text>';
  /* runs */
  order.forEach(r=>{
    const s=r.s,g=r.d;
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    const diff=DIFF(fit);
    const col=diff.k==='green'?'#2E8B57':diff.k==='blue'?'#2B6BB3':'#22272B';
    svg+='<path d="'+g.d+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" opacity=".9"/>';
    svg+='<path d="'+g.d+'" fill="none" stroke="#FDFCF8" stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round" opacity=".7"/>';
    /* channel towers along the run — interpolate between path endpoints at fixed fractions */
    const fr=[0.30,0.72];
    const ends=g.d.match(/M([\d.]+),([\d.]+)/);const tail=g.d.match(/([\d.]+),([\d.]+)$/);
    const sx=+ends[1],sy=+ends[2],ex=+tail[1],ey=+tail[2];
    (s.channels||[]).slice(0,2).forEach((c,ci)=>{
      const f=fr[ci]||0.5;
      const px=sx+(ex-sx)*f, py=sy+(ey-sy)*f+Math.sin(f*Math.PI)*-14;
      svg+='<line x1="'+px.toFixed(0)+'" y1="'+(py-16).toFixed(0)+'" x2="'+px.toFixed(0)+'" y2="'+py.toFixed(0)+'" stroke="#1E3A52" stroke-width="2"/>';
      svg+='<line x1="'+(px-9).toFixed(0)+'" y1="'+(py-16).toFixed(0)+'" x2="'+(px+9).toFixed(0)+'" y2="'+(py-16).toFixed(0)+'" stroke="#1E3A52" stroke-width="2"/>';
      svg+='<text x="'+(px+(g.side==='right'?12:-12)).toFixed(0)+'" y="'+(py-10).toFixed(0)+'" font-size="12" fill="#1E3A52" text-anchor="'+(g.side==='right'?'start':'end')+'">'+esc(c.name)+' '+f2(c.fit)+'</text>';
    });
    /* difficulty marker + name at label anchor */
    const mk=diff.k==='green'?'<circle cx="0" cy="0" r="8" fill="#2E8B57"/>':diff.k==='blue'?'<rect x="-8" y="-8" width="16" height="16" fill="#2B6BB3"/>':'<rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="#22272B"/>';
    svg+='<g transform="translate('+g.label[0]+','+g.label[1]+')">'+mk+'</g>';
    svg+='<text x="'+g.label[0]+'" y="'+(g.label[1]-16)+'" font-size="14.5" font-weight="800" text-anchor="middle" fill="#1E3A52">'+esc(s.title)+'</text>';
    svg+='<text x="'+g.label[0]+'" y="'+(g.label[1]+26)+'" font-size="11.5" font-style="italic" text-anchor="middle" fill="#33526E">'+esc(s.angle||'')+' · drop '+views(s.reach&&s.reach.estViews)+' vertical</text>';
  });
  /* closed runs — north face */
  svg+='<text x="846" y="232" font-size="12" font-weight="800" fill="#D6482B" letter-spacing="2">NORTH FACE</text>';
  anti.forEach((a,i)=>{
    const g=closedGeo[i%closedGeo.length];
    svg+='<line x1="'+g.x1+'" y1="'+g.y1+'" x2="'+g.x2+'" y2="'+g.y2+'" stroke="#9AAABB" stroke-width="5" stroke-dasharray="4 7" stroke-linecap="round"/>';
    const mx=(g.x1+g.x2)/2,my=(g.y1+g.y2)/2;
    svg+='<g transform="translate('+mx+','+my+')"><line x1="-6" y1="-6" x2="6" y2="6" stroke="#D6482B" stroke-width="3"/><line x1="6" y1="-6" x2="-6" y2="6" stroke="#D6482B" stroke-width="3"/></g>';
    svg+='<text x="'+((g.x1+g.x2)/2+10)+'" y="'+((g.y1+g.y2)/2-8)+'" font-size="11.5" font-weight="700" fill="#6B7F92">'+esc(a.title)+'</text>';
  });
  svg+='<line x1="790" y1="220" x2="965" y2="600" stroke="#D6482B" stroke-width="2" stroke-dasharray="3 6"/>';
  /* base lodge */
  svg+='<g transform="translate(458,606)"><rect x="-42" y="0" width="84" height="26" rx="4" fill="#1E3A52"/><path d="M-48,0 L0,-16 L48,0 Z" fill="#1E3A52"/><text x="0" y="17" font-size="11" font-weight="800" fill="#FDFCF8" text-anchor="middle" letter-spacing="1">BASE LODGE</text></g>';
  svg+='</svg>';
  document.getElementById('map').innerHTML=svg;

  /* legend */
  document.getElementById('legend').innerHTML='<h3>Trail legend</h3>'+
    strats.map(s=>{const fit=(s.audienceFit&&s.audienceFit.score)||0;const diff=DIFF(fit);
      return '<div class="lg">'+MARK[diff.k]+'<span><b>'+esc(s.title)+'</b> — '+esc(diff.n)+', groomed to '+f2(fit)+' · '+(s.formats||[]).map(esc).join(', ')+'</span></div>';}).join('')+
    '<div class="note">Difficulty marks audience fit — the steeper the rating, the surer the carving. Hero wax: '+(strats.map(s=>esc(s.heroSignal||'')).filter(Boolean).slice(0,2).join(' + ')||'—')+'.</div>';

  /* watchouts under legend as patrol cautions */
  const wo=strats.map(s=>(s.watchouts||[])[0]).filter(Boolean);
  if(wo.length)document.getElementById('legend').innerHTML+='<h3 style="margin-top:12px">Patrol cautions</h3><div class="note" style="margin-top:0">'+wo.map(esc).join(' ')+'</div>';
}

/* snow report = audience */
if(AR&&AR.lean){
  document.getElementById('snow').innerHTML='<h3>Snow report — who’s on the hill</h3>'+
  '<div class="row"><span class="k">Skier type</span><b>'+esc(AR.lean.label)+'</b></div>'+
  '<div class="row"><span class="k">Base depth</span><span><b>'+Math.round((AR.lean.confidence||0)*100)+' cm</b> of read confidence</span></div>'+
  '<div class="row"><span class="k">Overnight</span><span>'+(AR.lean.signals||[]).map(esc).join(' · ')+'</span></div>'+
  '<div class="row"><span class="k">Best terrain</span><span>'+(AR.mediaHabits||[]).map(h=>esc(h.channel)).join(' · ')+'</span></div>'+
  '<div class="regs">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>';
}

/* closed list = anti */
if(anti.length){
  document.getElementById('closed').innerHTML='<h3>Closed runs — roped off by patrol</h3><ul>'+
  anti.map(a=>'<li><span class="x">✕</span><span><b>'+esc(a.title)+'</b> <span style="color:var(--mut)">('+esc(a.channel)+')</span><p>'+esc(a.whyNot)+'</p></span></li>').join('')+'</ul>';
}else{document.getElementById('closed').style.display='none'}

/* collapse any panel that never got data */
['legend','snow'].forEach(id=>{const p=document.getElementById(id);if(p&&!p.innerHTML.trim())p.style.display='none'});
if(!strats.length){const mb=document.querySelector('.mapbox');if(mb)mb.innerHTML='<div class="empty">Fogged in — the trail crew lost the map.</div>'}

const M=document.getElementById('app');
const sec=(title,body)=>{if(!body)return;M.appendChild(el('<section class="sec"><div class="panel"><div class="h2">'+esc(title)+'</div>'+body+'</div></section>'))};

/* base lodge: brief + stubs */
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('Base lodge — the day plan',
  '<div class="lodge"><div class="briefcard">'+
  (br?'<div class="bt">'+esc(br.title)+'</div><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Ski school</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Mountain code</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Run of day</dt><dd>'+esc(selS.title)+' — serviced by the '+esc(selS.heroSignal||'—')+' gondola</dd></dl>':'<div class="lede">No day plan pinned at the lodge.</div>')+
  '</div>'+
  '<div class="stubs">'+CREAT.map(m=>'<figure class="stub"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">lift ticket · '+esc(m.provider)+'</div></figcaption></figure>').join('')+'</div></div>');
}

/* jackets = palette */
sec('Patrol jackets — resort colors',
  '<div class="jackets">'+PALETTE.map(s=>'<div class="jk"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">'+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* patrol radio log = qloo */
if(calls.length||affs.length){
  sec('Ski patrol radio log — Qloo dispatch, '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' on channel 9',
  '<div class="patrol"><div class="radio">'+calls.map(c=>'<div class="lr"><b>'+esc((c.at||'').slice(11,19))+'Z — '+esc(c.endpoint)+'</b><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,32)).join(' · '))+'</span><span class="me"><span>'+esc(c.tookMs)+' ms airtime</span><span>'+esc(c.n)+' pings returned</span><span>'+esc(c.mode)+'</span></span></div>').join('')+'</div>'+
  '<div class="ranks"><h4>What the radio says they follow</h4>'+affs.map(g=>'<div class="dv">'+esc(g.type.replace('urn:entity:',''))+'</div>'+
  g.entities.slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* pass */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
sec('Other mountains on this pass',
  '<div class="passrow">'+['Trail-map poster','Resort brochure','Video flyover','Season report'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+'</div>'+
  (others.length?'<div class="others"><b>Also serviced by this pass</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

if(!document.querySelector('.mapscroll svg')&&!M.children.length)
  M.appendChild(el('<div class="panel empty" style="margin-top:16px">The mountain is fogged in — data.js never reached the resort.</div>'));
})();
</script>
</body>
</html>
