<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL 38 — Synthwave Broadcast</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23070D2B'/%3E%3Ccircle cx='32' cy='30' r='14' fill='%23FF2E93'/%3E%3Cpath d='M8 52h48M14 58h36' stroke='%2300E7FF' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#070D2B;
  --deep:#04081C;
  --panel:#0B1338;
  --ink:#E7EDFF;
  --dim:#7B88B8;
  --line:rgba(0,231,255,.28);
  --pink:#FF2E93;
  --cyan:#00E7FF;
  --disp:'Orbitron','Arial Black',ui-sans-serif,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--deep);
  color:var(--ink);
  font-family:var(--mono);
  font-size:13px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:rgba(255,46,147,.45)}
a{color:var(--cyan);text-decoration:none;border-bottom:1px solid transparent}
a:hover{color:#fff;border-bottom-color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
a:focus-visible,button:focus-visible{outline:1px solid var(--cyan);outline-offset:3px}
button{font-family:var(--mono);cursor:pointer}
img{display:block;max-width:100%}

/* ===== starfield + horizon ===== */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.9),transparent 100%),
    radial-gradient(1px 1px at 34% 8%,rgba(255,255,255,.7),transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 24%,rgba(0,231,255,.8),transparent 100%),
    radial-gradient(1px 1px at 76% 12%,rgba(255,255,255,.8),transparent 100%),
    radial-gradient(1px 1px at 88% 34%,rgba(255,46,147,.7),transparent 100%),
    radial-gradient(1px 1px at 22% 42%,rgba(255,255,255,.5),transparent 100%),
    radial-gradient(1.5px 1.5px at 45% 55%,rgba(255,255,255,.6),transparent 100%),
    radial-gradient(1px 1px at 67% 44%,rgba(0,231,255,.5),transparent 100%),
    radial-gradient(1px 1px at 5% 60%,rgba(255,255,255,.4),transparent 100%),
    radial-gradient(1.5px 1.5px at 93% 62%,rgba(255,255,255,.55),transparent 100%);
  background-size:100% 100%;}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,40px) 70px}

/* ===== hero ===== */
.hero{position:relative;padding:clamp(40px,7vh,80px) 0 0;text-align:center;min-height:340px}
.sun{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);width:min(340px,72vw);z-index:0;opacity:.95}
.gridfloor{position:absolute;left:0;right:0;bottom:-46px;height:190px;overflow:hidden;z-index:0;
  mask-image:linear-gradient(180deg,#000 20%,transparent 92%);-webkit-mask-image:linear-gradient(180deg,#000 20%,transparent 92%)}
.gridfloor .pl{
  position:absolute;left:-30%;right:-30%;top:-40%;bottom:-160%;
  transform:perspective(340px) rotateX(62deg);
  background:
    repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 64px),
    repeating-linear-gradient(0deg,var(--line) 0 2px,transparent 2px 44px);
  animation:gridmove 7s linear infinite;
}
@keyframes gridmove{to{background-position:0 0,0 44px}}
.hero .kick{position:relative;font-size:10px;letter-spacing:.5em;color:var(--cyan);text-transform:uppercase;text-shadow:0 0 10px rgba(0,231,255,.6)}
.hero h1{
  position:relative;font-family:var(--disp);font-weight:900;font-size:clamp(34px,7.4vw,84px);
  line-height:1.04;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;
  background:linear-gradient(180deg,#F4F8FF 8%,#B9CBE8 38%,#5F7CA8 50%,#DEE9FB 56%,#8FA9CC 78%,#EDF3FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,46,147,.55)) drop-shadow(0 -1px 0 rgba(0,231,255,.4));
}
.hero .sub{position:relative;margin-top:12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.hero .sub b{color:var(--pink)}

/* ===== sections ===== */
.sec{margin-top:64px;position:relative}
.sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-h .ch-num{font-family:var(--disp);color:var(--pink);font-size:12px;letter-spacing:.2em;text-shadow:0 0 10px rgba(255,46,147,.7)}
.sec-h h2{
  font-family:var(--disp);font-weight:700;font-size:clamp(16px,2.4vw,24px);letter-spacing:.22em;text-transform:uppercase;
  background:linear-gradient(180deg,#F4F8FF,#93A9CD);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.sec-h h2::after{content:"";display:block;height:2px;margin-top:5px;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.sec-h .side{margin-left:auto;font-size:9.5px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}

.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(11,19,56,.92),rgba(7,13,43,.86));position:relative;
  box-shadow:0 0 0 1px rgba(255,46,147,.07),0 10px 40px rgba(0,0,0,.5), inset 0 0 40px rgba(0,231,255,.03)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
.scan{position:relative;overflow:hidden}
.scan::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}

/* ask */
.ask{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.ask>div{padding:24px 26px;min-width:0}
.ask .l{border-right:1px dashed var(--line)}
.lbl{font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan);display:block;margin-bottom:10px}
.ask .prompt{font-family:var(--disp);font-weight:700;font-size:clamp(19px,3vw,30px);line-height:1.25;text-transform:uppercase;letter-spacing:.03em}
.ask .prompt em{font-style:normal;color:var(--pink);text-shadow:0 0 14px rgba(255,46,147,.7)}
.ask .url{margin-top:14px;font-size:12px;word-break:break-all}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:11.5px}
.kv dt{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.kv dd{overflow-wrap:anywhere}

/* audience */
.aud{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr) minmax(0,.95fr)}
.aud>div{padding:22px 24px;border-right:1px dashed var(--line);min-width:0}
.aud>div:last-child{border-right:none}
.lean{font-family:var(--disp);font-size:clamp(20px,3vw,32px);font-weight:900;text-transform:uppercase;color:#fff;text-shadow:0 0 18px rgba(0,231,255,.55),0 0 4px var(--cyan);letter-spacing:.05em}
.conf{font-size:10px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.seg{display:flex;gap:3px;margin:12px 0 4px}
.seg i{flex:1;height:12px;border:1px solid var(--line);background:transparent}
.seg i.on{background:var(--cyan);box-shadow:0 0 8px rgba(0,231,255,.6);border-color:var(--cyan)}
.sig li{list-style:none;padding:7px 0 7px 16px;border-bottom:1px dashed rgba(0,231,255,.14);font-size:12px;position:relative}
.sig li::before{content:"›";position:absolute;left:0;color:var(--pink)}
.hab{display:grid;grid-template-columns:86px 1fr;gap:4px 12px;padding:8px 0;border-bottom:1px dashed rgba(0,231,255,.14);font-size:12px}
.hab:last-child{border-bottom:none}
.hab b{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.vibes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vibes span{border:1px solid var(--pink);color:#FFD3E8;padding:3px 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 8px rgba(255,46,147,.5);box-shadow:inset 0 0 10px rgba(255,46,147,.12)}

/* strategy tapes */
.tapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tape{position:relative;border:1px solid var(--line);background:var(--panel);padding:0;transition:transform .18s,box-shadow .18s;min-width:0}
.tape:hover{transform:translateY(-4px);box-shadow:0 0 0 1px var(--pink),0 14px 34px rgba(255,46,147,.14)}
.tape .trk{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.tape .trk .t{font-size:9px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
.tape .trk .n{font-family:var(--disp);font-size:10px;color:var(--dim)}
.tape h3{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:14px 16px 2px;line-height:1.25}
.tape .ang{padding:0 16px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink)}
.tape .fit{padding:14px 16px 6px;border-bottom:1px dashed var(--line)}
.tape .fit b{font-family:var(--disp);font-size:26px;color:#fff;text-shadow:0 0 12px rgba(0,231,255,.7)}
.tape .fit small{display:block;font-size:8.5px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.tape .fbar{height:8px;border:1px solid var(--line);margin-top:8px;padding:1px}
.tape .fbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));box-shadow:0 0 10px rgba(0,231,255,.5)}
.tape .chs{padding:10px 16px}
.tape .ch{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:10.5px;padding:4px 0}
.tape .ch b{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tape .ch .cb{height:6px;border:1px solid var(--line);padding:1px}
.tape .ch .cb i{display:block;height:100%;background:var(--cyan)}
.tape .ch .why{grid-column:1/-1;font-size:9.5px;color:var(--dim);letter-spacing:.08em}
.tape .fmt{padding:6px 16px;display:flex;flex-wrap:wrap;gap:5px}
.tape .fmt span{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);padding:2px 7px;color:var(--dim)}
.tape .rch{margin:8px 16px 0;padding-top:10px;border-top:1px solid var(--line);font-size:11px}
.tape .rch b{font-family:var(--disp);color:var(--pink);font-size:17px;text-shadow:0 0 10px rgba(255,46,147,.6)}
.tape .rch small{display:block;color:var(--dim);font-size:9.5px;line-height:1.45;margin-top:3px}
.tape .wch{margin:10px 16px 14px;font-size:9.5px;color:#FFB3D5;border-left:2px solid var(--pink);padding-left:8px;line-height:1.45}
.tape.sel{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 26px rgba(255,46,147,.25)}
.tape .hero-sig{position:absolute;top:-11px;right:12px;background:var(--navy);border:1px solid var(--pink);color:#fff;
  font-size:8.5px;letter-spacing:.22em;padding:3px 9px;text-transform:uppercase;text-shadow:0 0 8px var(--pink)}

/* off air */
.offair{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.off{position:relative;border:1px solid rgba(255,46,147,.35);padding:16px;background:
  repeating-linear-gradient(0deg,rgba(255,46,147,.06) 0 3px,transparent 3px 6px),var(--panel)}
.off .lost{font-family:var(--disp);font-size:9px;letter-spacing:.3em;color:var(--pink);text-transform:uppercase;text-shadow:0 0 8px rgba(255,46,147,.8)}
.off h4{font-family:var(--disp);font-size:14px;margin:8px 0 2px;text-transform:uppercase;text-decoration:line-through;text-decoration-color:var(--pink)}
.off .ch{font-size:9px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.off p{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}

/* broadcast */
.bc{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr)}
.bc .brief{padding:24px;border-right:1px dashed var(--line)}
.bc .brief h3{font-family:var(--disp);font-size:clamp(19px,2.6vw,28px);font-weight:900;text-transform:uppercase;line-height:1.15;color:#fff;text-shadow:0 0 16px rgba(0,231,255,.4)}
.bc .brief .ba{color:var(--pink);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin:10px 0 16px}
.bc .brief .msg{font-family:var(--disp);font-size:15px;color:#fff;text-shadow:0 0 10px rgba(255,46,147,.5)}
.crts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.crt{padding:14px;border-right:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.crt:nth-child(2n){border-right:none}
.crt:nth-last-child(-n+2){border-bottom:none}
.crt .scr{position:relative;border:1px solid var(--line);padding:4px;background:#000}
.crt .scr img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(1.1) contrast(1.05)}
.crt .scr::after{content:"";position:absolute;inset:4px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 4px)}
.crt figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:9px;font-size:11px}
.crt .h{min-width:0;overflow-wrap:anywhere}
.crt .p{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyan);padding:1px 7px;white-space:nowrap;text-shadow:0 0 6px rgba(0,231,255,.6)}

/* palette */
.pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.sw .box{height:80px;border:1px solid var(--line);position:relative;box-shadow:0 0 18px rgba(0,231,255,.12)}
.sw .box::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 45%)}
.sw .n{font-family:var(--disp);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.sw .h{font-size:9.5px;letter-spacing:.18em;color:var(--dim)}

/* provenance */
.prov{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.25fr)}
.prov>div{padding:22px 24px;min-width:0}
.prov .l{border-right:1px dashed var(--line)}
.prov table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;table-layout:fixed}
.prov th{font-size:8.5px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;text-align:left;padding:4px 6px;border-bottom:1px solid var(--cyan)}
.prov th:nth-child(2){width:34px}.prov th:nth-child(3){width:52px}.prov th:nth-child(4){width:56px}
.prov td{padding:6px;border-bottom:1px dashed rgba(0,231,255,.14);vertical-align:top;overflow-wrap:anywhere}
.prov .ep{color:var(--cyan)}
.prov .pm{display:block;color:var(--dim);font-size:9.5px;overflow-wrap:anywhere}
.prov .md{border:1px solid var(--pink);color:var(--pink);font-size:8.5px;padding:1px 6px;letter-spacing:.14em;text-transform:uppercase}
.affg{margin-top:12px}
.affg .t{font-family:var(--disp);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.aff{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:11.5px;border-bottom:1px dotted rgba(0,231,255,.12)}
.aff:last-child{border-bottom:none}
.aff .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aff .bar{width:70px;height:6px;border:1px solid var(--line);padding:1px}
.aff .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}
.aff .v{color:var(--cyan);font-size:10.5px}

/* next */
.nrow{display:flex;flex-wrap:wrap;gap:14px}
.nchip{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:11px 22px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;transition:.15s;box-shadow:inset 0 0 14px rgba(0,231,255,.08)}
.nchip:hover{color:#fff;border-color:var(--pink);box-shadow:inset 0 0 18px rgba(255,46,147,.25),0 0 14px rgba(255,46,147,.35);text-shadow:0 0 8px var(--pink)}
.nchip:active{transform:translateY(1px)}

.foot{margin-top:70px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.empty{border:1px dashed var(--line);padding:44px;text-align:center;color:var(--dim);letter-spacing:.2em}

@media(max-width:1020px){
  .tapes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .offair{grid-template-columns:repeat(2,minmax(0,1fr))}
  .aud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .aud>div:nth-child(3){grid-column:1/-1;border-right:none;border-top:1px dashed var(--line)}
  .bc{grid-template-columns:minmax(0,1fr)}
  .bc .brief{border-right:none;border-bottom:1px dashed var(--line)}
  .prov{grid-template-columns:minmax(0,1fr)}
  .prov .l{border-right:none;border-bottom:1px dashed var(--line)}
  .pal{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:640px){
  .tapes,.offair,.crts{grid-template-columns:minmax(0,1fr)}
  .crt{border-right:none!important;border-bottom:1px dashed var(--line)!important}
  .crt:last-child{border-bottom:none!important}
  .aud{grid-template-columns:minmax(0,1fr)}
  .aud>div{border-right:none;border-bottom:1px dashed var(--line)}
  .aud>div:last-child{border-bottom:none}
  .ask{grid-template-columns:minmax(0,1fr)}
  .ask .l{border-right:none;border-bottom:1px dashed var(--line)}
  .pal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{min-height:280px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <header class="hero">
    <div class="kick">Marque broadcast network · channel 38</div>
    <h1 id="hero-title">Signal<br>Sunset</h1>
    <div class="sub">strategy → campaign → <b>final result</b> · live feed</div>
    <svg class="sun" viewBox="0 0 340 190" aria-hidden="true">
      <defs>
        <linearGradient id="sung" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFD76E"/><stop offset=".45" stop-color="#FF8E5A"/><stop offset="1" stop-color="#FF2E93"/>
        </linearGradient>
      </defs>
      <clipPath id="sunclip"><circle cx="170" cy="150" r="128"/></clipPath>
      <g clip-path="url(#sunclip)">
        <rect x="0" y="0" width="340" height="190" fill="url(#sung)"/>
        <rect x="0" y="118" width="340" height="3" fill="#04081C"/>
        <rect x="0" y="132" width="340" height="5" fill="#04081C"/>
        <rect x="0" y="148" width="340" height="7" fill="#04081C"/>
        <rect x="0" y="168" width="340" height="10" fill="#04081C"/>
        <rect x="0" y="186" width="340" height="12" fill="#04081C"/>
      </g>
    </svg>
    <div class="gridfloor"><div class="pl"></div></div>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <span>CH·38 — MARQUE BROADCAST NETWORK</span>
    <span id="foot-id">FEED —</span>
    <span>END OF TRANSMISSION · DO NOT ADJUST YOUR SET</span>
  </footer>
</div>

<script src="./data.js"></script>
<script src="./media-data.js"></script>
<script src="./dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'./'):'';
const pct=x=>Math.round((x||0)*100);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[5,8,11,13].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||(s.reach&&s.reach.estViews)>(strats[b].reach&&strats[b].reach.estViews||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('hero-title').innerHTML=esc(B.title||'Signal Sunset').replace(/→/g,'<br>');
document.getElementById('foot-id').textContent='FEED '+(B.id||'—').slice(0,8).toUpperCase();

const M=document.getElementById('app');
const sec=(num,title,side,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="sec"><div class="sec-h"><span class="ch-num">'+num+'</span><h2>'+esc(title)+'</h2>'+(side?'<span class="side">'+esc(side)+'</span>':'')+'</div><div class="panel scan">'+body+'</div></section>'));
};

/* 01 the ask */
if(B.sub||B.urlContext){
  const u=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url)||'';
  sec('01','INCOMING REQUEST','signal locked · verified source',
    '<div class="ask"><div class="l"><span class="lbl">Transmission · viewer request</span>'+
    '<p class="prompt">'+esc((B.sub&&B.sub.prompt)||B.title||'').replace(/→/g,'<em>→</em>')+'</p>'+
    (u?'<p class="url"><a href="'+esc(u)+'">'+esc(u)+'</a></p>':'')+'</div>'+
    '<div><span class="lbl">Source decode</span>'+
    '<dl class="kv"><dt>Page</dt><dd>'+esc(B.urlContext&&B.urlContext.title||'—')+'</dd>'+
    '<dt>Board</dt><dd>'+esc(B.id||'—')+'</dd>'+
    '<dt>Signal</dt><dd>'+esc(B.urlContext&&B.urlContext.description||'—')+'</dd></dl></div></div>');
}

/* 02 audience */
if(AR&&AR.lean){
  const segs=Array.from({length:10},(_,i)=>'<i class="'+((AR.lean.confidence||0)*10>i?'on':'')+'"></i>').join('');
  sec('02','DEMOGRAPHIC SCAN','who’s tuned in tonight',
    '<div class="aud"><div><span class="lbl">Dominant lean</span><div class="lean">'+esc(AR.lean.label||'—')+'</div>'+
    '<div class="conf">Signal confidence '+pct(AR.lean.confidence)+'%</div><div class="seg">'+segs+'</div>'+
    '<ul class="sig">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>'+
    '<div><span class="lbl">Channel habits</span>'+(AR.mediaHabits||[]).map(h=>'<div class="hab"><b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span></div>').join('')+'</div>'+
    '<div><span class="lbl">On-air vibe words</span><div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>');
}

/* 03 strategies */
if(strats.length){
  sec('03','FOUR TRACKS','side a · pick your frequency',
    '<div class="tapes">'+strats.map((s,i)=>{
      const f=pct(s.audienceFit&&s.audienceFit.score);
      return '<article class="tape'+(i===sel?' sel':'')+'">'+
      (i===sel?'<span class="hero-sig">★ now spinning</span>':'')+
      '<div class="trk"><span class="t">Track 0'+(i+1)+'</span><span class="n">'+esc((s.id||'').toUpperCase())+'</span></div>'+
      '<h3>'+esc(s.title)+'</h3><div class="ang">'+esc(s.angle)+'</div>'+
      '<div class="fit"><b>'+f+'<small style="font-size:12px">%</small></b><small>Audience fit</small><div class="fbar"><i style="width:'+f+'%"></i></div></div>'+
      '<div class="chs">'+(s.channels||[]).map(c=>'<div class="ch"><b>'+esc(c.name)+'</b><span class="cb"><i style="width:'+pct(c.fit)+'%"></i></span><span>'+pct(c.fit)+'</span>'+(c.why?'<span class="why">via '+esc(c.why)+'</span>':'')+'</div>').join('')+'</div>'+
      '<div class="fmt">'+(s.formats||[]).map(fm=>'<span>'+esc(fm)+'</span>').join('')+'</div>'+
      (s.reach?'<div class="rch">'+views(s.reach.estViews)+' <b>est. plays</b><small>'+esc(s.reach.basis||'')+'</small></div>':'')+
      ((s.watchouts&&s.watchouts[0])?'<div class="wch">'+esc(s.watchouts[0])+'</div>':'')+
      '</article>'}).join('')+
    '</div>');
}

/* 04 off air */
if(anti.length){
  sec('04','OFF AIR','frequencies we do not broadcast on',
    '<div class="offair">'+anti.map(a=>
      '<div class="off"><span class="lost">· signal lost ·</span><h4>'+esc(a.title)+'</h4><div class="ch">ch·'+esc(a.channel).toUpperCase()+'</div>'+
      '<p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>');
}

/* 05 broadcast */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('05','TONIGHT’S BROADCAST','brief + fresh creative from the booth',
    '<div class="bc"><div class="brief"><span class="lbl">Featured track 0'+(sel!=null?sel+1:'—')+'</span>'+
    (br?'<h3>'+esc(br.title)+'</h3><p class="ba">'+esc(br.angle)+'</p>'+
    '<dl class="kv"><dt>Audience</dt><dd>'+esc(br.audience)+'</dd>'+
    '<dt>Key msg</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
    '<dt>Hero sig</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<p class="ba">no brief bound</p>')+'</div>'+
    '<div class="crts">'+CREAT.map((m,i)=>
      '<figure class="crt"><div class="scr"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
      '<figcaption><span class="h">'+esc(m.head)+'</span><span class="p">'+esc(m.provider)+'</span></figcaption></figure>').join('')+
    '</div></div>');
}

/* 06 palette */
sec('06','PAINT CHIPS','house palette · neon-tested',
  '<div style="padding:20px"><div class="pal">'+PALETTE.map(s=>
    '<div class="sw"><div class="box" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">'+s.h.toUpperCase()+'</div></div>').join('')+
  '</div></div>');

/* 07 provenance */
if(B.evidence||affs.length){
  sec('07','TRANSMISSION LOG','every signal traced · qloo relay',
    '<div class="prov"><div class="l"><span class="lbl">Relay calls · '+(calls.length)+' logged · '+(B.qlooBundle&&B.qlooBundle.mode?B.qlooBundle.mode.toUpperCase():'—')+' mode</span>'+
    '<table><thead><tr><th>Endpoint</th><th>N</th><th>Ms</th><th>Mode</th></tr></thead><tbody>'+
    calls.map(c=>'<tr><td><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,16)).join(' '))+'</span></td>'+
      '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
    '</tbody></table></div>'+
    '<div><span class="lbl">Strongest frequencies received</span>'+
    affs.map(g=>'<div class="affg"><div class="t">'+esc(g.type.replace('urn:entity:',''))+' band</div>'+
      g.entities.slice(0,4).map(e=>'<div class="aff"><span class="nm">'+esc(e.name)+'</span><span class="bar"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')+'</div>').join('')+
    '</div></div>');
}

/* 08 next */
sec('08','UP NEXT','request line is open',
  '<div style="padding:20px"><div class="nrow">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button class="nchip">'+x+'</button>').join('')+'</div></div>');

if(!M.children.length)M.appendChild(el('<div class="empty">SIGNAL LOST — data.js failed to load.</div>'));
})();
</script>
</body>
</html>
