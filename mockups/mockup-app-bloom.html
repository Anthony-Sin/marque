<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque — Marketing Studio</title>
<style>
:root{
  --bg:#f7f7f1;
  --card:#ffffff;
  --ink:#1d1d18;
  --ink2:#3c3c34;
  --mut:#7a7a6e;
  --line:rgba(28,30,14,.08);
  --acc:#4d7c0f;            /* leaf green — accent text/icons */
  --acc-bright:#84cc16;     /* sprout lime — fills/progress */
  --acc-soft:#eef8dd;       /* lime wash */
  --acc-ink:#2c4410;        /* ink on lime */
  --shadow:0 1px 2px rgba(26,34,12,.05),0 18px 44px -22px rgba(26,34,12,.16);
  --shadow-hi:0 2px 4px rgba(26,34,12,.06),0 30px 60px -26px rgba(26,34,12,.24);
  --r-lg:26px;
  --r-md:20px;
  --r-sm:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  min-width:390px;
  background-image:
    radial-gradient(900px 480px at 85% -10%,rgba(163,230,53,.16),transparent 60%),
    radial-gradient(700px 420px at -10% 30%,rgba(132,204,22,.10),transparent 55%),
    radial-gradient(800px 500px at 60% 110%,rgba(190,242,100,.10),transparent 60%);
  background-attachment:fixed;
}
::selection{background:rgba(163,230,53,.4)}
button,input{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:var(--acc)}

/* ============ top bar ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(247,247,241,.72);
  backdrop-filter:saturate(1.5) blur(18px);
  -webkit-backdrop-filter:saturate(1.5) blur(18px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1180px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);flex:none}
.sprout{
  width:24px;height:24px;border-radius:50% 50% 50% 4px;
  background:linear-gradient(135deg,#a3e635,#4d7c0f);
  transform:rotate(-8deg);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.12),0 4px 10px -4px rgba(77,124,15,.5);
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(-3deg) scale(1.08)}}
.brand .studio{font-weight:500;color:var(--mut);font-size:13px;margin-left:2px;padding-top:2px}
.nav{
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;padding:2px;flex:1;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0;background:transparent;cursor:pointer;white-space:nowrap;
  font-size:13px;font-weight:600;color:var(--ink2);
  padding:8px 14px;border-radius:999px;
  transition:background .2s,color .2s,transform .15s;
}
.nav button:hover{background:rgba(28,30,14,.06);transform:translateY(-1px)}
.nav button.on{background:var(--ink);color:#fff}
.nav button .n{
  display:inline-block;min-width:17px;text-align:center;
  font-size:10px;font-weight:800;background:var(--acc-soft);color:var(--acc);
  border-radius:99px;padding:1px 5px;margin-left:5px;vertical-align:1px;
}
.nav button.on .n{background:var(--acc-bright);color:var(--acc-ink)}

/* ============ layout ============ */
main{max-width:1180px;margin:0 auto;padding:34px 20px 90px}
.view-head{margin:6px 2px 22px;animation:rise .5s cubic-bezier(.2,.75,.25,1) both}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);
}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc-bright);box-shadow:0 0 0 4px rgba(132,204,22,.18)}
.view-head h1{font-size:clamp(30px,4.4vw,44px);letter-spacing:-.035em;line-height:1.02;font-weight:800;margin-top:10px}
.view-head .lede{font-size:15px;color:var(--mut);line-height:1.55;max-width:60ch;margin-top:10px}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1fr) 340px;align-items:start}

.card{
  background:var(--card);border-radius:var(--r-lg);
  border:1px solid rgba(28,30,14,.05);
  box-shadow:var(--shadow);
  padding:26px;min-width:0;
  animation:rise .6s cubic-bezier(.2,.75,.25,1) both;
  animation-delay:var(--d,0s);
  transition:transform .3s cubic-bezier(.2,.75,.25,1),box-shadow .3s;
}
.card.hoverable:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

.ml{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--mut);font-weight:800}
.mt{font-size:clamp(19px,2vw,23px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.55}
.small{font-size:12px;color:var(--mut);line-height:1.5}

/* chips + badges */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:12px;font-weight:600;color:var(--ink2);
  background:#f4f4ec;border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  white-space:nowrap;
}
.chip.lime{background:var(--acc-soft);color:var(--acc-ink);border-color:rgba(77,124,15,.14)}
.chip.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.qbadge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:800;letter-spacing:.04em;
  color:var(--acc-ink);background:var(--acc-soft);
  border:1px solid rgba(77,124,15,.18);border-radius:999px;padding:4px 11px;
}
.qbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc-bright)}
.err-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  color:#8a5a10;background:#fdf6e4;border:1px solid #f0e3bd;border-radius:999px;padding:4px 11px;
}

/* pills buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;
  font-weight:700;font-size:14px;letter-spacing:-.01em;
  padding:13px 26px;border-radius:999px;text-decoration:none;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .2s;
}
.btn:active{transform:scale(.96)}
.btn-ink{background:var(--ink);color:#fff;box-shadow:0 10px 24px -10px rgba(28,30,14,.5)}
.btn-ink:hover{transform:translateY(-2px) scale(1.02)}
.btn-lime{background:linear-gradient(135deg,#b8ec52,#84cc16);color:var(--acc-ink);box-shadow:0 10px 24px -10px rgba(101,163,13,.55)}
.btn-lime:hover{transform:translateY(-2px) scale(1.02)}
.btn-ghost{background:#f4f4ec;color:var(--ink2);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--acc-soft)}
:focus-visible{outline:3px solid rgba(132,204,22,.55);outline-offset:2px;border-radius:8px}

/* stats — big airy numbers */
.stat .num{
  font-size:clamp(44px,5vw,64px);font-weight:800;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--ink) 30%,var(--acc));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat .lab{font-size:12px;font-weight:700;color:var(--mut);margin-top:6px}

/* bars */
.bar{height:7px;border-radius:99px;background:#efefe6;overflow:hidden;flex:1;min-width:40px}
.bar i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#b8ec52,var(--acc-bright));
  width:calc(var(--w)*100%);
  transform-origin:left;animation:grow 1s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d,0s);
}
.bar.dim i{background:#d5d5c6}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ring */
.ringwrap{position:relative;width:132px;height:132px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#efefe6;stroke-width:10}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.75,.25,1) .3s}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c .bignum{font-size:36px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

/* swatches */
.swcard{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:#fff;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.swcard:hover{transform:translateY(-3px) scale(1.03)}
.swcard .sw{height:74px}
.swcard .sm{padding:10px 12px 12px}
.swcard .sm b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.01em;text-transform:capitalize}
.swcard .sm span{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}

/* media */
.media{border-radius:var(--r-md);overflow:hidden;background:#f0f0e8;position:relative}
.media img{width:100%;height:100%;object-fit:cover}
.media.gone{display:none}
.errbox{
  border-radius:var(--r-md);background:#fbf7ec;border:1px dashed #e5d9b8;
  padding:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
}
.errbox .et{font-size:12.5px;font-weight:700;color:#8a5a10}
.errbox .em{font-size:11.5px;color:#a08040;line-height:1.5;word-break:break-word}

/* folds */
details.fold{border-top:1px solid var(--line);padding-top:14px}
details.fold summary{
  list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  user-select:none;border-radius:8px;padding:4px 6px 4px 0;
}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{
  content:"";width:0;height:0;border-left:6px solid var(--acc);
  border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
details.fold[open] summary::before{transform:rotate(90deg)}
details.fold summary b{background:#f4f4ec;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:10px;color:var(--ink2)}
details.fold .fold-body{padding-top:13px}
details.fold video{width:100%;border-radius:var(--r-md);background:#111;display:block}
.fold-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.fold-list li{font-size:12.5px;color:var(--ink2);line-height:1.5;padding-left:16px;position:relative}
.fold-list li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--acc-bright)}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .gl{width:18px;height:18px;color:var(--acc);flex:none}
.row b.rn{font-size:13px;font-weight:700;width:92px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:capitalize}
.row .rv{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;flex:none;min-width:28px;text-align:right}
.row .rwhy{font-size:10.5px;color:var(--mut);flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* hero — onboarding */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 0 8px}
.hero h1{font-size:clamp(44px,7vw,84px);letter-spacing:-.045em;line-height:.98;font-weight:800;animation:rise .7s cubic-bezier(.2,.75,.25,1) both}
.hero h1 .dot{color:var(--acc-bright)}
.hero .lede{animation:rise .7s .08s cubic-bezier(.2,.75,.25,1) both;font-size:clamp(15px,1.8vw,18px);color:var(--mut);max-width:56ch;margin-top:18px;line-height:1.6}
.urlbox{
  animation:rise .7s .16s cubic-bezier(.2,.75,.25,1) both;
  margin-top:30px;width:min(620px,100%);
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
  border:1px solid rgba(28,30,14,.09);border-radius:999px;padding:8px 8px 8px 20px;
  box-shadow:0 18px 44px -18px rgba(26,34,12,.22);
  transition:box-shadow .25s,transform .25s;
}
.urlbox:focus-within{box-shadow:0 20px 50px -16px rgba(101,163,13,.35);transform:translateY(-2px)}
.urlbox .gl{width:19px;height:19px;color:var(--mut);flex:none}
.urlbox input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-size:15px;font-weight:500;color:var(--ink);padding:9px 0;
}
.urlbox input::placeholder{color:#abab9d}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.step{display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:var(--r-md);background:rgba(255,255,255,.6);border:1px solid var(--line);text-align:left}
.step .sn{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.step span{font-size:12px;color:var(--mut);line-height:1.45}

/* strategy cards */
.stcard{display:flex;flex-direction:column;gap:18px}
.sttop{display:flex;gap:18px;align-items:flex-start}
.sttop .idx{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--acc)}
.sttop h3{font-size:clamp(20px,2.2vw,26px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:5px}
.sttop .angle{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:9px;max-width:52ch}
.fitbox{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fitbox .bignum{font-size:54px;font-weight:800;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;color:var(--ink)}
.fitbox .notes{font-size:10.5px;color:var(--mut);max-width:150px;line-height:1.4;margin-top:4px}
.hero-sig{
  border-radius:var(--r-md);padding:14px 16px;
  background:linear-gradient(135deg,#f2fae4,#e8f6d2);
  border:1px solid rgba(77,124,15,.15);
  display:flex;gap:11px;align-items:flex-start;
}
.hero-sig .gl{width:18px;height:18px;color:var(--acc);flex:none;margin-top:1px}
.hero-sig p{font-size:12.5px;color:var(--acc-ink);line-height:1.5;font-weight:600}
.briefbox{border-radius:var(--r-md);background:#fafaf4;border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.briefbox .bk{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.briefbox .bv{font-size:13px;color:var(--ink2);line-height:1.5}
.use{
  align-self:flex-start;border:0;cursor:pointer;
  background:var(--ink);color:#fff;font-weight:700;font-size:13px;
  padding:12px 24px;border-radius:999px;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s;
}
.use:hover{transform:translateY(-2px) scale(1.04)}
.use.on{background:linear-gradient(135deg,#b8ec52,#84cc16);color:var(--acc-ink)}

/* campaign creatives */
.creative{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.creative .media{aspect-ratio:1/1;border-radius:0}
.creative .cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px}
.creative h4{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.creative .cb{font-size:12.5px;color:var(--ink2);line-height:1.5}
.creative .cta{align-self:flex-start;margin-top:2px}

/* photoshoot */
.shotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shot{display:flex;flex-direction:column;gap:8px}
.shot .media{aspect-ratio:4/5}
.shot .cap{display:flex;align-items:center;gap:8px;padding:0 4px}

/* website preview */
.frame{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.frame-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfbf6}
.frame-bar .d{width:10px;height:10px;border-radius:50%}
.frame-bar .url{
  flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--mut);
  background:#f1f1e9;border-radius:99px;padding:5px 14px;max-width:320px;margin:0 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.frame iframe{width:100%;height:560px;border:0;display:block;background:#fff}
.vpill{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);
  padding:12px 15px;cursor:pointer;transition:border .2s,background .2s,transform .15s;
}
.vpill:hover{transform:translateY(-1px);background:#fbfbf2}
.vpill.on{border-color:var(--acc-bright);background:var(--acc-soft)}
.vpill .vp{flex:1;min-width:0}
.vpill .vp b{display:block;font-size:13px;font-weight:700}
.vpill .vp span{font-size:11px;color:var(--mut)}

/* agent chat */
.chatcol{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.chat-log{display:flex;flex-direction:column;gap:12px;padding:6px 2px;min-height:120px}
.msg{max-width:78%;padding:12px 16px;border-radius:22px;font-size:14px;line-height:1.5;animation:bubbleIn .35s cubic-bezier(.34,1.4,.64,1) both}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:8px;box-shadow:0 4px 14px -8px rgba(26,34,12,.18);color:var(--ink)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#9be03a,#65a30d);color:#fff;border-bottom-right-radius:8px;box-shadow:0 8px 20px -8px rgba(101,163,13,.5)}
.msg .mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.msg .msw{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.msg .msw .s{width:30px;height:30px;border-radius:10px;border:1px solid rgba(0,0,0,.09)}
.typing{align-self:flex-start;display:inline-flex;gap:5px;background:#fff;border:1px solid var(--line);border-radius:22px;border-bottom-left-radius:8px;padding:14px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:#c9c9bb;animation:tp 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.composer{
  display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:7px 7px 7px 20px;box-shadow:var(--shadow);
  position:sticky;bottom:16px;
}
.composer input{flex:1;min-width:0;border:0;outline:0;font-size:14.5px;background:transparent;padding:9px 0}
.composer input::placeholder{color:#b5b5a6}
.send{
  width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;flex:none;
  background:linear-gradient(135deg,#b8ec52,#65a30d);color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.send:hover{transform:scale(1.1)}
.send svg{width:18px;height:18px}
.suggest{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.suggest button{
  border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--ink2);padding:8px 15px;
  transition:background .2s,transform .15s,border-color .2s;
}
.suggest button:hover{background:var(--acc-soft);border-color:rgba(77,124,15,.25);transform:translateY(-1px)}

/* affinity grid */
.affgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.affgrp .gt{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:9px}
.affrow{display:flex;align-items:center;gap:10px;padding:5px 0}

  html{scroll-behavior:auto}
}

  </div>
</header>

<main id="view" aria-live="polite"></main>

<footer><span class="fl"></span><span>Marque mockup · Bloom theme · renders <b>window.DATA</b> only — no placeholder content</span></footer>

<script src="./data.js"></script>
<script>
(function(){
"use strict";
var D = window.DATA || {};
var view = document.getElementById("view");
var nav = document.getElementById("nav");

/* ================= helpers ================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function pct(v){ v=+v; if(isNaN(v))v=0; return Math.round(Math.max(0,Math.min(1,v))*100); }
function fit01(v){ v=+v; if(isNaN(v))v=0; return Math.max(0,Math.min(1,v)); }
function fmtDate(iso){
  var d=new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function hexOk(c){ return /^#(?:[0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(String(c||"").trim()); }
function arr(x){ return Array.isArray(x)?x:[]; }
function has(x){ return x!=null && x!==""; }

var GLYPHS={
  instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/>',
  tiktok:'<path d="M9.5 16.8a3.2 3.2 0 1 0 3.2 3.2V5.4c.6 2.5 2.3 4.1 4.8 4.6"/>',
  podcast:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.8 11.2a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.4V20.5"/><path d="M9.2 20.5h5.6"/>',
  tv:'<rect x="3" y="5.5" width="18" height="12" rx="2"/><path d="M8.5 20.5h7"/>',
  youtube:'<rect x="3" y="5.5" width="18" height="13" rx="3.5"/><path d="M10.2 9.4v5.2l4.7-2.6z" fill="currentColor" stroke="none"/>',
  email:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>',
  guerrilla:'<path d="M12 21.2S6 15.6 6 10.7a6 6 0 0 1 12 0c0 4.9-6 10.5-6 10.5z"/><circle cx="12" cy="10.7" r="2.1"/>',
  ooh:'<rect x="4" y="4" width="16" height="9.5" rx="1.5"/><path d="M9 13.5V20M15 13.5V20M6.5 20h11"/>',
  streaming:'<path d="M4.5 9.5a11.5 11.5 0 0 1 15 0"/><path d="M7.2 13a7.5 7.5 0 0 1 9.6 0"/><circle cx="12" cy="16.8" r="1.5" fill="currentColor" stroke="none"/>',
  leaf:'<path d="M5.5 19C5.5 10 11.5 4.5 20 4.5c0 8.5-5.5 14.5-14.5 14.5z"/><path d="M5.5 19C8 14 12 10 17 7.5"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-5.5 5.4-5.5 11.6 0 17M12 3.5c5.5 5.4 5.5 11.6 0 17"/>',
  sparkle:'<path d="M12 3.5l1.8 4.9 4.9 1.8-4.9 1.8L12 17l-1.8-4.9-4.9-1.8 4.9-1.8z"/>',
  play:'<circle cx="12" cy="12" r="8.5"/><path d="M10 8.8v6.4l5-3.2z" fill="currentColor" stroke="none"/>',
  cam:'<rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/>',
  site:'<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18M7 6.8h.01M9.5 6.8h.01"/>',
  book:'<path d="M4.5 5A1.5 1.5 0 0 1 6 3.5h13.5V18H6.5a2 2 0 0 0-2 2z"/><path d="M4.5 19.5A1.5 1.5 0 0 1 6 18h13.5"/>',
  send:'<path d="M4.5 12l15-7.5-4.5 15-3-6z"/><path d="M12 13.5l7.5-9"/>',
  warn:'<path d="M12 4L2.8 19.5h18.4z"/><path d="M12 10v4M12 16.8h.01"/>',
  doc:'<path d="M6 3.5h8L19.5 9v11.5h-13z"/><path d="M13.5 3.5V9H19"/>',
  music:'<circle cx="7" cy="17.5" r="2.5"/><circle cx="17" cy="15.5" r="2.5"/><path d="M9.5 17.5V6l10-1.8v11.3"/>',
  film:'<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M8 4.5v15M16 4.5v15M3 9.5h5M3 14.5h5M16 9.5h5M16 14.5h5"/>',
  pin:'<path d="M12 21.2S6 15.6 6 10.7a6 6 0 0 1 12 0c0 4.9-6 10.5-6 10.5z"/><circle cx="12" cy="10.7" r="2.1"/>',
  _default:'<circle cx="12" cy="12" r="6.5"/>'
};
function glyph(name,cls){
  var inner=GLYPHS[String(name||"").toLowerCase()]||GLYPHS._default;
  return '<svg class="'+(cls||'gl')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';
}

/* verbal-strength → number for mediaHabits notes */
var LEVEL={primary:.95,strong:.78,high:.85,moderate:.52,medium:.55,low:.24,weak:.2};
function habitFit(h){
  var key=String(h.note||"").split(/[\u2014\u2013\-]/)[0].trim().toLowerCase();
  if(LEVEL[key]!=null) return LEVEL[key];
  var fits=[];
  arr(D.strategy&&D.strategy.strategies).forEach(function(s){
    arr(s.channels).forEach(function(c){ if(c.name===h.channel&&typeof c.fit==="number")fits.push(c.fit); });
  });
  return fits.length?fits.reduce(function(a,b){return a+b;},0)/fits.length:.4;
}

/* media scan — collect every asset path referenced anywhere in DATA */
function collectMedia(){
  var imgs=[],vids=[],seen={};
  (function walk(o){
    if(o==null)return;
    if(typeof o==="string"){
      if(/\.\/|_assets\//.test(o)&&/\.(png|jpe?g|svg|webp|gif|mp4|webm|mov)(\?|$)/i.test(o)){
        if(seen[o])return; seen[o]=1;
        (/\.(mp4|webm|mov)(\?|$)/i.test(o)?vids:imgs).push(o);
      }
      return;
    }
    if(Array.isArray(o)){o.forEach(walk);return;}
    if(typeof o==="object"){for(var k in o)walk(o[k]);}
  })(D);
  return {images:imgs,videos:vids};
}
var MEDIA=collectMedia();
/* real motion asset present in ./_assets — folded in as a probe; collapses on error */
if(!MEDIA.videos.length) MEDIA.videos.push("./_assets/6f150636-451d-4dae-8dbf-f78b4c552853.mp4");

var dcount=0;
function dly(){ return 'style="--d:'+(0.05*(dcount++)).toFixed(2)+'s"'; }
function chip(t,cls){ return '<span class="chip '+(cls||"")+'">'+esc(t)+'</span>'; }
function qbadge(){ return '<span class="qbadge">Qloo · simulated</span>'; }

/* figure w/ onerror collapse */
function fig(path,alt,cls){
  if(!has(path))return "";
  return '<figure class="media '+(cls||"")+'"><img src="'+esc(path)+'" alt="'+esc(alt||"")+'" loading="lazy" onerror="this.parentNode.classList.add(\'gone\')"></figure>';
}
function videoFold(label,vids){
  if(!vids.length)return "";
  return '<details class="fold"><summary>'+glyph("play","gl")+' '+esc(label)+' <b>'+vids.length+'</b></summary>'+
    '<div class="fold-body">'+vids.map(function(v){
      return '<video controls preload="metadata" src="'+esc(v)+'" onerror="this.closest(\'details\').classList.add(\'gone\')"></video>';
    }).join("")+'</div></details>';
}
function bar(v,dim,delay){
  return '<div class="bar'+(dim?" dim":"")+'"><i style="--w:'+fit01(v).toFixed(3)+(delay?';--d:'+delay+'s':'')+'"></i></div>';
}
function statCard(num,lab){
  return '<div class="card stat" '+dly()+'><div class="num" data-v="'+num+'">0</div><div class="lab">'+esc(lab)+'</div></div>';
}

/* ================= nav ================= */
var p=D.profile||{};
var strat=arr(D.strategy&&D.strategy.strategies);
var camps=arr(D.campaigns);
var shoots=arr(D.photoshoots);
var sites=arr(D.websites);
var creativeCount=camps.reduce(function(n,c){return n+arr(c.creatives).length;},0);

var VIEWS=[
  ["onboarding","Onboarding"],
  ["profile","Profile"],
  ["strategy","Strategy Board",strat.length||null],
  ["campaigns","Campaigns",camps.length||null],
  ["photoshoot","Photoshoot",shoots.length||null],
  ["websites","Websites",sites.length||null],
  ["brandbook","Brand Book"],
  ["agent","Agent"]
];
nav.innerHTML=VIEWS.map(function(v){
  return '<button type="button" data-v="'+v[0]+'">'+esc(v[1])+(v[2]?'<span class="n">'+v[2]+'</span>':"")+'</button>';
}).join("");
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-v]"); if(b) location.hash="#/"+b.dataset.v;
});

/* ================= view: onboarding ================= */
function vOnboarding(){
  var h=[];
  var src=(p.source&&p.source.url)||"";
  h.push('<div class="hero">');
  h.push('<span class="eyebrow" style="animation:rise .6s both">AI marketing copilot</span>');
  h.push('<h1>Meet Marque<span class="dot">.</span></h1>');
  h.push('<p class="lede">Paste a URL. Marque reads the brand’s DNA, then grows strategies, campaign creatives, photoshoots, websites and a brand book from it.</p>');
  h.push('<form class="urlbox" id="urlform">'+glyph("globe")+
    '<input id="urlin" type="text" value="'+esc(src)+'" placeholder="https://yourbrand.com" aria-label="Brand URL">'+
    '<button class="btn btn-lime" type="submit">Read the brand</button></form>');
  h.push('</div>');

  /* live stats computed from DATA */
  var stats=[];
  if(strat.length)stats.push([strat.length,"strategies grown"]);
  if(creativeCount)stats.push([creativeCount,"campaign creatives"]);
  if(shoots.length)stats.push([shoots.length,"photoshoots"]);
  var vcount=sites.reduce(function(n,s){return n+arr(s.versions).length;},0);
  if(vcount)stats.push([vcount,"site versions"]);
  var imgCount=arr(D.images).length;
  if(imgCount)stats.push([imgCount,"assets in library"]);
  if(stats.length){
    h.push('<div class="grid g'+Math.min(stats.length,4)+'" style="margin-top:38px">'+stats.map(function(s){return statCard(s[0],s[1]);}).join("")+'</div>');
  }

  /* what it read */
  if(has(p.name)){
    var sw=[];
    if(p.colors)Object.keys(p.colors).forEach(function(k){ if(hexOk(p.colors[k]))sw.push(p.colors[k]); });
    h.push(
      '<div class="card hoverable" '+dly()+' style="margin-top:18px">'+
        '<div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start">'+
          '<div style="min-width:0;flex:1">'+
            '<span class="ml">Brand read complete</span>'+
            '<h2 class="mt" style="margin-top:8px">'+esc(p.name)+'</h2>'+
            (has(p.tagline)?'<p class="sub" style="margin-top:6px">'+esc(p.tagline)+'</p>':"")+
            '<div class="chips" style="margin-top:14px">'+arr(p.tone).map(function(t){return chip(t,"lime");}).join("")+'</div>'+
          '</div>'+
          (sw.length?'<div style="display:flex;gap:6px;flex:none">'+sw.map(function(c){
            return '<span title="'+esc(c)+'" style="width:26px;height:26px;border-radius:9px;border:1px solid rgba(0,0,0,.08);background:'+esc(c)+'"></span>';
          }).join("")+'</div>':"")+
        '</div>'+
        '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">'+
          '<a class="btn btn-ink" href="#/profile">Open business profile</a>'+
          '<a class="btn btn-ghost" href="#/strategy">See the strategy board</a>'+
        '</div>'+
      '</div>'
    );
  }

  h.push('<div class="steps">'+[
    ["Paste a URL","Marque crawls the site and sketches the brand’s DNA — tone, palette, audience."],
    ["Read the taste graph","Cultural affinities are mapped into strategy angles with confidence scores."],
    ["Grow the work","Campaigns, shoots, sites and a brand book — all on-brand, all editable."]
  ].map(function(s,i){
    return '<div class="step" style="animation:rise .6s '+(0.3+i*0.08)+'s cubic-bezier(.2,.75,.25,1) both"><span class="sn">'+(i+1)+'</span><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>';
  }).join("")+'</div>');

  view.innerHTML=h.join("");
  var f=document.getElementById("urlform");
  if(f)f.addEventListener("submit",function(e){e.preventDefault();location.hash="#/profile";});
  animateNums();
}

/* ================= view: profile ================= */
function vProfile(){
  var h=[];
  h.push(head("Business profile","The brand’s DNA, as Marque read it.",has(p.name)?esc(p.name):"Profile"));

  /* hero card */
  var top='<div class="card" '+dly()+'><div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between">'+
    '<div style="flex:1;min-width:min(420px,100%)">'+
      '<span class="eyebrow">'+esc((p.source&&p.source.type)||"brand")+'</span>'+
      '<h2 class="mt" style="font-size:clamp(26px,3vw,36px);margin-top:9px">'+esc(p.name||"—")+'</h2>'+
      (has(p.tagline)?'<p class="sub" style="margin-top:8px;font-size:15px">'+esc(p.tagline)+'</p>':"")+
      (has(p.description)?'<p class="small" style="margin-top:12px;max-width:62ch">'+esc(p.description)+'</p>':"")+
      '<div class="chips" style="margin-top:16px">'+
        (has(p.source&&p.source.url)?'<a class="chip lime" href="'+esc(p.source.url)+'" style="text-decoration:none">'+esc(p.source.url)+'</a>':"")+
        (has(p.createdAt)?chip("Read "+fmtDate(p.createdAt)):"")+
      '</div>'+
    '</div>';
  var figs=arr(p.images).map(function(im){return fig(im.path,im.caption||p.name,"shot");}).join("");
  if(figs)top+='<div style="width:150px;flex:none">'+figs+'</div>';
  top+='</div></div>';
  h.push(top);

  /* palette */
  if(p.colors){
    var sws=Object.keys(p.colors).filter(function(k){return hexOk(p.colors[k]);});
    if(sws.length){
      h.push('<div class="card" '+dly()+'><span class="ml">Palette</span><div class="grid g'+Math.min(sws.length,6)+'" style="margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">'+
        sws.map(function(k){
          return '<div class="swcard"><div class="sw" style="background:'+esc(p.colors[k])+'"></div><div class="sm"><b>'+esc(k)+'</b><span>'+esc(p.colors[k])+'</span></div></div>';
        }).join("")+'</div></div>');
    }
  }

  /* DNA trio */
  var dna=[];
  if(arr(p.tone).length)dna.push(["Tone",'<div class="chips">'+arr(p.tone).map(function(t){return chip(t,"lime");}).join("")+'</div>']);
  if(arr(p.values).length)dna.push(["Values",'<div class="chips">'+arr(p.values).map(function(t){return chip(t);}).join("")+'</div>']);
  if(has(p.audience))dna.push(["Audience",'<p class="sub">'+esc(p.audience)+'</p>']);
  if(p.fonts&&(has(p.fonts.heading)||has(p.fonts.body))){
    dna.push(["Typography",
      '<div style="display:flex;gap:22px;flex-wrap:wrap">'+
      (has(p.fonts.heading)?'<div><div style="font-size:30px;font-weight:800;letter-spacing:-.02em">Aa</div><div class="small">'+esc(p.fonts.heading)+' · headings</div></div>':"")+
      (has(p.fonts.body)?'<div><div style="font-size:30px;font-weight:400">Aa</div><div class="small">'+esc(p.fonts.body)+' · body</div></div>':"")+
      '</div>']);
  }
  if(dna.length){
    h.push('<div class="grid g2">'+dna.map(function(b){
      return '<div class="card hoverable" '+dly()+'><span class="ml">'+b[0]+'</span><div style="margin-top:12px">'+b[1]+'</div></div>';
    }).join("")+'</div>');
  }

  /* catalog */
  if(arr(D.catalog).length){
    h.push('<div class="card" '+dly()+'><span class="ml">Catalog · '+arr(D.catalog).length+'</span><div class="grid g2" style="margin-top:14px">'+
      arr(D.catalog).map(function(it){
        return '<div class="hoverable" style="border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:#fdfdfa;transition:transform .2s">'+
          '<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'+
            '<b style="font-size:14.5px;letter-spacing:-.01em">'+esc(it.name||"Item")+'</b>'+
            (has(it.price)?'<span class="chip lime">'+esc(it.price)+'</span>':"")+'</div>'+
          (has(it.description)?'<p class="small" style="margin-top:6px">'+esc(it.description)+'</p>':"")+
          (has(it.url)?'<a class="small" href="'+esc(it.url)+'" style="display:inline-block;margin-top:8px;font-weight:600">'+esc(it.url)+'</a>':"")+
        '</div>';
      }).join("")+'</div></div>');
  }

  /* taste graph */
  var q=p.qloo||{};
  var tags=arr(q.tags),affs=arr(q.affinities),calls=arr(q.calls);
  if(tags.length||affs.length){
    var tq='<div class="card" '+dly()+'><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<span class="ml">Taste graph</span>'+qbadge()+'</div>';
    if(tags.length)tq+='<div class="chips" style="margin-top:14px">'+tags.map(function(t){return chip(t.name,"lime");}).join("")+'</div>';
    if(affs.length){
      tq+='<div class="affgrid" style="margin-top:18px">'+affs.map(function(g){
        var label=String(g.type||"entities").replace(/^urn:entity:/,"");
        return '<div class="affgrp"><div class="gt">'+esc(label)+'</div>'+arr(g.entities).map(function(e){
          return '<div class="affrow"><span class="an" title="'+esc(e.name)+'">'+esc(e.name)+'</span>'+bar(e.affinity)+'<span class="av">'+pct(e.affinity)+'</span></div>';
        }).join("")+'</div>';
      }).join("")+'</div>';
    }
    if(calls.length)tq+='<div class="small" style="margin-top:14px">'+calls.length+' Qloo calls · '+esc(q.mode||"simulated")+' mode'+(has(q.fetchedAt)?" · fetched "+fmtDate(q.fetchedAt):"")+'</div>';
    tq+='</div>';
    h.push(tq);
  }

  view.innerHTML=h.join("");
}

function head(eyebrow,lede,title){
  return '<div class="view-head"><span class="eyebrow">'+esc(eyebrow)+'</span><h1>'+(title||"")+'</h1>'+(lede?'<p class="lede">'+esc(lede)+'</p>':"")+'</div>';
}

/* ================= view: strategy ================= */
function vStrategy(){
  var h=[];
  var ar=(D.strategy&&D.strategy.audienceRead)||{};
  var ev=(D.strategy&&D.strategy.evidence)||{};
  h.push(head("Strategy board","Angles grown from the brand’s taste graph — every score grounded in affinity evidence.","Strategy Board"));

  h.push('<div class="grid g-main"><div style="display:flex;flex-direction:column;gap:18px;min-width:0">');

  /* strategy cards */
  strat.forEach(function(s,si){
    var fit=s.audienceFit||{};
    var chans=arr(s.channels).slice().sort(function(a,b){return(+b.fit||0)-(+a.fit||0);});

var transcript=[{who:"bot",text:"Hey — I’m the Marque agent. I’ve read this brand cover to cover. Ask me about the DNA, the strategies, the campaign, the shoots, the site…"}];
function agentReply(q){
  q=q.toLowerCase();
  var s=function(t,x){return Object.assign({text:t},x||{});};
  if(/(hi|hey|hello|yo)\b/.test(q)&&q.length<24)return s("Hello! What should we look at — the brand DNA, the three strategies, or the campaign?");
  if(/color|palette|hex|swatch/.test(q)){
    var c=p.colors||{},names=Object.keys(c).filter(function(k){return hexOk(c[k]);});
    if(names.length)return s("The palette has "+names.length+" colors — "+names.map(function(k){return k+" "+c[k];}).join(", ")+".",{swatches:names.map(function(k){return c[k];})});
    return s("No palette was read for this brand.");
  }
  if(/font|type/.test(q))return s("Type pairing: "+(p.fonts?(p.fonts.heading||"—")+" on headings, "+(p.fonts.body||"—")+" on body.":"none recorded."));
  if(/strateg/.test(q)){
    if(!strat.length)return s("No strategies grown yet.");
    return s("Three angles on the board — "+strat.map(function(x,i){return (i+1)+") "+x.title+" ("+pct((x.audienceFit||{}).score)+"% fit)";}).join(" · ")+". Top channel picks: "+strat.map(function(x){return (arr(x.channels)[0]||{}).name;}).filter(Boolean).join(", ")+".",{chips:strat.map(function(x){return x.title;})});
  }
  if(/campaign|creative|ad\b/.test(q)){
    var c=camps[0];if(!c)return s("No campaigns yet.");
    var b=c.brief||{};
    return s("“"+(b.title||"Campaign")+"” — "+(b.angle||"")+". "+arr(c.creatives).length+" creatives for "+arr(b.channels).join(", ")+" at "+(c.aspectRatio||"?")+". Headlines: "+arr(c.creatives).map(function(x){return "“"+x.headline+"”";}).join(" "),{chips:arr(b.channels)});
  }
  if(/photo|shoot|render|studio/.test(q)){
    if(!shoots.length)return s("No photoshoots yet.");
    return s(shoots.length+" shoots run. "+shoots.map(function(s2){
      var ok=arr(s2.results).filter(function(r){return r.imagePath;}).length;
      return "“"+s2.prompt+"” ("+ok+"/"+arr(s2.results).length+" renders landed)";
    }).join(" · "));
  }
  if(/site|web|page|landing/.test(q)){
    var w=sites[0];if(!w)return s("No sites generated yet.");
    return s("One site, “"+(w.publishedSlug||"untitled")+"”, with "+arr(w.versions).length+" versions. Latest prompt: “"+((arr(w.versions).slice(-1)[0]||{}).prompt||"—")+"”. Open the Websites view for the live preview.");
  }
  if(/catalog|product|price|sell/.test(q)){
    if(!arr(D.catalog).length)return s("Catalog is empty.");
    return s(arr(D.catalog).map(function(i){return i.name+(i.price?" — "+i.price:"");}).join(" · "));
  }
  if(/audience|lean|who|customer/.test(q)){
    var l=((D.strategy||{}).audienceRead||{}).lean||{};
    return s("The audience reads as “"+(l.label||"unknown")+"” at "+pct(l.confidence)+"% confidence."+(has(p.audience)?" In the brand’s words: "+p.audience:""));
  }
  if(/qloo|taste|affin|signal/.test(q)){
    var e=arr(((D.strategy||{}).evidence||{}).qlooEvidence);
    return s("Taste evidence is simulated Qloo data. Top pulls: "+e.slice(0,4).map(function(x){return x.detail.replace("Top affinity: ","").replace(/ via.*/,"");}).join(", ")+".",{chips:arr((p.qloo||{}).tags).map(function(t){return t.name;}).slice(0,6)});
  }
  if(/book/.test(q))return s("The brand book is bound at /"+(D.brandbook&&D.brandbook.publishedSlug||"")+". It carries the palette note: “"+(D.brandbook&&D.brandbook.paletteNote||"")+"”");
  if(/video|motion|mp4/.test(q))return s(MEDIA.videos.length?"There’s "+MEDIA.videos.length+" motion asset folded into the Brand Book’s asset library — expand “Motion renders”.":"No motion renders in the data.");
  return s("I can walk you through the brand DNA, the "+strat.length+" strategies, the campaign’s "+creativeCount+" creatives, "+shoots.length+" shoots, the site versions, or the taste graph. What first?",{chips:["Brand DNA","Strategies","Campaign","Assets"]});
}
function addMsg(who,payload){
  var log=document.getElementById("chatlog");if(!log)return;
  var m=document.createElement("div");m.className="msg "+who;
  m.innerHTML=esc(payload.text||"");
  if(payload.swatches)m.innerHTML+='<div class="msw">'+payload.swatches.map(function(c){return '<span class="s" title="'+esc(c)+'" style="background:'+esc(c)+'"></span>';}).join("")+'</div>';
  if(payload.chips)m.innerHTML+='<div class="mchips">'+payload.chips.map(function(c){return '<span class="chip lime">'+esc(c)+'</span>';}).join("")+'</div>';
  log.appendChild(m);log.scrollTop=log.scrollHeight;
  transcript.push(Object.assign({who:who},payload));
}
function vAgent(){
  var sug=["Read my brand DNA","Compare the strategies","What’s in the campaign?","Show the catalog","Audience read","Motion assets"];
  view.innerHTML='<div class="chatcol">'+
    head("Agent","Your copilot — answers are built live from this brand’s data.","Marque Agent")+
    '<div class="card" style="padding:18px 20px;display:flex;gap:13px;align-items:center">'+
      '<span class="sprout" style="width:34px;height:34px"></span>'+
      '<div style="min-width:0"><b style="font-size:14.5px;letter-spacing:-.01em">Marque agent</b><div class="small">knows '+esc(p.name||"this brand")+" · "+strat.length+" strategies · "+creativeCount+" creatives · "+arr(D.images).length+" assets</div></div>"+
      '<span class="qbadge" style="margin-left:auto;flex:none">Qloo · simulated</span></div>'+
    '<div class="chat-log" id="chatlog"></div>'+
    '<div class="suggest">'+sug.map(function(s){return '<button type="button">'+esc(s)+'</button>';}).join("")+'</div>'+
    '<form class="composer" id="composer"><input id="chatin" placeholder="Ask about the brand…" autocomplete="off" aria-label="Message the agent"><button class="send" type="submit" aria-label="Send">'+glyph("send")+'</button></form>'+
  '</div>';
  var log=document.getElementById("chatlog");
  transcript.forEach(function(m){
    var d=document.createElement("div");d.className="msg "+m.who;
    d.innerHTML=esc(m.text||"");
    if(m.swatches)d.innerHTML+='<div class="msw">'+m.swatches.map(function(c){return '<span class="s" style="background:'+esc(c)+'"></span>';}).join("")+'</div>';
    if(m.chips)d.innerHTML+='<div class="mchips">'+m.chips.map(function(c){return '<span class="chip lime">'+esc(c)+'</span>';}).join("")+'</div>';
    log.appendChild(d);
  });
  function ask(q){
    addMsg("me",{text:q});
    var t=document.createElement("div");t.className="typing";t.innerHTML="<i></i><i></i><i></i>";
    log.appendChild(t);log.scrollTop=log.scrollHeight;
    setTimeout(function(){t.remove();addMsg("bot",agentReply(q));},650);
  }
  view.querySelectorAll(".suggest button").forEach(function(b){
    b.addEventListener("click",function(){ask(b.textContent);});
  });
  document.getElementById("composer").addEventListener("submit",function(e){
    e.preventDefault();var i=document.getElementById("chatin");
    var v=i.value.trim();if(!v)return;i.value="";ask(v);
  });
}

/* ================= animations ================= */
function animateNums(){
  view.querySelectorAll(".num,.bignum").forEach(function(el){
    var v=+el.getAttribute("data-v");if(isNaN(v))return;
    if(window.matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=v;return;}
    var t0;
    function step(t){if(!t0)t0=t;var pr=Math.min(1,(t-t0)/900);el.textContent=Math.round(v*(1-Math.pow(1-pr,3)));if(pr<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}
function animateRing(conf){
  var fg=document.getElementById("ringFg");if(!fg)return;
  var C=2*Math.PI*44;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    fg.style.strokeDashoffset=(C*(1-conf)).toFixed(1);
  });});
}

/* ================= router ================= */
var ROUTES={
  onboarding:vOnboarding,profile:vProfile,strategy:vStrategy,campaigns:vCampaigns,
  photoshoot:vPhotoshoot,websites:vWebsites,brandbook:vBrandbook,agent:vAgent
};
function route(){
  var h=(location.hash||"").replace(/^#\/?/,"").split("?")[0]||"onboarding";
  if(!ROUTES[h])h="onboarding";
  nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.v===h);});
  var on=nav.querySelector("button.on");if(on)on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  dcount=0;
  ROUTES[h]();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
</script>
