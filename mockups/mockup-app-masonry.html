<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque — Studio · Masonry</title>
<style>
/* ============================================================
   MARQUE · MASONRY / MEDIA-FIRST GALLERY
   a creative-director pinboard: media talks, metadata whispers
   ============================================================ */
:root{
  --bg:#161517;
  --bg-2:#1b1a1d;
  --tile:#201f24;
  --tile-2:#252429;
  --line:#2e2d34;
  --line-2:#3a3941;
  --ink:#edebe6;
  --mut:#a19ea8;
  --faint:#6f6c77;
  --acc:#d3e374;          /* acid lime */
  --acc-ink:#22260f;
  --acc-dim:rgba(211,227,116,.14);
  --danger:#e08f8f;
  --r:16px;
  --rail:72px;
  --agent:308px;
  --sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.45;
  min-height:100vh;
}
::selection{background:var(--acc);color:var(--acc-ink)}
button{font-family:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

/* ---------- app frame ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:60;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;border-right:1px solid var(--line);background:var(--bg-2);
}
.logo{
  width:40px;height:40px;border-radius:12px;flex:none;margin-bottom:12px;
  background:var(--acc);color:var(--acc-ink);
  display:flex;align-items:center;justify-content:center;
  font:800 22px/1 var(--serif);font-style:italic;letter-spacing:-.05em;
  box-shadow:0 6px 18px -6px rgba(211,227,116,.5);
}
.rail-item{
  width:52px;padding:9px 0 7px;border:0;border-radius:13px;cursor:pointer;
  background:transparent;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:background .18s,color .18s;
}
.rail-item svg{width:20px;height:20px}
.rail-item .lb-off{font-size:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.rail-item:hover{background:var(--tile-2);color:var(--ink)}
.rail-item.active{background:var(--acc-dim);color:var(--acc)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}

.stage{flex:1;min-width:0;margin-left:var(--rail);transition:margin-right .25s ease}
body.agent-open .stage{margin-right:var(--agent)}

.topbar{
  position:sticky;top:0;z-index:50;height:54px;
  display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(22,21,23,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .who{display:flex;align-items:baseline;gap:10px;min-width:0}
.topbar .vname{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.topbar .vmeta{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.badge{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--acc);border:1px solid rgba(211,227,116,.4);border-radius:99px;padding:4px 10px;
}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
.badge.dim{color:var(--mut);border-color:var(--line-2)}
.badge.dim i{background:var(--faint)}
.agent-toggle{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  background:var(--tile-2);border:1px solid var(--line);color:var(--ink);
  border-radius:11px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;
  transition:border-color .18s,background .18s;
}
.agent-toggle:hover{border-color:var(--line-2);background:#2c2b31}
.agent-toggle svg{width:15px;height:15px}
body.agent-open .agent-toggle{color:var(--acc);border-color:rgba(211,227,116,.4)}

/* ---------- masonry ---------- */
.view{padding:22px 20px 90px;max-width:1560px;margin:0 auto}
.masonry{column-count:5;column-gap:14px}
@media(max-width:1400px){.masonry{column-count:4}}
@media(max-width:1060px){.masonry{column-count:3}}
@media(max-width:760px){.masonry{column-count:2}}
@media(max-width:520px){.masonry{column-count:1}.view{padding:16px 12px 110px}}

.mt{
  break-inside:avoid;margin:0 0 14px;position:relative;
  background:var(--tile);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);
  transition:border-color .2s,transform .2s;
}
.mt:hover{border-color:var(--line-2)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pad{padding:17px 18px}
.ml{
  display:block;font-size:9.5px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint);margin-bottom:10px;
}
.mt h2{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.12}
.mt h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.prose{font-size:12.5px;color:#c8c5cd;line-height:1.55}
.muted{color:var(--mut)}
.small{font-size:11px}
.faint{font-size:11px;color:var(--faint)}
.serif{font-family:var(--serif);font-style:italic}

/* quote tile — the serif whisper */
.quote{padding:18px 20px}
.quote p{
  font-family:var(--serif);font-style:italic;font-size:16.5px;
  line-height:1.5;color:#e9e7ee;letter-spacing:-.01em;
}
.quote p::before{content:"“";color:var(--acc);font-size:30px;line-height:0;vertical-align:-8px;margin-right:2px}
.quote .attr{margin-top:10px;font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:700}

/* accent tile */
.mt.accent{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.mt.accent .ml{color:rgba(34,38,15,.55)}
.mt.accent .faint{color:rgba(34,38,15,.6)}

/* ---------- media figure: the signature ---------- */
.mwrap{position:relative;background:#121114;margin:0}
.mslides{position:relative}
.mslide{display:none}
.mslide.on{display:block}
.mslide img{display:block;width:100%;height:auto;cursor:zoom-in}
.mnav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:46px;height:66px;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:300;line-height:1;padding-bottom:5px;
  color:#fff;background:rgba(12,11,14,.52);
  backdrop-filter:blur(3px);opacity:.62;
  transition:opacity .18s,background .18s,color .18s;
}
.mnav.prev{left:0;border-radius:0 14px 14px 0}
.mnav.next{right:0;border-radius:14px 0 0 14px}
.mwrap:hover .mnav,.mnav:focus-visible{opacity:1}
.mnav:hover{background:rgba(12,11,14,.82);color:var(--acc)}
.mcount{
  position:absolute;top:10px;right:10px;z-index:5;
  background:rgba(12,11,14,.66);color:#e6e4ea;border-radius:99px;
  font-size:10.5px;font-weight:700;padding:3px 10px;font-variant-numeric:tabular-nums;
  letter-spacing:.05em;
}
.mcap{
  position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
  padding:30px 14px 11px;font-size:11.5px;color:#dedce3;line-height:1.4;
  background:linear-gradient(transparent,rgba(9,8,11,.85));
}
.mcap b{font-weight:700}
.mcap .sub{display:block;color:#a9a6b0;font-size:10.5px;margin-top:1px}
.figfoot{
  display:flex;align-items:center;gap:8px;padding:11px 14px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);
}
.figfoot .grow{flex:1}
.mtag{
  font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc);
}
.mdots{position:absolute;top:14px;left:14px;z-index:5;display:flex;gap:5px}
.mdots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s}
.mdots i.on{background:var(--acc)}

/* ---------- chips / rows / meters ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:11px;font-weight:600;color:#c9c6cf;
  background:#26252b;border:1px solid var(--line);border-radius:99px;padding:4px 11px;
  white-space:nowrap;
}
.chip.lime{color:var(--acc);border-color:rgba(211,227,116,.35);background:transparent}
.chip i{font-style:normal;opacity:.55;font-size:9.5px;margin-right:4px}

.meter{height:5px;background:#2c2b32;border-radius:99px;overflow:hidden;flex:1}
.meter i{
  display:block;height:100%;width:calc(var(--w)*100%);border-radius:99px;
  background:#55535e;transform-origin:left;
  animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);
}
.meter i.hot{background:var(--acc)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-top:1px solid var(--line);font-size:12px;
}
.row:first-child{border-top:0;padding-top:0}
.row .nm{min-width:0;flex:1;font-weight:600}
.row .pv{width:30px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--mut)}
.row .sub{display:block;font-weight:400;font-size:10.5px;color:var(--faint)}

.kv{display:flex;flex-direction:column;gap:8px;font-size:12px}
.kv .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800}
.kv .v{color:#dcdae1}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}

.swrow{display:flex;flex-direction:column;gap:7px}
.sw{
  display:flex;align-items:center;gap:10px;border-radius:10px;
  border:1px solid var(--line);overflow:hidden;background:#1a191d;
}
.sw i{width:34px;height:34px;flex:none;align-self:stretch}
.sw b{font-size:11.5px;font-weight:700}
.sw span{font-size:10.5px;color:var(--faint);margin-left:auto;padding-right:12px;font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;
  padding:10px 17px;font-size:13px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
  transition:transform .15s,filter .15s;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--faint);filter:none}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:10px}
.btn.on{background:var(--tile-2);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}

/* ---------- folds ---------- */
.fold{border-top:1px solid var(--line)}
.fold summary{
  list-style:none;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:8px;padding:11px 0 0;
  font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);
}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{
  content:"";width:0;height:0;flex:none;
  border-left:5px solid var(--faint);border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .2s;
}
.fold[open] summary::before{transform:rotate(90deg)}
.fold summary:hover{color:var(--ink)}
.fold .fold-body{padding:10px 0 2px}
.fold video{display:block;width:100%;border-radius:12px;background:#0b0a0c;margin-top:6px}

/* ---------- error / note tiles ---------- */
.errtile{border-color:rgba(224,143,143,.28)}
.errtile .ml{color:var(--danger)}
.errnote{font-size:11px;color:#b98f92;line-height:1.5;word-break:break-word}
.note{
  font-size:10.5px;color:var(--faint);border-left:2px solid var(--line-2);
  padding-left:9px;line-height:1.5;
}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center}
.lb[hidden]{display:none}
.lb-back{position:absolute;inset:0;background:rgba(9,8,11,.92);backdrop-filter:blur(8px);animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}}
.lb-img{
  position:relative;z-index:2;max-width:88vw;max-height:82vh;
  border-radius:14px;box-shadow:0 40px 110px rgba(0,0,0,.7);
  animation:zoomin .22s cubic-bezier(.2,.7,.2,1);
}
@keyframes zoomin{from{opacity:0;transform:scale(.96)}}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:58px;height:86px;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:300;line-height:1;padding-bottom:6px;
  color:#fff;background:rgba(20,19,23,.55);backdrop-filter:blur(4px);
  transition:background .18s,color .18s;
}
.lb-nav.prev{left:14px;border-radius:0 16px 16px 0}
.lb-nav.next{right:14px;border-radius:16px 0 0 16px}
.lb-nav:hover{background:rgba(20,19,23,.85);color:var(--acc)}
.lb-x{
  position:absolute;top:16px;right:18px;z-index:3;
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);cursor:pointer;
  background:rgba(20,19,23,.7);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s;
}
.lb-x:hover{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.lb-cap{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:3;
  max-width:80vw;text-align:center;
  background:rgba(20,19,23,.7);border:1px solid var(--line);
  color:#e2e0e6;font-size:12px;padding:8px 16px;border-radius:99px;
}
.lb-cap b{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:8px}
body.lb-open{overflow:hidden}

/* ---------- onboarding (centered, not masonry) ---------- */
.ob{max-width:620px;margin:0 auto;padding:30px 0 40px;display:flex;flex-direction:column;gap:16px}
.ob-hero{text-align:center;padding:14px 0 6px}
.ob-hero .logo{width:54px;height:54px;font-size:28px;border-radius:16px;margin:0 auto 16px}
.ob-hero h1{font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.03em}
.ob-hero .sub{color:var(--mut);font-size:13.5px;margin-top:10px;line-height:1.55;max-width:48ch;margin-left:auto;margin-right:auto}
.urlrow{display:flex;gap:8px;margin-top:4px}
.urlrow input{
  flex:1;min-width:0;background:#17161a;border:1px solid var(--line-2);border-radius:12px;
  color:var(--ink);padding:11px 14px;font-size:13.5px;font-family:inherit;
}
.urlrow input:focus{border-color:var(--acc);outline:none}
.check{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12px;color:var(--mut);cursor:pointer}
.check input{accent-color:var(--acc);width:15px;height:15px}
.stage-list{display:flex;flex-direction:column;gap:10px}
.stage-it{display:flex;align-items:center;gap:11px;font-size:12.5px;color:#d5d3da}
.stage-it .tick{
  width:22px;height:22px;border-radius:50%;flex:none;
  background:var(--acc-dim);color:var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;
}
.stage-it .faint{margin-left:auto;text-align:right}
.tplgrid{display:flex;flex-direction:column;gap:8px}
.tpl{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:#1a191e;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  cursor:pointer;color:var(--ink);transition:border-color .15s;
}
.tpl:hover{border-color:var(--acc)}
.tpl .tpsw{display:flex}
.tpl .tpsw i{width:16px;height:16px;border-radius:50%;border:2px solid #1a191e;margin-left:-6px}
.tpl .tpsw i:first-child{margin-left:0}
.tpl b{font-size:12.5px;display:block}
.tpl span{font-size:10.5px;color:var(--faint);display:block}

/* ---------- strategy ---------- */
.score-big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.statline{display:flex;align-items:center;gap:12px}
.chan-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.chan-row .gl{width:15px;height:15px;flex:none;color:var(--mut)}
.chan-row .cname{width:78px;flex:none;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan-row .cval{width:28px;text-align:right;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--mut);flex:none}
.herosig{
  font-family:var(--serif);font-style:italic;font-size:13.5px;line-height:1.5;color:#d9d7df;
  border-left:2px solid var(--acc);padding-left:12px;margin:2px 0;
}
.watch-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.watch-list li{font-size:11.5px;color:#a9a6b1;line-height:1.45;padding-left:14px;position:relative}
.watch-list li::before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--line-2)}

/* ---------- websites ---------- */
.devframe{
  background:#0d0c0f;border-radius:14px;overflow:hidden;border:1px solid var(--line-2);
}
.devbar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line)}
.devbar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.devbar i:first-child{background:rgba(211,227,116,.5)}
.devframe iframe{display:block;width:100%;height:460px;border:0;background:#fff}
.vtabs{display:flex;gap:8px;flex-wrap:wrap}
.vtab{
  background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;
  padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .15s;
}
.vtab:hover{border-color:var(--faint);color:var(--ink)}
.vtab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* ---------- agent rail ---------- */
.agent{
  position:fixed;top:0;right:0;bottom:0;width:var(--agent);z-index:70;
  background:var(--bg-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;
}
body.agent-open .agent{transform:none}
.agent-head{
  display:flex;align-items:center;gap:9px;padding:15px 16px;
  border-bottom:1px solid var(--line);font-size:13px;font-weight:800;
}
.agent-head svg{width:16px;height:16px;color:var(--acc)}
.agent-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
.msg{
  max-width:88%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.5;
  background:var(--tile-2);color:#e3e1e7;border-bottom-left-radius:4px;align-self:flex-start;
}
.msg.user{align-self:flex-end;background:var(--acc-dim);color:#e9f0c8;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg .mt-t{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;display:block;margin-bottom:4px}
.agent-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.agent-input input{
  flex:1;min-width:0;background:#17161a;border:1px solid var(--line-2);border-radius:11px;
  color:var(--ink);padding:10px 13px;font-size:12.5px;font-family:inherit;
}
.agent-input input:focus{border-color:var(--acc);outline:none}
.agent-input .send{
  width:40px;flex:none;border:0;border-radius:11px;background:var(--acc);color:var(--acc-ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.agent-input .send svg{width:16px;height:16px}
.agent-input .send:disabled{opacity:.4;cursor:default}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--line);margin:12px 0}
.sec-gap{margin-top:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumbstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbstrip .mwrap{border-radius:10px;overflow:hidden}
.jobmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

@media(max-width:700px){
  .rail{
    inset:auto 0 0 0;width:auto;height:60px;flex-direction:row;justify-content:space-around;
    padding:6px 10px;border-right:0;border-top:1px solid var(--line);
  }
  .rail-item{width:auto;padding:7px 10px}
  .rail-item .lb-off{display:none}
  .logo{display:none}
  .rail-foot{margin:0;flex-direction:row}
  .stage{margin-left:0}
  body.agent-open .stage{margin-right:0}
  .agent{width:min(340px,92vw);box-shadow:-30px 0 60px rgba(0,0,0,.5)}
  .view{padding-bottom:140px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Studio navigation">
    <div class="logo" title="Marque">M</div>
    <div id="railItems" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="rail-foot">
      <button class="rail-item" id="railAgent" title="Agent" aria-label="Toggle agent panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h10a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 17 16H9.5L4.5 20.5z"/><circle cx="9" cy="9.5" r="1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="9.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="9.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="lb-off">Agent</span>
      </button>
    </div>
  </nav>

  <div class="stage">
    <header class="topbar">
      <div class="who">
        <span class="vname" id="vName">Marque</span>
        <span class="vmeta" id="vMeta"></span>
      </div>
      <span class="grow"></span>
      <span id="topBadge"></span>
      <button class="agent-toggle" id="agentToggle" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
        Agent
      </button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <aside class="agent" id="agentPane" aria-label="Marque agent panel">
    <div class="agent-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
      Marque Agent
      <span class="grow"></span>
      <span class="badge"><i></i>Qloo · simulated</span>
    </div>
    <div class="agent-body" id="agentBody"></div>
    <div class="agent-input">
      <input id="agentIn" placeholder="Ask Marque to edit your profile…" aria-label="Message the agent">
      <button class="send" id="agentSend" title="Send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-7-5 16-3-7z"/><path d="M20 5l-8 9"/></svg>
      </button>
    </div>
  </aside>
</div>

<!-- lightbox -->
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-back" id="lbBack"></div>
  <button class="lb-x" id="lbX" aria-label="Close">&#10005;</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
  <img class="lb-img" id="lbImg" alt="">
  <button class="lb-nav next" id="lbNext" aria-label="Next image">&#8250;</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script src="./data.js"></script>
<script>
(function(){
"use strict";
var D = window.DATA || {};
var $ = function(id){ return document.getElementById(id); };
var view = $("view");

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function pct(v){ v=+v; if(isNaN(v))v=0; return Math.round(Math.max(0,Math.min(1,v))*100); }
function clamp01(v){ v=+v; return isNaN(v)?0:Math.max(0,Math.min(1,v)); }
function fmtDate(iso){
  if(!iso) return "";
  try{ return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return ""; }
}
function fmtTime(iso){
  if(!iso) return "";
  try{ return new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; }
}
function shortId(id){ return String(id||"").slice(0,8); }
var popN=0; function pd(){ return 'style="--d:'+(0.04*(popN++)).toFixed(2)+'s"'; }

/* ================= media registry / lightbox ================= */
var SETS={};
function regset(name,slides){ SETS[name]=slides; return name; }
var setSeq=0;

/* Build a figure. slides=[{src,cap,sub}] ; multi → arrows+counter+dots.
   opt.base offsets data-idx so single-slide figures can share a larger
   lightbox set (e.g. the library wall cycles across tiles). */
function figure(setName,slides,opt){
  opt=opt||{};
  var multi=slides.length>1;
  var base=opt.base||0;
  var h='<figure class="mwrap'+(opt.cls?" "+opt.cls:"")+'" data-set="'+esc(setName)+'" data-i="0">';
  h+='<div class="mslides">';
  slides.forEach(function(s,i){
    h+='<div class="mslide'+(i===0?" on":"")+'" data-idx="'+(base+i)+'">'
      +'<img src="'+esc(s.src)+'" alt="'+esc(s.cap||s.sub||"image")+'" loading="lazy" onerror="IE(this)">';
    if(s.cap||s.sub){
      h+='<div class="mcap">'+(s.cap?"<b>"+esc(s.cap)+"</b>":"")+(s.sub?'<span class="sub">'+esc(s.sub)+"</span>":"")+"</div>";
    }
    h+='</div>';
  });
  h+='</div>';
  if(multi){
    h+='<div class="mdots">'+slides.map(function(s,i){return '<i class="'+(i===0?"on":"")+'"></i>';}).join("")+'</div>';
    h+='<button class="mnav prev" type="button" data-nav="-1" aria-label="Previous image">&#8249;</button>'
      +'<button class="mnav next" type="button" data-nav="1" aria-label="Next image">&#8250;</button>'
      +'<span class="mcount">1 / '+slides.length+'</span>';
  }
  h+='</figure>';
  return h;
}
function liveSlides(wr){ return wr.querySelectorAll(".mslide:not(.dead)"); }
function syncFig(wr){
  var live=liveSlides(wr);
  var on=wr.querySelector(".mslide.on:not(.dead)");
  if(!on && live.length){ on=live[0]; on.classList.add("on"); }
  var idx=0;
  live.forEach(function(s,i){ if(s===on) idx=i; });
  wr.dataset.i = on ? +on.dataset.idx : 0;
  var c=wr.querySelector(".mcount");
  if(c) c.textContent=(idx+1)+" / "+live.length;
  var dots=wr.querySelectorAll(".mdots i");
  dots.forEach(function(d){d.classList.remove("on")});
  if(on){ var di=+on.dataset.idx; if(dots[di]) dots[di].classList.add("on"); }
}
function cycle(wr,d){
  var live=liveSlides(wr); if(live.length<2) return;
  var on=wr.querySelector(".mslide.on:not(.dead)");
  var i=0; live.forEach(function(s,j){ if(s===on) i=j; });
  var n=(i+d+live.length)%live.length;
  if(on) on.classList.remove("on");
  live[n].classList.add("on");
  syncFig(wr);
}
/* image error → collapse: slide dies; empty figure dies; img-only tile dies */
window.IE=function(img){
  var sl=img.closest?img.closest(".mslide"):null;
  var wr=img.closest?img.closest(".mwrap"):null;
  var tile=img.closest?img.closest(".mt"):null;
  if(sl) sl.classList.add("dead"); else img.style.display="none";
  if(wr){
    var live=liveSlides(wr);
    if(!live.length){ wr.style.display="none"; }
    else syncFig(wr);
  }
  if(tile && tile.hasAttribute("data-imgonly")){
    var alive=tile.querySelector(".mslide:not(.dead) img");
    if(!alive) tile.style.display="none";
  }
};

/* lightbox */
var lb={set:null,idx:0};
var lbEl=$("lb"),lbImg=$("lbImg"),lbCap=$("lbCap");
function lbRender(){
  var s=(SETS[lb.set]||[])[lb.idx];
  if(!s){ lbClose(); return; }
  lbImg.src=s.src;
  lbImg.alt=s.cap||s.sub||"";
  lbCap.innerHTML="<b>"+(lb.idx+1)+" / "+(SETS[lb.set].length)+"</b>"+esc(s.cap||"")+(s.sub?" · "+esc(s.sub):"");
  var multi=SETS[lb.set].length>1;
  $("lbPrev").style.display=multi?"":"none";
  $("lbNext").style.display=multi?"":"none";
}
var lbTries=0;
function lbOpen(set,idx){
  lb.set=set; lb.idx=idx||0; lbTries=0;
  lbRender();
  lbEl.hidden=false;
  document.body.classList.add("lb-open");
}
function lbClose(){
  lbEl.hidden=true;
  document.body.classList.remove("lb-open");
}
function lbNav(d){
  var n=(SETS[lb.set]||[]).length; if(!n) return lbClose();
  lb.idx=(lb.idx+d+n)%n; lbRender();
}
$("lbBack").addEventListener("click",lbClose);
$("lbX").addEventListener("click",lbClose);
$("lbPrev").addEventListener("click",function(){lbNav(-1)});
$("lbNext").addEventListener("click",function(){lbNav(1)});
lbImg.addEventListener("error",function(){
  lbTries++;
  if(lbTries>=(SETS[lb.set]||[]).length){ lbClose(); } else { lbNav(1); }
});
document.addEventListener("keydown",function(e){
  if(lbEl.hidden) return;
  if(e.key==="Escape") lbClose();
  else if(e.key==="ArrowLeft") lbNav(-1);
  else if(e.key==="ArrowRight") lbNav(1);
});

/* click delegation: arrows + zoom */
view.addEventListener("click",function(e){
  var nav=e.target.closest(".mnav");
  if(nav){ cycle(nav.closest(".mwrap"),+nav.dataset.nav); return; }
  var sl=e.target.closest(".mslide");
  if(sl && e.target.tagName==="IMG"){
    var wr=sl.closest(".mwrap");
    lbOpen(wr.dataset.set,+sl.dataset.idx);
    return;
  }
  var vtab=e.target.closest(".vtab");
  if(vtab){ setVer(+vtab.dataset.v); return; }
  var use=e.target.closest(".use");
  if(use){
    use.classList.toggle("on");
    use.innerHTML=use.classList.contains("on")?"Selected &#10003;":"Use &#8594;";
    return;
  }
  var go=e.target.closest("[data-go]");
  if(go){ location.hash="#/"+go.dataset.go; }
});

/* ================= shared bits ================= */
var ICONS={
  onboarding:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 4 5.4 4 8.5s-1.4 6.1-4 8.5c-2.6-2.4-4-5.4-4-8.5s1.4-6.1 4-8.5z"/>',
  profile:'<path d="M7.5 3.5c0 5.5 9 5.5 9 8.5s-9 3-9 8.5M16.5 3.5c0 5.5-9 5.5-9 8.5s9 3 9 8.5M8.6 7h6.8M8.6 17h6.8"/>',
  strategy:'<path d="M12 3.5l2.2 6.3 6.3 2.2-6.3 2.2L12 20.5l-2.2-6.3-6.3-2.2 6.3-2.2z"/><circle cx="19" cy="5" r="1.4"/>',
  campaigns:'<path d="M4 10.5v3L6.8 14v-3.5zM6.8 10.5l10.2-4v11L6.8 14z"/><path d="M18.5 8.2a4.3 4.3 0 0 1 0 7.6M9.2 14.4l1 5.1h2l-.8-5"/>',
  photoshoot:'<rect x="3" y="7.5" width="18" height="12.5" rx="3"/><path d="M8.5 7.5l1.4-2.7h4.2l1.4 2.7"/><circle cx="12" cy="13.5" r="3.4"/>',
  websites:'<rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M9.5 20.5h5M12 17v3.5"/>',
  brandbook:'<path d="M6.5 3.5H19v16.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 18.5v-12A2.5 2.5 0 0 1 6.5 3.5z"/><path d="M8.5 8h7M8.5 11.5h7"/>',
  instagram:'<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/>',
  tiktok:'<path d="M9.5 16.8a3.2 3.2 0 1 0 3.2 3.2V5.4c.6 2.5 2.3 4.1 4.8 4.6"/>',
  streaming:'<path d="M4.5 9.5a11.5 11.5 0 0 1 15 0"/><path d="M7.2 13a7.5 7.5 0 0 1 9.6 0"/><circle cx="12" cy="16.8" r="1.5" fill="currentColor" stroke="none"/>',
  guerrilla:'<path d="M12 21.2S6 15.6 6 10.7a6 6 0 0 1 12 0c0 4.9-6 10.5-6 10.5z"/><circle cx="12" cy="10.7" r="2.1"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10.5l5-3v9l-5-3z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  _d:'<circle cx="12" cy="12" r="6.5"/>'
};
function glyph(name,cls){
  var inner=ICONS[String(name||"").toLowerCase()]||ICONS._d;
  return '<svg class="'+(cls||"gl")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';
}
function qlooBadge(mode){
  if(mode!=="live"&&mode!=="simulated") mode="simulated";
  return '<span class="badge"><i></i>Qloo · '+esc(mode)+'</span>';
}
function chips(arr,cls){
  return '<div class="chips">'+(arr||[]).map(function(t){return '<span class="chip'+(cls?" "+cls:"")+'">'+esc(t)+'</span>';}).join("")+'</div>';
}
function meter(w,hot,d){
  return '<div class="meter"><i'+(hot?' class="hot"':"")+' style="--w:'+clamp01(w).toFixed(3)+';--d:'+(d||0).toFixed(2)+'s"></i></div>';
}

/* deep-scan data for real video files (none ship in this dataset,
   but anything present renders in a fold — never a bare link) */
function findVideos(){
  var out=[];
  (function walk(o,ctx){
    if(!o) return;
    if(typeof o==="string"){ if(/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(o)) out.push({src:o,ctx:ctx}); return; }
    if(Array.isArray(o)){ o.forEach(function(v,i){walk(v,ctx);}); return; }
    if(typeof o==="object"){ Object.keys(o).forEach(function(k){walk(o[k],k);}); }
  })(D,"");
  return out;
}
function videoFold(v,label){
  return '<details class="fold"><summary>'+glyph("video","")+' '+(label||"Motion clip")+'</summary>'
    +'<div class="fold-body"><video controls preload="metadata" src="'+esc(v.src)+'"></video>'
    +(v.ctx?'<div class="faint" style="margin-top:6px">'+esc(v.ctx)+'</div>':"")+'</div></details>';
}

/* ================= VIEWS ================= */
var NAV=[
  {id:"onboarding",label:"Onboarding",meta:"first run"},
  {id:"profile",label:"Business",meta:"profile"},
  {id:"strategy",label:"Strategy",meta:"board"},
  {id:"campaigns",label:"Campaigns",meta:""},
  {id:"photoshoot",label:"Photoshoot",meta:"studio"},
  {id:"websites",label:"Websites",meta:""},
  {id:"brandbook",label:"Brand Book",meta:""}
];

/* ---------- Onboarding ---------- */
function vOnboarding(){
  var p=D.profile||{};
  var done=p.name?true:false;
  var stages=[
    {t:"Scanned your site",d:p.source&&p.source.url?esc(p.source.url):"",done:done},
    {t:"Read your voice",d:(p.tone||[]).join(" · "),done:done},
    {t:"Matched your audience's taste",d:(p.qloo&&p.qloo.calls?p.qloo.calls.length+" taste calls":""),done:done,qloo:true}
  ];
  var tpls=[
    {name:"Aurora Roast",cat:"Specialty coffee roaster",colors:["#6f4e37","#c9a87c","#e07a5f"]},
    {name:"Driftline",cat:"Coastal surf shop",colors:["#0d5c63","#7fb6b9","#f2a65a"]},
    {name:"Petal & Stem",cat:"Boutique florist",colors:["#7d4f5e","#d9a7b0","#e8c547"]}
  ];
  return '<div class="ob">'
    +'<div class="ob-hero"><div class="logo">M</div>'
    +'<h1>Let&rsquo;s build your brand</h1>'
    +'<p class="sub">Point Marque at your website and we&rsquo;ll draft your brand DNA &mdash; voice, palette, and your audience&rsquo;s taste &mdash; ready for campaigns, photoshoots and sites.</p></div>'

    +'<section class="mt pad" '+pd()+'>'
    +'<span class="ml">Enter your website</span>'
    +'<div class="urlrow">'
    +'<input value="'+esc(p.source&&p.source.url||"")+'" placeholder="https://yourbusiness.com" aria-label="Website URL">'
    +'<button class="btn" type="button" data-go="profile">'+glyph("strategy","")+' Generate Business Profile</button>'
    +'</div>'
    +'<label class="check"><input type="checkbox" checked><span>Include public business-listing details when available</span></label>'
    +(p.source?'<div class="note" style="margin-top:12px">Source on file: <b style="color:var(--mut)">'+esc(p.source.type)+'</b> · '+esc(p.source.url)+' &mdash; profile updated '+esc(fmtDate(p.updatedAt))+'</div>':"")
    +'</section>'

    +(done?'<section class="mt pad" '+pd()+'>'
      +'<span class="ml">Last build · '+esc(fmtDate(p.updatedAt))+'</span>'
      +'<div class="stage-list">'
      +stages.map(function(s){
        return '<div class="stage-it"><span class="tick">'+glyph("check","")+'</span><span>'+esc(s.t)+'</span>'
          +(s.qloo?qlooBadge(p.qloo.mode):"")
          +'<span class="faint">'+esc(s.d)+'</span></div>';
      }).join("")
      +'</div></section>':"")

    +'<section class="mt pad" '+pd()+'>'
    +'<details class="fold" style="border-top:0"><summary style="padding-top:0">No website yet?</summary>'
    +'<div class="fold-body"><div class="tplgrid">'
    +tpls.map(function(t){
      return '<button class="tpl" type="button" data-go="profile"><span class="tpsw">'+t.colors.map(function(c){return '<i style="background:'+c+'"></i>';}).join("")+'</span><span><b>'+esc(t.name)+'</b><span>'+esc(t.cat)+'</span></span></button>';
    }).join("")
    +'</div><div class="faint" style="margin-top:10px">Or chat with the Marque agent and draft your brand DNA from scratch.</div></div></details>'
    +'</section>'

    +'<div class="faint" style="text-align:center">Marque can make mistakes &mdash; review your profile before generating.</div>'
    +'</div>';
}

/* ---------- Business Profile ---------- */
function vProfile(){
  var p=D.profile||{};
  var h=[];
  h.push('<section class="mt pad" '+pd()+'>'
    +'<span class="ml">Business Profile'+(p.source?" · "+esc(p.source.type):"")+'</span>'
    +'<h2>'+esc(p.name)+'</h2>'
    +(p.tagline?'<p class="serif" style="font-size:16px;color:var(--acc);margin:8px 0 10px">'+esc(p.tagline)+'</p>':"")
    +(p.description?'<p class="prose">'+esc(p.description)+'</p>':"")
    +'<div class="divider"></div>'
    +'<div class="jobmeta faint">'
    +(p.source?'<span class="chip">'+esc(p.source.url)+'</span>':"")
    +(p.updatedAt?'<span>updated '+esc(fmtDate(p.updatedAt))+'</span>':"")
    +'</div></section>');

  /* palette */
  var cols=p.colors||{};
  var crow=Object.keys(cols).map(function(k){
    return '<span class="sw"><i style="background:'+esc(cols[k])+'"></i><b>'+esc(k)+'</b><span>'+esc(cols[k])+'</span></span>';
  }).join("");
  if(crow) h.push('<section class="mt pad" '+pd()+'><span class="ml">Palette</span><div class="swrow">'+crow+'</div></section>');

  /* type */
  if(p.fonts){
    h.push('<section class="mt pad" '+pd()+'><span class="ml">Typography</span>'
      +'<div class="kv"><div><span class="k">Heading · '+esc(p.fonts.heading||"default")+'</span>'
      +'<div class="v serif" style="font-size:21px;margin-top:4px">The quick brown fox</div></div>'
      +'<div><span class="k">Body · '+esc(p.fonts.body||"default")+'</span>'
      +'<div class="v" style="margin-top:4px">The quick brown fox jumps over the lazy dog.</div></div></div></section>');
  }

  /* tone + values + audience */
  if((p.tone||[]).length) h.push('<section class="mt pad" '+pd()+'><span class="ml">Tone of voice</span>'+chips(p.tone)+'</section>');
  if((p.values||[]).length) h.push('<section class="mt pad" '+pd()+'><span class="ml">Values</span>'+chips(p.values,"lime")+'</section>');
  if(p.audience) h.push('<section class="mt quote" '+pd()+'><p>'+esc(p.audience)+'</p><div class="attr">Audience</div></section>');

  /* profile images */
  (p.images||[]).forEach(function(im,i){
    if(!im.path) return;
    var sn="profile-im-"+i;
    regset(sn,[{src:im.path,cap:im.caption||p.name,sub:fmtDate(p.createdAt)}]);
    h.push('<section class="mt" data-imgonly '+pd()+'>'+figure(sn,SETS[sn])+'</section>');
  });

  /* catalog */
  (p.catalog||D.catalog||[]).forEach(function(pr){
    var tile='<section class="mt pad" '+pd()+'><span class="ml">Catalog · product</span>'
      +'<h3>'+esc(pr.name)+'</h3>'
      +(pr.description?'<p class="prose" style="margin-top:6px">'+esc(pr.description)+'</p>':"")
      +'<div class="jobmeta" style="margin-top:10px">'
      +(pr.price?'<span class="chip lime">'+esc(pr.price)+'</span>':"")
      +(pr.url?'<span class="chip">'+esc(pr.url)+'</span>':"")
      +'</div></section>';
    if(pr.image){

/* ================= agent rail ================= */
function agentMsg(role,html){
  var b=$("agentBody");
  var m=document.createElement("div");
  m.className="msg "+(role==="user"?"user":"bot");
  m.innerHTML=(role==="bot"?'<span class="mt-t">Marque</span>':"")+html;
  b.appendChild(m);
  b.scrollTop=b.scrollHeight;
  return m;
}
function agentBoot(){
  var p=D.profile||{};
  agentMsg("bot","Hey — I'm the Marque agent. Ask me to tune your brand voice, swap palette colors, rewrite the tagline, or draft copy.");
  var bits=[];
  if(p.name)bits.push("<b>"+esc(p.name)+"</b>");
  var sN=(D.strategy&&D.strategy.strategies||[]).length;
  var cN=(D.campaigns||[]).length;
  var iN=(D.images||[]).length;
  if(sN)bits.push(sN+" strategies drafted");
  if(cN)bits.push(cN+" campaign"+(cN>1?"s":""));
  if(iN)bits.push(iN+" assets on the board");
  if(bits.length>1)agentMsg("bot","On the board: "+bits.join(" · ")+".");
}
function agentSend(){
  var inp=$("agentIn"),t=inp.value.trim();
  if(!t)return;
  agentMsg("user",esc(t));
  inp.value="";
  var tp=agentMsg("bot",'<span class="typing"><i></i><i></i><i></i></span>');
  setTimeout(function(){
    tp.innerHTML='<span class="mt-t">Marque</span>'+"Noted — this mockup isn't wired to the live agent, but edits would land right here.";
    $("agentBody").scrollTop=$("agentBody").scrollHeight;
  },900);
}
$("agentSend").addEventListener("click",agentSend);
$("agentIn").addEventListener("keydown",function(e){if(e.key==="Enter")agentSend()});
function toggleAgent(){document.body.classList.toggle("agent-open")}
$("agentToggle").addEventListener("click",toggleAgent);
$("railAgent").addEventListener("click",toggleAgent);
if(window.innerWidth>=1200)document.body.classList.add("agent-open");

/* ================= router ================= */
var VIEWS={
  onboarding:{r:vOnboarding,name:"Onboarding",meta:"point us at your site"},
  profile:{r:vProfile,name:"Business Profile",meta:"brand DNA · catalog · taste"},
  strategy:{r:vStrategy,name:"Strategy Board",meta:"audience read + directions"},
  campaigns:{r:vCampaigns,name:"Campaigns",meta:function(){return (D.campaigns||[]).length+" campaign"+((D.campaigns||[]).length!==1?"s":"")}},
  photoshoot:{r:vPhotoshoot,name:"Photoshoot",meta:function(){return (D.images||[]).length+" assets · "+(D.photoshoots||[]).length+" shoots"}},
  websites:{r:vWebsites,name:"Websites",meta:function(){return (D.websites||[]).length+" site"+((D.websites||[]).length!==1?"s":"")}},
  brandbook:{r:vBrandBook,name:"Brand Book",meta:"published identity"}
};
var railItems=$("railItems");
railItems.innerHTML=NAV.map(function(n){
  return '<button class="rail-item" type="button" data-view="'+n.id+'" title="'+esc(n.label)+'">'
    +glyph(n.id)+'<span class="lb-off">'+esc(n.label.split(" ")[0])+'</span></button>';
}).join("");
railItems.addEventListener("click",function(e){
  var b=e.target.closest("[data-view]");
  if(b)location.hash="#/"+b.dataset.view;
});
function go(){
  var id=(location.hash||"").replace(/^#\/?/,"")||"onboarding";
  if(!VIEWS[id])id="onboarding";
  popN=0;
  view.innerHTML=VIEWS[id].r();
  var meta=VIEWS[id].meta;
  $("vName").textContent=VIEWS[id].name;
  $("vMeta").textContent=typeof meta==="function"?meta():meta;
  document.querySelectorAll(".rail-item[data-view]").forEach(function(b){
    b.classList.toggle("active",b.dataset.view===id);
  });
  /* top badge: simulated honesty where taste data is on screen */
  var badgeViews={strategy:1,profile:1,campaigns:1};
  $("topBadge").innerHTML=badgeViews[id]?qlooBadge("simulated"):"";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",go);

agentBoot();
go();
})();
</script>
</body>
</html>
