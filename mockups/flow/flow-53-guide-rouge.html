<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque — Le Guide des Campagnes 2027</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23B53425'/%3E%3Crect x='10' y='14' width='44' height='36' rx='3' fill='%23FAF6EC'/%3E%3Ctext x='32' y='38' text-anchor='middle' font-family='Georgia' font-size='18' fill='%23B53425'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EC;
  --paper2:#F4EEDF;
  --ink:#26211A;
  --dim:#837862;
  --rouge:#B53425;
  --hair:#D8CDB2;
  --bk:'Libre Baskerville',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#CCC4AC;
  color:var(--ink);font-family:var(--bk);font-size:13.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(181,52,37,.2)}
a{color:var(--rouge);text-decoration:none;border-bottom:1px dotted var(--rouge)}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--rouge);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.book{max-width:860px;margin:26px auto 60px;padding:0 clamp(8px,2vw,18px)}
.page{
  background:var(--paper);border:1px solid #B9AE92;
  box-shadow:0 18px 50px rgba(70,55,30,.35),inset 0 0 60px rgba(180,160,110,.12);
  padding:clamp(18px,4vw,46px) clamp(16px,5vw,58px);
}

/* cover header */
.hd{text-align:center;border-bottom:3px double var(--rouge);padding-bottom:18px}
.hd .ann{font-size:9.5px;letter-spacing:.5em;text-transform:uppercase;color:var(--dim)}
.hd h1{font-size:clamp(30px,6vw,50px);font-weight:700;letter-spacing:.1em;color:var(--rouge);margin:8px 0 2px}
.hd .sub{font-size:clamp(13px,2vw,16px);font-style:italic;color:var(--dim)}
.hd .ask{max-width:600px;margin:16px auto 0;font-size:clamp(14px,2.2vw,17px)}
.hd .ask .itin{font-style:italic}
.hd .ask .itin b{color:var(--rouge)}
.hd .url{font-family:var(--mono);font-size:10px;margin-top:8px;color:var(--dim);overflow-wrap:anywhere}
.hd .impr{margin-top:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

/* sommaire */
.sommaire{margin:18px 0 8px;columns:2;column-gap:40px}
@media(max-width:560px){.sommaire{columns:1}}
.sommaire .row{display:flex;align-items:baseline;gap:8px;font-size:11.5px;padding:3px 0;break-inside:avoid}
.sommaire .row b{font-weight:400;white-space:nowrap}
.sommaire .row i{flex:1;border-bottom:1px dotted var(--hair);transform:translateY(-3px)}
.sommaire .row span{font-family:var(--mono);font-size:9.5px;color:var(--rouge)}
.sommaire a{color:var(--ink);border-bottom:none}
.sommaire a:hover{color:var(--rouge)}

/* entries */
.chap{margin-top:26px}
.chap-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rouge);padding-bottom:6px;margin-bottom:14px}
.chap-h .n{font-family:var(--mono);font-size:9.5px;color:var(--rouge);letter-spacing:.2em}
.chap-h h2{font-size:clamp(15px,2.4vw,19px);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.chap-h .rub{margin-left:auto;font-style:italic;font-size:11.5px;color:var(--dim)}

/* le voyageur */
.trav{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(14px,3vw,26px)}
@media(max-width:640px){.trav{grid-template-columns:1fr}}
.trav .ess{font-size:13.5px}
.trav .ess .temp{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:.05em;text-transform:capitalize}
.trav .ess .conf{font-family:var(--mono);font-size:10px;color:var(--rouge);letter-spacing:.14em;border:1px solid var(--rouge);padding:1px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.trav .ess p{font-style:italic;color:var(--dim);font-size:12.5px;margin-top:6px}
.signes{list-style:none;margin-top:10px}
.signes li{padding:4px 0 4px 18px;border-bottom:1px dotted var(--hair);position:relative;font-size:12.5px}
.signes li::before{content:"◆";position:absolute;left:0;color:var(--rouge);font-size:8px;top:9px}
.gares{display:grid;grid-template-columns:80px 1fr;gap:2px 12px;font-size:12px;margin-top:4px}
.gares b{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--rouge);padding-top:3px}
.gares span{font-style:italic;padding-bottom:5px;border-bottom:1px dotted var(--hair)}
.mots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mots span{font-size:11px;font-style:italic;border:1px solid var(--ink);padding:2px 10px;background:var(--paper2);border-radius:10px}
.k{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
.folio{margin-top:12px;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--dim)}

/* establishments */
.etab{padding:14px 0 12px;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px}
.etab:last-child{border-bottom:none}
.etab .nm{font-size:clamp(16px,2.6vw,20px);font-weight:700;letter-spacing:.04em}
.etab .nm .q{font-style:italic}
.etab .stars{font-family:Georgia,serif;color:var(--rouge);font-size:clamp(15px,2.4vw,19px);letter-spacing:.18em;white-space:nowrap;text-align:right}
.etab .stars .lbl{display:block;font-family:var(--bk);font-style:italic;font-size:9.5px;letter-spacing:.06em;color:var(--dim)}
.etab .comm{font-size:11px;font-style:italic;color:var(--rouge)}
.etab .desc{grid-column:1/-1;font-size:12.5px;color:var(--ink);margin-top:2px}
.etab .desc .sv{color:var(--dim)}
.etab .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;margin-top:5px}
.etab .meta .c{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em}
.etab .meta .c b{color:var(--rouge);font-weight:400}
.etab .prix{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;border-top:1px dotted var(--hair);padding-top:7px;margin-top:5px;font-size:12px}
.etab .prix b{font-size:15px}
.etab .prix small{font-style:italic;color:var(--dim);text-align:right;max-width:260px}
.etab .rem{grid-column:1/-1;font-size:11.5px;font-style:italic;color:var(--rouge)}
.etab.coeur{background:linear-gradient(90deg,rgba(181,52,37,.07),transparent 60%);margin:0 -14px;padding-left:14px;padding-right:14px}
.etab.coeur .nm::after{content:"Coup de cœur de l’inspecteur";display:inline-block;margin-left:12px;font-family:var(--bk);font-size:9px;font-style:italic;letter-spacing:.14em;color:var(--paper);background:var(--rouge);padding:2px 9px;vertical-align:middle}

/* non retenus */
.noret{border:1px solid var(--hair);background:var(--paper2);padding:4px 16px}
.noret .row{padding:9px 0;border-bottom:1px dotted var(--hair);font-size:12px}
.noret .row:last-child{border-bottom:none}
.noret b{font-size:12.5px}
.noret .ch{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rouge);margin-left:8px}
.noret p{font-style:italic;color:var(--dim);font-size:11.5px;margin-top:2px}

/* menu + assiettes */
.menud{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(14px,3vw,26px)}
@media(max-width:720px){.menud{grid-template-columns:1fr}}
.menu{border:2px solid var(--rouge);background:var(--paper);padding:18px 22px;height:max-content;text-align:center}
.menu .k2{font-size:8.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--rouge)}
.menu h3{font-size:clamp(18px,3vw,24px);font-weight:700;margin:6px 0 8px}
.menu .lede{font-style:italic;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:10px}
.menu dl{display:grid;grid-template-columns:86px 1fr;gap:5px 14px;font-size:12px;text-align:left}
.menu dt{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rouge);padding-top:3px}
.menu dd{border-bottom:1px dotted var(--hair);padding-bottom:6px}
.menu .msg{font-weight:700}
.menu .foot{margin-top:10px;font-size:10.5px;font-style:italic;color:var(--dim)}
.assiettes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:430px){.assiettes{grid-template-columns:1fr}}
.plat{text-align:center;transition:transform .16s ease}
.plat:hover{transform:translateY(-3px)}
.plat .dish{
  border-radius:50%;overflow:hidden;border:6px solid var(--paper2);
  box-shadow:0 0 0 1px var(--ink),0 8px 20px rgba(70,50,25,.25),inset 0 0 0 1px rgba(38,33,26,.4);
  position:relative;
}
.plat img{width:100%;aspect-ratio:1/1;object-fit:cover}
.plat .h{font-size:11.5px;font-weight:700;display:block;margin-top:8px;line-height:1.3}
.plat .p{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--rouge)}

/* encres */
.encres{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:640px){.encres{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.encres{grid-template-columns:repeat(2,1fr)}}
.enc{text-align:center}
.enc .sw{height:46px;border:1px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper);margin-bottom:5px}
.enc .n{font-size:11px;font-weight:700}
.enc .h{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--dim)}

/* carnet */
.carnet .mem{font-size:12.5px;font-style:italic;max-width:620px;margin-bottom:14px}
.carnet .mem b{font-style:normal}
.cgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(14px,3vw,26px)}
@media(max-width:720px){.cgrid{grid-template-columns:1fr}}
.visits{width:100%;border-collapse:collapse;font-size:11px}
.visits th{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rouge);text-align:left;border-bottom:1.5px solid var(--ink);padding:4px 8px 4px 0}
.visits td{border-bottom:1px dotted var(--hair);padding:5px 8px 5px 0;vertical-align:top}
.visits .ep{font-family:var(--mono);font-size:9.5px}
.visits .pm{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);overflow-wrap:anywhere;max-width:200px}
.visits .md{border:1px solid var(--ink);padding:0 5px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
.symp .g{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--rouge);margin:10px 0 3px}
.symp .g:first-child{margin-top:0}
.symp .row{display:grid;grid-template-columns:minmax(0,1fr) 66px 30px;gap:8px;align-items:center;font-size:11.5px;padding:3px 0;border-bottom:1px dotted var(--hair)}
.symp .bar{height:6px;border:1px solid var(--ink);background:var(--paper)}
.symp .bar i{display:block;height:100%;background:var(--rouge)}
.symp .v{font-family:var(--mono);font-size:9px;text-align:right}

/* correspondance */
.corr{display:flex;flex-wrap:wrap;gap:10px}
.corr button{
  border:1.5px solid var(--rouge);background:var(--paper);color:var(--rouge);padding:8px 17px;font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;transition:all .15s ease;
}
.corr button:hover{background:var(--rouge);color:var(--paper)}
.corr button:active{transform:translateY(1px)}
.cornote{margin-top:10px;font-size:11px;font-style:italic;color:var(--dim)}

.empty{padding:26px;text-align:center;font-style:italic;color:var(--dim)}
.foot{text-align:center;margin-top:22px;font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--dim)}
</style>
</head>
<body>
<div class="book">
<div class="page">
<header class="hd">
  <div class="ann">Inspections anonymes · Édition des campagnes</div>
  <h1>MARQUE</h1>
  <div class="sub">Le Guide des Campagnes — les maisons qui valent le détour</div>
  <div class="ask" id="s-ask"></div>
  <div class="url" id="s-url"></div>
  <div class="impr" id="s-impr"></div>
</header>
<nav class="sommaire" id="som"></nav>
<main id="app"></main>
<div class="foot" id="foot"></div>
</div>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return '—'}};
const stars=fit=>fit>=0.95?{s:'★★★',t:'vaut le voyage'}:fit>=0.90?{s:'★★',t:'vaut un détour'}:{s:'★',t:'intéressant'};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[1,4,6,13].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-ask').innerHTML='<span class="itin">Itinéraire proposé par un lecteur : <b>« '+esc((B.sub&&B.sub.prompt)||B.title||'')+' »</b></span>';
document.getElementById('s-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'maison visitée : <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';
document.getElementById('s-impr').textContent=(B.urlContext&&B.urlContext.title)?('Imprimé après visite de '+B.urlContext.title+' — '+dt(B.createdAt||B.fetchedAt)):'';
document.getElementById('foot').textContent='GUIDE '+String(B.id||'—').slice(0,8).toUpperCase()+' · LES ÉTOILES SONT RÉATTRIBUÉES CHAQUE ANNÉE';

const CHAPTERS=[['I','Le voyageur'],['II','Établissements inspectés'],['III','Non retenus cette année'],['IV','Menu & assiettes'],['V','Encres du guide'],['VI','Carnet de l’inspecteur'],['VII','Correspondance']];
document.getElementById('som').innerHTML=CHAPTERS.map((c,i)=>'<div class="row"><a href="#ch'+i+'"><b>'+esc(c[0])+'. '+esc(c[1])+'</b></a><i></i><span>'+(101+i*14)+'</span></div>').join('');

const M=document.getElementById('app');
let chidx=0;
const chap=(title,rub,body)=>{
  if(!body)return;
  const i=chidx++;
  M.appendChild(el('<section class="chap" id="ch'+i+'"><div class="chap-h"><span class="n">'+esc(CHAPTERS[i][0])+'</span><h2>'+esc(title)+'</h2><span class="rub">'+esc(rub)+'</span></div>'+body+'</section>'));
};

/* I — le voyageur */
if(AR&&AR.lean){
  chap('Le Voyageur','portrait d’usage, dressé sans complaisance',
  '<div class="trav"><div class="ess"><span class="temp">'+esc(AR.lean.label||'—')+'</span><span class="conf">sûreté '+f2(AR.lean.confidence)+'</span>'+
  '<p>Se reconnaît à sa hâte raisonnée : le voyageur visite peu, mais il revient. Nos inspecteurs notent :</p>'+
  '<ul class="signes">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'+
  '<div class="folio">FICHE '+String(B.id||'—').slice(0,8).toUpperCase()+' · '+dt(B.createdAt||B.fetchedAt)+'</div></div>'+
  '<div><span class="k">Gares fréquentées</span><div class="gares">'+(AR.mediaHabits||[]).map(h=>'<b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span>').join('')+'</div>'+
  '<div style="margin-top:12px"><span class="k">Mots de passe reconnus</span><div class="mots">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div></div>');
}

/* II — establishments */
if(strats.length){
  chap('Établissements inspectés','quatre maisons, visitées incognito',
  strats.map((s,i)=>{
    const st=stars(s.audienceFit&&s.audienceFit.score);
    return '<article class="etab'+(i===sel?' coeur':'')+'"><div class="nm">'+esc(s.title)+' <span class="q">— '+esc(s.angle||'')+'</span></div>'+
    '<div class="stars">'+st.s+'<span class="lbl">'+st.t+'</span></div>'+
    '<div class="desc">Service '+esc((s.channels||[]).map(c=>esc(c.name)).join(', '))+'. '+(s.audienceFit&&s.audienceFit.notes||[]).map(esc).join('; ')+'.</div>'+
    '<div class="meta">'+(s.channels||[]).map(c=>'<span class="c">couvert <b>'+esc(c.name)+'</b> · '+f2(c.fit)+' — '+esc(c.why||'—')+'</span>').join('')+
    '<span class="c">formules : <b>'+(s.formats||[]).map(esc).join('</b>, <b>')+'</b></span></div>'+
    '<div class="prix"><span>Couverts estimés : <b>'+views(s.reach&&s.reach.estViews)+'</b></span><small>'+esc(s.reach&&s.reach.basis||'')+'</small></div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="rem">Remarque de l’inspecteur : '+esc(s.watchouts[0])+'</div>':'')+
    '</article>'}).join(''));
}

/* III — non retenus */
if(anti.length){
  chap('Non retenus cette année','sans étoile, sans regret',
  '<div class="noret">'+anti.map(a=>'<div class="row"><b>'+esc(a.title)+'</b><span class="ch">'+esc(a.channel)+'</span><p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>');
}

/* IV — menu + assiettes */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  chap('Menu & Assiettes','la carte proposée, les plats photographiés',
  '<div class="menud"><div class="menu"><div class="k2">Menu du jour · prix fixe</div>'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Pour</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Le mot du chef</dt><dd class="msg">« '+esc(br.keyMessage)+' »</dd>'+
  '<dt>Pièce signature</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<div class="lede">aucun menu affiché</div>')+
  '<div class="foot">Service compris. Le menu change au gré du marché.</div></div>'+
  '<div class="assiettes">'+CREAT.map((m,i)=>
    '<figure class="plat"><div class="dish"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" loading="lazy" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
    '<figcaption><span class="h">Assiette n°'+(i+1)+' — '+esc(m.head)+'</span><span class="p">en cuisine · '+esc(m.provider)+'</span></figcaption></figure>').join('')+'</div></div>');
}

/* V — encres */
chap('Encres du Guide','les couleurs de cette édition',
  '<div class="encres">'+PALETTE.map((s,i)=>
    '<div class="enc"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">ENCRE '+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* VI — carnet de l'inspecteur */
if(B.evidence||affs.length){
  chap('Carnet de l’Inspecteur','frais justifiés, visites consignées — source Qloo',
  '<div class="carnet"><p class="mem"><b>NOTE AUX LECTEURS.</b> Nos inspecteurs déjeunent anonymement. Les présentes notes proviennent du <b>bureau Qloo</b>, en régime <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'—').toUpperCase()+'</b> — <b>'+calls.length+' visites</b> payées de leur poche.</p>'+
  '<div class="cgrid"><div><table class="visits"><thead><tr><th>Bureau consulté</th><th>N</th><th>Ms</th><th>Régime</th></tr></thead><tbody>'+
  calls.map(c=>'<tr><td><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,18)).join(' '))+'</span></td>'+
    '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
  '</tbody></table></div>'+
  '<div class="symp">'+affs.map(g=>'<div class="g">Sympathies relevées · '+esc(g.type.replace('urn:entity:',''))+'</div>'+
    g.entities.slice(0,4).map(e=>'<div class="row"><span>'+esc(e.name)+'</span><span class="bar"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
  '</div></div></div>');
}
