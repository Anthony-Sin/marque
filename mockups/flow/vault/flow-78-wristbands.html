<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque Fest — Wristband Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23241F18'/%3E%3Crect x='6' y='24' width='52' height='16' rx='3' fill='%23E8560C'/%3E%3Cpath d='M6 24h52M6 40h52' stroke='%23F4E9D4' stroke-width='1.5' stroke-dasharray='4 3'/%3E%3Ccircle cx='46' cy='32' r='6' fill='%23F4E9D4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#241F18;--bg2:#2E2820;--cloth:#F4E9D4;--cloth2:#CBBD9E;
  --rust:#E8560C;--olive:#7C7A4E;--ink:#171310;--mut:#94856B;--line:#4A4132;
  --f:'Space Grotesk',system-ui,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg) radial-gradient(ellipse at 50% -10%,rgba(78,66,45,.8),transparent 55%);
  color:var(--cloth);font-family:var(--f);font-size:15.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(232,86,12,.45)}
a{color:var(--cloth);text-decoration:none;border-bottom:1.5px solid var(--rust);word-break:break-all}
a:hover{color:#fff;border-color:#fff}
a:focus-visible,button:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}
.fest{max-width:980px;margin:0 auto 84px;padding:0 clamp(10px,2.4vw,22px)}

/* gate sign */
.gate{margin-top:26px;border:2px solid var(--line);background:linear-gradient(170deg,var(--bg2),var(--bg));
  border-radius:8px;padding:clamp(16px,4vw,26px) clamp(16px,4.4vw,34px);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.gate h1{font-size:clamp(26px,6vw,44px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.gate h1 span{color:var(--rust)}
.gate .booth{text-align:right;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut)}
.gate .booth b{display:block;font-size:13px;color:var(--cloth2);letter-spacing:.1em;font-family:var(--mono);font-weight:400}

section{margin-top:28px}
.sect-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sect-h .bx{font-size:10px;letter-spacing:.28em;background:var(--rust);color:var(--ink);padding:3px 10px;font-weight:700;text-transform:uppercase;border-radius:2px}
.sect-h h2{font-size:clamp(19px,3.8vw,27px);font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.sect-h .sub{margin-left:auto;font-size:12.5px;color:var(--mut);font-style:italic}
.tray{
  background:var(--bg2);border:1.5px solid var(--line);border-radius:8px;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.35);
  padding:clamp(16px,3.6vw,28px) clamp(12px,3.4vw,28px);
}

/* the bands — generic woven wristband */
.band{position:relative;border-radius:6px;overflow:visible;
  border-top:2px dashed rgba(255,255,255,.4);border-bottom:2px dashed rgba(0,0,0,.35);
  box-shadow:0 6px 14px rgba(0,0,0,.45);
  display:flex;align-items:center;gap:clamp(10px,2.6vw,22px);flex-wrap:wrap;
  padding:12px clamp(12px,3vw,20px)}
.band::before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 3px,transparent 3px 7px),
             repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 3px,transparent 3px 7px)}
.band .tag{font-size:9px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;
  background:rgba(0,0,0,.32);padding:3px 10px;border-radius:3px;flex:0 0 auto}
.band .core{flex:1;min-width:200px}
.band .ttl{font-size:clamp(19px,4.6vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.05}
.band .sub2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:3px}
.band .tail{font-family:var(--mono);font-size:11px;text-align:right;flex:0 0 auto}
.band .tail b{display:block;font-size:17px;font-weight:600}
.bead{width:26px;height:26px;border-radius:50%;flex:0 0 auto;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff,var(--cloth2) 60%,#8d7f63);
  box-shadow:0 2px 5px rgba(0,0,0,.5)}
.bead::before{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(0,0,0,.25)}

/* hero band = ask */
.hero{background:var(--rust);color:var(--ink)}
.hero .ttl{font-size:clamp(24px,6vw,40px)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:8px}
.hero .meta div{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.hero .meta b{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:none;margin-top:1px}
.hero a{color:var(--ink);border-color:var(--ink)}
.hero a:hover{color:#fff}

/* gate stats = audience */
.gateband{background:var(--cloth);color:var(--ink)}
.gateband .ttl{letter-spacing:.04em}
.gateband .conf{font-family:var(--mono)}
.gateband .conf b{color:var(--rust)}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(max-width:620px){.lanes{grid-template-columns:1fr}}
.lane{border:1.5px dashed rgba(0,0,0,.3);border-radius:5px;padding:9px 12px;background:rgba(0,0,0,.04)}
.lane .ch{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);font-weight:700}
.lane .nt{font-size:12px;margin-top:3px;line-height:1.4}
.lane .bar{margin-top:7px;height:16px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 6px);opacity:.8}
.tells{margin-top:12px;font-size:12.5px;opacity:.8}
.tells b{font-weight:700}
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stickers span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid var(--ink);padding:1px 10px;border-radius:20px;font-weight:600}

/* tier bands = strategies */
.stack{display:grid;gap:14px}
.tier{transition:transform .15s ease}
.tier:hover{transform:translateX(4px)}
.tier.worn{box-shadow:0 8px 20px rgba(232,86,12,.3)}
.tier .fit{margin-left:auto;text-align:right;flex:0 0 auto}
.tier .fit b{font-family:var(--mono);font-size:clamp(19px,4.4vw,27px);font-weight:600}
.tier .fit span{display:block;font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.valid{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.valid .v{opacity:.9}
.valid .v i{font-style:italic;text-transform:none;letter-spacing:0;opacity:.7}
.bandinfo{flex-basis:100%;border-top:1px dashed rgba(0,0,0,.25);padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 22px;font-size:11.5px}
.bandinfo .fmt{letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.bandinfo .watch{font-style:italic;opacity:.8}
.bandinfo .watch b{font-style:normal;font-size:8px;letter-spacing:.24em;text-transform:uppercase;opacity:.9;display:block}
.tier.t0{background:#F4E9D4;color:var(--ink)}
.tier.t1{background:#7C7A4E;color:#F4E9D4}
.tier.t2{background:#3B3326;color:var(--cloth)}
.tier.t3{background:var(--rust);color:var(--ink)}
.tier .access{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;border:1.5px solid currentColor;padding:1px 8px;border-radius:2px;display:inline-block;margin-top:5px;opacity:.85}

/* voided = ruled out */
.voids{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:640px){.voids{grid-template-columns:1fr}}
.void{background:var(--bg);color:var(--mut);border:1.5px dashed var(--line);
  border-top-style:dashed;border-bottom-style:dashed;box-shadow:none;opacity:.75;position:relative}
.void::after{content:"";position:absolute;top:-3px;right:38%;width:16px;height:calc(100% + 6px);background:var(--bg2);
  clip-path:polygon(0 0,100% 0,80% 50%,100% 100%,0 100%,20% 50%);border-left:1.5px dashed var(--line);border-right:1.5px dashed var(--line)}
.void .ch{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);font-weight:700}
.void h4{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.void h4 s{text-decoration-color:var(--rust)}
.void .why{font-size:12px;font-style:italic;margin-top:4px;line-height:1.45;max-width:76%}

/* lanyard pass = brief + pit photos */
.passwrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(16px,3.4vw,30px);align-items:start}
@media(max-width:800px){.passwrap{grid-template-columns:1fr}}
.lanyard{position:relative;padding-top:56px}
.lanyard::before{content:"";position:absolute;top:-30px;left:50%;transform:translateX(-50%) rotate(-4deg);
  width:14px;height:110px;background:repeating-linear-gradient(180deg,var(--rust) 0 8px,var(--cloth) 8px 16px);border-radius:6px;z-index:0}
.pass{position:relative;background:var(--cloth);color:var(--ink);border-radius:8px;padding:16px 18px;
  box-shadow:0 10px 24px rgba(0,0,0,.5);transform:rotate(-1.2deg)}
.pass .sal{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);font-weight:700}
.pass h3{font-size:clamp(22px,4.6vw,32px);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.pass .ang{font-size:13.5px;margin-top:6px;color:#4E4634}
.pass dl{display:grid;grid-template-columns:100px 1fr;gap:4px 14px;margin-top:12px;font-size:13px}
.pass dt{font-size:8.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);padding-top:4px}
.pass dd{border-bottom:1px solid var(--cloth2);padding-bottom:6px}
.pass .km{font-weight:700;font-size:15px}
.pass .bc{margin-top:10px;height:26px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 7px,var(--ink) 7px 8px,transparent 8px 14px)}
.pit{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:430px){.pit{grid-template-columns:1fr}}
.shot{border:1.5px solid var(--line);background:var(--ink);overflow:hidden;transition:transform .15s ease;border-radius:3px}
.shot:hover{transform:translateY(-3px)}
.shot .iw{aspect-ratio:4/3;overflow:hidden}
.shot .iw img{width:100%;height:100%;object-fit:cover}
.shot figcaption{padding:8px 12px 10px;border-top:1.5px solid var(--line)}
.shot .h{font-size:12.5px;font-weight:500;line-height:1.3}
.shot .p{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);margin-top:3px}
.shot .p b{border:1px solid var(--rust);padding:0 7px;border-radius:8px}

/* weave samples = palette */
.weaves{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.wv{width:104px}
.wv .b{height:26px;border-radius:4px;border-top:1.5px dashed rgba(255,255,255,.4);border-bottom:1.5px dashed rgba(0,0,0,.35);position:relative;overflow:hidden}
.wv .b::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 3px,transparent 3px 7px),repeating-linear-gradient(-45deg,rgba(0,0,0,.1) 0 3px,transparent 3px 7px)}
.wv .n{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;font-weight:600}
.wv .hx{font-size:9.5px;font-family:var(--mono);color:var(--mut)}

/* scan log = qloo */
.scans{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(14px,3vw,26px)}
@media(max-width:800px){.scans{grid-template-columns:1fr}}
.scans table{width:100%;border-collapse:collapse;font-size:12.5px}
.scans th{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 7px;border-bottom:2px solid var(--cloth2)}
.scans td{padding:7px;border-bottom:1px dashed var(--line);vertical-align:top}
.scans td.mono{font-family:var(--mono);font-size:11.5px;color:var(--cloth2)}
.scans .ok{display:inline-block;font-size:9px;letter-spacing:.16em;border:1.5px solid var(--rust);color:var(--rust);padding:0 6px;text-transform:uppercase;margin-top:2px}
.scannote{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:10px}
.merch{border:1.5px solid var(--cloth2);background:rgba(0,0,0,.3);padding:12px 16px;border-radius:4px}
.merch h4{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);margin-bottom:8px}
.merch .dv{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em;border-bottom:1.5px solid var(--cloth2);padding:6px 0 2px}
.merch .rw{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dotted var(--line)}
.merch .rw:last-child{border-bottom:none}
.merch .rw .v{font-family:var(--mono);font-size:12px;color:var(--cloth2)}

/* re-entry = next */
.re{display:flex;flex-wrap:wrap;gap:10px}
.re button{border:1.5px solid var(--cloth);background:transparent;color:var(--cloth);padding:9px 18px;
  font-weight:600;font-size:13.5px;text-transform:uppercase;letter-spacing:.09em;border-radius:3px;
  transition:background .12s ease,color .12s ease,transform .12s ease}
.re button:hover{background:var(--cloth);color:var(--ink)}
.re button:active{transform:translateY(2px)}
.re .sub{width:100%;font-style:italic;color:var(--mut);font-size:13px}
.alsoc{margin-top:12px;font-size:13px;color:var(--mut)}
.alsoc b{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--rust);display:block;margin-bottom:4px}
.alsoc span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dotted var(--mut)}
.foot{text-align:center;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--mut);margin-top:32px}
.empty{background:var(--bg2);border:1.5px solid var(--line);border-radius:8px;padding:40px;text-align:center;font-style:italic;color:var(--mut);margin-top:20px}
</style>
</head>
<body>
<div class="fest">
  <header class="gate">
    <h1>Marque Fest <span>· Wristband Desk</span></h1>
    <div class="booth" id="booth">—</div>
  </header>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dshort=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}catch(e){return '—'}};

const PALETTE=[
  {n:'Field Clay',h:'#E8560C'},{n:'Crew Cloth',h:'#F4E9D4'},{n:'Moss Stage',h:'#7C7A4E'},
  {n:'Night Gate',h:'#241F18'},{n:'Dust Trail',h:'#CBBD9E'}
];
const CREAT=[6,0,8,13].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];
const DATE=dshort(B.createdAt||B.fetchedAt);
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
const prompt=((B.sub&&B.sub.prompt)||B.title||'').trim();
const TIERS=['GA','VIP','ARTIST','CREW'];

document.getElementById('booth').innerHTML='ISSUE BOOTH 03 · GATE A<br>'+DATE+' · ROLL No. '+esc(String(B.id||'').slice(0,4).toUpperCase());
document.getElementById('foot').textContent='MARQUE FEST · BANDS NON-TRANSFERABLE · KEEP IT ON TIL MONDAY';

const M=document.getElementById('app');
const sec=(bx,title,sub,inner,cls)=>{if(!inner)return;
  M.appendChild(el('<section'+(cls?' class="'+cls+'"':'')+'><div class="sect-h"><span class="bx">'+esc(bx)+'</span><h2>'+esc(title)+'</h2><span class="sub">'+esc(sub)+'</span></div><div class="tray">'+inner+'</div></section>'))};

/* headline band = ask */
sec('GA','The Event Band','everybody through the gate wears this one',
'<div class="band hero"><span class="tag">HEADLINE</span><div class="core">'+
'<div class="ttl">'+esc(prompt)+'</div>'+
'<div class="sub2">Marque Fest · main stage · all weekend</div>'+
'<div class="meta">'+
'<div>Presented by<b>'+(U?'<a href="'+esc(U)+'">'+esc(U)+'</a>':'—')+'</b></div>'+
'<div>Billing<b>'+esc((B.urlContext&&B.urlContext.title)||'—')+'</b></div>'+
'<div>Sounds like<b>'+esc(((B.urlContext&&B.urlContext.description)||'').slice(0,96))+'…</b></div>'+
'</div></div><div class="tail"><b>3</b>DAYS<span></span></div><span class="bead"></span></div>');

/* gate stats = audience */
if(AR&&AR.lean){
  sec('SCAN','Crowd Profile — Gate A','beep, beep, beep — every scan logged',
  '<div class="band gateband"><span class="tag" style="background:var(--rust);color:var(--ink)">CROWD READ</span><div class="core">'+
  '<div class="ttl">'+esc(AR.lean.label)+'</div>'+
  '<div class="sub2">scan-through reads <b class="conf" style="color:var(--rust)">'+Math.round((AR.lean.confidence||0)*100)+'%</b> valid</div>'+
  '<div class="lanes">'+(AR.mediaHabits||[]).map(h=>'<div class="lane"><div class="ch">'+esc(h.channel)+' lane</div>'+
  '<div class="nt">'+esc(h.note)+'</div><div class="bar"></div></div>').join('')+'</div>'+
  '<div class="tells"><b>Gate tells —</b> '+(AR.lean.signals||[]).map(s=>esc(s)).join(' · ')+'</div>'+
  '<div class="stickers">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
  '</div><span class="bead" style="background:radial-gradient(circle at 35% 30%,#F4A26E,var(--rust) 60%,#9C3208)"></span></div>');
}

/* tier bands = strategies */
if(strats.length){
  sec('TIER','The Band Set','four tiers issued at the desk — fit decides access',
  '<div class="stack">'+strats.map((s,i)=>{
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    return '<div class="band tier t'+i+(i===sel?' worn':'')+'"><span class="tag">'+TIERS[i]+'</span>'+
    '<div class="core"><div class="ttl" style="font-size:clamp(19px,4.2vw,27px)">'+esc(s.title)+'</div>'+
    '<div class="sub2">'+esc(s.angle||'')+'</div>'+
    '<span class="access">ACCESS LVL '+f2(fit)+(i===sel?' · ON WRIST NOW':'')+'</span>'+
    '<div class="valid">VALID AT '+(s.channels||[]).map(c=>'<span class="v">'+esc(c.name)+' '+f2(c.fit)+' <i>('+esc(c.why||'')+')</i></span>').join('')+'</div>'+
    '<div class="bandinfo">'+
    '<span class="fmt">SETS '+(s.formats||[]).map(f=>esc(f)).join(' + ').toUpperCase()+'</span>'+
    (s.reach&&s.reach.basis?'<span class="fmt" style="text-transform:none;letter-spacing:.02em">'+esc(s.reach.basis)+'</span>':'')+
    (s.watchouts&&s.watchouts[0]?'<span class="watch"><b>Security note</b>'+esc(s.watchouts[0])+'</span>':'')+
    '</div></div>'+
    '<div class="fit"><b>'+views(s.reach&&s.reach.estViews)+'</b><span>cap. est.</span></div>'+
    '<span class="bead"'+(i===sel?' style="background:radial-gradient(circle at 35% 30%,#F4A26E,var(--rust) 60%,#9C3208)"':'')+'></span></div>';
  }).join('')+'</div>');
}

/* voided = ruled out */
if(anti.length){
  sec('VOID','Voided at the Gate','cut bands — don\'t let them back in',
  '<div class="voids">'+anti.map(a=>'<div class="band void"><div><div class="ch">band voided · '+esc(a.channel)+'</div>'+
  '<h4><s>'+esc(a.title)+'</s></h4><div class="why">gate log — '+esc(a.whyNot)+'</div></div></div>').join('')+'</div>');
}

/* artist pass = brief + photo pit */
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('AAA','Artist Pass \u0026 Photo Pit','the laminate that opens every door',
  '<div class="passwrap"><div class="lanyard"><div class="pass">'+
  (br?'<div class="sal">AAA laminate · '+esc(selS.title)+'</div><h3>'+esc(br.title)+'</h3>'+
  '<div class="ang">'+esc(br.angle)+'</div>'+
  '<dl><dt>Holder</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Rider line</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Endorsed</dt><dd>headline signal '+esc(selS.heroSignal||'—')+' · access '+f2((selS.audienceFit&&selS.audienceFit.score)||0)+'</dd></dl>'+
  '<div class="bc"></div>'
  :'<div class="ang">Pass unprinted.</div>')+
  '</div></div>'+
  '<div><div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);margin-bottom:8px;font-weight:700">Photo pit — first three songs, no flash</div>'+
  '<div class="pit">'+CREAT.map(m=>'<figure class="shot"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">shot by <b>'+esc(m.provider)+'</b></div></figcaption></figure>').join('')+'</div></div></div>');
}

/* weave samples = palette */
sec('WVE','Weave Samples','cloth off the roll — pick the season colourway',
  '<div class="weaves">'+PALETTE.map(s=>'<div class="wv"><div class="b" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="hx">'+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* scan log = qloo */
if(calls.length||affs.length){
  sec('LOG','Scan Log','every beep reconciled — Qloo gate system, '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live'),
  '<div class="scans"><div><table><tr><th>Gate / scanner</th><th>Beeped</th><th>Latency</th><th>Crowd</th><th>Fields</th></tr>'+
  calls.map((c,i)=>'<tr><td><b>SCAN-'+(i+1)+'</b> · '+esc(c.endpoint)+'<br><span class="ok">'+esc(c.mode)+'</span></td>'+
  '<td class="mono">'+esc((c.at||'').slice(11,19))+'Z</td><td class="mono">'+esc(c.tookMs)+' ms</td><td class="mono">n='+esc(c.n)+'</td><td class="mono">'+esc(Object.keys(c.params||{}).length)+'</td></tr>').join('')+'</table>'+
  '<p class="scannote">'+(calls.length||0)+' scans reconciled at close — '+(esc((B.qlooBundle&&B.qlooBundle.mode)||'live'))+' gate system, counts match the till.</p></div>'+
  '<div class="merch"><h4>Merch stand — what the crowd buys</h4>'+affs.map(g=>'<div class="dv">'+esc(String(g.type).replace('urn:entity:',''))+'</div>'+
  (g.entities||[]).slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+(e.affinity||0).toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* re-entry = next */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
sec('RE','Re-Entry Stamp','hand stamped — back in for the encore',
  '<div class="re">'+['Cut the ad spot','Deal the landing page','Ship the media plan','Run it back — remix'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">Band stays on, gate stays open — encore slot is yours.</div></div>'+
  (others.length?'<div class="alsoc"><b>Other stages on site</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

if(!M.children.length)M.appendChild(el('<div class="empty">Gate never opened — data.js lost on the way to the field.</div>'));
})();
</script>
</body>
</html>
