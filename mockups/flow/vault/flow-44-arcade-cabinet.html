<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARQUE · Strategy Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23101014'/%3E%3Crect x='14' y='14' width='36' height='8' fill='%23FFC400'/%3E%3Crect x='14' y='28' width='36' height='8' fill='%23FFC400'/%3E%3Crect x='14' y='42' width='24' height='8' fill='%23FF4A3D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --cab:#141417;
  --cab-2:#1D1D22;
  --scr:#0B0B0E;
  --amber:#FFC400;
  --red:#FF4A3D;
  --ink:#E8E4D8;
  --dim:#8E8A7A;
  --px:'Press Start 2P',ui-monospace,monospace;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#08080A;
  background-image:radial-gradient(ellipse 70% 40% at 50% -5%,rgba(255,196,0,.07),transparent 60%);
  color:var(--ink);
  font-family:var(--mono);
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(255,196,0,.3)}
a{color:var(--amber);text-decoration:none}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.cab{
  max-width:1120px;margin:22px auto 60px;
  background:var(--cab);
  border:2px solid #2E2E35;border-radius:18px;
  box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  padding:clamp(14px,2.6vw,30px);
  position:relative;
}
.crt{position:relative;background:var(--scr);border-radius:10px;overflow:hidden;
  border:1px solid #000;box-shadow:inset 0 0 60px rgba(0,0,0,.85),inset 0 0 14px rgba(120,200,255,.05)}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 120% 100% at 50% 0%,rgba(255,255,255,.05),transparent 45%)}
.crtpad{padding:clamp(16px,3.4vw,34px);position:relative;z-index:2}

/* attract screen */
.attract{text-align:center;padding:clamp(20px,4vw,44px) 10px}
.attract .pres{font-family:var(--px);font-size:9px;letter-spacing:.34em;color:var(--dim)}
.attract h1{font-family:var(--px);font-size:clamp(17px,4.2vw,34px);line-height:1.5;color:var(--amber);margin:20px 0 8px;
  text-shadow:0 0 18px rgba(255,196,0,.45),3px 3px 0 #7A2B00}
.attract .ask{font-size:clamp(13px,1.9vw,16px);color:var(--ink);max-width:640px;margin:14px auto 0}
.attract .ask em{font-style:normal;color:var(--red)}
.attract .url{font-size:11px;color:var(--dim);margin-top:10px;overflow-wrap:anywhere}
.coin{
  display:inline-flex;align-items:center;gap:12px;margin-top:26px;
  font-family:var(--px);font-size:10px;color:var(--scr);
  background:linear-gradient(#FFD94A,#E0A800);
  border:none;border-radius:8px;padding:14px 26px;
  box-shadow:0 4px 0 #8a6b00,0 0 26px rgba(255,196,0,.35);transition:.12s;
}
.coin .slot{width:8px;height:22px;border-radius:4px;background:var(--scr);box-shadow:inset 0 2px 4px #000}
.coin:hover{filter:brightness(1.08)}
.coin:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6b00}
.coinhint{font-family:var(--px);font-size:8px;color:var(--dim);margin-top:14px;letter-spacing:.2em}

/* panels */
.panel{margin-top:26px;border:1px solid #33333B;background:var(--cab-2);border-radius:8px;overflow:hidden}
.panel>.ph{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#000;border-bottom:1px solid #33333B;padding:10px 16px;
}
.panel>.ph h2{font-family:var(--px);font-size:clamp(9px,1.6vw,12px);color:var(--amber);letter-spacing:.14em}
.panel>.ph .no{font-family:var(--px);font-size:8px;color:var(--red)}
.panel>.ph .tag{margin-left:auto;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.panel>.pb{padding:clamp(14px,2.6vw,24px)}

/* player select — audience */
.player{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.player .avatar{width:clamp(84px,12vw,120px);aspect-ratio:1;border:2px solid var(--amber);background:var(--scr);position:relative;padding:14px}
.player .avatar svg{width:100%;height:100%}
.player .who .lbl{font-size:9px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:6px}
.player .class{font-family:var(--px);font-size:clamp(12px,2.2vw,17px);color:var(--ink);line-height:1.6}
.player .meter{margin:14px 0 6px;display:flex;gap:3px}
.player .meter i{width:12px;height:16px;background:#2A2A30;border:1px solid #000}
.player .meter i.on{background:var(--amber);box-shadow:0 0 8px rgba(255,196,0,.5)}
.player .conf{font-size:10px;color:var(--dim)}
.player .traits{list-style:none;margin-top:10px}
.player .traits li{font-size:12px;padding:5px 0;border-bottom:1px dashed #2E2E35}
.player .traits li::before{content:"▸ ";color:var(--red)}
.player .habits .row{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;font-size:12px;padding:6px 0;border-bottom:1px dashed #2E2E35}
.player .habits .row b{color:var(--amber);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding-top:2px}
.player .vibes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.player .vibes span{font-size:10px;letter-spacing:.1em;border:1px solid var(--amber);color:var(--amber);padding:3px 9px}

/* hi-score table */
table.hi{width:100%;border-collapse:collapse;font-size:12.5px}
.hi th{font-family:var(--px);font-size:8px;color:var(--dim);text-align:left;padding:6px 10px 10px;letter-spacing:.12em}
.hi td{padding:9px 10px;border-bottom:1px dashed #2E2E35;vertical-align:middle}
.hi tr.hsel td{background:rgba(255,196,0,.05)}
.hi .rank{font-family:var(--px);font-size:10px;color:var(--red);width:34px}
.hi .nm{font-family:var(--px);font-size:clamp(9px,1.5vw,11.5px);color:var(--ink);line-height:1.7}
.hi .nm small{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:0}
.hi .fit{color:var(--amber);font-size:12px;white-space:nowrap}
.hi .fit .cb{display:inline-block;width:70px;height:9px;border:1px solid var(--dim);margin-right:8px;vertical-align:0;padding:1px}
.hi .fit .cb i{display:block;height:100%;background:var(--amber)}
.hi .scr{font-family:var(--px);font-size:clamp(10px,1.7vw,13px);color:var(--amber);text-align:right;white-space:nowrap;text-shadow:0 0 12px rgba(255,196,0,.4)}
.hi .scr small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);text-shadow:none}
.hi .crown{color:var(--amber);font-family:var(--px);font-size:8px}

/* stage detail cards */
.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.stage{border:1px solid #33333B;background:var(--scr);border-radius:6px;padding:14px 16px;position:relative}
.stage.best{border-color:var(--amber);box-shadow:0 0 22px rgba(255,196,0,.12)}
.stage .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stage .sh b{font-family:var(--px);font-size:9.5px;color:var(--ink);line-height:1.7}
.stage .sh .ang{font-size:9px;color:var(--red);letter-spacing:.18em;text-transform:uppercase}
.stage .stat{display:grid;grid-template-columns:88px 1fr 46px;gap:4px 10px;align-items:center;font-size:10.5px;margin-top:8px}
.stage .stat b{color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:9px}
.stage .bar{height:10px;border:1px solid #33333B;background:#000;padding:1px}
.stage .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--amber) 0 5px,transparent 5px 7px)}
.stage .pv{font-family:var(--px);font-size:8.5px;color:var(--amber);text-align:right}
.stage .fmt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stage .fmt span{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--dim);color:var(--dim);padding:2px 7px}
.stage .warn{margin-top:10px;font-size:10.5px;color:var(--red);border-left:3px solid var(--red);padding-left:9px}
.stage .warn b{font-family:var(--px);font-size:7.5px;display:block;margin-bottom:3px}
.stage .bases{font-size:10px;color:var(--dim);margin-top:8px}

/* banned */
.banned{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ban{border:1px dashed var(--red);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;background:rgba(255,74,61,.04)}
.ban .x{font-family:var(--px);color:var(--red);font-size:13px;line-height:1.4}
.ban b{font-family:var(--px);font-size:9px;color:var(--ink);text-decoration:line-through;text-decoration-color:var(--red);line-height:1.7}
.ban .chan{font-size:8.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-left:8px}
.ban p{font-size:11px;color:var(--dim);margin-top:5px}

/* mission + crt screens */
.mission{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:22px}
.mission .brief h3{font-family:var(--px);font-size:clamp(11px,1.9vw,15px);color:var(--amber);line-height:1.8}
.mission .brief .ba{font-size:11px;color:var(--red);margin:8px 0 14px}
.mission .brief dl{display:grid;grid-template-columns:82px 1fr;gap:8px 14px;font-size:12px}
.mission .brief dt{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);padding-top:3px}
.mission .brief dd.msg{color:var(--ink);font-size:13.5px}
.mission .cont{margin-top:18px}
.creats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bezel{
  border-radius:14px;padding:10px 10px 6px;position:relative;
  background:linear-gradient(#2C2C32,#1A1A1F);
  border:1px solid #0A0A0C;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.5);
}
.bezel .glass{position:relative;border-radius:8px;overflow:hidden;background:#000;border:1px solid #000}
.bezel .glass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse 130% 80% at 50% -10%,rgba(255,255,255,.12),transparent 55%)}
.bezel img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:saturate(1.08) contrast(1.05)}
.bezel figcaption{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:7px;padding:0 2px}
.bezel .h{font-size:10.5px;min-width:0;overflow-wrap:anywhere;color:var(--ink)}
.bezel .p{font-size:7.5px;font-family:var(--px);color:var(--scr);background:var(--amber);padding:3px 6px;border-radius:3px;white-space:nowrap}
.bezel .led{position:absolute;top:4px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}

/* rom swatches */
.roms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.rom{border:1px solid #33333B;background:var(--scr);padding:8px;border-radius:4px;text-align:center}
.rom .chip{height:58px;border:2px solid #000;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.rom .n{font-size:10px;margin-top:8px;color:var(--ink)}
.rom .h{font-size:8.5px;color:var(--dim);letter-spacing:.08em}

/* service menu — provenance */
.svc{font-size:11.5px}
.svc .hdr{color:var(--dim);margin-bottom:14px;font-size:11px}
.svc .hdr b{color:var(--amber)}
.svcgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}
table.calls{width:100%;border-collapse:collapse;font-size:10.5px}
.calls th{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:left;border-bottom:1px solid var(--amber);padding:3px 4px}
.calls td{padding:5px 4px;border-bottom:1px dashed #2E2E35;vertical-align:top}
.calls .pm{display:block;color:var(--dim);font-size:8.5px;overflow-wrap:anywhere}
.calls .md{border:1px solid var(--amber);color:var(--amber);font-size:8px;padding:0 4px}
.ach .g{font-size:9px;letter-spacing:.24em;color:var(--red);text-transform:uppercase;border-bottom:1px solid #33333B;padding-bottom:4px;margin:12px 0 6px}
.ach .g:first-child{margin-top:0}
.ach .row{display:flex;align-items:center;gap:10px;font-size:11px;padding:4px 0;border-bottom:1px dashed #2E2E35}
.ach .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach .row .cb{width:60px;height:8px;border:1px solid var(--dim);padding:1px}
.ach .row .cb i{display:block;height:100%;background:var(--amber)}
.ach .row .v{font-size:9.5px;color:var(--dim)}

/* next games */
.games{display:flex;flex-wrap:wrap;gap:14px}
.game{
  font-family:var(--px);font-size:9px;letter-spacing:.12em;
  background:var(--scr);border:2px solid var(--amber);color:var(--amber);
  padding:13px 20px;border-radius:6px;box-shadow:0 4px 0 #6b5200;transition:.12s;
}
.game:hover{background:var(--amber);color:var(--scr)}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 #6b5200}

.foot{margin-top:30px;text-align:center;font-family:var(--px);font-size:8px;letter-spacing:.3em;color:var(--dim)}
.foot .blink{animation:bl 1.1s steps(2,start) infinite;color:var(--red)}
@keyframes bl{to{visibility:hidden}}
.empty{border:2px dashed #33333B;border-radius:8px;padding:44px;text-align:center;color:var(--dim);margin-top:24px}

@media(max-width:900px){
  .player{grid-template-columns:auto 1fr}
  .player .habits{grid-column:1/-1}
  .mission{grid-template-columns:1fr}
  .svcgrid{grid-template-columns:1fr}
  .roms{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:640px){
  .player{grid-template-columns:1fr}
  .stages,.banned,.creats{grid-template-columns:1fr}
  .roms{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hi .fit .cb{width:44px}
  .hi td,.hi th{padding-left:4px;padding-right:4px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="cab">
  <div class="crt"><div class="crtpad">
    <header class="attract">
      <div class="pres">MARQUE STRATEGY SYSTEMS PRESENTS</div>
      <h1 id="a-title">STRATEGY<br>ARCADE</h1>
      <p class="ask" id="a-ask">—</p>
      <p class="url" id="a-url"></p>
      <button class="coin"><span class="slot"></span>INSERT COIN · 1 PLAY</button>
      <div class="coinhint">© 2026 MARQUE AMUSEMENTS · LICENSED BY QLOO</div>
    </header>
    <main id="app"></main>
    <footer class="foot">HI-SCORE SAVES ON EXIT · <span class="blink">INSERT COIN TO CONTINUE</span></footer>
  </div></div>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const score=n=>String(Math.round(n||0)).padStart(7,'0');
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[5,6,11,0].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||(s.reach&&s.reach.estViews)>(strats[b].reach&&strats[b].reach.estViews||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('a-ask').innerHTML='“'+esc((B.sub&&B.sub.prompt)||B.title||'').replace(/→/g,' <em>→</em>')+'”';
document.getElementById('a-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'LOADED FROM <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';

const M=document.getElementById('app');
const panel=(no,tag,title,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="panel"><div class="ph"><span class="no">'+esc(no)+'</span><h2>'+esc(title)+'</h2><span class="tag">'+esc(tag)+'</span></div><div class="pb">'+body+'</div></section>'));
};

/* 1P — player profile (audience) */
if(AR&&AR.lean){
  const hearts=Math.round((AR.lean.confidence||0)*10);
  panel('1P','CHARACTER SELECT · PRESS START','PLAYER PROFILE — THE AUDIENCE',
    '<div class="player">'+
    '<div class="avatar"><svg viewBox="0 0 64 64"><rect x="20" y="8" width="24" height="8" fill="#EFB7AE"/><rect x="14" y="16" width="36" height="10" fill="#EFB7AE"/><rect x="18" y="28" width="8" height="8" fill="#E8E4D8"/><rect x="38" y="28" width="8" height="8" fill="#E8E4D8"/><rect x="16" y="40" width="32" height="8" fill="#B98A6F"/><rect x="24" y="48" width="16" height="8" fill="#4E362B"/></svg></div>'+
    '<div class="who"><span class="lbl">Character class</span><div class="class">'+esc(AR.lean.label||'—').toUpperCase()+'</div>'+
    '<div class="meter">'+Array.from({length:10},(_,i)=>'<i'+(i<hearts?' class="on"':'')+'></i>').join('')+'</div>'+
    '<div class="conf">SYNC RATE '+pct(AR.lean.confidence)+'% — confidence in this read</div>'+
    '<ul class="traits">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>'+
    '<div class="habits"><span class="lbl" style="font-size:9px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:8px">Where they grind</span>'+
    (AR.mediaHabits||[]).map(h=>'<div class="row"><b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span></div>').join('')+
    '<div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div>'+
    '</div>');
}

/* HI-SCORE — strategies ranked by reach + stage cards */
if(strats.length){
  const order=strats.map((s,i)=>i).sort((a,b)=>((strats[b].reach||{}).estViews||0)-((strats[a].reach||{}).estViews||0));
  panel('HI','SCORE RANKING · TOP 4','HI-SCORE TABLE — STRATEGIES',
    '<table class="hi"><thead><tr><th></th><th>NAME</th><th>FIT</th><th style="text-align:right">SCORE</th></tr></thead><tbody>'+
    order.map((si,r)=>{
      const s=strats[si];
      return '<tr'+(si===sel?' class="hsel"':'')+'><td class="rank">'+(r===0?'<span class="crown">1ST</span>':'0'+(r+1))+'</td>'+
      '<td class="nm">'+esc(s.title).toUpperCase()+'<small>'+esc(s.angle)+'</small></td>'+
      '<td class="fit"><span class="cb"><i style="width:'+pct(s.audienceFit&&s.audienceFit.score)+'%"></i></span>'+pct(s.audienceFit&&s.audienceFit.score)+'%</td>'+
      '<td class="scr">'+score(s.reach&&s.reach.estViews)+'<small>est. views</small></td></tr>'}).join('')+
    '</tbody></table>'+
    '<div class="stages">'+strats.map((s,i)=>
      '<article class="stage'+(i===sel?' best':'')+'"><div class="sh"><b>STAGE '+(i+1)+' — '+esc(s.title).toUpperCase()+'</b><span class="ang">'+esc(s.angle)+'</span></div>'+
      (s.channels||[]).map(c=>'<div class="stat"><b>'+esc(c.name)+'</b><span class="bar"><i style="width:'+pct(c.fit)+'%"></i></span><span class="pv">'+pct(c.fit)+'</span></div>').join('')+
      '<div class="stat"><b>why</b><span style="font-size:10px;color:var(--dim)">'+esc((s.channels||[]).map(c=>c.why).filter(Boolean).join(' · ')||'—')+'</span><span></span></div>'+
      '<div class="fmt">'+(s.formats||[]).map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
      ((s.watchouts&&s.watchouts[0])?'<div class="warn"><b>!! WARNING</b>'+esc(s.watchouts[0])+'</div>':'')+
      '<div class="bases">EST.REACH '+views(s.reach&&s.reach.estViews)+' — '+esc(s.reach&&s.reach.basis||'')+'</div>'+
      '</article>').join('')+'</div>');
}

/* banned moves — ruled outs */
if(anti.length){
  panel('X','MOVE LIST · DISABLED','BANNED MOVES — DO NOT INPUT',
    '<div class="banned">'+anti.map(a=>'<div class="ban"><span class="x">✕</span><div><b>'+esc(a.title).toUpperCase()+'</b><span class="chan">'+esc(a.channel)+'</span><p>'+esc(a.whyNot)+'</p></div></div>').join('')+'</div>');
}

/* mission briefing + crt creatives */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  panel('GO','MISSION BRIEFING · STAGE '+(sel!=null?sel+1:'—'),'MISSION OBJECTIVE + REELS',
    '<div class="mission"><div class="brief">'+
    (br?'<h3>'+esc(br.title).toUpperCase()+'</h3><p class="ba">'+esc(br.angle)+'</p>'+
    '<dl><dt>Party</dt><dd>'+esc(br.audience)+'</dd>'+
    '<dt>Objective</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
    '<dt>Power-up</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<p class="ba">no brief bound</p>')+
    '<div class="cont"><button class="coin"><span class="slot"></span>PRESS START</button></div>'+
    '</div>'+
    '<div class="creats">'+CREAT.map(m=>
      '<figure class="bezel"><span class="led"></span><div class="glass"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
      '<figcaption><span class="h">'+esc(m.head)+'</span><span class="p">'+esc(m.provider)+'</span></figcaption></figure>').join('')+
    '</div></div>');
}

/* palette roms */
panel('SW','GRAPHICS ROM · 5 BANKS','COLOR PALETTE — ROM CHIPS',
  '<div class="roms">'+PALETTE.map((s,i)=>
    '<div class="rom"><div class="chip" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">CHR-'+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+
  '</div>');

/* service menu — provenance */
if(B.evidence||affs.length){
  panel('DIP','SERVICE MODE · OPERATORS ONLY','SERVICE MENU — SIGNAL LOG',
    '<div class="svc"><p class="hdr">AUDIT: <b>'+(B.qlooBundle&&B.qlooBundle.mode?B.qlooBundle.mode.toUpperCase():'—')+' MODE</b> — <b>'+calls.length+' API CALLS</b> LOGGED BY THE QLOO BOARD · PCB '+(B.id||'—').slice(0,8).toUpperCase()+'</p>'+
    '<div class="svcgrid"><div>'+
    '<table class="calls"><thead><tr><th>Endpoint</th><th>N</th><th>Ms</th><th>Mode</th></tr></thead><tbody>'+
    calls.map(c=>'<tr><td>'+esc(c.endpoint)+'<span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,18)).join(' '))+'</span></td>'+
      '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="ach">'+affs.map(g=>'<div class="g">'+esc(g.type.replace('urn:entity:',''))+' unlocked</div>'+
      g.entities.slice(0,4).map(e=>'<div class="row"><span class="nm">'+esc(e.name)+'</span><span class="cb"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
    '</div></div></div>');
}

/* next games */
panel('NX','ATTRACT MODE · CHOOSE WISELY','SELECT NEXT CABINET',
  '<div class="games">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button class="game">'+x+'</button>').join('')+'</div>');

if(!M.children.length)M.appendChild(el('<div class="empty">GAME OVER — data.js failed to load. NO COINS REFUNDED.</div>'));
})();
</script>
</body>
</html>
