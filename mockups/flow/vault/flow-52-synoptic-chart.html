<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque Meteorological Office — Daily Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F3EFE2'/%3E%3Ccircle cx='32' cy='32' r='8' fill='none' stroke='%231F4E79' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%231F4E79' stroke-width='1.4'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%231F4E79' stroke-width='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EFE2;
  --paper2:#EDE8D6;
  --ink:#22303E;
  --dim:#6B7566;
  --iso:#1F4E79;
  --front:#B23A2E;
  --hair:#C4BCA2;
  --ost:'Old Standard TT',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#D8D2BE;
  color:var(--ink);font-family:var(--ost);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(31,78,121,.2)}
a{color:var(--iso);text-decoration:none;border-bottom:1px dotted var(--iso)}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--iso);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.office{max-width:1080px;margin:26px auto 64px;padding:0 clamp(10px,2.4vw,22px)}

.report{background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 16px 50px rgba(50,45,25,.3),inset 0 0 0 5px var(--paper2),inset 0 0 0 6px var(--hair)}

/* telegram head */
.thead{border-bottom:3px double var(--ink);padding:clamp(18px,4vw,32px) clamp(16px,4vw,40px);text-align:center;position:relative}
.thead .office-n{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--dim)}
.thead h1{font-size:clamp(24px,5vw,42px);font-weight:700;letter-spacing:.06em;margin:10px 0 4px}
.thead h1 em{font-style:normal;color:var(--iso)}
.thead .issued{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin-top:8px}
.thead .ask{margin:16px auto 0;max-width:640px;font-size:clamp(15px,2.2vw,18px)}
.thead .ask .req{font-style:italic}
.thead .ask .req b{color:var(--iso)}
.thead .url{font-family:var(--mono);font-size:10.5px;margin-top:8px;color:var(--dim);overflow-wrap:anywhere}

/* sections */
.sec{border-bottom:1.5px solid var(--ink);padding:clamp(16px,3.4vw,30px) clamp(16px,4vw,40px)}
.sec:last-child{border-bottom:none}
.sech{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.sech .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--front)}
.sech h2{font-size:clamp(17px,2.8vw,24px);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sech .note{margin-left:auto;font-style:italic;font-size:12px;color:var(--dim)}

/* general situation */
.gensit{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:clamp(16px,3vw,30px)}
@media(max-width:720px){.gensit{grid-template-columns:1fr}}
.gensit .prose{font-size:14.5px}
.gensit .prose .lead{font-variant:small-caps;font-size:clamp(21px,3.2vw,28px);font-weight:700;color:var(--iso)}
.gensit .prose .conf{display:inline-block;border:1.5px solid var(--iso);color:var(--iso);font-family:var(--mono);font-size:10px;letter-spacing:.16em;padding:2px 10px;margin-left:8px;vertical-align:middle}
.siglist{list-style:none;margin-top:10px}
.siglist li{padding:5px 0 5px 22px;border-bottom:1px dotted var(--hair);position:relative;font-size:13.5px}
.siglist li::before{content:"↑";position:absolute;left:2px;color:var(--iso);font-family:var(--mono)}
.stns{width:100%;border-collapse:collapse;font-size:12.5px}
.stns th{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--iso);text-align:left;border-bottom:1.5px solid var(--ink);padding:4px 8px 4px 0}
.stns td{border-bottom:1px dotted var(--hair);padding:6px 8px 6px 0;vertical-align:top}
.stns .st{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.stns .rd{font-style:italic}
.feats{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.feats span{font-size:11px;font-variant:small-caps;letter-spacing:.05em;border:1px solid var(--ink);padding:2px 10px;background:var(--paper2)}
.obsno{margin-top:12px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}

/* the chart */
.chartwrap{overflow-x:auto}
.chartwrap svg{display:block;min-width:560px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.legend .k{display:flex;align-items:center;gap:7px}
.legend .sw-iso{width:22px;border-top:2px solid var(--iso)}
.legend .sw-front{width:22px;border-top:2px solid var(--front)}
.legend .sw-low{width:22px;border-top:2px dashed var(--dim)}

/* centres table */
.centres{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}
@media(max-width:680px){.centres{grid-template-columns:1fr}}
.centre{border:1.5px solid var(--iso);background:linear-gradient(#F7F4E8,#EFEADA);padding:14px 17px 12px;position:relative}
.centre.top{box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--front)}
.centre .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.centre .hd h3{font-size:clamp(16px,2.4vw,21px);font-weight:700;letter-spacing:.03em}
.centre .hd .mb{font-family:var(--mono);font-size:11px;color:var(--iso);white-space:nowrap}
.centre .ang{font-style:italic;font-size:12px;color:var(--front)}
.centre .wind{display:grid;grid-template-columns:88px 1fr 34px;gap:2px 10px;font-size:12px;padding:4px 0;border-bottom:1px dotted var(--hair);align-items:center}
.centre .wind b{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--iso)}
.centre .wind .brb{display:flex;gap:2.5px}
.centre .wind .brb i{width:12px;height:3px;background:var(--iso)}
.centre .wind .brb i.o{background:transparent;border:1px solid var(--iso)}
.centre .wind .v{font-family:var(--mono);font-size:9.5px;text-align:right}
.centre .wind .why{grid-column:2/4;font-size:10px;font-style:italic;color:var(--dim)}
.centre .fmt{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.centre .fmt span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;border:1px solid var(--hair);padding:2px 7px;background:rgba(255,255,255,.4)}
.centre .area{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1.5px solid var(--iso);margin-top:9px;padding-top:7px}
.centre .area b{font-size:19px}
.centre .area small{font-size:10.5px;font-style:italic;color:var(--dim);text-align:right;max-width:210px}
.centre .warn{font-size:11px;font-style:italic;color:var(--front);margin-top:7px}
.centre .warn b{font-variant:small-caps;font-style:normal;letter-spacing:.08em;font-size:9.5px}

/* dissipated */
.diss{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.diss{grid-template-columns:1fr}}
.dis{border:1px dashed var(--dim);padding:12px 15px;font-size:12.5px;background:rgba(107,117,102,.07)}
.dis h4{font-size:14.5px;font-weight:700;color:var(--dim)}
.dis .ch{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--front)}
.dis p{font-style:italic;color:var(--dim);font-size:12px;line-height:1.5;margin-top:3px}

/* forecast + photographs */
.fcst{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(16px,3vw,26px)}
@media(max-width:760px){.fcst{grid-template-columns:1fr}}
.fbox{border:2px solid var(--iso);background:var(--paper);padding:20px 22px;height:max-content;position:relative}
.fbox::before{content:"FORECAST";position:absolute;top:-9px;left:18px;background:var(--paper);padding:0 8px;font-size:9px;letter-spacing:.36em;color:var(--front)}
.fbox h3{font-size:clamp(19px,3vw,25px);font-weight:700;text-align:center;margin:4px 0 8px}
.fbox .lede{font-style:italic;font-size:13px;text-align:center;color:var(--dim);border-bottom:1px solid var(--hair);padding-bottom:11px;margin-bottom:11px}
.fbox dl{display:grid;grid-template-columns:92px 1fr;gap:6px 14px;font-size:12.5px}
.fbox dt{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--iso);padding-top:3px}
.fbox dd{border-bottom:1px dotted var(--hair);padding-bottom:6px}
.fbox .msg{font-weight:700;font-size:14px}
.fbox .valid{margin-top:12px;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim)}
.tiros{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:440px){.tiros{grid-template-columns:1fr}}
.tiro{border:1px solid var(--ink);background:var(--paper2);padding:8px;transition:transform .16s ease,box-shadow .16s ease}
.tiro:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(50,45,25,.25)}
.tiro .iw{border:1px solid var(--ink);overflow:hidden;position:relative}
.tiro img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:grayscale(.45) contrast(1.05) brightness(1.03)}
.tiro .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(34,48,62,.12) 0 1px,transparent 1px 3px);pointer-events:none}
.tiro figcaption{padding:7px 2px 1px}
.tiro .h{font-size:11.5px;font-weight:700;display:block;line-height:1.3}
.tiro .p{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--iso);display:block;margin-top:2px}

/* inks */
.inks{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:640px){.inks{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.inks{grid-template-columns:repeat(2,1fr)}}
.ink2{text-align:center}
.ink2 .sw{height:52px;border:1.5px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--hair);margin-bottom:6px}
.ink2 .n{font-size:11.5px;font-weight:700}
.ink2 .h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim)}

/* instrument log */
.ilog .mem{font-size:13.5px;font-style:italic;max-width:660px;margin-bottom:14px}
.ilog .mem b{font-style:normal}
.ilogrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,28px)}
@media(max-width:760px){.ilogrid{grid-template-columns:1fr}}
.tty{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
.tty th{font-family:var(--ost);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--iso);text-align:left;border-bottom:1.5px solid var(--ink);padding:4px 8px 4px 0}
.tty td{border-bottom:1px dotted var(--hair);padding:6px 8px 6px 0;vertical-align:top}
.tty .pm{display:block;font-size:8.5px;color:var(--dim);overflow-wrap:anywhere;max-width:230px}
.tty .md{font-family:var(--ost);border:1px solid var(--ink);padding:0 6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.baro .g{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--iso);margin:12px 0 4px}
.baro .g:first-child{margin-top:0}
.baro .row{display:grid;grid-template-columns:minmax(0,1fr) 70px 30px;gap:8px;align-items:center;font-size:12px;padding:3.5px 0;border-bottom:1px dotted var(--hair)}
.baro .bar{height:7px;border:1px solid var(--ink);background:var(--paper)}
.baro .bar i{display:block;height:100%;background:var(--iso)}
.baro .v{font-family:var(--mono);font-size:9.5px;text-align:right}

/* bulletins */
.bul{display:flex;flex-wrap:wrap;gap:10px}
.bul button{
  border:1.5px solid var(--iso);background:var(--paper);padding:9px 18px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:2.5px 2.5px 0 rgba(34,48,62,.25);transition:transform .15s ease,box-shadow .15s ease,background .15s,color .15s;
}
.bul button:hover{background:var(--iso);color:var(--paper);transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 rgba(178,58,46,.4)}
.bul button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(34,48,62,.25)}
.bulnote{margin-top:12px;font-size:11.5px;font-style:italic;color:var(--dim)}

.empty{padding:26px;text-align:center;font-style:italic;color:var(--dim)}
.foot{text-align:center;padding:14px;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim);border-top:1.5px solid var(--ink)}
</style>
</head>
<body>
<div class="office">
<div class="report">
<header class="thead">
  <div class="office-n">Marque Meteorological Office · Weather Division</div>
  <h1>DAILY <em>CAMPAIGN</em> REPORT</h1>
  <div class="issued" id="s-issued"></div>
  <div class="ask" id="s-ask"></div>
  <div class="url" id="s-url"></div>
</header>
<main id="app"></main>
<div class="foot" id="foot"></div>
</div>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return '—'}};
const mb=fit=>Math.round(985+(fit||0)*45);
const beauf=fit=>Math.min(12,Math.max(1,Math.round((fit||0)*10)));

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[3,5,10,14].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-issued').textContent='ISSUED '+dt(B.createdAt||B.fetchedAt)+' · STATION MARQUE · CHART '+String(B.id||'—').slice(0,8).toUpperCase();
document.getElementById('s-ask').innerHTML='<span class="req">Forecast requested for the district of <b>“'+esc((B.sub&&B.sub.prompt)||B.title||'')+'”</b></span>';
document.getElementById('s-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'reporting station: <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';
document.getElementById('foot').textContent=(B.urlContext&&B.urlContext.title?'STATION PROVISION: '+B.urlContext.title.toUpperCase()+' — ':'')+'QLOO OBSERVATORY · ALL TIMES GMT';

const M=document.getElementById('app');
const sec=(no,title,note,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="sec"><div class="sech"><span class="no">'+esc(no)+'</span><h2>'+esc(title)+'</h2><span class="note">'+esc(note)+'</span></div>'+body+'</section>'));
};

/* §1 — general situation */
if(AR&&AR.lean){
  sec('01','General Situation','upper-air analysis, 0600 GMT',
  '<div class="gensit"><div class="prose"><span class="lead">'+esc(AR.lean.label||'—')+'</span><span class="conf">CONFIDENCE '+f2(AR.lean.confidence)+'</span>'+
  '<p style="margin-top:10px;font-style:italic;color:var(--dim)">A ridge of high affinity is expected to persist over the district; the following soundings were returned by the balloon ascent.</p>'+
  '<ul class="siglist">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'+
  '<div class="feats">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'+
  '<div class="obsno">ASCENT NO. '+String(B.id||'—').slice(0,8).toUpperCase()+' · RELEASED '+dt(B.createdAt||B.fetchedAt)+'</div></div>'+
  '<div><table class="stns"><thead><tr><th>Reporting station</th><th>Observation</th></tr></thead><tbody>'+
  (AR.mediaHabits||[]).map(h=>'<tr><td class="st">'+esc(h.channel)+'</td><td class="rd">'+esc(h.note)+'</td></tr>').join('')+
  '</tbody></table></div></div>');
}

/* §2 — the synoptic chart */
function chart(){
  const C=[[205,150],[625,140],[215,385],[615,380]];
  let s='<svg viewBox="0 0 840 520" xmlns="http://www.w3.org/2000/svg">';
  /* grid */
  for(let x=40;x<840;x+=80)s+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="520" stroke="rgba(31,78,121,.12)"/>';
  for(let y=40;y<520;y+=60)s+='<line x1="0" y1="'+y+'" x2="840" y2="'+y+'" stroke="rgba(31,78,121,.12)"/>';
  s+='<rect x="6" y="6" width="828" height="508" fill="none" stroke="#22303E" stroke-width="1.5"/><rect x="14" y="14" width="812" height="492" fill="none" stroke="#22303E" stroke-width=".6"/>';
  /* fronts between centres */
  const front=(x1,y1,x2,y2,cold)=>{
    const mx=(x1+x2)/2,my=(y1+y2)/2-46;
    let d='M'+x1+' '+y1+' Q '+mx+' '+my+' '+x2+' '+y2;
    let marks='';
    for(let t=0;t<=1.001;t+=0.18){
      const px=(1-t)*(1-t)*x1+2*(1-t)*t*mx+t*t*x2;
      const py=(1-t)*(1-t)*y1+2*(1-t)*t*my+t*t*y2;
      const tx=2*(1-t)*(mx-x1)+2*t*(x2-mx), ty=2*(1-t)*(my-y1)+2*t*(y2-my);
      const ang=Math.atan2(ty,tx)*180/Math.PI;
      if(cold)marks+='<path d="M0 0 L-9 -14 L9 -14 Z" fill="#B23A2E" transform="translate('+px.toFixed(1)+' '+py.toFixed(1)+') rotate('+(ang+90).toFixed(1)+')"/>';
      else marks+='<circle cx="0" cy="-9" r="8" fill="#B23A2E" transform="translate('+px.toFixed(1)+' '+py.toFixed(1)+')"/>';
    }
    return '<path d="'+d+'" fill="none" stroke="#B23A2E" stroke-width="2"/>'+marks;
  };
  s+=front(C[0][0]+40,C[0][1]+30,C[2][0]+40,C[2][1]-40,true);
  s+=front(C[1][0]-40,C[1][1]+30,C[3][0]-30,C[3][1]-40,false);
  /* dissipated low (anti) */
  s+='<g opacity=".5"><ellipse cx="450" cy="280" rx="46" ry="34" fill="none" stroke="#6B7566" stroke-width="1.4" stroke-dasharray="5 5"/>'+
     '<ellipse cx="450" cy="280" rx="70" ry="52" fill="none" stroke="#6B7566" stroke-width="1" stroke-dasharray="4 6"/>'+
     '<text x="450" y="284" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" letter-spacing="2" fill="#6B7566">LOW</text>'+
     '<text x="450" y="298" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#6B7566">'+(anti.length?anti.length+' features filling':'filling')+'</text></g>';
  /* isobar clusters */
  strats.forEach((st,i)=>{
    const cx=C[i][0],cy=C[i][1],fit=(st.audienceFit&&st.audienceFit.score)||0.9,p=mb(fit);
    for(let r=0;r<4;r++){
      s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(34+r*24)+'" ry="'+(25+r*18)+'" fill="none" stroke="#1F4E79" stroke-width="'+(r===0?2:1)+'" opacity="'+(1-r*.18)+'"/>';
    }
    /* wind barbs around cluster */
    const nb=Math.min(5,Math.max(2,Math.round(fit*5)));
    for(let b=0;b<nb;b++){
      const bx=cx+58+0,by=cy-40+b*13;
      s+='<line x1="'+bx+'" y1="'+by+'" x2="'+(bx+22)+'" y2="'+(by-9)+'" stroke="#22303E" stroke-width="1.4"/><line x1="'+(bx+22)+'" y1="'+(by-9)+'" x2="'+(bx+30)+'" y2="'+(by-6)+'" stroke="#22303E" stroke-width="1.4"/>';
    }
    s+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="bold" font-size="15" letter-spacing="1" fill="'+(i===sel?'#B23A2E':'#1F4E79')+'">HIGH</text>'+
       '<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#22303E">'+p+'</text>'+
       '<text x="'+cx+'" y="'+(cy+30)+'" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="10.5" fill="#22303E">'+esc(st.title)+'</text>';
  });
  s+='<text x="36" y="42" font-family="ui-monospace,monospace" font-size="9" letter-spacing="2" fill="#6B7566">FIG. 1 — SURFACE ANALYSIS · MARQUE DISTRICT</text>';
  s+='<text x="804" y="500" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.5" fill="#6B7566">ISOBARS AT 4 MB · SOURCE: QLOO OBSERVATORY</text>';
  return s+'</svg>';
}
if(strats.length){
  sec('02','The Synoptic Chart','isobaric centres & fronts',
  '<div class="chartwrap">'+chart()+'</div>'+
  '<div class="legend"><span class="k"><span class="sw-iso"></span>ISOBAR (4 MB)</span><span class="k"><span class="sw-front"></span>ACTIVE FRONT</span><span class="k"><span class="sw-low"></span>DISSIPATING LOW</span><span class="k">▬ wind barbs = audience fit</span></div>'+
  '<div class="centres">'+strats.map((st,i)=>{
    const fit=(st.audienceFit&&st.audienceFit.score)||0;
    return '<div class="centre'+(i===sel?' top':'')+'"><div class="hd"><h3>'+esc(st.title)+'</h3><span class="mb">'+mb(fit)+' MB'+(i===sel?' · TRACKING':'')+'</span></div>'+
    '<div class="ang">feature of type: '+esc(st.angle||'—')+'</div>'+
    (st.channels||[]).map(c=>'<div class="wind"><b>'+esc(c.name)+'</b><span class="brb">'+Array.from({length:5},(_,d)=>'<i'+(d<Math.round((c.fit||0)*5)?'':' class="o"')+'></i>').join('')+'</span><span class="v">'+f2(c.fit)+'</span><span class="why">veering per '+esc(c.why||'—')+'</span></div>').join('')+
    '<div class="wind"><b>force</b><span class="brb">'+Array.from({length:5},(_,d)=>'<i'+(d<Math.round(fit*5)?'':' class="o"')+'></i>').join('')+'</span><span class="v">'+beauf(fit)+' BFT</span><span class="why">audience fit '+f2(fit)+' — '+(st.audienceFit&&st.audienceFit.notes||[]).map(esc).join('; ')+'</span></div>'+
    '<div class="fmt">'+(st.formats||[]).map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
    '<div class="area"><span>Area affected: <b>'+views(st.reach&&st.reach.estViews)+'</b></span><small>'+esc(st.reach&&st.reach.basis||'')+'</small></div>'+
    ((st.watchouts&&st.watchouts[0])?'<div class="warn"><b>Warning to shipping.</b> '+esc(st.watchouts[0])+'</div>':'')+
    '</div>'}).join('')+'</div>');
}

/* §3 — dissipated features */
if(anti.length){
  sec('03','Features No Longer Expected','filling fast; warnings cancelled',
  '<div class="diss">'+anti.map(a=>'<div class="dis"><h4>'+esc(a.title)+'</h4><div class="ch">'+esc(a.channel)+' — dissipated</div><p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>');
}

/* §4 — forecast + photographs */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('04','Forecast & Satellite Photographs','valid for 24 hours from issue',
  '<div class="fcst"><div class="fbox">'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>District</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Outlook</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Named feature</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<div class="lede">no forecast issued</div>')+
  '<div class="valid">VALID '+dt(B.createdAt||B.fetchedAt)+' + 24H · NEXT ISSUE 0600 GMT</div></div>'+
  '<div class="tiros">'+CREAT.map((m,i)=>
    '<figure class="tiro"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" loading="lazy" onerror="this.closest(\'figure\').style.display=\'none\'"><div class="scan"></div></div>'+
    '<figcaption><span class="h">TIROS '+(i+1)+' — '+esc(m.head)+'</span><span class="p">transmission · '+esc(m.provider)+'</span></figcaption></figure>').join('')+'</div></div>');
}

/* §5 — chart inks */
sec('05','Chart Inks','as stocked in the drawing office',
  '<div class="inks">'+PALETTE.map((s,i)=>
    '<div class="ink2"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">INK '+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* §6 — instrument log */
if(B.evidence||affs.length){
  sec('06','Instrument Log','Qloo Observatory, teleprinter return',
  '<div class="ilog"><p class="mem"><b>REMARKS.</b> All readings herein derive from the <b>Qloo Observatory</b>, operating in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'—').toUpperCase()+' mode</b>; <b>'+calls.length+' ascents</b> were made. Instruments calibrated before use.</p>'+
  '<div class="ilogrid"><div><table class="tty"><thead><tr><th>Instrument</th><th>N</th><th>Ms</th><th>Mode</th></tr></thead><tbody>'+
  calls.map(c=>'<tr><td>'+esc(c.endpoint)+'<span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,20)).join(' '))+'</span></td>'+
    '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
  '</tbody></table></div>'+
  '<div class="baro">'+affs.map(g=>'<div class="g">Barometric affinities · '+esc(g.type.replace('urn:entity:',''))+'</div>'+
    g.entities.slice(0,4).map(e=>'<div class="row"><span>'+esc(e.name)+'</span><span class="bar"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
  '</div></div></div>');
}

/* §7 — bulletins */
sec('07','Further Bulletins','issued on application to the Office',
  '<div class="bul">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+'</div>'+
  '<div class="bulnote">Mariners and market-makers alike are advised to await the next issue before putting to sea.</div>');

if(!M.children.length)M.appendChild(el('<div class="empty sec">The wire is silent — data.js never reached the Office. No report issued.</div>'));
})();
</script>
</body>
</html>
