<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Marque Recipe Box — Campaign Recipes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23A85B42'/%3E%3Crect x='10' y='14' width='44' height='38' rx='3' fill='%23FFFBF0'/%3E%3Cpath d='M10 22h44M18 30h28M18 36h28M18 42h18' stroke='%23B33A2B' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --tin:#8F4F38;
  --tin-d:#7A4128;
  --card:#FFFBF0;
  --manila:#EEDFB9;
  --ink:#3A3226;
  --mut:#8A7B62;
  --red:#B33A2B;
  --rule:#B9CFE3;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--tin);
  background-image:
    radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.08),transparent 55%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 40px);
  color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(179,58,43,.2)}
a{color:var(--red);text-decoration:none;border-bottom:1.5px solid var(--red)}
a:hover{color:var(--ink);border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.box{
  max-width:980px;margin:26px auto 64px;
  padding:clamp(14px,3vw,34px);
  background:linear-gradient(180deg,#96553B,#8F4F38);
  border:2px solid var(--tin-d);
  box-shadow:inset 0 0 0 8px rgba(255,255,255,.06),inset 0 14px 34px rgba(0,0,0,.28),0 24px 60px rgba(40,18,8,.5);
}
/* label plate on the box front */
.plate{
  background:linear-gradient(180deg,#F6E9C9,#EEDFB9);
  border:2px solid #6E3A24;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px #C9B285,0 4px 10px rgba(0,0,0,.3);
  padding:clamp(14px,2.6vw,24px);text-align:center;position:relative;
}
.plate .brand{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--mut)}
.plate h1{font-size:clamp(26px,4.6vw,40px);font-weight:700;letter-spacing:.02em;margin:8px 0 2px}
.plate .filed{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.plate .ask{margin:14px auto 0;max-width:640px;font-size:clamp(15px,2.2vw,18.5px)}
.plate .ask b{color:var(--red)}
.plate .url{font-family:var(--mono);font-size:10.5px;margin-top:7px;overflow-wrap:anywhere}
.plate .src{font-style:italic;font-size:12.5px;color:var(--mut);margin-top:5px}

/* tabbed dividers + cards */
.tabsec{margin-top:clamp(18px,3vw,30px)}
.tab{
  display:inline-block;background:var(--manila);border:2px solid var(--tin-d);border-bottom:none;
  padding:6px 22px 4px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  border-radius:8px 8px 0 0;margin-left:clamp(8px,4vw,40px);position:relative;top:2px;color:#5E4A2E;
}
.tab.alt{margin-left:clamp(60px,18vw,190px)}
.rc{
  background:var(--card);border:2px solid #8A7454;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--rule) 27px 28px);
  box-shadow:0 8px 22px rgba(40,18,8,.3);
  padding:clamp(16px,3vw,28px) clamp(16px,3.4vw,34px) clamp(18px,3vw,26px);
  position:relative;
}
.rc::before{content:"";position:absolute;top:0;bottom:0;left:clamp(34px,5vw,46px);width:1.5px;background:rgba(179,58,43,.35)}
.rc>*{position:relative}
.rc-h{display:flex;align-items:baseline;gap:14px;border-bottom:2.5px double var(--ink);padding-bottom:8px;margin-bottom:14px;flex-wrap:wrap}
.rc-h .no{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red);letter-spacing:.16em}
.rc-h h2{font-size:clamp(19px,3vw,27px);font-weight:700}
.rc-h .note{margin-left:auto;font-style:italic;font-size:12px;color:var(--mut)}
.rc-h .margin-note{margin-left:clamp(38px,5vw,46px)}

/* ingredients / audience */
.serves{font-size:clamp(16px,2.4vw,20px);font-weight:600}
.serves .kw{background:var(--red);color:var(--card);padding:1px 9px;font-style:italic}
.ing{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(16px,3vw,30px);margin-top:12px}
@media(max-width:720px){.ing{grid-template-columns:1fr}}
.ing h4,.shop h4{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.ing ul{list-style:none}
.ing li{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:4px 0;font-size:14px;align-items:start}
.ing li i{width:13px;height:13px;border:1.8px solid var(--ink);display:inline-block;margin-top:4px;position:relative}
.ing li i::after{content:"";position:absolute;inset:1px;background:var(--red);transform:scale(0);transition:transform .12s ease}
.ing li:hover i::after{transform:scale(.8)}
.shop table{width:100%;border-collapse:collapse;font-size:13.5px}
.shop td{padding:6px 0;border-bottom:1px dashed var(--rule);vertical-align:top}
.shop td:first-child{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;width:90px;color:var(--red);padding-top:8px}
.shop tr:last-child td{border-bottom:none}
.season{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.season span{font-style:italic;font-size:13px;border:1.5px dashed var(--red);color:var(--red);padding:2px 11px;border-radius:999px;background:#FFF6E8}

/* method steps */
.steps{counter-reset:step}
.step{display:grid;grid-template-columns:74px 1fr;gap:14px;padding:16px 0;border-bottom:1.5px dashed var(--rule)}
.step:last-child{border-bottom:none;padding-bottom:4px}
@media(max-width:560px){.step{grid-template-columns:56px 1fr}}
.step .num{
  width:60px;height:60px;border-radius:50%;border:2px solid var(--ink);background:var(--manila);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:9px;letter-spacing:.08em;color:var(--mut);
}
.step .num b{font-size:20px;color:var(--ink);letter-spacing:0}
@media(max-width:560px){.step .num{width:50px;height:50px}.step .num b{font-size:16px}}
.step h3{font-size:clamp(17px,2.4vw,21px);font-weight:700}
.step h3 .ang{font-weight:400;font-style:italic;color:var(--mut);font-size:.82em}
.step .fold{margin:6px 0;font-size:14px}
.step .fold b{border-bottom:1.5px solid var(--red)}
.step .fold .f{font-family:var(--mono);font-size:11px;color:var(--red);font-weight:700}
.step .yield{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:4px}
.step .yield b{font-weight:700}
.step .yield .yv{font-family:var(--mono);font-size:11px;color:var(--mut)}
.step .heat{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.step .heat .tg{width:110px;height:9px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.step .heat .tg i{display:block;height:100%;background:var(--red)}
.step .care{margin-top:7px;font-size:12.5px;font-style:italic;color:#7A4128}
.step .care::before{content:"mind: ";font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.2em;color:var(--red);text-transform:uppercase}
.step .hero{font-size:11.5px;font-family:var(--mono);letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin-top:4px}
.step .fmt{margin-top:6px}
.step .fmt span{font-size:11px;font-style:italic;border:1px solid var(--mut);color:var(--mut);padding:1px 8px;border-radius:999px;margin-right:5px;display:inline-block;margin-bottom:4px}
.step.star{background:linear-gradient(90deg,rgba(179,58,43,.05),transparent 60%);}

/* do not substitute */
.nosubs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,20px)}
@media(max-width:660px){.nosubs{grid-template-columns:1fr}}
.nosub{border:1.8px solid var(--ink);padding:12px 16px;background:repeating-linear-gradient(-45deg,rgba(179,58,43,.05) 0 12px,transparent 12px 24px)}
.nosub .stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.22em;padding:3px 9px;text-transform:uppercase;transform:rotate(-1.5deg);margin-bottom:8px}
.nosub h4{font-size:15.5px;font-weight:700}
.nosub h4 s{text-decoration-color:var(--red)}
.nosub .ch{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.nosub p{font-size:12.5px;color:#5E5140;font-style:italic;margin-top:5px}

/* house recipe + plating */
.house{display:grid;grid-template-columns:1fr;gap:18px}
.housecard{border:2.5px solid var(--ink);background:linear-gradient(180deg,#FFFDF6,var(--card));padding:16px 20px;position:relative}
.housecard::after{content:"FROM OUR KITCHEN";position:absolute;top:-11px;right:16px;background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.2em;padding:3px 10px}
.housecard h3{font-size:clamp(20px,3vw,27px);font-weight:700}
.housecard .lede{font-style:italic;margin:6px 0 12px;font-size:14.5px}
.housecard dl{display:grid;grid-template-columns:110px 1fr;gap:5px 14px;font-size:13.5px}
.housecard dt{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);padding-top:4px}
.housecard dd{border-bottom:1px dashed var(--rule);padding-bottom:6px}
.housecard .km{font-weight:700;font-size:15px}
.plates{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.plates{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.plates{grid-template-columns:1fr}}
.plated{background:#fff;border:1.8px solid #CBBFA4;padding:8px 8px 0;box-shadow:0 6px 14px rgba(40,18,8,.22);transform:rotate(-.6deg);transition:transform .16s ease}
.plated:nth-child(2n){transform:rotate(.7deg)}
.plated:hover{transform:rotate(0) scale(1.03)}
.plated .tape{width:74px;height:20px;background:rgba(238,223,185,.9);border:1px solid rgba(138,116,84,.5);margin:-18px auto 4px;position:relative;transform:rotate(-2deg)}
.plated .iw{aspect-ratio:1/1;overflow:hidden;border:1px solid var(--rule)}
.plated .iw img{width:100%;height:100%;object-fit:cover}
.plated figcaption{padding:8px 2px}
.plated .h{font-size:12px;font-weight:600;line-height:1.4}
.plated .p{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--red);text-transform:uppercase}

/* pantry */
.pantry{display:flex;flex-wrap:wrap;gap:clamp(14px,2.4vw,24px)}
.jar{width:118px;flex:0 1 auto;text-align:center}
.jar .glass{
  height:74px;border:2px solid var(--ink);border-radius:6px 6px 10px 10px;position:relative;background:#fff;
  overflow:hidden;
}
.jar .glass i{position:absolute;left:0;right:0;bottom:0;display:block}
.jar .lid{height:12px;width:78%;margin:0 auto -4px;border:2px solid var(--ink);border-bottom:none;border-radius:5px 5px 0 0;background:var(--manila);position:relative;z-index:2}
.jar .n{font-size:12px;font-weight:600;margin-top:7px}
.jar .h{font-family:var(--mono);font-size:9px;color:var(--mut);letter-spacing:.1em}

/* test kitchen */
.tk{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(16px,3vw,28px)}
@media(max-width:780px){.tk{grid-template-columns:1fr}}
.tk .mem{font-style:italic;font-size:14px;margin-bottom:12px}
.tk .mem b{color:var(--red)}
.log{font-family:var(--mono);font-size:11px}
.log .lr{display:grid;grid-template-columns:104px 1fr;gap:4px 10px;padding:6px 0;border-bottom:1px dashed var(--rule)}
.log .lr b{color:var(--red);font-weight:700}
.log .lr .pm{grid-column:2;color:var(--mut);font-size:10px;overflow-wrap:anywhere}
.log .lr .me{grid-column:2;display:flex;gap:14px;color:var(--mut);font-size:10px}
.pair{border:1.8px solid var(--ink);background:#FFFDF6;padding:12px 14px}
.pair h4{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
.pair .rw{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dotted var(--rule)}
.pair .rw:last-child{border-bottom:none}
.pair .rw .v{font-family:var(--mono);font-size:11px;color:var(--mut)}
.pair .g{margin-top:10px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}

/* swap */
.swap{display:flex;flex-wrap:wrap;gap:10px}
.swap button{
  border:2px solid var(--ink);background:var(--card);padding:10px 20px;border-radius:999px;
  font-family:var(--serif);font-style:italic;font-size:14px;font-weight:600;
  transition:background .12s ease,color .12s ease,transform .12s ease;
}
.swap button:hover{background:var(--red);border-color:var(--red);color:var(--card)}
.swap button:active{transform:translateY(2px)}
.swap .sub{width:100%;font-size:12px;font-style:italic;color:var(--mut);margin-top:4px}
.swap .other{margin-top:14px;font-size:12.5px;color:var(--mut)}
.swap .other b{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:4px}
.swap .other span{display:inline-block;margin-right:12px;font-style:italic;border-bottom:1px dashed var(--mut)}
.colophon{margin-top:clamp(18px,3vw,28px);text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:rgba(255,251,240,.75);text-transform:uppercase}
.empty{padding:40px;text-align:center;color:var(--mut);font-style:italic;background:var(--card)}
</style>
</head>
<body>
<div class="box">
  <div class="plate">
    <div class="brand">The Marque Recipe Box</div>
    <h1>Recipes for Campaigns</h1>
    <div class="filed" id="s-filed"></div>
    <div class="ask" id="s-ask"></div>
    <div class="url" id="s-url"></div>
    <div class="src" id="s-src"></div>
  </div>
  <main id="app"></main>
  <div class="colophon" id="foot"></div>
</div>
<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Crème Fraîche',h:'#F3E6CE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[2,4,10,14].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];
const DATE=dt(B.createdAt||B.fetchedAt);

document.getElementById('s-filed').textContent='FILED UNDER · CAMPAIGNS · '+DATE+' · CARD '+String(B.id||'—').slice(0,8).toUpperCase();
document.getElementById('s-ask').innerHTML='Tonight’s menu, by request: <b>“'+esc((B.sub&&B.sub.prompt)||B.title||'')+'.”</b>';
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
document.getElementById('s-url').innerHTML=U?'source clipped from: <a href="'+esc(U)+'">'+esc(U)+'</a>':'';
document.getElementById('s-src').textContent=(B.urlContext&&B.urlContext.title)?('On the jar: '+B.urlContext.title+' — '+(B.urlContext.description||'').slice(0,88)+'…'):'';
document.getElementById('foot').textContent='FROM THE KITCHEN OF MARQUE · RECIPE NO. '+String(B.id||'—').slice(0,8).toUpperCase()+' · WRITE LEGIBLY, COOK GENEROUSLY';

const M=document.getElementById('app');
let tabn=0;
const tabsec=(label,title,note,body,alt)=>{
  if(!body)return;
  tabn++;
  M.appendChild(el('<section class="tabsec"><div class="tab'+(alt?' alt':'')+'">'+esc(label)+'</div><div class="rc"><div class="rc-h"><span class="no">CARD '+String(tabn).padStart(2,'0')+'</span><h2 class="margin-note" style="margin-left:0">'+esc(title)+'</h2><span class="note">'+esc(note)+'</span></div>'+body+'</div></section>'));
};

/* mis en place — the audience */
if(AR&&AR.lean){
  tabsec('Mis en place','Know Your Diners','gathered before any heat is applied',
  '<div class="serves">This recipe serves the <span class="kw">'+esc(AR.lean.label)+'</span> table — we are '+Math.round((AR.lean.confidence||0)*100)+'% sure they will come hungry.</div>'+
  '<div class="ing"><div><h4>Shopping list — what to stock</h4><ul>'+
  (AR.lean.signals||[]).map(s=>'<li><i></i><span>'+esc(s)+'</span></li>').join('')+'</ul>'+
  '<div class="season">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div>'+
  '<div class="shop"><h4>Where they shop</h4><table>'+
  (AR.mediaHabits||[]).map(h=>'<tr><td>'+esc(h.channel)+'</td><td>'+esc(h.note)+'</td></tr>').join('')+
  '</table></div></div>',false);
}

/* method — the strategies */
if(strats.length){
  tabsec('Method','The Method, In Four Steps','tested in the Marque kitchen', 
  '<div class="steps">'+strats.map((s,i)=>{
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    return '<div class="step'+(i===sel?' star':'')+'"><div class="num">STEP<b>'+(i+1)+'</b></div><div>'+
    '<h3>'+esc(s.title)+' <span class="ang">— '+esc(s.angle||'')+(i===sel?' · the house favorite':'')+'</span></h3>'+
    '<div class="fold">'+(s.channels||[]).map(c=>'fold in <b>'+esc(c.name)+'</b> <span class="f">'+f2(c.fit)+'</span> until '+esc(c.why||'smooth')).join('; then ')+'.</div>'+
    '<div class="yield"><span class="heat">doneness <span class="tg"><i style="width:'+Math.round(fit*100)+'%"></i></span> '+f2(fit)+'</span>'+
    '<span><b>yields '+views(s.reach&&s.reach.estViews)+' servings</b> <span class="yv">'+esc(s.reach&&s.reach.basis||'')+'</span></span></div>'+
    '<div class="hero">signature ingredient · '+esc(s.heroSignal||'—')+'</div>'+
    '<div class="fmt">'+(s.formats||[]).map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="care">'+esc(s.watchouts[0])+'</div>':'')+
    '</div></div>';
  }).join('')+'</div>',true);
}

/* never substitute */
if(anti.length){
  tabsec('Substitutions','Never Substitute','these swaps fall flat — tested, regretted',
  '<div class="nosubs">'+anti.map(a=>
    '<div class="nosub"><span class="stamp">Do not substitute</span><h4><s>'+esc(a.title)+'</s></h4><div class="ch">aisle: '+esc(a.channel)+'</div><p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>',false);
}

/* house recipe + plating */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  tabsec('The dish','The House Recipe','plate it warm, serve it dewy',
  '<div class="house"><div class="housecard">'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Cooked for</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Chef’s note</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Signature</dt><dd>'+esc(selS.heroSignal||'—')+' — from Step '+( (sel<0?0:sel)+1 )+', '+esc(selS.title)+'</dd></dl>':'<div class="lede">The kitchen has no house recipe on file.</div>')+
  '</div>'+
  '<div class="plates">'+CREAT.map((m,i)=>
    '<figure class="plated"><div class="tape"></div><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
    '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">plated in the '+esc(m.provider)+' kitchen</div></figcaption></figure>').join('')+'</div></div>',true);
}

/* pantry */
tabsec('Pantry','The Pantry Shelf','five jars, always within reach',
  '<div class="pantry">'+PALETTE.map(s=>
    '<div class="jar"><div class="lid"></div><div class="glass"><i style="background:'+s.h+';height:62%"></i></div><div class="n">'+esc(s.n)+'</div><div class="h">'+s.h.toUpperCase()+'</div></div>').join('')+'</div>',false);

/* test kitchen — qloo */
if(B.evidence||affs.length){
  tabsec('Test kitchen','Test Kitchen Notes','every batch tasted against the Qloo pantry — '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' mode',
  '<div class="tk"><div><p class="mem"><b>Tasting record.</b> Before any card was filed, the kitchen ran <b>'+calls.length+' tastings</b> against Qloo’s affinity pantry, in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' mode</b>. Each tasting is logged below.</p>'+
  '<div class="log">'+calls.map(c=>
    '<div class="lr"><b>'+esc(c.endpoint)+'</b><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,30)).join(' · '))+'</span><span class="me"><span>'+esc((c.at||'').slice(11,19))+'Z</span><span>'+esc(c.tookMs)+' ms on the stove</span><span>n = '+esc(c.n)+'</span><span>'+esc(c.mode)+'</span></span></div>').join('')+'</div></div>'+
  '<div class="pair"><h4>Pairs well with</h4>'+affs.map(g=>'<div class="g">'+esc(g.type.replace('urn:entity:',''))+'</div>'+
    g.entities.slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+'</div></div>',true);
}

/* recipe swap */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
tabsec('Swap','Recipe Swap','trade this card forward',
  '<div class="swap">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">Hand a card to a friend — every swap returns a new deliverable.</div></div>'+
  (others.length?'<div class="other"><b>Also in the box</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''),false);

if(!M.children.length)M.appendChild(el('<div class="empty">The box is empty — data.js never made it to the kitchen. Check your pantry.</div>'));
})();
</script>
</body>
</html>
