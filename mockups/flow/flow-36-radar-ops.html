<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARQUE AIR CONTROL — Sector RH-07 · Rhode peptide lip tint → Gen Z</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23040907'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%2343F07B' stroke-width='2'/%3E%3Ccircle cx='40' cy='24' r='4' fill='%2343F07B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040907;
  --panel:#07120C;
  --grn:#43F07B;
  --grn2:#2BC15B;
  --grn-dim:#1C5C34;
  --grn-faint:rgba(67,240,123,.14);
  --ink:#C9FBD9;
  --dim:#5F9E75;
  --amb:#FFB02E;
  --mono:'Share Tech Mono',ui-monospace,'Cascadia Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-shadow:0 0 6px rgba(67,240,123,.25);
}
::selection{background:var(--grn);color:var(--bg)}
a{color:var(--grn);text-decoration:none;border-bottom:1px dashed var(--grn-dim)}
a:hover{color:#fff;text-shadow:0 0 8px var(--grn)}
a:focus-visible,button:focus-visible{outline:1px solid var(--amb);outline-offset:2px}
button{font-family:var(--mono);cursor:pointer}
img{display:block}

/* CRT overlay */
.crt{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 140px rgba(0,0,0,.75);
}

.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* ============ STATUS BAR ============ */
.status{
  border-bottom:1px solid var(--grn-dim);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:10px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
}
.status .call{color:var(--grn);font-weight:400;letter-spacing:.2em}
.status .sub{color:var(--dim)}
.leds{display:flex;gap:14px;margin-left:auto}
.led{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;color:var(--dim)}
.led i{width:8px;height:8px;border-radius:50%;display:block;box-shadow:0 0 8px currentColor}
.led.g i{background:var(--grn);color:var(--grn)}
.led.g.blk i{animation:blink 1.1s steps(2) infinite}
.led.a i{background:var(--amb);color:var(--amb);animation:blink 2.6s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

/* ============ OPS GRID ============ */
.ops{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:16px;margin-top:16px}

/* scope */
.scope-panel{border:1px solid var(--grn-dim);background:var(--panel);padding:12px}
.scope-head{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.scope-head b{color:var(--grn)}
.scope{
  position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  border:1px solid var(--grn-dim);
  background:
    radial-gradient(circle,transparent 0 24%,var(--grn-faint) 24% calc(24% + 1px),transparent calc(24% + 1px) 49%,var(--grn-faint) 49% calc(49% + 1px),transparent calc(49% + 1px) 74%,var(--grn-faint) 74% calc(74% + 1px),transparent calc(74% + 1px)),
    radial-gradient(circle,rgba(67,240,123,.06),transparent 70%),
    #030805;
}
.scope::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--grn-faint)}
.scope::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid var(--grn-faint)}
.deg{position:absolute;font-size:8px;color:var(--dim);letter-spacing:.1em}
.sweep{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(67,240,123,.55) 0deg,rgba(67,240,123,.12) 40deg,transparent 60deg);
  animation:sweep 4.8s linear infinite;
  mix-blend-mode:screen;
}
@keyframes sweep{to{transform:rotate(360deg)}}
.sweep::before{content:"";position:absolute;left:50%;top:0;bottom:50%;width:1px;background:var(--grn)}
.blip{
  position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;
  background:var(--grn);border-radius:50%;
  box-shadow:0 0 10px var(--grn),0 0 22px rgba(67,240,123,.5);
  animation:ping 4.8s linear infinite;
}
.blip.dmd{background:transparent;border:2px solid var(--grn);border-radius:0;transform:rotate(45deg);width:12px;height:12px;margin:-6px 0 0 -6px;box-shadow:0 0 12px var(--grn)}
.blip .tag{
  position:absolute;left:14px;top:-4px;white-space:nowrap;font-size:8.5px;letter-spacing:.14em;
  color:var(--grn);background:rgba(3,8,5,.85);padding:1px 5px;border:1px solid var(--grn-dim);
}
.blip .tag em{font-style:normal;color:var(--amb)}
@keyframes ping{
  0%{opacity:1}
  30%{opacity:.9}
  70%{opacity:.18}
  100%{opacity:.14}
}
.rng-lbl{position:absolute;left:50%;font-size:7.5px;color:var(--dim);transform:translateX(-50%);letter-spacing:.1em}
.scope-foot{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;color:var(--dim);margin-top:10px;text-transform:uppercase}
.scope-foot b{color:var(--grn)}

/* contact stack */
.contacts{display:flex;flex-direction:column;gap:10px}
.cth{font-size:9.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--grn-dim);padding-bottom:6px}
.cth b{color:var(--grn)}
.contact{
  border:1px solid var(--grn-dim);background:var(--panel);padding:10px 12px;position:relative;
  transition:border-color .15s,background .15s;
}
.contact:hover{border-color:var(--grn);background:#0A1A10}
.contact.pri{border-color:var(--grn);box-shadow:inset 0 0 18px rgba(67,240,123,.1)}
.contact.pri::before{content:"PRIORITY TRACK";position:absolute;top:-7px;right:10px;background:var(--grn);color:var(--bg);font-size:8px;letter-spacing:.18em;padding:1px 7px}
.contact .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.contact .cid{color:var(--grn);font-size:10px;letter-spacing:.16em}
.contact h3{font-size:14px;letter-spacing:.06em;color:#fff;font-weight:400}
.contact .ang{font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.contact .coords{font-size:9px;color:var(--dim);letter-spacing:.1em;margin-left:auto;white-space:nowrap}
.sigbars{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:9px;letter-spacing:.14em;color:var(--dim)}
.seg{display:flex;gap:2px}
.seg i{width:8px;height:9px;background:var(--grn-dim);display:block}
.seg i.on{background:var(--grn);box-shadow:0 0 5px rgba(67,240,123,.6)}
.chrow{display:flex;flex-wrap:wrap;gap:10px;font-size:9.5px;color:var(--dim)}
.chrow b{color:var(--ink);font-weight:400}
.chrow .cb{display:inline-block;width:34px;height:4px;background:var(--grn-dim);vertical-align:middle;margin:0 5px;position:relative}
.chrow .cb i{position:absolute;inset:0 auto 0 0;background:var(--grn)}
.cmeta{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px;font-size:8.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.cmeta b{color:var(--grn)}
.cwarn{font-size:8.5px;color:var(--amb);margin-top:6px;letter-spacing:.04em}
.cwarn::before{content:"▲ CAUTION "}

/* ============ PANELS ============ */
.panel{margin-top:16px;border:1px solid var(--grn-dim);background:var(--panel)}
.phead{
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--grn-dim);padding:8px 12px;
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
}
.phead::before{content:"";width:8px;height:8px;background:var(--grn);box-shadow:0 0 8px var(--grn)}
.phead b{color:var(--grn)}
.phead .r{margin-left:auto;font-size:8.5px;letter-spacing:.16em}
.pbody{padding:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.grid2 .cell{padding:12px 16px;border-right:1px dashed var(--grn-dim)}
.grid2 .cell:last-child{border-right:none}
.mini{font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.mini::before{content:"» ";color:var(--grn)}

/* tasking */
.task{font-size:clamp(14px,2.2vw,20px);color:#fff;line-height:1.5}
.task::before{content:">> ";color:var(--grn)}
.task .arr{color:var(--amb)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:11px}
.kv dt{color:var(--dim);font-size:8.5px;letter-spacing:.18em;padding-top:2px}
.kv dd{min-width:0;overflow-wrap:anywhere}

/* elint */
.dial{margin:8px 0}
.dial .seg i{width:12px;height:10px}
.dial .lb{display:flex;justify-content:space-between;font-size:8.5px;color:var(--dim);margin-top:4px}
.habit{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;padding:6px 0;border-bottom:1px dashed var(--grn-dim);font-size:10.5px}
.habit:last-child{border:none}
.habit b{color:var(--grn);letter-spacing:.14em;font-size:9px;font-weight:400;text-transform:uppercase;padding-top:1px}
.habit span{color:var(--ink)}
.el li{list-style:none;padding:3px 0 3px 14px;position:relative;font-size:10.5px;color:var(--ink)}
.el li::before{content:"·";position:absolute;left:4px;color:var(--grn)}
.vibes{display:flex;flex-wrap:wrap;gap:6px}
.vibes span{border:1px solid var(--grn-dim);padding:3px 9px;font-size:10px;letter-spacing:.08em;color:var(--ink);transition:all .15s}
.vibes span:hover{border-color:var(--grn);color:var(--grn)}

/* lost contacts */
.lost{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lc{border:1px solid rgba(255,176,46,.3);background:rgba(255,176,46,.04);padding:12px;position:relative}
.lc .lh{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;letter-spacing:.2em;color:var(--amb);text-transform:uppercase}
.lc h4{font-size:13px;font-weight:400;margin:7px 0 2px;text-decoration:line-through;text-decoration-color:var(--amb);color:#D8C9A8}
.lc .ch{font-size:8.5px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase}
.lc p{font-size:9.5px;color:#A89878;margin-top:8px;line-height:1.6}

/* strike package */
.pkg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr)}
.brief{padding:14px 16px;border-right:1px dashed var(--grn-dim)}
.brief h3{font-size:clamp(17px,2.4vw,26px);font-weight:400;color:#fff;letter-spacing:.04em;line-height:1.2}
.brief .an{font-size:10.5px;color:var(--dim);margin:9px 0 12px;line-height:1.7}
.brief .km{border:1px solid var(--grn);color:var(--grn);padding:9px 12px;font-size:12px;margin-top:12px;letter-spacing:.04em}
.rec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px}
.frame{border:1px solid var(--grn-dim);background:#030805}
.frame:hover{border-color:var(--grn)}
.frame .iw{position:relative;aspect-ratio:4/3;overflow:hidden;border-bottom:1px solid var(--grn-dim)}
.frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.9)}
.frame .iw::after{content:"";position:absolute;inset:0;background:var(--grn);mix-blend-mode:multiply;opacity:.28;pointer-events:none}
.frame .iw .fl{position:absolute;top:3px;left:5px;font-size:7.5px;color:var(--grn);letter-spacing:.18em;z-index:2;background:rgba(3,8,5,.7);padding:0 4px}
.frame .cap{padding:7px 8px;font-size:9px}
.frame .cap .h{min-height:2.7em;line-height:1.4;color:var(--ink)}
.frame .cap .p{display:flex;justify-content:space-between;font-size:7.5px;color:var(--dim);letter-spacing:.16em;margin-top:4px;text-transform:uppercase}
.frame .cap .p b{color:var(--grn)}

/* paint */
.paints{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.paint .sw{height:48px;border:1px solid var(--grn-dim);position:relative}
.paint .sw::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(4,9,7,.4)}
.paint .n{font-size:9.5px;letter-spacing:.06em;margin-top:7px;color:var(--ink)}
.paint .h{font-size:8px;letter-spacing:.16em;color:var(--dim)}

/* intercept log */
table.ilog{width:100%;border-collapse:collapse;font-size:10px}
table.ilog th{text-align:left;font-weight:400;font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--grn-dim);padding:0 8px 6px 0}
table.ilog td{border-bottom:1px dashed var(--grn-dim);padding:6px 8px 6px 0;vertical-align:top}
table.ilog .ep{color:#fff}
table.ilog .pm{display:block;font-size:8px;color:var(--dim);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{font-size:7.5px;letter-spacing:.18em;color:var(--bg);background:var(--grn);padding:1px 6px;text-transform:uppercase}
.aff{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:10px;padding:3px 0;align-items:baseline}
.aff .tp{font-size:7.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;width:44px;flex-shrink:0}
.aff .nm{color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aff .v{color:var(--grn)}
.aff .bar{flex-basis:100%;height:3px;background:var(--grn-dim)}
.aff .bar i{display:block;height:100%;background:var(--grn)}

/* next */
.next-row{display:flex;flex-wrap:wrap;gap:10px}
.nbtn{
  border:1px solid var(--amb);color:var(--amb);background:none;padding:10px 18px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;transition:all .14s;
}
.nbtn:hover{background:var(--amb);color:var(--bg);text-shadow:none}
.nbtn:active{transform:translateY(1px)}

footer{margin:22px 0 26px;padding-top:10px;border-top:1px solid var(--grn-dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:8.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}

/* ---------- responsive ---------- */
@media(max-width:1020px){
  .ops{grid-template-columns:1fr}
  .scope-panel{max-width:520px;margin:0 auto;width:100%}
  .contacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cth{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
  .grid2 .cell{border-right:none;border-bottom:1px dashed var(--grn-dim)}
  .grid2 .cell:last-child{border-bottom:none}
  .lost{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pkg{grid-template-columns:1fr}
  .brief{border-right:none;border-bottom:1px dashed var(--grn-dim)}
  .rec{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paints{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:560px){
  .contacts,.lost{grid-template-columns:1fr}
  .paints{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scope-panel{max-width:100%}
  .grid2 .cell,.brief{min-width:0}
  table.ilog .pm{max-width:140px}
  .rec{grid-template-columns:1fr}
  .contact .coords{margin-left:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){
  .sweep{animation:none}
  .blip{animation:none;opacity:1}
  .led i{animation:none}
}
</style>
</head>
<body>
<div class="crt"></div>

<header class="status">
  <span class="call">MARQUE AIR CONTROL</span>
  <span class="sub" id="sec-lbl">SECTOR RH-07 · PPI-1</span>
  <div class="leds">
    <span class="led g"><i></i>PWR</span>
    <span class="led g blk"><i></i>DATA</span>
    <span class="led a"><i></i>TRK</span>
  </div>
</header>

<main class="wrap">
  <div class="ops">
    <section class="scope-panel">
      <div class="scope-head"><span>RDR PPI-1 · <b>ACTIVE</b></span><span>SWEEP 4.8S · RNG 100NM</span></div>
      <div class="scope" id="scope"></div>
      <div class="scope-foot"><span>CONTACTS: <b id="ncon">0</b></span><span id="clock">—</span><span>MODE: <b>LIVE</b></span></div>
    </section>
    <section class="contacts" id="contacts"></section>
  </div>

  <div id="panels"></div>

  <footer>
    <span>MARQUE AIR CONTROL — CONSOLE 36</span>
    <span id="foot-meta">PHOSPHOR P31 · ALL SIGNALS VERIFIED</span>
  </footer>
</main>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const pad=n=>String(n).padStart(3,'0');

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[8,11,9,0].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||(s.reach&&s.reach.estViews)>(strats[b].reach&&strats[b].reach.estViews||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const POS=[{a:38,r:.60},{a:104,r:.38},{a:205,r:.72},{a:318,r:.50}];
const T=4.8;

document.getElementById('sec-lbl').textContent='SECTOR '+esc((B.id||'RH-07').slice(0,5).toUpperCase())+' · PPI-1';
document.getElementById('clock').textContent=B.createdAt?('ZULU '+new Date(B.createdAt).toISOString().slice(11,16)+' · '+new Date(B.createdAt).toISOString().slice(0,10)):'—';
document.getElementById('ncon').textContent=strats.length;

/* scope blips + degree ticks */
const SC=document.getElementById('scope');
for(let d=0;d<360;d+=90){
  const lbl=document.createElement('span');lbl.className='deg';lbl.textContent=pad(d)+'°';
  const rad=(d-90)*Math.PI/180;
  lbl.style.left=(50+Math.cos(rad)*46)+'%';lbl.style.top=(50+Math.sin(rad)*46)+'%';
  lbl.style.transform='translate(-50%,-50%)';
  SC.appendChild(lbl);
}
[25,50,75].forEach(r=>{
  const rl=document.createElement('span');rl.className='rng-lbl';rl.textContent=r+'NM';
  rl.style.top=(50-r*.5*1.34)+'%';SC.appendChild(rl);
});
const sw=document.createElement('div');sw.className='sweep';SC.appendChild(sw);
strats.forEach((s,i)=>{
  const p=POS[i%POS.length];
  const rad=(p.a-90)*Math.PI/180;
  const x=50+Math.cos(rad)*p.r*50, y=50+Math.sin(rad)*p.r*50;
  const b=document.createElement('div');
  b.className='blip'+(i===sel?' dmd':'');
  b.style.left=x+'%';b.style.top=y+'%';
  b.style.animationDelay=(p.a/360*T)+'s';
  b.innerHTML='<span class="tag">CT-0'+(i+1)+' '+esc(s.title).toUpperCase()+(i===sel?' <em>PRI</em>':'')+'</span>';
  SC.appendChild(b);
});

/* contact cards */
const seg=x=>{const on=Math.round(x*10);let h='<span class="seg">';for(let i=0;i<10;i++)h+='<i class="'+(i<on?'on':'')+'"></i>';return h+'</span>'};
document.getElementById('contacts').innerHTML=
  '<div class="cth">CONTACT DATA — <b>'+strats.length+' TRACKS HELD</b> · SWEEP SYNCHRONISED</div>'+
  strats.map((s,i)=>{
    const p=POS[i%POS.length];
    return '<article class="contact'+(i===sel?' pri':'')+'">'+
    '<div class="r1"><span class="cid">CT-0'+(i+1)+'</span><h3>'+esc(s.title)+'</h3><span class="ang">'+esc(s.angle)+'</span>'+
    '<span class="coords">AZ '+pad(p.a)+'° / RNG '+(p.r*100).toFixed(0)+'NM</span></div>'+
    '<div class="sigbars">FIT '+seg((s.audienceFit&&s.audienceFit.score)||0)+' <b style="color:var(--grn)">'+pct(s.audienceFit&&s.audienceFit.score)+'/100</b></div>'+
    '<div class="chrow">'+(s.channels||[]).map(c=>'<span>'+esc(c.name).toUpperCase()+' <span class="cb"><i style="width:'+pct(c.fit)+'%"></i></span><b>'+pct(c.fit)+'%</b>'+(c.why?' <i style="color:var(--dim)">'+esc(c.why)+'</i>':'')+'</span>').join('')+'</div>'+
    '<div class="cmeta"><span>SIG STR <b>'+(s.reach?views(s.reach.estViews):'—')+'</b></span><span>FMT '+esc((s.formats||[]).join(' / ')).toUpperCase()+'</span>'+
    (s.reach?'<span title="'+esc(s.reach.basis||'')+'">BASIS '+esc((s.reach.basis||'').slice(0,60))+'…</span>':'')+'</div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="cwarn">'+esc(s.watchouts[0])+'</div>':'')+
    '</article>'}).join('');

const M=document.getElementById('panels');
const panel=(id,title,tag,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="panel"><div class="phead"><b>'+esc(id)+'</b><span>'+esc(title)+'</span><span class="r">'+esc(tag)+'</span></div><div class="pbody">'+body+'</div></section>'));
};

/* tasking — the ask */
if(B.sub||B.urlContext){
  const u=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url)||'';
  panel('MSG-01','MISSION TASKING','RECEIVED · DECRYPTED',
    '<div class="grid2"><div class="cell"><div class="mini">Tasking text</div>'+
    '<p class="task">'+esc((B.sub&&B.sub.prompt)||B.title||'').replace(/→/g,'<span class="arr">→</span>')+'</p>'+
    (u?'<p style="margin-top:12px;font-size:10.5px">ORIGIN: <a href="'+esc(u)+'">'+esc(u)+'</a></p>':'')+'</div>'+
    '<div class="cell"><div class="mini">Origin intel</div>'+
    '<dl class="kv"><dt>CALLSIGN</dt><dd>'+esc(B.urlContext&&B.urlContext.title||'—')+'</dd>'+
    '<dt>BOARD</dt><dd>'+esc(B.id||'—')+'</dd>'+
    '<dt>SITREP</dt><dd>'+esc(B.urlContext&&B.urlContext.description||'—')+'</dd></dl></div></div>');
}

/* elint — audience */
if(AR&&AR.lean){
  panel('ELINT-02','SIGNAL INTELLIGENCE — AUDIENCE READ','INTERCEPTED · VERIFIED',
    '<div class="grid2"><div class="cell"><div class="mini">Classification</div>'+
    '<div style="font-size:19px;letter-spacing:.1em;color:#fff;text-transform:uppercase">'+esc(AR.lean.label||'—')+'</div>'+
    '<div class="dial" style="margin-top:10px"><div class="mini">Confidence '+pct(AR.lean.confidence)+'/100</div>'+seg(AR.lean.confidence||0)+
    '<div class="lb"><span>0</span><span>'+(AR.lean.confidence||0).toFixed(2)+'</span><span>1.00</span></div></div>'+
    '<ul class="el" style="margin-top:10px">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>'+
    '<div class="cell"><div class="mini">Emission habits</div>'+
    (AR.mediaHabits||[]).map(h=>'<div class="habit"><b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span></div>').join('')+
    '<div class="mini" style="margin-top:12px">Codewords</div>'+
    '<div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>');
}

/* lost contacts — ruled out */
const anti=B.antiStrategies||[];
if(anti.length){
  panel('LOST-03','DROPPED CONTACTS','NO TRACK · FADED FROM SCOPE',
    '<div class="lost">'+anti.map(a=>
      '<div class="lc"><div class="lh"><span>LOST</span><span>'+esc(a.channel).toUpperCase()+'</span></div>'+
      '<h4>'+esc(a.title)+'</h4><p>'+esc(a.whyNot)+'</p></div>').join('')+
    '</div>');
}

/* strike package */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  panel('PKGE-04','STRIKE PACKAGE — PRIORITY TRACK '+String.fromCharCode(65+(sel||0)),'AUTHORISED',
    '<div class="pkg"><div class="brief"><div class="mini">Campaign brief</div>'+
    (br?'<h3>'+esc(br.title)+'</h3><p class="an">'+esc(br.angle)+'</p>'+
    '<dl class="kv"><dt>TARGET</dt><dd>'+esc(br.audience)+'</dd>'+
    '<dt>FROM</dt><dd>'+esc(selS.title)+' · SIG '+esc(selS.heroSignal||'—')+'</dd></dl>'+
    '<div class="km">“'+esc(br.keyMessage)+'”</div>':'<p class="an">no brief bound</p>')+'</div>'+
    '<div class="rec">'+CREAT.map((m,i)=>
      '<figure class="frame"><div class="iw"><span class="fl">REC-'+pad(i+1)+'</span><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
      '<figcaption class="cap"><div class="h">'+esc(m.head)+'</div><div class="p"><span>SRC</span><b>'+esc(m.provider)+'</b></div></figcaption></figure>').join('')+
    '</div></div>');
}

/* paint codes */
panel('SPEC-05','PAINT SCHEME','SCHEDULED FINISH',
  '<div class="paints">'+PALETTE.map((s,i)=>
    '<div class="paint"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">PC-0'+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+
  '</div>');

/* intercept log */
const QB=B.qlooBundle;
if(B.evidence||QB){
  const affs=(QB&&QB.affinities)||[];
  panel('LOG-06','INTERCEPT LOG — QLOO PROVENANCE',(QB&&QB.mode?QB.mode.toUpperCase():'LIVE')+' FEED',
    '<div class="grid2"><div class="cell"><div class="mini">'+calls.length+' intercepts · fetched '+(B.fetchedAt?new Date(B.fetchedAt).toISOString().slice(11,16)+'Z':'—')+'</div>'+
    '<table class="ilog"><thead><tr><th>ENDPOINT</th><th>N</th><th>MS</th><th>MODE</th></tr></thead><tbody>'+
    calls.map(c=>'<tr><td><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+kv[1]).join(' '))+'</span></td>'+
      '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="cell"><div class="mini">Signal library — top affinities</div>'+
    affs.map(g=>g.entities.slice(0,4).map(e=>'<div class="aff"><span class="tp">'+esc(g.type.replace('urn:entity:',''))+'</span><span class="nm">'+esc(e.name)+'</span><span class="v">'+e.affinity.toFixed(2)+'</span><div class="bar"><i style="width:'+pct(e.affinity)+'%"></i></div></div>').join('')).join('')+
    '</div></div>');
}

/* next tasking */
panel('TSK-07','NEW TASKING OPTIONS','SELECT NEXT OPERATION',
  '<div class="next-row">'+
  ['CAMPAIGN MICROSITE','BRANDBOOK PDF','VIDEO CUT','PERFORMANCE PLAN'].map(x=>'<button class="nbtn">'+x+'</button>').join('')+
  '</div>');
})();
</script>
</body>
</html>
