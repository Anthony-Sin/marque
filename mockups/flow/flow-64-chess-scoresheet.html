<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Official Scoresheet — Marque Invitational</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F7F5EE'/%3E%3Crect x='8' y='8' width='24' height='24' fill='%231A1A17'/%3E%3Crect x='32' y='32' width='24' height='24' fill='%231A1A17'/%3E%3Crect x='32' y='8' width='24' height='24' fill='%2316653C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5EE;--paper2:#EFEBDD;--ink:#1A1A17;--mut:#7C7666;
  --grn:#16653C;--grn-d:#0E4D2B;--line:#CFC8B4;
  --f:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#141F18 radial-gradient(ellipse at 50% 0%,rgba(22,101,60,.25),transparent 55%);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:rgba(22,101,60,.2)}
a{color:var(--grn);text-decoration:none;border-bottom:1.5px solid var(--grn)}
a:hover{color:var(--ink);border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--grn);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.hall{max-width:900px;margin:28px auto 80px;background:var(--paper);border:2px solid #0C2C1A;box-shadow:0 30px 70px rgba(0,0,0,.5)}

/* tournament header card */
.thead{border-bottom:2px solid var(--ink)}
.thead .band{background:var(--grn);color:#fff;padding:7px 18px;display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;flex-wrap:wrap}
.thead .core{padding:clamp(16px,3.6vw,28px) clamp(16px,4vw,34px);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.thead h1{font-size:clamp(24px,5vw,40px);font-weight:700;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
.thead h1 span{color:var(--grn)}
.thead .meta{font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.thead .stamp{width:96px;height:96px;border:2.5px solid var(--grn);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--grn);transform:rotate(8deg);font-weight:700}
@media(max-width:560px){.thead .stamp{display:none}}
.order{border-top:2px solid var(--ink);padding:14px clamp(16px,4vw,34px);background:var(--paper2)}
.order .lbl{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--grn);font-weight:700}
.order .ask{font-size:clamp(16px,3vw,21px);font-weight:600;margin-top:4px}
.order .url{font-size:10.5px;margin-top:5px;overflow-wrap:anywhere;color:var(--mut)}
.order .venue{font-size:11px;font-style:italic;color:var(--mut);margin-top:4px}

section{padding:clamp(16px,3.4vw,28px) clamp(16px,4vw,34px);border-bottom:1.5px solid var(--line)}
section:last-of-type{border-bottom:none}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-h .no{font-size:10px;font-weight:700;color:#fff;background:var(--ink);padding:3px 9px;letter-spacing:.16em}
.sec-h h2{font-size:clamp(19px,3.6vw,27px);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.sec-h .sub{margin-left:auto;font-style:italic;color:var(--mut);font-size:12.5px}

/* player card = audience */
.pcard{border:1.5px solid var(--ink);background:var(--paper2)}
.pcard .ph{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1.5px solid var(--ink);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);flex-wrap:wrap}
.pcard .pg{display:grid;grid-template-columns:repeat(2,1fr);gap:0}
@media(max-width:620px){.pcard .pg{grid-template-columns:1fr}}
.pcard .cell{padding:10px 14px;border-bottom:1px dashed var(--line)}
.pcard .cell:nth-child(odd){border-right:1px dashed var(--line)}
@media(max-width:620px){.pcard .cell:nth-child(odd){border-right:none}}
.pcard .k{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--grn);font-weight:700;margin-bottom:3px}
.pcard .big{font-size:22px;font-weight:700}
.pcard .elo{display:flex;align-items:center;gap:10px}
.pcard .elo .ev{font-size:22px;font-weight:700}
.pcard .elo .bar{flex:1;max-width:180px;height:12px;border:1.5px solid var(--ink);display:flex}
.pcard .elo .bar i{display:block;height:100%;background:var(--ink)}
.pcard .elo .bar b{display:block;height:100%;background:#fff;flex:1}
.pcard ul{list-style:none;font-size:12.5px}
.pcard li{padding:3px 0;border-bottom:1px dotted var(--line)}
.pcard li:last-child{border-bottom:none}
.pcard .reps{display:flex;flex-wrap:wrap;gap:6px}
.pcard .reps span{font-size:11px;border:1.5px solid var(--ink);padding:2px 9px;background:#fff}

/* boards = strategies */
.board{border:1.5px solid var(--ink);margin-bottom:16px;background:#fff}
.board:last-child{margin-bottom:0}
.board .bh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 14px;background:var(--ink);color:var(--paper)}
.board .bh .bn{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#B9CDBE}
.board .bh .bt{font-size:clamp(15px,2.6vw,20px);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.board .bh .res{font-size:clamp(16px,3vw,22px);font-weight:700;color:#fff;border:1.5px solid #fff;padding:2px 10px}
.board .moves{padding:10px 14px;font-size:12.5px}
.board .mv{display:grid;grid-template-columns:34px 1fr 1fr;gap:4px 14px;padding:4px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.board .mv:last-child{border-bottom:none}
.board .mv .n{color:var(--mut);font-size:10px;padding-top:2px}
.board .mv .w,.board .mv .b{padding:1px 4px}
.board .mv .f{color:var(--mut);font-size:10px}
.board .mv .why{color:var(--mut);font-size:10px;font-style:italic}
@media(max-width:520px){.board .mv{grid-template-columns:24px 1fr}.board .mv .b{grid-column:2}}
.board .bf{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1.5px solid var(--ink);background:var(--paper2);font-size:11px}
.board .eval{display:flex;align-items:center;gap:10px}
.board .eval .bar{width:150px;max-width:38vw;height:12px;border:1.5px solid var(--ink);display:flex;background:#fff}
.board .eval .bar i{display:block;height:100%;background:var(--ink)}
.board .eval .rv{font-size:10.5px;font-weight:700}
.board .bf .purse{text-align:right}
.board .bf .purse b{font-size:16px}
.board .bf .purse .basis{display:block;color:var(--mut);font-size:9.5px;font-style:italic;max-width:220px}
@media(max-width:520px){.board .bf{grid-template-columns:1fr}.board .bf .purse{text-align:left}}
.board .caution{padding:7px 14px;border-top:1px dashed var(--line);font-size:11px;font-style:italic;color:var(--grn-d)}
.board .caution::before{content:"ARBITER'S CAUTION — ";font-style:normal;font-size:8px;letter-spacing:.22em;color:var(--grn)}
.board .fmt{padding:0 14px 9px;font-size:11px;color:var(--mut)}
.board .fmt span{border:1px solid var(--mut);padding:1px 8px;margin-right:5px;display:inline-block;margin-bottom:3px}

/* forfeits */
.ff{border:1.5px solid var(--ink)}
.ff .fr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:8px 14px;border-bottom:1px dashed var(--line);align-items:baseline;font-size:12.5px}
.ff .fr:last-child{border-bottom:none}
.ff .fr .sc{font-weight:700;color:var(--grn);font-size:11px;letter-spacing:.08em;white-space:nowrap}
.ff .fr .why{color:var(--mut);font-size:11.5px;font-style:italic}
.ff .fr h4{font-size:14px;font-weight:700}
.ff .fr h4 s{text-decoration-color:var(--grn)}
@media(max-width:560px){.ff .fr{grid-template-columns:1fr;gap:3px}}

/* analysis + photos */
.anal{border:2px solid var(--ink);background:var(--paper2);padding:16px 20px;margin-bottom:18px;position:relative}
.anal::after{content:"GAME OF THE ROUND";position:absolute;top:-10px;left:16px;background:var(--grn);color:#fff;font-size:8.5px;letter-spacing:.24em;padding:3px 10px}
.anal h3{font-size:clamp(20px,3.8vw,30px);font-weight:700;text-transform:uppercase;line-height:1.1}
.anal .lede{font-style:italic;margin:7px 0 12px;font-size:14px}
.anal dl{display:grid;grid-template-columns:120px 1fr;gap:5px 14px;font-size:12.5px}
.anal dt{font-size:8.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--grn);padding-top:4px}
.anal dd{border-bottom:1px dotted var(--line);padding-bottom:6px}
.anal .km{font-weight:700;font-size:15px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.photos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.photos{grid-template-columns:1fr}}
.photo{background:#fff;border:1.5px solid var(--ink);padding:6px 6px 0;transform:rotate(-.5deg);transition:transform .15s ease}
.photo:nth-child(2n){transform:rotate(.6deg)}
.photo:hover{transform:rotate(0) scale(1.03)}
.photo .iw{aspect-ratio:1/1;overflow:hidden;border:1px solid var(--line);background:var(--paper2)}
.photo .iw img{width:100%;height:100%;object-fit:cover;filter:saturate(.92)}
.photo figcaption{padding:7px 2px}
.photo .h{font-size:11.5px;font-weight:600;line-height:1.4}
.photo .p{font-size:8.5px;letter-spacing:.14em;color:var(--grn);text-transform:uppercase;margin-top:2px}

/* federation colors */
.fed{display:flex;flex-wrap:wrap;gap:14px}
.fs{width:112px;text-align:center}
.fs .sw{height:48px;border:1.5px solid var(--ink);position:relative}
.fs .sw::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 48%,rgba(26,26,23,.14) 48% 52%,transparent 52%)}
.fs .n{font-size:12px;font-weight:600;margin-top:6px}
.fs .h{font-size:9px;color:var(--mut)}

/* arbiter report = qloo */
.rep{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(14px,3vw,26px)}
@media(max-width:760px){.rep{grid-template-columns:1fr}}
.rep .mem{font-style:italic;font-size:13px;margin-bottom:10px}
.rep .mem b{color:var(--grn)}
.checks .lr{padding:6px 0;border-bottom:1px dashed var(--line);font-size:10.5px}
.checks b{color:var(--grn);font-size:11px}
.checks .pm{color:var(--mut);overflow-wrap:anywhere;display:block}
.checks .me{display:flex;gap:12px;color:var(--mut);flex-wrap:wrap}
.rlist{border:1.5px solid var(--ink);background:#fff;padding:10px 14px}
.rlist h4{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--grn);margin-bottom:6px}
.rlist .dv{font-weight:700;text-transform:uppercase;font-size:12.5px;border-bottom:1.5px solid var(--ink);padding:7px 0 3px}
.rlist .rw{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dotted var(--line)}
.rlist .rw:last-child{border-bottom:none}
.rlist .rw .v{color:var(--mut);font-size:10.5px}

/* submit */
.nextrow{display:flex;flex-wrap:wrap;gap:10px}
.nextrow button{border:1.5px solid var(--ink);background:var(--paper);padding:9px 18px;font-family:var(--f);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;transition:background .12s ease,color .12s ease,transform .12s ease}
.nextrow button:hover{background:var(--grn);border-color:var(--grn);color:#fff}
.nextrow button:active{transform:translateY(2px)}
.nextrow .sub{width:100%;font-style:italic;color:var(--mut);font-size:12px}
.events{margin-top:12px;font-size:12px;color:var(--mut)}
.events b{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--grn);display:block;margin-bottom:4px}
.events span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dotted var(--mut)}
.foot{background:var(--ink);color:var(--paper);font-size:9px;letter-spacing:.26em;text-transform:uppercase;text-align:center;padding:10px}
.empty{padding:40px;text-align:center;font-style:italic;color:var(--mut)}
</style>
</head>
<body>
<div class="hall">
  <header class="thead">
    <div class="band"><span>International Campaign Federation</span><span>Official Scoresheet · retain for 3 seasons</span></div>
    <div class="core">
      <div>
        <h1>Marque <span>Invitational</span></h1>
        <div class="meta" id="s-meta"></div>
      </div>
      <div class="stamp">CERTIFIED<br>FED.<br><span id="s-fed"></span></div>
    </div>
    <div class="order">
      <div class="lbl">Match order for the round</div>
      <div class="ask" id="s-ask"></div>
      <div class="url" id="s-url"></div>
      <div class="venue" id="s-venue"></div>
    </div>
  </header>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Crème Fraîche',h:'#F3E6CE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[3,7,10,12].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-meta').textContent='Section A · '+dt(B.createdAt||B.fetchedAt)+' · time control: strategy → campaign → result';
document.getElementById('s-fed').textContent=String(B.id||'—').slice(0,6).toUpperCase();
document.getElementById('s-ask').textContent='“'+((B.sub&&B.sub.prompt)||B.title||'')+'”';
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
document.getElementById('s-url').innerHTML=U?'venue of record: <a href="'+esc(U)+'">'+esc(U)+'</a>':'';
document.getElementById('s-venue').textContent=(B.urlContext&&B.urlContext.title)?('the club reports — '+B.urlContext.title+': '+(B.urlContext.description||'').slice(0,92)+'…'):'';
document.getElementById('foot').textContent='RESULTS CERTIFIED BY THE FEDERATION · BOARD SEAL '+String(B.id||'—').slice(0,8).toUpperCase()+' · APPEALS CLOSE AT MIDNIGHT';

const M=document.getElementById('app');
const sec=(no,title,sub,body)=>{if(!body)return;M.appendChild(el('<section><div class="sec-h"><span class="no">'+esc(no)+'</span><h2>'+esc(title)+'</h2><span class="sub">'+esc(sub)+'</span></div>'+body+'</section>'))};

/* player card = audience */
if(AR&&AR.lean){
  sec('REG','Player Card — Gen Z','federation record, verified at the door',
  '<div class="pcard"><div class="ph"><span>FEDERATION PLAYER CARD</span><span>ALL FIELDS CERTIFIED</span></div><div class="pg">'+
  '<div class="cell"><div class="k">Name / federation</div><div class="big">GEN Z</div><div>'+esc(AR.lean.label)+' section</div></div>'+
  '<div class="cell"><div class="k">Read rating</div><div class="elo"><span class="ev">'+Math.round((AR.lean.confidence||0)*100)+'</span><span class="bar"><i style="width:'+Math.round((AR.lean.confidence||0)*100)+'%"></i><b></b></span><span style="color:var(--mut)">confidence</span></div></div>'+
  '<div class="cell"><div class="k">Known repertoire</div><ul>'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>'+
  '<div class="cell"><div class="k">Preferred boards</div><ul>'+(AR.mediaHabits||[]).map(h=>'<li><b>'+esc(h.channel)+'</b> — '+esc(h.note)+'</li>').join('')+'</ul></div>'+
  '<div class="cell" style="grid-column:1/-1;border-bottom:none"><div class="k">Studied under</div><div class="reps">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div>'+
  '</div></div>');
}

/* match book = strategies */
if(strats.length){
  sec('RND','The Match Book','four boards, all games recorded',
  strats.map((s,i)=>{
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    const chans=s.channels||[];
    const mvRows=[];
    /* move 1: channels as white/black; move 2: formats; move 3: signal */
    const fmt=s.formats||[];
    mvRows.push({n:'1.',w:chans[0]?esc(chans[0].name):'—',wf:chans[0]?f2(chans[0].fit):'',ww:chans[0]?esc(chans[0].why||''):'',
                 b:chans[1]?esc(chans[1].name):'reserves',bf:chans[1]?f2(chans[1].fit):'',bw:chans[1]?esc(chans[1].why||''):''});
    mvRows.push({n:'2.',w:fmt[0]?esc(fmt[0]):'—',wf:'',ww:'opening line',b:fmt[1]?esc(fmt[1]):'—',bf:'',bw:'reply line'});
    mvRows.push({n:'3.',w:'signal: '+esc(s.heroSignal||'—'),wf:'',ww:'pinned',b:esc(s.angle||''),bf:'',bw:'the idea'});
    return '<div class="board"><div class="bh"><span class="bn">Board '+(i+1)+(i===sel?' · top board':'')+'</span><span class="bt">'+esc(s.title)+' vs The Feed</span><span class="res">'+(i===sel?'1–0':'½–½')+'</span></div>'+
    '<div class="moves">'+mvRows.map(m=>'<div class="mv"><span class="n">'+m.n+'</span><span class="w">'+m.w+(m.wf?' <span class="f">'+m.wf+'</span>':'')+(m.ww?' <span class="why">'+m.ww+'</span>':'')+'</span><span class="b">'+m.b+(m.bf?' <span class="f">'+m.bf+'</span>':'')+(m.bw?' <span class="why">'+m.bw+'</span>':'')+'</span></div>').join('')+'</div>'+
    '<div class="fmt">time stamps — '+fmt.map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="caution">'+esc(s.watchouts[0])+'</div>':'')+
    '<div class="bf"><div class="eval"><span class="rv">eval '+f2(fit)+'</span><span class="bar"><i style="width:'+Math.round(fit*100)+'%"></i></span><span style="color:var(--mut);font-size:10px">audience fit</span></div>'+
    '<div class="purse"><b>'+views(s.reach&&s.reach.estViews)+'</b> spectators<span class="basis">'+esc(s.reach&&s.reach.basis||'')+'</span></div></div></div>';
  }).join(''));
}

/* forfeits = anti */
if(anti.length){
  sec('DEF','Unplayed Games','declared by the arbiter — opponents did not appear',
  '<div class="ff">'+anti.map(a=>'<div class="fr"><span class="sc">− : + forfeit</span><h4><s>'+esc(a.title)+'</s> <span style="font-weight:400;color:var(--mut)">@ '+esc(a.channel)+'</span></h4><span class="why">'+esc(a.whyNot)+'</span></div>').join('')+'</div>');
}

/* analysis + photographs */
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('ANA','The Annotated Game','published in the tournament bulletin',
  '<div class="anal">'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Played for</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Winning idea</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Continuation</dt><dd>Board '+((sel!=null?sel:0)+1)+', '+esc(selS.title)+' — key piece '+esc(selS.heroSignal||'—')+'</dd></dl>'
  :'<div class="lede">The bulletin went to press without notes.</div>')+
  '</div>'+
  '<div class="photos">'+CREAT.map(m=>'<figure class="photo"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">hall camera · '+esc(m.provider)+'</div></figcaption></figure>').join('')+'</div>');
}

/* federation colors */
sec('CLR','Federation Colors','board and cloth as published',
  '<div class="fed">'+PALETTE.map(s=>'<div class="fs"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">'+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* arbiter report = qloo */
if(calls.length||affs.length){
  sec('ARB','Arbiter’s Report','fair-play verification — Qloo rating list, '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' season',
  '<div class="rep"><div><p class="mem"><b>Signed, the Arbiter.</b> Before sealing the results, <b>'+calls.length+' checks</b> were run against the Qloo rating list in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' mode</b>; the record follows.</p>'+
  '<div class="checks">'+calls.map(c=>'<div class="lr"><b>CHECK — '+esc(c.endpoint)+'</b><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,32)).join(' · '))+'</span><span class="me"><span>'+esc((c.at||'').slice(11,19))+'Z</span><span>'+esc(c.tookMs)+' ms deliberation</span><span>'+esc(c.n)+' entries</span><span>'+esc(c.mode)+'</span></span></div>').join('')+'</div></div>'+
  '<div class="rlist"><h4>Rating list — what they follow</h4>'+affs.map(g=>'<div class="dv">'+esc(g.type.replace('urn:entity:',''))+'</div>'+
  g.entities.slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* submit */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
sec('SUB','Submit the Result','the scoresheet travels onward',
  '<div class="nextrow">'+['Report to federation','Publish bulletin','Export PGN','Book the rematch'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">One signed sheet feeds every deliverable — signatures already in place.</div></div>'+
  (others.length?'<div class="events"><b>Upcoming events</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

if(!M.children.length)M.appendChild(el('<section><div class="empty">The round is postponed — the scoresheets never reached the hall.</div></section>'));
})();
</script>
</body>
</html>
