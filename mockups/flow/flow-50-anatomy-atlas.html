<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque — Tabulae Anatomicae Campaigni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F5EFE0'/%3E%3Cpath d='M32 14c-8 0-13 7-13 14 0 9 8 16 13 22 5-6 13-13 13-22 0-7-5-14-13-14z' fill='none' stroke='%23802B21' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE0;
  --paper2:#EFE7D2;
  --ink:#26201A;
  --dim:#7A6E5A;
  --blood:#802B21;
  --hair:#C9BC9C;
  --cardo:'Cardo',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper2);
  background-image:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.55),transparent 60%);
  color:var(--ink);font-family:var(--cardo);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(128,43,33,.22)}
a{color:var(--blood);text-decoration:none;border-bottom:1px dotted var(--blood)}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--blood);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.atlas{max-width:1060px;margin:26px auto 64px;padding:0 clamp(10px,2.4vw,22px)}

/* title page */
.tp{
  border:1.5px solid var(--ink);background:var(--paper);text-align:center;
  padding:clamp(24px,5vw,44px) clamp(16px,4vw,44px);position:relative;
  box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--hair),0 14px 44px rgba(60,45,25,.16);
}
.tp .vol{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--dim)}
.tp h1{font-size:clamp(25px,5vw,44px);font-weight:700;letter-spacing:.04em;line-height:1.1;margin:12px 0 4px;font-variant:small-caps}
.tp .sub{font-style:italic;font-size:clamp(13px,2vw,16px);color:var(--dim)}
.tp .rule{display:flex;align-items:center;gap:14px;margin:18px auto;max-width:520px;color:var(--blood);font-size:13px}
.tp .rule::before,.tp .rule::after{content:"";flex:1;border-top:1px solid var(--ink)}
.tp .ask{max-width:660px;margin:0 auto;font-size:clamp(15px,2.2vw,18px)}
.tp .ask .sujet{font-style:italic}
.tp .ask .sujet b{color:var(--blood)}
.tp .url{font-family:var(--mono);font-size:10.5px;margin-top:10px;color:var(--dim);overflow-wrap:anywhere}
.tp .imprim{margin-top:16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* plates & sections */
.plate{
  margin-top:30px;border:1.5px solid var(--ink);background:var(--paper);
  box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--hair),0 10px 34px rgba(60,45,25,.13);
  padding:clamp(16px,3.4vw,30px);
}
.plateh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:18px}
.plateh .tab{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--blood);white-space:nowrap}
.plateh h2{font-size:clamp(18px,3vw,25px);font-weight:700;font-variant:small-caps;letter-spacing:.04em}
.plateh .lat{margin-left:auto;font-style:italic;font-size:12.5px;color:var(--dim)}

/* the subject */
.subject{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,34px);align-items:start}
@media(max-width:760px){.subject{grid-template-columns:1fr}.subject .figwrap{margin:0 auto}}
.figwrap{width:170px}
.figwrap svg{width:100%;height:auto;display:block}
.figwrap .cap{font-size:10.5px;font-style:italic;text-align:center;color:var(--dim);margin-top:6px;border-top:1px solid var(--hair);padding-top:5px}
.k{font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:8px}
.lean{font-size:clamp(23px,3.4vw,32px);font-variant:small-caps;font-weight:700;line-height:1.08}
.tonus{margin:10px 0 12px}
.tonus .bar{height:12px;border:1px solid var(--ink);position:relative;background:repeating-linear-gradient(90deg,transparent 0 19.5%,rgba(38,32,26,.22) 19.5% 20%)}
.tonus .bar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(128,43,33,.35),rgba(128,43,33,.75))}
.tonus .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px}
.notes{list-style:none}
.notes li{font-size:13.5px;padding:5px 0 5px 20px;border-bottom:1px dotted var(--hair);position:relative}
.notes li::before{content:"§";position:absolute;left:2px;color:var(--blood);font-size:12px}
.innerv{display:grid;grid-template-columns:86px 1fr;gap:3px 14px;font-size:13px}
.innerv b{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--blood);padding-top:2px}
.innerv span{font-style:italic;padding-bottom:6px;border-bottom:1px dotted var(--hair)}
.nomina{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.nomina span{font-size:11.5px;font-style:italic;border:1px solid var(--ink);padding:2px 10px;background:rgba(255,255,255,.4)}
.catno{margin-top:14px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);border-top:1px solid var(--hair);padding-top:8px}

/* the four organs */
.organs{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:720px){.organs{grid-template-columns:1fr}}
.organ{border:1px solid var(--ink);background:linear-gradient(#F9F4E6,#F0E8D3);padding:16px 18px 14px;position:relative;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--hair)}
.organ.chosen{box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--blood)}
.organ .pn{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--dim);display:flex;justify-content:space-between}
.organ .pn .ch{color:var(--blood);font-weight:700}
.organ h3{font-size:clamp(17px,2.4vw,22px);font-variant:small-caps;font-weight:700;letter-spacing:.05em;margin:3px 0 0}
.organ .lat{font-style:italic;font-size:12.5px;color:var(--blood);margin-bottom:10px}
.figrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center}
.figrow svg{width:100%;height:auto;display:block}
.lead{list-style:none;font-size:11px}
.lead li{display:grid;grid-template-columns:14px 1fr;gap:6px;padding:3px 0;border-bottom:1px dotted var(--hair);align-items:baseline}
.lead li b{font-family:var(--mono);font-size:10px;color:var(--blood)}
.lead li .nm{font-variant:small-caps;font-size:11.5px;letter-spacing:.04em}
.lead li .v{font-family:var(--mono);font-size:9px;color:var(--dim);display:block}
.organ .expl{font-size:11.5px;font-style:italic;color:var(--dim);margin-top:9px;line-height:1.5}
.organ .res{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1.5px solid var(--ink);margin-top:10px;padding-top:8px}
.organ .res b{font-size:20px;font-variant:small-caps}
.organ .res small{font-size:10.5px;font-style:italic;color:var(--dim);text-align:right;max-width:210px}
.organ .cau{font-size:11.5px;font-style:italic;color:var(--blood);margin-top:7px}
.organ .cau b{font-variant:small-caps;font-style:normal;letter-spacing:.08em;font-size:10px}
.organ .fmt{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.organ .fmt span{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;border:1px solid var(--hair);padding:2px 7px;background:rgba(255,255,255,.35)}

/* excisions */
.excis{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.excis{grid-template-columns:1fr}}
.exc{border:1px solid var(--ink);background:var(--paper);padding:13px 16px;position:relative}
.exc::before{content:"";position:absolute;left:-4px;right:-4px;top:26px;border-top:2px solid var(--blood);transform:rotate(-1.4deg);opacity:.8}
.exc h4{font-size:15.5px;font-variant:small-caps;font-weight:700}
.exc .ch{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--blood);margin:2px 0 6px}
.exc p{font-size:12.5px;font-style:italic;color:var(--dim);line-height:1.5}

/* diagnosis + preparations */
.diag{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(16px,3vw,26px)}
@media(max-width:760px){.diag{grid-template-columns:1fr}}
.card{border:2px solid var(--ink);background:var(--paper);padding:20px 22px;box-shadow:inset 0 0 0 4px var(--paper2),inset 0 0 0 5px var(--hair);height:max-content}
.card .k2{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--blood);text-align:center}
.card h3{font-size:clamp(19px,3vw,26px);font-variant:small-caps;font-weight:700;text-align:center;margin:6px 0 8px}
.card .lede{font-style:italic;font-size:13px;text-align:center;color:var(--dim);border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:12px}
.card dl{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:12.5px}
.card dt{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blood);padding-top:3px}
.card dd{border-bottom:1px dotted var(--hair);padding-bottom:7px}
.card .msg{font-weight:700;font-size:14px}
.card .foot{margin-top:12px;text-align:center;font-style:italic;font-size:11.5px;color:var(--dim)}
.preps{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:440px){.preps{grid-template-columns:1fr}}
.prep{border:1px solid var(--ink);background:var(--paper2);padding:8px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--ink);transition:transform .18s ease,box-shadow .18s ease}
.prep:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--blood),0 10px 22px rgba(60,40,20,.25)}
.prep .iw{border:1px solid var(--ink);overflow:hidden}
.prep img{width:100%;aspect-ratio:1/1;object-fit:cover;filter:sepia(.25) contrast(.96)}
.prep figcaption{padding:7px 2px 2px}
.prep .h{font-size:11.5px;font-weight:700;display:block;line-height:1.3}
.prep .p{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blood);display:block;margin-top:2px}

/* tinctures */
.tincts{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:640px){.tincts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.tincts{grid-template-columns:repeat(2,1fr)}}
.tinct{text-align:center}
.tinct .vial{height:60px;border:1.5px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--hair);margin-bottom:6px;position:relative}
.tinct .vial::after{content:"";position:absolute;left:8px;right:8px;top:8px;bottom:8px;border:1px solid rgba(38,32,26,.25)}
.tinct .n{font-size:11.5px;font-variant:small-caps;font-weight:700}
.tinct .h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim)}

/* registry */
.reg .mem{font-size:13.5px;font-style:italic;max-width:660px;margin-bottom:16px}
.reg .mem b{font-style:normal}
.regg{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,28px)}
@media(max-width:760px){.regg{grid-template-columns:1fr}}
.sess{width:100%;border-collapse:collapse;font-size:11.5px}
.sess th{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--blood);text-align:left;border-bottom:1.5px solid var(--ink);padding:5px 8px 5px 0}
.sess td{border-bottom:1px dotted var(--hair);padding:6px 8px 6px 0;vertical-align:top}
.sess .ep{font-family:var(--mono);font-size:10px}
.sess .pm{display:block;font-family:var(--mono);font-size:8.5px;color:var(--dim);overflow-wrap:anywhere;max-width:220px}
.sess .md{border:1px solid var(--ink);padding:0 6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.symp .g{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--blood);margin:12px 0 4px}
.symp .g:first-child{margin-top:0}
.symp .row{display:grid;grid-template-columns:minmax(0,1fr) 74px 30px;gap:8px;align-items:center;font-size:12px;padding:3.5px 0;border-bottom:1px dotted var(--hair)}
.symp .bar{height:7px;border:1px solid var(--ink);background:var(--paper)}
.symp .bar i{display:block;height:100%;background:var(--blood)}
.symp .v{font-family:var(--mono);font-size:9.5px;text-align:right}

/* further sections */
.furt{display:flex;flex-wrap:wrap;gap:10px}
.furt button{
  border:1.5px solid var(--ink);background:var(--paper);padding:9px 18px;font-size:12.5px;font-variant:small-caps;letter-spacing:.06em;
  box-shadow:2.5px 2.5px 0 rgba(60,45,25,.25);transition:transform .15s ease,box-shadow .15s ease,background .15s;
}
.furt button:hover{background:#FBF6EA;transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 rgba(128,43,33,.35)}
.furt button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(60,45,25,.25)}
.furt button .no{color:var(--blood);font-family:var(--mono);font-size:10px;margin-right:7px}
.furtnote{margin-top:12px;font-size:11.5px;font-style:italic;color:var(--dim)}

.empty{border:1.5px dashed var(--ink);padding:26px;text-align:center;font-style:italic;color:var(--dim);margin-top:30px}
.colophon{text-align:center;margin-top:28px;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim)}
</style>
</head>
<body>
<div class="atlas">
<header class="tp">
  <div class="vol">Atlas minor · quarta editio</div>
  <h1>Tabulae Anatomicae Campaigni</h1>
  <div class="sub">The Anatomy of a Campaign, laid open for the instruction of Strategists</div>
  <div class="rule">❦</div>
  <div class="ask" id="s-ask"></div>
  <div class="url" id="s-url"></div>
  <div class="imprim" id="s-imprim"></div>
</header>
<main id="app"></main>
<div class="colophon" id="colo"></div>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[2,6,7,12].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-ask').innerHTML='<span class="sujet">The subject presented for dissection: <b>“'+esc((B.sub&&B.sub.prompt)||B.title||'')+'”</b></span>';
document.getElementById('s-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'procured from <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';
document.getElementById('s-imprim').textContent=(B.urlContext&&B.urlContext.title)?('Corpus: '+B.urlContext.title+' — '+dt(B.createdAt||B.fetchedAt)):'';
document.getElementById('colo').textContent='EX MUSEO MARQUE · CATALOGUE '+String(B.id||'—').slice(0,8).toUpperCase()+' · '+(B.urlContext&&B.urlContext.description?esc(B.urlContext.description.slice(0,90))+'…':'');

const M=document.getElementById('app');
const plate=(tab,title,lat,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="plate"><div class="plateh"><span class="tab">'+esc(tab)+'</span><h2>'+esc(title)+'</h2><span class="lat">'+esc(lat)+'</span></div>'+body+'</section>'));
};

/* engraved figures — hatch pattern + fine stroke */
const hatch='<defs><pattern id="ht" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="rgba(38,32,26,.35)" stroke-width="1"/></pattern><pattern id="htr" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="rgba(128,43,33,.4)" stroke-width="1"/></pattern></defs>';
const HEAD='<svg viewBox="0 0 160 170">'+hatch+
'<path d="M96 14 C66 10 44 30 40 58 C37 74 42 84 40 92 L32 106 L46 108 C44 114 48 120 56 122 C54 132 60 142 70 146 L72 162 L116 162 L114 128 C138 112 150 86 146 58 C142 30 120 17 96 14 Z" fill="none" stroke="#26201A" stroke-width="1.6"/>'+
'<path d="M96 14 C66 10 44 30 40 58 C37 74 42 84 40 92 L32 106 L46 108 C44 114 48 120 56 122 C54 132 60 142 70 146 L72 162 L116 162 L114 128 C138 112 150 86 146 58 C142 30 120 17 96 14 Z" fill="url(#ht)" opacity=".5"/>'+
'<ellipse cx="92" cy="72" rx="34" ry="26" fill="url(#htr)" opacity=".65" stroke="#802B21" stroke-width="1.2"/>'+
'<path d="M60 66q32-18 64 0M60 80q32 18 64 0" fill="none" stroke="#802B21" stroke-width=".8"/>'+
'<line x1="126" y1="72" x2="150" y2="72" stroke="#26201A" stroke-width=".8"/><text x="152" y="75" font-family="Cardo,Georgia" font-size="9" fill="#802B21">1</text>'+
'<line x1="40" y1="92" x2="16" y2="92" stroke="#26201A" stroke-width=".8"/><text x="4" y="95" font-family="Cardo,Georgia" font-size="9" fill="#802B21">2</text>'+
'<line x1="98" y1="148" x2="98" y2="166" stroke="#26201A" stroke-width=".8"/><text x="92" y="169" font-family="Cardo,Georgia" font-size="9" fill="#802B21">3</text></svg>';

const ORGAN={
cor:'<svg viewBox="0 0 200 150">'+hatch+
'<path d="M78 26 C64 26 54 40 54 56 C54 84 82 104 100 124 C116 106 148 90 148 58 C148 40 136 28 122 28 C112 28 104 34 100 44 C96 34 88 26 78 26 Z" fill="url(#ht)" stroke="#26201A" stroke-width="1.6"/>'+
'<path d="M84 26 C82 14 90 8 98 8 M102 26 C104 12 114 6 124 8 M112 28 C118 18 128 16 136 20" fill="none" stroke="#26201A" stroke-width="2.4"/>'+
'<path d="M70 50 C80 58 96 62 108 60 M64 74 C78 82 96 86 116 82" fill="none" stroke="#802B21" stroke-width="1"/>'+
'<ellipse cx="100" cy="70" rx="16" ry="20" fill="url(#htr)" opacity=".7" stroke="#802B21" stroke-width="1"/>'+
'<line x1="148" y1="58" x2="178" y2="58" stroke="#26201A" stroke-width=".8"/><text x="182" y="61" font-family="Cardo" font-size="9" fill="#802B21">a</text>'+
'<line x1="54" y1="56" x2="24" y2="56" stroke="#26201A" stroke-width=".8"/><text x="14" y="59" font-family="Cardo" font-size="9" fill="#802B21">b</text></svg>',
oculus:'<svg viewBox="0 0 200 150">'+hatch+
'<path d="M18 76 Q100 22 182 76 Q100 130 18 76 Z" fill="url(#ht)" opacity=".6" stroke="#26201A" stroke-width="1.6"/>'+
'<circle cx="100" cy="76" r="28" fill="none" stroke="#26201A" stroke-width="1.4"/>'+
'<circle cx="100" cy="76" r="16" fill="url(#htr)" opacity=".7" stroke="#802B21" stroke-width="1"/>'+
'<circle cx="100" cy="76" r="6" fill="#26201A"/>'+
'<path d="M44 62 q-6 14 0 28 M156 62 q6 14 0 28" fill="none" stroke="#802B21" stroke-width="1"/>'+
'<line x1="100" y1="48" x2="100" y2="26" stroke="#26201A" stroke-width=".8"/><text x="97" y="20" font-family="Cardo" font-size="9" fill="#802B21">a</text>'+
'<line x1="144" y1="94" x2="172" y2="110" stroke="#26201A" stroke-width=".8"/><text x="176" y="114" font-family="Cardo" font-size="9" fill="#802B21">b</text></svg>',
cochlea:'<svg viewBox="0 0 200 150">'+hatch+
'<path d="M100 76 m0 -38 a38 38 0 1 1 -38 38 a30 30 0 1 0 30 -30 a22 22 0 1 1 -22 22 a14 14 0 1 0 14 -14 a7 7 0 1 1 -7 7" fill="none" stroke="#26201A" stroke-width="1.6"/>'+
'<path d="M100 38 a38 38 0 0 1 38 38 l22 -4 M114 116 l16 12" fill="none" stroke="#802B21" stroke-width="1.2"/>'+
'<ellipse cx="152" cy="66" rx="9" ry="5" fill="url(#ht)" stroke="#26201A" stroke-width="1.2" transform="rotate(20 152 66)"/>'+
'<ellipse cx="128" cy="124" rx="9" ry="5" fill="url(#ht)" stroke="#26201A" stroke-width="1.2" transform="rotate(40 128 124)"/>'+
'<circle cx="100" cy="76" r="3.5" fill="#802B21"/>'+
'<line x1="62" y1="50" x2="30" y2="30" stroke="#26201A" stroke-width=".8"/><text x="20" y="28" font-family="Cardo" font-size="9" fill="#802B21">a</text>'+
'<line x1="100" y1="76" x2="176" y2="76" stroke="#26201A" stroke-width=".8" stroke-dasharray="2 2"/><text x="180" y="79" font-family="Cardo" font-size="9" fill="#802B21">b</text></svg>',
cutis:'<svg viewBox="0 0 200 150">'+hatch+
'<path d="M20 34 q14 -6 28 0 t28 0 t28 0 t28 0 t28 0 t20 0 l0 26 l-160 0 z" fill="url(#ht)" stroke="#26201A" stroke-width="1.4"/>'+
'<rect x="20" y="60" width="160" height="46" fill="url(#htr)" opacity=".55" stroke="#26201A" stroke-width="1.2"/>'+
'<path d="M20 106 l160 0 l0 26 l-160 0 z" fill="none" stroke="#26201A" stroke-width="1.2"/>'+
'<circle cx="50" cy="120" r="9" fill="none" stroke="#26201A"/><circle cx="80" cy="122" r="11" fill="none" stroke="#26201A"/><circle cx="116" cy="119" r="8" fill="none" stroke="#26201A"/><circle cx="148" cy="122" r="10" fill="none" stroke="#26201A"/>'+
'<path d="M64 34 l30 -22 M70 40 l24 -18" stroke="#26201A" stroke-width="1.6"/>'+
'<path d="M120 60 q10 18 -4 24 q-14 6 -8 22" fill="none" stroke="#802B21" stroke-width="1.2"/>'+
'<line x1="180" y1="46" x2="192" y2="46" stroke="#26201A" stroke-width=".8"/><text x="194" y="49" font-family="Cardo" font-size="9" fill="#802B21">a</text>'+
'<line x1="180" y1="84" x2="192" y2="84" stroke="#26201A" stroke-width=".8"/><text x="194" y="87" font-family="Cardo" font-size="9" fill="#802B21">b</text></svg>'
};
const FIGKEY=['cor','oculus','cochlea','cutis'];
const LATIN=['Cor Persuasionis','Oculus Narrativus','Cochlea Sympathiae','Cutis Humida'];
const LEADNOTE=['the seat of preference','the organ of regard','the spiral of sympathy','the membrane of condition'];
const NUM=['II','III','IV','V'];

/* §1 — the subject */
if(AR&&AR.lean){
  plate('Tabula I','The Subject, Examined Whole','habitus corporis',
  '<div class="subject"><div class="figwrap">'+HEAD+'<div class="cap">Fig. 1 — Caput audienciae; 1. sympathia, 2. ingressus, 3. radix.</div></div>'+
  '<div><span class="k">Habitus</span><div class="lean">'+esc(AR.lean.label||'—')+'</div>'+
  '<div class="tonus"><div class="bar"><i style="width:'+pct(AR.lean.confidence)+'%"></i></div><div class="cap"><span>TONUS / TONE OF THE FIBRE</span><span>'+f2(AR.lean.confidence)+'</span></div></div>'+
  '<span class="k">Histological notes</span><ul class="notes">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'+
  '<div class="catno">SPECIMEN '+String(B.id||'—').slice(0,8).toUpperCase()+' · PREPARED '+dt(B.createdAt||B.fetchedAt)+'</div></div>'+
  '<div><span class="k">Innervation, by region</span><div class="innerv">'+(AR.mediaHabits||[]).map(h=>'<b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span>').join('')+'</div>'+
  '<div style="margin-top:16px"><span class="k">Nomenclatura vulgaris</span><div class="nomina">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>'+
  '</div>');
}

/* §2 — the four organs */
if(strats.length){
  plate('Tabulae II–V','The Organs of Persuasion','four systems, separately figured',
  '<div class="organs">'+strats.map((s,i)=>{
    return '<article class="organ'+(i===sel?' chosen':'')+'"><div class="pn"><span>TAB. '+NUM[i]+' · FIG. '+(i+1)+'</span>'+(i===sel?'<span class="ch">exemplar selectum</span>':'')+'</div>'+
    '<h3>'+esc(s.title)+'</h3><div class="lat">'+esc(LATIN[i]||'Organum')+' — '+esc(s.angle||'')+'</div>'+
    '<div class="figrow"><div>'+ORGAN[FIGKEY[i%4]]+'</div>'+
    '<ul class="lead">'+(s.channels||[]).map((c,j)=>'<li><b>'+'abcd'[j]+'</b><span><span class="nm">'+esc(c.name)+'</span><span class="v">'+f2(c.fit)+' · '+esc(c.why||'—')+'</span></span></li>').join('')+
    '<li><b>'+String.fromCharCode(97+(s.channels||[]).length)+'</b><span><span class="nm">resistentia</span><span class="v">'+f2(s.audienceFit&&s.audienceFit.score)+' fibre-tone</span></span></li></ul></div>'+
    '<div class="expl">'+esc(LEADNOTE[i%4])+'; '+(s.audienceFit&&s.audienceFit.notes||[]).map(esc).join('; ')+'.</div>'+
    '<div class="fmt">'+(s.formats||[]).map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
    '<div class="res"><span>Extent of supply: <b>'+views(s.reach&&s.reach.estViews)+'</b> fibres</span><small>'+esc(s.reach&&s.reach.basis||'')+'</small></div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="cau"><b>Monitum.</b> '+esc(s.watchouts[0])+'</div>':'')+
    '</article>'}).join('')+'</div>');
}

/* §3 — excisions */
if(anti.length){
  plate('Tabula VI','Partes Exsectae','tissue excised and not retained',
  '<div class="excis">'+anti.map(a=>'<div class="exc"><h4>'+esc(a.title)+'</h4><div class="ch">region · '+esc(a.channel)+' — excised</div><p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>');
}

/* §4 — diagnosis + preparations */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  plate('Tabula VII','Diagnosis & Preparations','the case stated, the specimens mounted',
  '<div class="diag"><div class="card"><div class="k2">Diagnosis</div>'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Patient</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Prognosis</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Active element</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<div class="lede">no diagnosis recorded</div>')+
  '<div class="foot">Signed, the Demonstrator of Anatomy.</div></div>'+
  '<div class="preps">'+CREAT.map((m,i)=>
    '<figure class="prep"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" loading="lazy" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
    '<figcaption><span class="h">Prep. '+'αβγδ'[i]+' — '+esc(m.head)+'</span><span class="p">stained per · '+esc(m.provider)+'</span></figcaption></figure>').join('')+
  '</div></div>');
}

/* §5 — tinctures */
plate('Tabula VIII','Tincturae','stains for the sections, standardised',
  '<div class="tincts">'+PALETTE.map((s,i)=>
    '<div class="tinct"><div class="vial" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">SOL. '+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+
  '</div>');

/* §6 — registry */
if(B.evidence||affs.length){
  plate('Tabula IX','Registrum Speciminum','sessions at the Qloo Institute, duly minuted',
  '<div class="reg"><p class="mem"><b>MEMORANDUM.</b> The specimens herein were received from the <b>Institutio Qloo</b> in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'—').toUpperCase()+' mode</b> over <b>'+calls.length+' dissection sessions</b>; every fibre is traceable to its source.</p>'+
  '<div class="regg"><div><table class="sess"><thead><tr><th>Instrument</th><th>N</th><th>Ms.</th><th>Mode</th></tr></thead><tbody>'+
  calls.map(c=>'<tr><td><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,20)).join(' '))+'</span></td>'+
    '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
  '</tbody></table></div>'+
  '<div class="symp">'+affs.map(g=>'<div class="g">Index sympathiae · '+esc(g.type.replace('urn:entity:',''))+'</div>'+
    g.entities.slice(0,4).map(e=>'<div class="row"><span class="nm">'+esc(e.name)+'</span><span class="bar"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
  '</div></div></div>');
}

/* §7 — further sections */
plate('Tabula X','Requisitiones','further sections, upon application',
  '<div class="furt">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map((x,i)=>'<button type="button"><span class="no">§'+['XI','XII','XIII','XIV'][i]+'</span>'+esc(x)+'</button>').join('')+'</div>'+
  '<div class="furtnote">Sections are prepared within the week; a nominal fee covers the mounting.</div>');

if(!M.children.length)M.appendChild(el('<div class="empty">The theatre is empty — data.js was never received. No dissection performed.</div>'));
})();
</script>
