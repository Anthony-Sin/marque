<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque &amp; Co. — Dispensing Chemists</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F4EAD3'/%3E%3Crect x='24' y='16' width='16' height='34' rx='4' fill='%239A5B1F'/%3E%3Crect x='27' y='10' width='10' height='8' fill='%233B2A1A'/%3E%3Crect x='26' y='26' width='12' height='16' fill='%23F4EAD3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#2A2118;
  --paper:#F4EAD3;
  --paper-2:#EDE0C2;
  --ink:#3B2A1A;
  --dim:#7A6547;
  --amber:#9A5B1F;
  --amber-dk:#6E3F14;
  --hair:#C9B58B;
  --fell:'IM Fell English',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--wall);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,transparent 3px 90px),linear-gradient(#322719,#211A11);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(154,91,31,.3)}
a{color:var(--amber-dk);border-bottom:1px dotted var(--amber-dk);text-decoration:none}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--amber-dk);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.counter{max-width:1100px;margin:26px auto 64px;padding:0 clamp(8px,2vw,20px)}

/* hanging sign */
.sign{
  background:linear-gradient(#F7EFDC,#EFE2C4);
  border:2px solid var(--ink);padding:clamp(20px,4vw,36px) clamp(16px,4vw,40px);text-align:center;position:relative;
  box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 5px var(--paper),inset 0 0 0 6.5px var(--ink);
}
.sign::before,.sign::after{content:"";position:absolute;top:-38px;width:2px;height:38px;background:#171310}
.sign::before{left:22%}.sign::after{right:22%}
.sign .est{font-family:var(--fell);font-size:10.5px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
.sign h1{font-family:var(--fell);font-weight:400;font-size:clamp(26px,5vw,44px);letter-spacing:.04em;margin:8px 0 4px}
.sign h1 em{font-style:normal;color:var(--amber-dk)}
.sign .tag{font-family:var(--fell);font-style:italic;font-size:clamp(13px,2vw,16px);color:var(--dim)}
.sign .ask{margin:16px auto 0;max-width:600px;font-family:var(--fell);font-size:clamp(15px,2.2vw,19px)}
.sign .ask em{font-style:normal;color:var(--amber-dk)}
.sign .url{font-family:var(--mono);font-size:10.5px;margin-top:10px;color:var(--dim);overflow-wrap:anywhere}
.sign .src{font-size:11.5px;font-style:italic;color:var(--dim);margin-top:5px}

/* labelled drawers / shelf sections */
.shelf{
  margin-top:26px;background:var(--paper);
  border:1.5px solid var(--ink);position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 0 0 4px var(--paper-2),inset 0 0 0 5.5px var(--hair);
  padding:clamp(26px,4vw,40px) clamp(18px,3.4vw,34px) clamp(18px,3.4vw,34px);
}
.shelf>.plaque{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-family:var(--fell);
  font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;padding:5px 20px 4px;white-space:normal;text-align:center;max-width:86%;line-height:1.4;
}
.sech{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:9px;margin-bottom:16px}
.sech h2{font-family:var(--fell);font-weight:400;font-size:clamp(18px,2.8vw,26px)}
.sech h2 i{color:var(--amber-dk)}
.sech .lat{margin-left:auto;font-family:var(--fell);font-style:italic;font-size:12px;color:var(--dim)}

/* tinctura audience */
.tinct{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,32px);align-items:start}
.bottle{width:clamp(96px,14vw,140px);position:relative;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.bottle svg{width:100%;height:auto;display:block}
.tinct .lbl{font-family:var(--fell);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:8px}
.tinct .lean{font-family:var(--fell);font-size:clamp(22px,3.4vw,32px);line-height:1.05}
.tinct .dose{font-family:var(--fell);font-style:italic;font-size:12.5px;color:var(--dim);margin:6px 0 10px}
.tinct .balance-hint{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tinct .grad{flex:1;height:10px;border:1px solid var(--ink);position:relative;background:repeating-linear-gradient(90deg,transparent 0 12.4%,rgba(59,42,26,.18) 12.4% 12.9%)}
.tinct .grad i{position:absolute;top:-4px;bottom:-4px;width:2.5px;background:var(--amber-dk)}
.tinct ul{list-style:none}
.tinct li{font-family:var(--fell);font-size:13px;padding:5px 0;border-bottom:1px dotted var(--hair)}
.tinct li::before{content:"℞ ";color:var(--amber-dk)}
.tinct .hab{display:grid;grid-template-columns:88px 1fr;gap:3px 12px;font-size:12.5px;padding:6px 0;border-bottom:1px dotted var(--hair)}
.tinct .hab:last-child{border-bottom:none}
.tinct .hab b{font-family:var(--fell);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber-dk);padding-top:2px}
.tinct .hab span{font-style:italic}
.tinct .vibes{display:flex;flex-wrap:wrap;gap:8px}
.tinct .vibes span{font-family:var(--fell);font-size:11.5px;font-style:italic;border:1px solid var(--ink);padding:3px 11px;background:rgba(255,255,255,.4);border-radius:11px}
.batch{margin-top:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--dim);border-top:1px solid var(--hair);padding-top:9px}

/* formulae — strategy labels + balance */
.formulae{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.formula{
  border:1.5px solid var(--ink);background:linear-gradient(#F8F1DE,#F0E4C8);
  padding:18px 20px;position:relative;
  box-shadow:inset 0 0 0 3.5px var(--paper),inset 0 0 0 4.5px var(--hair);
}
.formula.best{box-shadow:inset 0 0 0 3.5px var(--paper),inset 0 0 0 4.5px var(--amber-dk)}
.formula .rx{position:absolute;top:12px;right:16px;font-family:var(--fell);font-size:22px;color:var(--amber-dk)}
.formula .fn{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.formula h3{font-family:var(--fell);font-weight:400;font-size:clamp(18px,2.6vw,24px);line-height:1.15;margin-top:4px}
.formula .lat{font-family:var(--fell);font-style:italic;font-size:12px;color:var(--amber-dk);margin:3px 0 12px}
.formula .scale{margin:8px 0 4px}
.formula .chrow{display:grid;grid-template-columns:74px 1fr 58px;gap:4px 10px;align-items:center;font-size:11.5px;padding:4px 0;border-bottom:1px dotted var(--hair)}
.formula .chrow b{font-family:var(--fell);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-dk)}
.formula .chrow .dots{display:flex;gap:3px}
.formula .chrow .dots i{width:9px;height:9px;border:1px solid var(--ink);border-radius:50%}
.formula .chrow .dots i.f{background:var(--ink)}
.formula .chrow .v{font-family:var(--mono);font-size:10px;text-align:right}
.formula .chwhy{font-size:10.5px;font-style:italic;color:var(--dim);grid-column:2/4}
.formula .yield{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1.5px solid var(--ink);margin-top:12px;padding-top:9px}
.formula .yield b{font-family:var(--fell);font-size:19px;font-weight:400}
.formula .yield small{font-size:10.5px;font-style:italic;color:var(--dim);text-align:right;max-width:230px}
.formula .cau{font-family:var(--fell);font-size:11.5px;color:var(--amber-dk);margin-top:9px;font-style:italic}
.formula .cau b{font-style:normal;letter-spacing:.18em;font-size:9px}
.formula .fmt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.formula .fmt span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--dim);color:var(--dim);padding:2px 8px}

/* contraindicata */
.contra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ccard{border:1.5px dashed var(--amber-dk);padding:12px 16px;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;background:rgba(154,91,31,.05)}
.ccard .sk{font-family:var(--fell);color:var(--amber-dk);font-size:20px;text-align:center}
.ccard b{font-family:var(--fell);font-size:15px;font-weight:400;text-decoration:line-through;text-decoration-color:var(--amber-dk)}
.ccard .chan{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-left:8px}
.ccard p{font-size:11.5px;font-style:italic;color:var(--dim);margin-top:3px}

/* prescription pad + specimen cards */
.rxpad{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.45fr);gap:0;border:1.5px solid var(--ink);background:#FBF6E8}
.rxpad .pad{
  padding:22px 24px;border-right:1.5px dashed var(--hair);position:relative;
  background:repeating-linear-gradient(180deg,transparent 0 26px,rgba(154,91,31,.12) 26px 27px);
}
.rxpad .pad .rxsym{font-family:var(--fell);font-size:44px;color:var(--amber-dk);line-height:1}
.rxpad .pad h3{font-family:var(--fell);font-weight:400;font-size:clamp(19px,2.8vw,27px);margin:8px 0 4px}
.rxpad .pad .ba{font-style:italic;color:var(--amber-dk);font-size:12.5px;margin-bottom:14px}
.rxpad .pad dl{display:grid;grid-template-columns:76px 1fr;gap:8px 14px;font-size:12.5px}
.rxpad .pad dt{font-family:var(--fell);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);padding-top:3px}
.rxpad .pad dd.msg{font-family:var(--fell);font-style:italic;font-size:15px}
.rxpad .sig{margin-top:18px;display:flex;align-items:flex-end;gap:12px}
.rxpad .sig .line{flex:1;border-bottom:1px solid var(--ink);font-family:var(--fell);font-style:italic;font-size:15px;color:var(--amber-dk);padding-bottom:2px}
.rxpad .sig span{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.specgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.spec{padding:12px 14px;border-right:1px dashed var(--hair);border-bottom:1px dashed var(--hair)}
.spec:nth-child(2n){border-right:none}
.spec:nth-last-child(-n+2){border-bottom:none}
.spec .jar{border:1.5px solid var(--ink);background:var(--paper-2);padding:5px;position:relative}
.spec .jar::before{content:"";position:absolute;top:-1px;left:14%;right:14%;height:5px;background:var(--amber);border:1.5px solid var(--ink);border-bottom:none;border-radius:3px 3px 0 0}
.spec img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:sepia(.3) contrast(1.02) saturate(.9)}
.spec figcaption{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:8px;font-size:11px}
.spec .h{min-width:0;overflow-wrap:anywhere;font-family:var(--fell);font-style:italic}
.spec .p{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);padding:1px 7px;white-space:nowrap}

/* pigmenta */
.jars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.jar2{text-align:center}
.jar2 .sw{height:70px;border:1.5px solid var(--ink);border-radius:0 0 6px 6px;position:relative}
.jar2 .sw::before{content:"";position:absolute;top:-7px;left:20%;right:20%;height:7px;background:var(--amber);border:1.5px solid var(--ink);border-radius:3px 3px 0 0}
.jar2 .n{font-family:var(--fell);font-size:13.5px;margin-top:9px}
.jar2 .h{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.1em}

/* probata — wax sealed provenance */
.prob{display:grid;grid-template-columns:minmax(0,1.15fr) auto;gap:26px;align-items:start}
.prob .pre{font-family:var(--fell);font-size:13.5px;line-height:1.8;margin-bottom:16px}
.prob .pre b{letter-spacing:.08em}
.probgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
table.reg{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
.reg th{font-family:var(--fell);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);text-align:left;border-bottom:1.5px solid var(--ink);padding:4px}
.reg td{padding:6px 4px;border-bottom:1px dotted var(--hair);vertical-align:top}
.reg .pm{display:block;color:var(--dim);font-size:8.5px;overflow-wrap:anywhere}
.reg .md{border:1px solid var(--amber-dk);color:var(--amber-dk);font-size:8px;padding:0 5px}
.ing .g{font-family:var(--fell);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--amber-dk);border-bottom:1px solid var(--ink);padding-bottom:4px;margin:14px 0 5px}
.ing .g:first-child{margin-top:0}
.ing .row{display:flex;align-items:center;gap:10px;font-size:11.5px;padding:4px 0;border-bottom:1px dotted var(--hair)}
.ing .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
.ing .row .cb{width:58px;height:7px;border:1px solid var(--ink);padding:1px}
.ing .row .cb i{display:block;height:100%;background:var(--ink)}
.ing .row .v{font-family:var(--mono);font-size:9.5px}
.waxcol{text-align:center;padding-top:6px}
.wax{width:120px;height:120px;margin:0 auto;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
.waxcol .cap{font-family:var(--fell);font-style:italic;font-size:11px;color:var(--dim);margin-top:10px;max-width:160px}

/* refills */
.refills{display:flex;flex-wrap:wrap;gap:16px}
.tag2{
  font-family:var(--fell);font-size:12.5px;font-style:italic;
  background:var(--paper);border:1.5px solid var(--ink);padding:9px 20px 8px 26px;position:relative;
  box-shadow:2px 3px 0 rgba(0,0,0,.18);transition:.15s;
}
.tag2::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;border:1.5px solid var(--ink);border-radius:50%;transform:translateY(-50%);background:var(--paper-2)}
.tag2:hover{border-color:var(--amber-dk);color:var(--amber-dk);transform:rotate(-1deg)}
.tag2:active{transform:translate(1px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.18)}

.foot{margin-top:34px;text-align:center;font-family:var(--fell);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.empty{border:1.5px dashed var(--ink);background:var(--paper);padding:44px;text-align:center;font-family:var(--fell);font-style:italic;margin-top:26px}

@media(max-width:920px){
  .tinct{grid-template-columns:auto 1fr}
  .tinct .right{grid-column:1/-1}
  .formulae{grid-template-columns:1fr}
  .rxpad{grid-template-columns:1fr}
  .rxpad .pad{border-right:none;border-bottom:1.5px dashed var(--hair)}
  .prob{grid-template-columns:1fr}
  .probgrid{grid-template-columns:1fr}
  .jars{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:600px){
  .tinct{grid-template-columns:1fr}
  .bottle{margin:0 auto}
  .contra,.specgrid{grid-template-columns:1fr}
  .spec{border-right:none!important;border-bottom:1px dashed var(--hair)!important}
  .spec:last-child{border-bottom:none!important}
  .jars{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="counter">
  <header class="sign">
    <div class="est">EST. MMXXVI · BY APPOINTMENT TO THE CREATIVE CLASS</div>
    <h1>MARQUE <em>&amp;</em> CO.</h1>
    <div class="tag">Dispensing Chemists — Strategies, Tinctures &amp; Fine Campaigns</div>
    <p class="ask" id="s-ask">—</p>
    <p class="url" id="s-url"></p>
    <p class="src" id="s-src"></p>
  </header>
  <main id="app"></main>
  <footer class="foot">Nº <span id="f-no">—</span> · COMPOUNDED ON THE PREMISES · KEEP FROM DIRECT SUNLIGHT</footer>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const LATIN=['Tinctura Luxuriae','Elixir Cinematis','Potio Rhythmi','Aqua Insulae'];
const CREAT=[4,5,0,11].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||(s.reach&&s.reach.estViews)>(strats[b].reach&&strats[b].reach.estViews||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-ask').innerHTML='The patient requests: “'+esc((B.sub&&B.sub.prompt)||B.title||'').replace(/→/g,' <em>→</em>')+'”';
document.getElementById('s-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'Prescribed from <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';
document.getElementById('s-src').textContent=(B.urlContext&&B.urlContext.title)?('Of the house of '+B.urlContext.title+' — '+(B.urlContext.description||'')):'';
document.getElementById('f-no').textContent=(B.id||'—').slice(0,8).toUpperCase();

const M=document.getElementById('app');
const shelf=(plaque,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="shelf"><span class="plaque">'+esc(plaque)+'</span>'+body+'</section>'));
};

/* balance scale — beam tilts by fit */
const scale=(fit)=>{
  const t=Math.round((0.9-(fit||0))*22); /* higher fit → pans level */
  return '<svg class="scale" viewBox="0 0 220 96" width="220" style="max-width:100%">'+
  '<line x1="110" y1="14" x2="110" y2="66" stroke="#3B2A1A" stroke-width="2"/>'+
  '<path d="M96 66h28l-14 16z" fill="#3B2A1A"/>'+
  '<g transform="rotate('+(-t)+' 110 26)">'+
  '<line x1="30" y1="26" x2="190" y2="26" stroke="#3B2A1A" stroke-width="2"/>'+
  '<line x1="30" y1="26" x2="22" y2="50" stroke="#3B2A1A"/><line x1="30" y1="26" x2="38" y2="50" stroke="#3B2A1A"/>'+
  '<path d="M16 50q14 12 28 0z" fill="#9A5B1F" stroke="#3B2A1A"/>'+
  '<line x1="190" y1="26" x2="182" y2="50" stroke="#3B2A1A"/><line x1="190" y1="26" x2="198" y2="50" stroke="#3B2A1A"/>'+
  '<path d="M176 50q14 12 28 0z" fill="#EDE0C2" stroke="#3B2A1A"/></g>'+
  '<circle cx="110" cy="26" r="4" fill="#3B2A1A"/>'+
  '<text x="110" y="94" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="10" fill="#7A6547">fit weighed: '+f2(fit)+' — the beam '+(fit>=.9?'rests near true':'lists slightly')+'</text></svg>';
};

/* bottle svg for audience */
const bottle='<svg viewBox="0 0 90 160"><rect x="33" y="6" width="24" height="16" rx="2" fill="#3B2A1A"/><rect x="36" y="18" width="18" height="10" fill="#6E3F14"/>'+
'<path d="M30 28q-14 8 -14 26v84q0 14 14 14h30q14 0 14 -14v-84q0 -18 -14 -26z" fill="#9A5B1F" opacity=".9"/>'+
'<path d="M22 78v60q0 8 8 8h30q8 0 8 -8v-60z" fill="#6E3F14" opacity=".55"/>'+
'<rect x="24" y="58" width="42" height="48" fill="#F4EAD3" stroke="#3B2A1A"/>'+
'<text x="45" y="72" text-anchor="middle" font-family="Georgia" font-size="6.4" letter-spacing="1.4" fill="#3B2A1A">TINCTURA</text>'+
'<text x="45" y="81" text-anchor="middle" font-family="Georgia" font-size="6.4" letter-spacing="1.4" fill="#3B2A1A">AUDIENCIAE</text>'+
'<text x="45" y="93" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="5.6" fill="#7A6547">ex genibus novissimis</text>'+
'<line x1="28" y1="99" x2="62" y2="99" stroke="#9A5B1F"/>'+
'<text x="45" y="104" text-anchor="middle" font-family="Georgia" font-size="5" fill="#9A5B1F">MARQUE &amp; CO.</text></svg>';

/* I · tinctura audienciae */
if(AR&&AR.lean){
  shelf('TINCTURA AUDIENCIAE',
    '<div class="sech"><h2>Tinctura <i>Audienciae</i> — The Audience, Distilled</h2><span class="lat">a reading of the humours</span></div>'+
    '<div class="tinct"><div class="bottle">'+bottle+'</div>'+
    '<div><span class="lbl">Dominant humour</span><div class="lean">'+esc(AR.lean.label||'—')+'</div>'+
    '<div class="dose">potency assayed at '+pct(AR.lean.confidence)+' per cent</div>'+
    '<div class="balance-hint"><div class="grad"><i style="left:'+pct(AR.lean.confidence)+'%"></i></div><span style="font-family:var(--mono);font-size:9.5px;color:var(--dim)">'+f2(AR.lean.confidence)+'</span></div>'+
    '<ul>'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'+
    '<div class="batch">BATCH '+(B.id||'—').slice(0,8).toUpperCase()+' · '+(B.fetchedAt?new Date(B.fetchedAt).toISOString().slice(0,10):'—')+'</div></div>'+
    '<div class="right"><span class="lbl">Where the essence gathers</span>'+(AR.mediaHabits||[]).map(h=>'<div class="hab"><b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span></div>').join('')+
    '<div style="margin-top:14px"><span class="lbl">Botanicals named on the label</span><div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>'+
    '</div>');
}

/* II · formulae */
if(strats.length){
  shelf('FORMULAE — FOUR PRESCRIPTIONS COMPOUNDED',
    '<div class="sech"><h2>The Formulae, <i>Weighed &amp; Measured</i></h2><span class="lat">each channel apportioned by grains</span></div>'+
    '<div class="formulae">'+strats.map((s,i)=>
      '<article class="formula'+(i===sel?' best':'')+'"><span class="rx">℞</span>'+
      '<div class="fn">FORMULA '+['I','II','III','IV'][i]+(i===sel?' · SELECTED':'')+'</div>'+
      '<h3>'+esc(s.title)+'</h3><div class="lat">'+esc(LATIN[i]||'Tinctura')+' — '+esc(s.angle)+'</div>'+
      scale(s.audienceFit&&s.audienceFit.score)+
      (s.channels||[]).map(c=>'<div class="chrow"><b>'+esc(c.name)+'</b><span class="dots">'+Array.from({length:5},(_,d)=>'<i'+(d<Math.round((c.fit||0)*5)?' class="f"':'')+'></i>').join('')+'</span><span class="v">'+f2(c.fit)+'</span><span class="chwhy">per '+esc(c.why||'—')+'</span></div>').join('')+
      '<div class="fmt">'+(s.formats||[]).map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
      '<div class="yield"><span>Yield: <b>'+views(s.reach&&s.reach.estViews)+'</b> doses</span><small>'+esc(s.reach&&s.reach.basis||'')+'</small></div>'+
      ((s.watchouts&&s.watchouts[0])?'<div class="cau"><b>CAUTIO.</b> '+esc(s.watchouts[0])+'</div>':'')+
      '</article>').join('')+'</div>');
}

/* III · contraindicata */
if(anti.length){
  shelf('CONTRAINDICATA — NOT TO BE DISPENSED',
    '<div class="sech"><h2>Struck <i>from the Pharmacopœia</i></h2><span class="lat">harmful to this constitution</span></div>'+
    '<div class="contra">'+anti.map(a=>'<div class="ccard"><span class="sk">☠</span><div><b>'+esc(a.title)+'</b><span class="chan">'+esc(a.channel)+'</span><p>'+esc(a.whyNot)+'</p></div></div>').join('')+'</div>');
}

/* IV · prescription pad + specimen cards */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  shelf('SCRIPTUM — THE PRESCRIPTION & ITS PREPARATIONS',
    '<div class="rxpad"><div class="pad"><div class="rxsym">℞</div>'+
    (br?'<h3>'+esc(br.title)+'</h3><p class="ba">'+esc(br.angle)+'</p>'+
    '<dl><dt>To be given to</dt><dd>'+esc(br.audience)+'</dd>'+
    '<dt>Sig.</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
    '<dt>Active agent</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<p class="ba">no prescription written</p>')+
    '<div class="sig"><div class="line">Marque, Dispenser</div><span>M.D. Strategiae</span></div>'+
    '</div>'+
    '<div class="specgrid">'+CREAT.map((m,i)=>
      '<figure class="spec"><div class="jar"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
      '<figcaption><span class="h">Spec. '+'abcd'[i]+'. '+esc(m.head)+'</span><span class="p">'+esc(m.provider)+'</span></figcaption></figure>').join('')+
    '</div></div>');
}

/* V · pigmenta */
shelf('PIGMENTA — COLOURS FOR THE LABELS',
  '<div class="sech"><h2>Pigments <i>in Amber Glass</i></h2><span class="lat">ground fine, kept dark</span></div>'+
  '<div class="jars">'+PALETTE.map((s,i)=>
    '<div class="jar2"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">PIG.'+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+
  '</div>');

/* VI · probata — wax sealed provenance */
if(B.evidence||affs.length){
  shelf('PROBATA — SEALED & SWORN',
    '<div class="prob"><div>'+
    '<p class="pre"><b>MEMORANDUM.</b> We, Marque &amp; Co., do hereby attest that the essences herein were drawn from the <b>Qloo still</b> in '+
    '<b>'+(B.qlooBundle&&B.qlooBundle.mode?B.qlooBundle.mode.toUpperCase():'—')+' mode</b> over <b>'+calls.length+' distillations</b>, and that no artificial flavouring has been added.</p>'+
    '<div class="probgrid"><div><div class="sech" style="border-bottom:1.5px solid var(--ink)"><h2 style="font-size:16px">Register of Distillations</h2><span class="lat">api calls</span></div>'+
    '<table class="reg"><thead><tr><th>Alembic</th><th>N</th><th>Ms</th><th>Mode</th></tr></thead><tbody>'+
    calls.map(c=>'<tr><td>'+esc(c.endpoint)+'<span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,18)).join(' '))+'</span></td>'+
      '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
    '</tbody></table></div>'+
    '<div class="ing">'+affs.map(g=>'<div class="g">materia · '+esc(g.type.replace('urn:entity:',''))+'</div>'+
      g.entities.slice(0,4).map(e=>'<div class="row"><span class="nm">'+esc(e.name)+'</span><span class="cb"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
    '</div></div></div>'+
    '<div class="waxcol"><svg class="wax" viewBox="0 0 120 120"><path d="M60 8c6 2 14-2 20 3s10 8 15 15 4 13 8 19 8 9 5 17-1 14-6 19-8 12-15 15-14 1-21 3-14 5-21 0-13-8-17-15-10-9-11-17 2-14-1-21-1-15 5-19 12-8 17-14S54 6 60 8z" fill="#8E3B23"/><circle cx="60" cy="58" r="40" fill="#A3472C"/><circle cx="60" cy="58" r="33" fill="none" stroke="#7C2F1B" stroke-width="1.5"/>'+
    '<text x="60" y="50" text-anchor="middle" font-family="Georgia" font-size="9" letter-spacing="2" fill="#F4EAD3">MARQUE</text>'+
    '<text x="60" y="64" text-anchor="middle" font-family="Georgia" font-size="13" letter-spacing="2.5" fill="#F4EAD3">PROBATUM</text>'+
    '<text x="60" y="76" text-anchor="middle" font-family="Georgia" font-size="6.5" letter-spacing="1.5" fill="#F4EAD3">QLOO VERIFIED</text></svg>'+
    '<div class="cap">Sealed in our wax; the provenance of every signal is thus made fast.</div></div>'+
    '</div>');
}

/* VII · refills */
shelf('REFILLS — FURTHER PREPARATIONS',
  '<div class="sech"><h2>Order <i>Against Future Want</i></h2><span class="lat">tied with string, sent by post</span></div>'+
  '<div class="refills">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button class="tag2">'+x+'</button>').join('')+'</div>');

if(!M.children.length)M.appendChild(el('<div class="empty">The dispensary is bare — data.js failed to load. No prescription filled.</div>'));
})();
</script>
