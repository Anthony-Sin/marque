<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque 50mm — Aperture Ring</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231B1B1A'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23D8D2C0' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%23D8D2C0' stroke-width='2'/%3E%3Crect x='30' y='8' width='4' height='10' fill='%23E8622C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --metal:#1B1B1A;--metal2:#242422;--metal3:#2E2E2B;--eng:#D8D2C0;--eng2:#9E9A88;
  --idx:#E8622C;--glass:#0C0C0B;--line:#3A3A36;
  --f:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#121212 radial-gradient(ellipse at 50% -10%,rgba(60,58,50,.7),transparent 55%);
  color:var(--eng);font-family:var(--f);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(232,98,44,.4)}
a{color:var(--eng);text-decoration:none;border-bottom:1.5px solid var(--idx);word-break:break-all}
a:hover{color:#fff;border-color:#fff}
a:focus-visible,button:focus-visible{outline:3px solid var(--idx);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}
.lens{max-width:960px;margin:0 auto 84px;padding:0 clamp(8px,2.4vw,22px)}

/* mount cap header */
.cap{margin-top:26px;border:2px solid var(--line);background:linear-gradient(170deg,var(--metal3),var(--metal));
  border-radius:8px;padding:clamp(14px,3.4vw,22px) clamp(14px,4vw,30px);
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 26px rgba(0,0,0,.55)}
.cap h1{font-size:clamp(19px,4.6vw,32px);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.cap h1 span{color:var(--idx)}
.cap .sn{text-align:right;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--eng2)}
.cap .sn b{display:block;font-size:13px;color:var(--eng);letter-spacing:.1em;font-weight:500}

/* the barrel — every section is a ring */
.barrel{margin-top:16px;border:2px solid var(--line);border-radius:10px;overflow:hidden;
  background:linear-gradient(180deg,var(--metal2),var(--metal));
  box-shadow:0 14px 34px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07)}
.ring{border-bottom:2px solid var(--line);padding:clamp(14px,3.6vw,22px) clamp(12px,3.8vw,30px);position:relative}
.ring:last-child{border-bottom:none}
.knurl{border-bottom:2px solid var(--line);height:12px;
  background:repeating-linear-gradient(115deg,#33332F 0 5px,#222220 5px 10px);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.5),inset 0 2px 3px rgba(0,0,0,.5)}
.ring .tag{position:absolute;top:clamp(14px,3.6vw,20px);right:clamp(12px,3.8vw,26px);
  font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--idx);font-weight:600}
.eng-name{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--eng2);margin-bottom:6px}

/* identity ring = ask */
.idname{font-size:clamp(17px,4.4vw,27px);font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.15}
.idname .f-stop{color:var(--idx)}
.idrow{display:flex;flex-wrap:wrap;gap:6px 30px;margin-top:10px}
.idrow div{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--eng2)}
.idrow b{display:block;font-size:12.5px;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--eng);margin-top:2px}
.indexline{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--idx);opacity:.9;pointer-events:none}
.indexline::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top:9px solid var(--idx)}

/* focus ring = audience */
.fscale{position:relative;margin:8px 0 4px;padding:14px 0 0}
.fscale .marks{display:flex;justify-content:space-between;position:relative;border-top:1.5px solid var(--line);padding-top:6px}
.fscale .mk{font-size:10px;color:var(--eng2);position:relative;text-align:center;flex:1}
.fscale .mk::before{content:"";position:absolute;top:-8px;left:50%;width:1.5px;height:6px;background:var(--eng2)}
.fscale .mk.on{color:var(--idx);font-weight:600}
.fscale .mk.on::before{background:var(--idx);height:9px;top:-10px;width:2px}
.fread{display:flex;flex-wrap:wrap;gap:4px 26px;align-items:baseline;margin-top:10px}
.fread .lean{font-size:clamp(20px,4.6vw,30px);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fread .conf{color:var(--eng2);font-size:12px}
.fread .conf b{color:var(--idx);font-weight:600}
.dof{margin-top:12px;display:grid;gap:6px}
.dof .r{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;font-size:11.5px}
@media(max-width:460px){.dof .r{grid-template-columns:76px 1fr auto}}
.dof .c{text-transform:uppercase;letter-spacing:.1em;color:var(--eng)}
.dof .track{position:relative;height:10px;border:1px solid var(--line);background:#222220}
.dof .track i{position:absolute;top:0;bottom:0;left:15%;right:15%;background:rgba(216,210,192,.18);border-left:2px solid var(--idx);border-right:2px solid var(--idx)}
.dof .n{font-size:11px;color:var(--eng2);font-style:normal;text-align:right;max-width:150px}
.sigs{margin-top:10px;font-size:11.5px;color:var(--eng2);letter-spacing:.04em}
.sigs b{color:var(--eng);font-weight:500}
.vibes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vibes span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--eng2);color:var(--eng);padding:1px 10px;border-radius:2px}

/* aperture ring = strategies */
.aperture .detent{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;
  padding:13px 4px;border-bottom:1.5px dashed var(--line);position:relative;transition:background .12s ease}
.aperture .detent:hover{background:rgba(255,255,255,.035)}
.aperture .detent:last-child{border-bottom:none}
.aperture .detent.hot{background:linear-gradient(90deg,rgba(232,98,44,.1),transparent 70%)}
@media(max-width:640px){.aperture .detent{grid-template-columns:62px 1fr}}
@media(max-width:640px){.aperture .detent .ev{grid-column:2}}
.fstop{font-size:clamp(24px,6vw,38px);font-weight:700;color:var(--eng);letter-spacing:-.02em;line-height:1}
.fstop small{font-size:.42em;font-weight:500;color:var(--eng2);letter-spacing:.08em}
.detent.hot .fstop{color:var(--idx)}
.detent h3{font-size:clamp(16px,3.6vw,22px);font-weight:600;text-transform:uppercase;letter-spacing:.07em;line-height:1.05}
.detent .ang{font-size:11px;color:var(--eng2);letter-spacing:.06em;margin-top:2px}
.detent .tickrow{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.detent .tk{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--eng2)}
.detent .tk b{color:var(--eng);font-weight:600}
.detent .tk i{font-style:italic;text-transform:none;letter-spacing:0;color:#7E7A6A}
.detent .fmt{margin-top:6px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7E7A6A}
.detent .ev{text-align:right}
.detent .ev b{font-size:clamp(16px,4vw,22px);font-weight:600;color:var(--eng)}
.detent.hot .ev b{color:var(--idx)}
.detent .ev span{display:block;font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--eng2)}
.detent .watch{grid-column:2/-1;font-size:11px;color:#B09A6E;font-style:italic;margin-top:4px}
.detent .watch b{font-style:normal;font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:var(--idx);display:block}
.detent .basis{grid-column:2/-1;font-size:10.5px;color:#7E7A6A;font-style:italic}
.detent .click{position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:6px;height:26px;background:var(--idx);border-radius:0 3px 3px 0;display:none}
.detent.hot .click{display:block}

/* infrared marks = ruled out */
.ir{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,14px)}
@media(max-width:820px){.ir{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.ir{grid-template-columns:1fr}}
.mark{border:1.5px solid var(--line);background:#232320;padding:11px 13px;position:relative}
.mark::before{content:"";position:absolute;left:13px;top:-6px;width:14px;height:14px;background:var(--idx);
  clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.85}
.mark .ch{margin-top:6px;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--idx);font-weight:600}
.mark h4{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.mark h4 s{text-decoration-color:var(--idx)}
.mark .why{font-size:11.5px;color:var(--eng2);font-style:italic;margin-top:5px;line-height:1.45}

/* shot plate = brief + exposures = creatives */
.plate{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(16px,3.4vw,30px);align-items:start}
@media(max-width:800px){.plate{grid-template-columns:1fr}}
.engraved{border:1.5px solid var(--line);background:linear-gradient(160deg,#2A2A27,#1E1E1C);padding:14px 16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.engraved .sal{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--idx);font-weight:600}
.engraved h3{font-size:clamp(20px,4.4vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.engraved .ang{font-size:13px;margin-top:6px;color:var(--eng)}
.engraved dl{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;margin-top:12px;font-size:12.5px}
.engraved dt{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--eng2);padding-top:4px}
.engraved dd{border-bottom:1px solid var(--line);padding-bottom:6px}
.engraved .km{font-weight:600;font-size:14.5px;color:#fff}
.exps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:430px){.exps{grid-template-columns:1fr}}
.exp{border:1.5px solid var(--line);background:#0E0E0D;overflow:hidden;transition:transform .15s ease}
.exp:hover{transform:translateY(-3px)}
.exp .iw{aspect-ratio:4/3;overflow:hidden;position:relative}
.exp .iw img{width:100%;height:100%;object-fit:cover}
.exp figcaption{padding:7px 12px 9px;border-top:1.5px solid var(--line)}
.exp .h{font-size:12px;font-weight:500;letter-spacing:.02em;line-height:1.3}
.exp .p{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--idx);margin-top:3px}
.exp .p b{border:1px solid var(--idx);padding:0 7px;border-radius:8px}

/* filter thread = palette */
.filters{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.glass{width:92px;text-align:center}
.glass .disc{height:64px;border-radius:50%;border:6px solid #2A2A27;outline:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(0,0,0,.5),inset 0 0 14px rgba(0,0,0,.45);
  position:relative;overflow:hidden}
.glass .disc::after{content:"";position:absolute;top:8%;left:14%;width:30%;height:18%;border-radius:50%;
  background:rgba(255,255,255,.28);transform:rotate(-18deg)}
.glass .n{font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:7px;font-weight:600}
.glass .hx{font-size:9.5px;color:var(--eng2)}

/* exif log = qloo */
.exif{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(14px,3vw,26px)}
@media(max-width:800px){.exif{grid-template-columns:1fr}}
.exif table{width:100%;border-collapse:collapse;font-size:11.5px}
.exif th{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--eng2);text-align:left;padding:4px 7px;border-bottom:2px solid var(--eng2)}
.exif td{padding:7px;border-bottom:1px dashed var(--line);vertical-align:top}
.exif td.mono{font-size:11px;color:var(--eng)}
.exif .win{display:inline-block;font-size:8.5px;letter-spacing:.16em;border:1.5px solid var(--idx);color:var(--idx);padding:0 6px;text-transform:uppercase;margin-top:2px}
.exnote{font-size:11.5px;color:var(--eng2);font-style:italic;margin-top:10px}
.meta2{border:1.5px solid var(--eng2);background:rgba(0,0,0,.3);padding:12px 16px}
.meta2 h4{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--idx);margin-bottom:8px}
.meta2 .dv{font-weight:600;text-transform:uppercase;font-size:12.5px;letter-spacing:.1em;border-bottom:1.5px solid var(--eng2);padding:6px 0 2px}
.meta2 .rw{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dotted var(--line)}
.meta2 .rw:last-child{border-bottom:none}
.meta2 .rw .v{font-size:11.5px;color:var(--eng)}

/* dial clicks = next */
.clicks{display:flex;flex-wrap:wrap;gap:10px}
.clicks button{border:1.5px solid var(--eng);background:transparent;color:var(--eng);padding:9px 18px;
  font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;border-radius:3px;
  transition:background .12s ease,color .12s ease,transform .12s ease}
.clicks button:hover{background:var(--eng);color:var(--metal)}
.clicks button:active{transform:translateY(2px)}
.clicks .sub{width:100%;font-style:italic;color:var(--eng2);font-size:12.5px}
.alsoc{margin-top:12px;font-size:12.5px;color:var(--eng2)}
.alsoc b{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--idx);display:block;margin-bottom:4px}
.alsoc span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dotted var(--eng2)}
.foot{text-align:center;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--eng2);margin-top:30px}
.empty{background:var(--metal2);border:1.5px solid var(--line);border-radius:8px;padding:40px;text-align:center;font-style:italic;color:var(--eng2);margin-top:20px}
</style>
</head>
<body>
<div class="lens">
  <header class="cap">
    <h1>Marque <span>⌀ Campaign 1:0.95</span></h1>
    <div class="sn" id="sn">—</div>
  </header>
  <div class="barrel" id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dshort=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}catch(e){return '—'}};

const PALETTE=[
  {n:'UV Haze',h:'#D8D2C0'},{n:'Skylight 1A',h:'#E8B4A2'},{n:'81B Warm',h:'#C8955C'},
  {n:'ND8 Neutral',h:'#5C5A52'},{n:'IR Cut',h:'#3A3A36'}
];
const CREAT=[0,9,11,5].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];
const DATE=dshort(B.createdAt||B.fetchedAt);
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
const prompt=((B.sub&&B.sub.prompt)||B.title||'').trim();
const STOPS=['1.4','2','2.8','4','5.6','8'];

document.getElementById('sn').innerHTML='SERIAL No. '+esc(String(B.id||'').slice(0,8).toUpperCase())+'<br>METERED '+DATE;
document.getElementById('foot').textContent='MARQUE OPTICAL · CLICKED, NOT GUESSED · ⌀52 FILTER THREAD';

const A=document.getElementById('app');
const ring=(tag,inner)=>{if(!inner)return '';
  return '<div class="knurl"></div><div class="ring"><span class="tag">'+esc(tag)+'</span>'+inner+'</div>'};
let html='';

/* identity ring = ask */
html+='<div class="ring"><span class="tag">NAME RING · ENGRAVED</span>'+
'<div class="eng-name">Lens designation</div>'+
'<div class="idname"><span class="f-stop">MARQUE</span> '+esc(prompt)+'</div>'+
'<div class="idrow">'+
'<div>Mount ref.<b>'+(U?'<a href="'+esc(U)+'">'+esc(U)+'</a>':'—')+'</b></div>'+
'<div>Optics read<b>'+esc((B.urlContext&&B.urlContext.title)||'—')+'</b></div>'+
'<div>Coating notes<b>'+esc(((B.urlContext&&B.urlContext.description)||'').slice(0,110))+'…</b></div>'+
'</div></div>';

/* focus ring = audience */
if(AR&&AR.lean){
  const mk=['0.45','0.6','0.8','1','1.5','2','3','5','∞'];
  const confIdx=Math.min(mk.length-1,Math.round((AR.lean.confidence||0)*(mk.length-1)));
  html+=ring('FOCUS RING · m / ft',
  '<div class="fread"><span class="lean">'+esc(AR.lean.label)+'</span>'+
  '<span class="conf">focus locks at <b>'+Math.round((AR.lean.confidence||0)*100)+'%</b> · subject distance read</span></div>'+
  '<div class="fscale"><div class="marks">'+mk.map((m,i)=>'<span class="mk'+(i===confIdx?' on':'')+'">'+esc(m)+'</span>').join('')+'</div></div>'+
  '<div class="dof">'+(AR.mediaHabits||[]).map(h=>'<div class="r"><span class="c">'+esc(h.channel)+'</span>'+
  '<span class="track"><i></i></span><span class="n">'+esc(h.note)+'</span></div>').join('')+'</div>'+
  '<div class="sigs">DOF scale reads — '+(AR.lean.signals||[]).map(s=>'<b>'+esc(s)+'</b>').join(' · ')+'</div>'+
  '<div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>');
}

/* aperture ring = strategies */
if(strats.length){
  html+=ring('APERTURE RING · CLICK-STOPS',
  '<div class="aperture">'+strats.map((s,i)=>{
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    const hot=i===sel;
    return '<div class="detent'+(hot?' hot':'')+'"><span class="click"></span>'+
    '<div class="fstop"><small>ƒ/</small>'+esc(STOPS[i]||STOPS[STOPS.length-1])+'</div>'+
    '<div><h3>'+esc(s.title)+'</h3><div class="ang">'+esc(s.angle||'')+' · exposure fit '+f2(fit)+'</div>'+
    '<div class="tickrow">'+(s.channels||[]).map(c=>'<span class="tk"><b>'+esc(c.name)+'</b> '+f2(c.fit)+' <i>— '+esc(c.why||'')+'</i></span>').join('')+'</div>'+
    '<div class="fmt">SHOOTS '+(s.formats||[]).map(f=>esc(f)).join(' · ').toUpperCase()+'</div></div>'+
    '<div class="ev"><b>'+views(s.reach&&s.reach.estViews)+'</b><span>est. frames<br>reached</span></div>'+
    (s.reach&&s.reach.basis?'<div class="basis">'+esc(s.reach.basis)+'</div>':'')+
    (s.watchouts&&s.watchouts[0]?'<div class="watch"><b>Shooter\'s note</b>'+esc(s.watchouts[0])+'</div>':'')+
    '</div>';
  }).join('')+'</div>');
}

/* infrared index = ruled out */
if(anti.length){
  html+=ring('IR INDEX · OFFSET MARKS',
  '<div class="ir">'+anti.map(a=>'<div class="mark"><div class="ch">'+esc(a.channel)+' · shifted focus</div>'+
  '<h4><s>'+esc(a.title)+'</s></h4><div class="why">recalibration note — '+esc(a.whyNot)+'</div></div>').join('')+'</div>');
}

/* shot plate = brief + test exposures */
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  html+=ring('SHOT PLATE · '+(selS?esc(selS.title.toUpperCase()):'—'),
  '<div class="plate"><div class="engraved">'+
  (br?'<div class="sal">Composition · '+esc(selS.title)+'</div><h3>'+esc(br.title)+'</h3>'+
  '<div class="ang">'+esc(br.angle)+'</div>'+
  '<dl><dt>Subject</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Caption</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Metered by</dt><dd>key light '+esc(selS.heroSignal||'—')+' · exposure '+f2((selS.audienceFit&&selS.audienceFit.score)||0)+'</dd></dl>'
  :'<div class="ang">Plate unexposed.</div>')+
  '</div>'+
  '<div><div style="font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--eng2);margin-bottom:8px">Test exposures — straight out of camera</div>'+
  '<div class="exps">'+CREAT.map(m=>'<figure class="exp"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">rendered by <b>'+esc(m.provider)+'</b></div></figcaption></figure>').join('')+'</div></div></div>');
}

/* filter thread = palette */
html+=ring('FILTER THREAD · ⌀52',
  '<div class="filters">'+PALETTE.map(s=>'<div class="glass"><div class="disc" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="hx">'+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* exif log = qloo */
if(calls.length||affs.length){
  html+=ring('EXIF LOG · FRAME DATA',
  '<div class="exif"><div><table><tr><th>Frame / call</th><th>Clocked</th><th>Shutter</th><th>Frames</th><th>Tags</th></tr>'+
  calls.map((c,i)=>'<tr><td><b>IMG_'+(1000+i)+'</b> · '+esc(c.endpoint)+'<br><span class="win">'+esc(c.mode)+'</span></td>'+
  '<td class="mono">'+esc((c.at||'').slice(11,19))+'Z</td><td class="mono">'+esc(c.tookMs)+' ms</td><td class="mono">n='+esc(c.n)+'</td><td class="mono">'+esc(Object.keys(c.params||{}).length)+' tags</td></tr>').join('')+'</table>'+
  '<p class="exnote">'+(calls.length||0)+' frames logged by the Qloo meter — '+(esc((B.qlooBundle&&B.qlooBundle.mode)||'live'))+' metering, every tag burned into the file.</p></div>'+
  '<div class="meta2"><h4>Scene metadata — what the meter saw</h4>'+affs.map(g=>'<div class="dv">'+esc(String(g.type).replace('urn:entity:',''))+'</div>'+
  (g.entities||[]).slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+(e.affinity||0).toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* dial clicks = next */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
html+=ring('COMMAND DIAL · NEXT EXPOSURE',
  '<div class="clicks">'+['Cut the ad spot','Deal the landing page','Ship the media plan','Run it back — remix'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">One more click around the dial — the light is still good.</div></div>'+
  (others.length?'<div class="alsoc"><b>Other bodies in the bag</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

A.innerHTML='<div class="knurl"></div>'+html;
if(!A.querySelector('.ring'))A.appendChild(el('<div class="empty">Body cap still on — data.js never mounted.</div>'));
})();
</script>
</body>
</html>
