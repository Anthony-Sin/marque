<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Marque Railway — Booking Office Collection</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%234C4634'/%3E%3Crect x='8' y='22' width='48' height='20' rx='2' fill='%23EFE0B0' stroke='%232B2418'/%3E%3Ccircle cx='16' cy='32' r='4' fill='%234C4634'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --leather:#46402E;
  --leather2:#3B3526;
  --felt:#F1EAD6;
  --felt2:#EAE0C6;
  --ink:#26201A;
  --dim:#7A6E55;
  --stamp:#A83226;
  --buff:#F2E2AC;
  --green:#D3E1BC;
  --pink:#F0CCB8;
  --cream:#F5EFDC;
  --hair:#B9A978;
  --zilla:'Zilla Slab',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#211D14;
  color:var(--ink);font-family:var(--zilla);font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(168,50,38,.25)}
a{color:var(--stamp);text-decoration:none;border-bottom:1px dotted var(--stamp)}
a:hover{color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--stamp);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.wallet{max-width:1020px;margin:28px auto 70px;padding:0 clamp(8px,2vw,18px)}

/* cover */
.cover{
  background:linear-gradient(#4C4634,#3B3526);border-radius:10px 10px 4px 4px;
  border:1px solid #2A2618;padding:clamp(22px,4.5vw,40px) clamp(16px,4vw,44px);text-align:center;color:var(--felt);
  box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 0 0 6px rgba(241,234,214,.07),inset 0 0 0 7px rgba(241,234,214,.25);
}
.cover .rail{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:#C9BD92}
.cover h1{font-size:clamp(26px,5.4vw,44px);font-weight:700;letter-spacing:.06em;margin:10px 0 4px}
.cover h1 .amp{color:#C9BD92}
.cover .sub{font-style:italic;font-size:clamp(12.5px,2vw,15px);color:#A89D78}
.cover .blind{margin:16px auto 0;width:min(560px,90%);border:1px solid rgba(241,234,214,.3);padding:12px 16px;color:var(--felt);font-size:clamp(14px,2.2vw,18px)}
.cover .blind b{color:#E4C86A}
.cover .url{font-family:var(--mono);font-size:10.5px;margin-top:10px;color:#A89D78;overflow-wrap:anywhere}
.cover .url a{color:#E4C86A;border-bottom-color:#E4C86A}
.cover .url a:hover{color:var(--felt)}
.cover .src{font-size:11.5px;font-style:italic;color:#8D8362;margin-top:6px}

/* felt tray */
.tray{
  background:var(--felt);border:1px solid #2A2618;border-top:none;border-radius:0 0 10px 10px;
  padding:clamp(16px,3.5vw,34px);box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.rack{margin-bottom:30px}
.rack:last-child{margin-bottom:0}
.rack-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rack-h .tag{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--stamp);border:1.5px solid var(--stamp);padding:4px 12px;transform:rotate(-1.5deg);background:var(--felt)}
.rack-h h2{font-size:clamp(16px,2.6vw,21px);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.rack-h::after{content:"";flex:1;border-top:1.5px dashed var(--hair)}
.rsub{font-size:12.5px;font-style:italic;color:var(--dim);margin:-6px 0 12px 2px}

/* season ticket = audience */
.season{
  background:linear-gradient(135deg,var(--green),#C2D6A9);border:1.5px solid var(--ink);border-radius:6px;
  padding:18px 22px;position:relative;box-shadow:0 6px 18px rgba(40,32,18,.25),inset 0 0 0 4px rgba(255,255,255,.35);
  transform:rotate(-.4deg);
}
.season::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--stamp);border-radius:5px 0 0 5px}
.season .band{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);padding:0 0 8px 14px;margin-left:-8px}
.season .band b{font-size:clamp(17px,2.6vw,22px);letter-spacing:.2em;text-transform:uppercase}
.season .band span{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.season .guts{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;padding-top:12px}
@media(max-width:640px){.season .guts{grid-template-columns:1fr}}
.season .fld{font-size:12.5px}
.season .fld b{display:block;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--stamp);margin-bottom:2px}
.season .holder{font-size:clamp(19px,3vw,26px);font-weight:700;text-transform:capitalize;line-height:1.05}
.season .meter{margin-top:6px;display:flex;align-items:center;gap:10px}
.season .meter .g{flex:1;height:9px;border:1px solid var(--ink);background:repeating-linear-gradient(90deg,transparent 0 9.6%,rgba(38,32,26,.2) 9.6% 10%)}
.season .meter .g i{display:block;height:100%;background:var(--ink)}
.season .meter em{font-family:var(--mono);font-size:9.5px;font-style:normal;color:var(--dim)}
.season .list{list-style:none;font-size:12.5px}
.season .list li{padding:3.5px 0;border-bottom:1px dotted rgba(38,32,26,.3)}
.season .list li::before{content:"▸ ";color:var(--stamp);font-size:10px}
.season .routes{display:grid;grid-template-columns:82px 1fr;gap:2px 12px;font-size:12.5px}
.season .routes b{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--stamp);padding-top:3px}
.season .routes span{font-style:italic;padding-bottom:5px;border-bottom:1px dotted rgba(38,32,26,.3)}
.season .vibes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.season .vibes span{font-size:11px;border:1px solid var(--ink);padding:1px 9px;background:rgba(255,255,255,.45);border-radius:9px}
.season .sig{margin-top:12px;border-top:1px solid rgba(38,32,26,.4);padding-top:6px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.12em}

/* singles */
.tickets{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){.tickets{grid-template-columns:1fr}}
.ticket{
  border-radius:5px;border:1.5px solid var(--ink);padding:14px 18px 12px;position:relative;
  box-shadow:0 7px 18px rgba(40,32,18,.22),inset 0 0 0 3px rgba(255,255,255,.5);
  transition:transform .16s ease,box-shadow .16s ease;
}
.ticket:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 12px 26px rgba(40,32,18,.3),inset 0 0 0 3px rgba(255,255,255,.5)}
.ticket::before{content:"";position:absolute;left:9px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--felt);box-shadow:inset 0 0 0 1.5px var(--ink),inset 1px 2px 3px rgba(0,0,0,.4)}
.ticket::after{content:"";position:absolute;right:20px;top:-1.5px;width:18px;height:9px;border:1.5px solid var(--ink);border-top:none;border-radius:0 0 12px 12px;background:var(--felt)}
.ticket .inner{border:1px dashed rgba(38,32,26,.55);padding:10px 14px 10px 22px;min-height:120px}
.ticket .co{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.ticket .co .sn{font-family:var(--mono);letter-spacing:.1em}
.ticket h3{font-size:clamp(19px,2.8vw,25px);font-weight:700;letter-spacing:.02em;line-height:1.05;margin:5px 0 0}
.ticket .via{font-style:italic;font-size:12px;color:var(--stamp)}
.ticket .route{font-family:var(--mono);font-size:9px;letter-spacing:.14em;margin:7px 0;color:var(--ink);text-transform:uppercase}
.ticket .fare{display:flex;align-items:baseline;gap:10px;border-top:1.5px solid var(--ink);padding-top:7px;margin-top:7px}
.ticket .fare b{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--stamp)}
.ticket .fare .p{font-size:21px;font-weight:700}
.ticket .fare .dots{display:flex;gap:3px;margin-left:auto}
.ticket .fare .dots i{width:9px;height:9px;border:1.2px solid var(--ink);border-radius:50%}
.ticket .fare .dots i.f{background:var(--ink)}
.ticket .chans{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.ticket .chans span{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;border:1px solid rgba(38,32,26,.5);padding:1.5px 7px;background:rgba(255,255,255,.4)}
.ticket .admit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;font-size:11px}
.ticket .admit b{font-size:13px}
.ticket .admit small{font-style:italic;color:var(--dim);text-align:right;max-width:200px;font-size:10px}
.ticket .cau{font-size:10.5px;font-style:italic;color:var(--dim);margin-top:6px;border-top:1px dotted rgba(38,32,26,.4);padding-top:5px}
.ticket .stampv{
  position:absolute;right:-10px;bottom:18px;transform:rotate(12deg);
  border:2.5px solid var(--stamp);color:var(--stamp);border-radius:50%;
  font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  padding:9px 13px;opacity:.88;pointer-events:none;text-align:center;line-height:1.3;
}
.tk-buff{background:linear-gradient(160deg,var(--buff),#E7D394)}
.tk-green{background:linear-gradient(160deg,var(--green),#C0D4A4)}
.tk-pink{background:linear-gradient(160deg,var(--pink),#E7BBA4)}
.tk-cream{background:linear-gradient(160deg,var(--cream),#EBE1C4)}

/* refused */
.refused{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.refused{grid-template-columns:1fr}}
.ref{
  border:1.5px solid rgba(38,32,26,.65);border-radius:5px;padding:13px 17px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(0deg,#E4DCC4 0 3px,#EAE3CC 3px 6px);color:var(--dim);
}
.ref::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 14px,rgba(168,50,38,.09) 14px 16px)}
.ref .void{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
  border:3px solid var(--stamp);color:var(--stamp);font-size:clamp(15px,2.4vw,19px);font-weight:700;
  letter-spacing:.3em;padding:5px 16px;opacity:.8;text-transform:uppercase;background:rgba(241,234,214,.55);
}
.ref h4{font-size:15.5px;font-weight:700}
.ref .ch{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stamp);margin:2px 0 5px}
.ref p{font-size:11.5px;font-style:italic;line-height:1.45;position:relative;z-index:1}

/* excursion notice + luggage labels */
.notice{
  border:2.5px double var(--ink);background:var(--cream);padding:clamp(18px,4vw,30px);text-align:center;position:relative;
  box-shadow:inset 0 0 0 5px var(--felt2);
}
.notice .k{font-size:9px;letter-spacing:.44em;text-transform:uppercase;color:var(--stamp)}
.notice h3{font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:.04em;margin:8px 0 6px}
.notice .lede{font-style:italic;font-size:13.5px;max-width:560px;margin:0 auto 12px;color:var(--dim)}
.notice dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px;text-align:left;max-width:560px;margin:0 auto}
.notice dt{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--stamp);padding-top:3px;text-align:right}
.notice dd{border-bottom:1px dotted var(--hair);padding-bottom:6px}
.notice .msg{font-weight:700;font-size:15px}
.notice .foot{margin-top:12px;font-size:11px;font-style:italic;color:var(--dim)}
.labels{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
@media(max-width:860px){.labels{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.labels{grid-template-columns:1fr}}
.label{
  background:var(--cream);border:2px solid var(--ink);border-radius:8px;padding:10px;position:relative;
  box-shadow:0 8px 18px rgba(40,32,18,.2),inset 0 0 0 3px var(--felt2);
  transition:transform .16s ease,box-shadow .16s ease;
}
.label:hover{transform:translateY(-4px) rotate(1deg);box-shadow:0 14px 28px rgba(40,32,18,.3),inset 0 0 0 3px var(--felt2)}
.label::before{content:"";position:absolute;top:9px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--felt);border:2px solid var(--ink)}
.label::after{content:"";position:absolute;top:-24px;left:50%;width:1.5px;height:26px;background:#7A6248;transform:rotate(4deg);transform-origin:bottom}
.label .iw{margin-top:16px;border:1px solid var(--ink);overflow:hidden}
.label img{width:100%;aspect-ratio:4/3;object-fit:cover;filter:sepia(.18) contrast(.97)}
.label figcaption{padding:8px 2px 1px;text-align:left}
.label .h{font-size:11.5px;font-weight:700;line-height:1.3;display:block}
.label .p{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);display:block;margin-top:2px}

/* stock */
.stock{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:640px){.stock{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.stock{grid-template-columns:repeat(2,1fr)}}
.stk{text-align:center}
.stk .sw{height:52px;border:1.5px solid var(--ink);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);position:relative;margin-bottom:6px}
.stk .sw::before{content:"";position:absolute;left:6px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--felt);box-shadow:inset 0 0 0 1px var(--ink)}
.stk .n{font-size:11.5px;font-weight:600}
.stk .h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim)}

/* inspector */
.insp .mem{font-size:13px;font-style:italic;max-width:640px;margin-bottom:14px}
.insp .mem b{font-style:normal}
.insgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,28px)}
@media(max-width:760px){.insgrid{grid-template-columns:1fr}}
.punchlog{width:100%;border-collapse:collapse;font-size:11.5px}
.punchlog th{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--stamp);text-align:left;border-bottom:1.5px solid var(--ink);padding:5px 8px 5px 0}
.punchlog td{border-bottom:1px dashed var(--hair);padding:6px 8px 6px 0;vertical-align:top}
.punchlog .pn{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--stamp);margin-right:8px;vertical-align:-1px}
.punchlog .ep{font-family:var(--mono);font-size:10px}
.punchlog .pm{display:block;font-family:var(--mono);font-size:8.5px;color:var(--dim);overflow-wrap:anywhere;max-width:210px}
.punchlog .md{border:1px solid var(--ink);padding:0 6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.ret .g{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--stamp);margin:12px 0 4px}
.ret .g:first-child{margin-top:0}
.ret .row{display:grid;grid-template-columns:minmax(0,1fr) 70px 30px;gap:8px;align-items:center;font-size:12px;padding:3.5px 0;border-bottom:1px dashed var(--hair)}
.ret .bar{height:7px;border:1px solid var(--ink);background:rgba(255,255,255,.5)}
.ret .bar i{display:block;height:100%;background:var(--stamp)}
.ret .v{font-family:var(--mono);font-size:9.5px;text-align:right}

/* window */
.window{display:flex;flex-wrap:wrap;gap:12px}
.window button{
  background:var(--buff);border:1.5px solid var(--ink);border-radius:4px;padding:9px 20px 9px 14px;
  font-size:12.5px;font-weight:600;letter-spacing:.05em;position:relative;
  box-shadow:2.5px 2.5px 0 rgba(38,32,26,.35);transition:transform .15s ease,box-shadow .15s ease,background .15s;
}
.window button::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);margin-right:9px;background:var(--felt)}
.window button:hover{background:#F8ECC4;transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 rgba(168,50,38,.4)}
.window button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(38,32,26,.35)}
.winnote{margin-top:12px;font-size:11.5px;font-style:italic;color:var(--dim)}

.empty{border:1.5px dashed var(--ink);padding:26px;text-align:center;font-style:italic;color:var(--dim)}
.foot{text-align:center;margin-top:24px;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim)}
</style>
</head>
<body>
<div class="wallet">
<header class="cover">
  <div class="rail">Great Marque Railway · Incorporated 2026</div>
  <h1>BOOKING OFFICE <span class="amp">&amp;</span> COLLECTION</h1>
  <div class="sub">Season tickets, singles &amp; refused stock, preserved in the company wallet</div>
  <div class="blind" id="s-ask"></div>
  <div class="url" id="s-url"></div>
  <div class="src" id="s-src"></div>
</header>
<main class="tray" id="app"></main>
<div class="foot" id="foot"></div>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).toUpperCase()}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[11,8,9,13].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];
const STOCK=['tk-buff','tk-green','tk-pink','tk-cream'];

document.getElementById('s-ask').innerHTML='JOURNEY REQUESTED — <b>“'+esc((B.sub&&B.sub.prompt)||B.title||'')+'”</b>';
document.getElementById('s-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'booked at the office of <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';
document.getElementById('s-src').textContent=(B.urlContext&&B.urlContext.title)?('Serving the district of '+B.urlContext.title):'';
document.getElementById('foot').textContent='GMR WALLET '+String(B.id||'—').slice(0,8).toUpperCase()+' · COLLECTED '+dt(B.createdAt||B.fetchedAt)+' · NOT TRANSFERABLE';

const M=document.getElementById('app');
const rack=(tag,title,a,b)=>{
  /* calls are either (tag,title,body) or (tag,title,sub,body) */
  let sub='',body;
  if(b===undefined){body=a}else{sub=a;body=b}
  if(!body)return;
  M.appendChild(el('<section class="rack"><div class="rack-h"><span class="tag">'+esc(tag)+'</span><h2>'+esc(title)+'</h2></div>'+
    (sub?'<div class="rsub">'+esc(sub)+'</div>':'')+body+'</section>'));
};

/* §1 — season ticket (audience) */
if(AR&&AR.lean){
  rack('Form S.1','The Season Ticket — holder examined',
  '<div class="season"><div class="band"><b>Season</b><span>No. '+String(B.id||'—').slice(0,5).toUpperCase()+' · '+dt(B.createdAt||B.fetchedAt)+'</span></div>'+
  '<div class="guts"><div class="fld"><b>Holder, as described</b><div class="holder">'+esc(AR.lean.label||'—')+'</div>'+
  '<div class="meter"><div class="g"><i style="width:'+pct(AR.lean.confidence)+'%"></i></div><em>VALIDITY '+f2(AR.lean.confidence)+'</em></div>'+
  '<b style="margin-top:10px">Remarks of the booking clerk</b><ul class="list">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div>'+
  '<div class="fld"><b>Routes habitually taken</b><div class="routes">'+(AR.mediaHabits||[]).map(h=>'<b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span>').join('')+'</div>'+
  '<b style="margin-top:12px">Known to frequent</b><div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>'+
  '<div class="sig"><span>SIGNED · THE INSPECTOR</span><span>GMR FORM S.1</span></div></div>');
}

/* §2 — singles */
if(strats.length){
  rack('Form S.2','Singles for the Journey — four issued',
  '<div class="tickets">'+strats.map((s,i)=>{
    const chans=(s.channels||[]).map(c=>esc(c.name)+' '+f2(c.fit)).join(' · ');
    return '<article class="ticket '+STOCK[i%4]+'"><div class="inner">'+
    '<div class="co"><span>Great Marque Railway</span><span class="sn">A'+(4237+i*311)+'</span></div>'+
    '<h3>'+esc(s.title)+'</h3><div class="via">via '+esc(s.angle||'—')+'</div>'+
    '<div class="route">FROM QLOO JCN · TO '+esc(s.heroSignal||'DEST.').toUpperCase()+'</div>'+
    '<div class="fare"><b>Fare / fit</b><span class="p">'+f2(s.audienceFit&&s.audienceFit.score)+'</span>'+
    '<span class="dots">'+Array.from({length:5},(_,d)=>'<i'+(d<Math.round(((s.audienceFit&&s.audienceFit.score)||0)*5)?' class="f"':'')+'></i>').join('')+'</span></div>'+
    '<div class="chans">'+(s.channels||[]).map(c=>'<span>'+esc(c.name)+' '+f2(c.fit)+' · '+esc(c.why||'')+'</span>').join('')+'</div>'+
    '<div class="admit"><span>Admit <b>'+views(s.reach&&s.reach.estViews)+'</b> passengers</span><small>'+esc(s.reach&&s.reach.basis||'')+'</small></div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="cau">Conditions (see over): '+esc(s.watchouts[0])+'</div>':'')+
    '</div>'+(i===sel?'<div class="stampv">Validated<br>'+dt(B.createdAt||B.fetchedAt)+'</div>':'')+'</article>'}).join('')+'</div>');
}

/* §3 — refused at window */
if(anti.length){
  rack('Form S.3','Refused at the Window','stock retained but not issued',
  '<div class="refused">'+anti.map(a=>'<div class="ref"><h4>'+esc(a.title)+'</h4><div class="ch">'+esc(a.channel)+' road · not issued</div><p>'+esc(a.whyNot)+'</p><div class="void">VOID</div></div>').join('')+'</div>');
}

/* §4 — excursion notice + luggage labels */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  rack('Form S.4','Excursion Notice & Registered Luggage',
  '<div class="notice"><div class="k">By order of the Traffic Manager</div>'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>For the carriage of</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>Declared value</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Forwarding mark</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<div class="lede">no notice posted</div>')+
  '<div class="foot">Posted at all stations. The company is not responsible for umbrellas.</div></div>'+
  '<div class="labels">'+CREAT.map((m,i)=>
    '<figure class="label"><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" loading="lazy" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
    '<figcaption><span class="h">Label '+(i+1)+' — '+esc(m.head)+'</span><span class="p">carrier · '+esc(m.provider)+'</span></figcaption></figure>').join('')+'</div>');
}

/* §5 — ticket stock */
rack('Form S.5','Ticket Stock & Inks','card colours held at the print works',
  '<div class="stock">'+PALETTE.map((s,i)=>
    '<div class="stk"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">STOCK '+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* §6 — inspector's punch record */
if(B.evidence||affs.length){
  rack('Form S.6','Inspector’s Punch Record','every impression witnessed, Qloo Junction',
  '<div class="insp"><p class="mem"><b>MEMO.</b> The undersigned inspector certifies that <b>'+calls.length+' punches</b> were made upon this journey, all in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'—').toUpperCase()+' mode</b> at <b>Qloo Junction</b>; no ticket was clipped twice.</p>'+
  '<div class="insgrid"><div><table class="punchlog"><thead><tr><th>Punch</th><th>N</th><th>Ms.</th><th>Mode</th></tr></thead><tbody>'+
  calls.map(c=>'<tr><td><span class="pn"></span><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,20)).join(' '))+'</span></td>'+
    '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
  '</tbody></table></div>'+
  '<div class="ret">'+affs.map(g=>'<div class="g">Traffic returns · '+esc(g.type.replace('urn:entity:',''))+'</div>'+
    g.entities.slice(0,4).map(e=>'<div class="row"><span>'+esc(e.name)+'</span><span class="bar"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
  '</div></div></div>');
}

/* §7 — apply at window */
rack('Form S.7','Apply at the Window','further forms upon request',
  '<div class="window">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+'</div>'+
  '<div class="winnote">Take a numbered slip and wait to be called. The window closes at six.</div>');

if(!M.children.length)M.appendChild(el('<div class="empty">The wallet is empty — data.js never arrived at the station. No tickets issued.</div>'));
})();
</script>
</body>
</html>
