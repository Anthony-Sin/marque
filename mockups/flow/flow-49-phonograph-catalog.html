<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Marque Phonograph Co. — Catalogue No. 49</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23EAE1CB'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%233A2C18' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%238A6414' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAE1CB;
  --paper2:#F4EDDA;
  --paper3:#E0D4B6;
  --ink:#33271A;
  --dim:#7A6A4C;
  --gold:#8A6414;
  --hair:#C7B891;
  --shellac:#1E150C;
  --caslon:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#2B2114;
  color:var(--ink);
  font-family:var(--caslon);
  font-size:14.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(138,100,20,.28)}
a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--gold)}
a:hover{color:var(--ink);border-bottom-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.sheet{
  max-width:940px;margin:30px auto 70px;background:var(--paper);
  padding:clamp(14px,3vw,34px);
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 0 90px rgba(122,90,40,.14);
  border:1px solid #B4A478;
}

/* masthead */
.mast{border:3px double var(--ink);padding:clamp(18px,4vw,34px) clamp(14px,3.5vw,36px);text-align:center;position:relative}
.mast::before{content:"";position:absolute;inset:5px;border:1px solid var(--ink);pointer-events:none}
.mast .co{font-size:10.5px;letter-spacing:.5em;text-transform:uppercase;color:var(--dim)}
.mast h1{font-size:clamp(26px,5.4vw,46px);font-weight:700;letter-spacing:.03em;line-height:1.08;margin:10px 0 6px}
.mast h1 .amp{color:var(--gold)}
.mast .cat{font-size:clamp(12px,1.8vw,15px);font-style:italic;color:var(--dim)}
.mast .no{margin-top:12px;display:inline-block;border:1.5px solid var(--ink);padding:4px 18px;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase}
.mast .ask{margin:20px auto 0;max-width:640px;font-size:clamp(15px,2.3vw,19px)}
.mast .ask .q{font-style:italic}
.mast .ask .q b{color:var(--gold);font-weight:700}
.mast .url{font-family:var(--mono);font-size:10.5px;margin-top:10px;color:var(--dim);overflow-wrap:anywhere}
.mast .url a{font-family:var(--mono)}
.mast .src{font-size:12px;font-style:italic;color:var(--dim);margin-top:6px}
.mast .horn{position:absolute;top:14px;left:16px;width:44px;opacity:.85}
.mast .horn2{position:absolute;top:14px;right:16px;width:44px;opacity:.85;transform:scaleX(-1)}

/* department headers */
.dept{margin-top:34px;border:1.5px solid var(--ink);background:var(--paper2);position:relative;box-shadow:4px 4px 0 rgba(58,44,24,.18)}
.dept-h{
  border-bottom:3px double var(--ink);padding:14px clamp(14px,3vw,26px) 12px;text-align:center;position:relative;
}
.dept-h .rn{font-size:9.5px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold)}
.dept-h h2{font-size:clamp(18px,3vw,26px);font-weight:700;letter-spacing:.05em;margin-top:3px}
.dept-h .sub{font-style:italic;font-size:12px;color:var(--dim)}
.dept-b{padding:clamp(16px,3.4vw,28px)}

.fleuron{display:flex;align-items:center;gap:12px;color:var(--gold);justify-content:center;margin-top:6px}
.fleuron::before,.fleuron::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--ink));}
.fleuron::after{background:linear-gradient(90deg,var(--ink),transparent)}
.fleuron span{font-size:11px;letter-spacing:.2em}

/* §1 parlour */
.parlour{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,30px)}
@media(max-width:640px){.parlour{grid-template-columns:1fr}}
.k{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:8px}
.lean{font-size:clamp(24px,3.6vw,34px);font-weight:700;line-height:1.1;text-transform:capitalize}
.audiometer{margin:12px 0 14px}
.audiometer .grad{height:16px;border:1px solid var(--ink);position:relative;background:repeating-linear-gradient(90deg,transparent 0 9.6%,rgba(51,39,26,.25) 9.6% 10%);background-color:var(--paper)}
.audiometer .needle{position:absolute;top:-5px;bottom:-5px;width:2.5px;background:var(--gold)}
.audiometer .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:4px}
.siglist{list-style:none}
.siglist li{padding:6px 0 6px 22px;border-bottom:1px dotted var(--hair);position:relative;font-size:13.5px}
.siglist li::before{content:"¶";position:absolute;left:2px;color:var(--gold)}
.habits{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;font-size:13px}
.habits b{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding-top:3px}
.habits span{font-style:italic;padding-bottom:7px;border-bottom:1px dotted var(--hair)}
.habits .r{padding-bottom:7px;border-bottom:1px dotted var(--hair)}
.vibes{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.vibes span{border:1px solid var(--ink);padding:2px 11px;font-size:11.5px;font-style:italic;background:rgba(255,255,255,.35);border-radius:10px}
.colophon{margin-top:14px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);border-top:1px solid var(--hair);padding-top:8px}

/* §2 records */
.recs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.recs{grid-template-columns:1fr}}
.rec{border:1.5px solid var(--ink);background:linear-gradient(#F6EFDC,#EDE2C6);padding:16px 18px 14px;position:relative;box-shadow:inset 0 0 0 4px var(--paper2),inset 0 0 0 5px var(--hair)}
.rec.choice{box-shadow:inset 0 0 0 4px var(--paper2),inset 0 0 0 5px var(--gold),0 4px 14px rgba(58,44,24,.25)}
.rec .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.rec .no .choicetag{color:var(--gold);font-weight:700;letter-spacing:.18em}
.rec h3{font-size:clamp(19px,2.6vw,24px);font-weight:700;line-height:1.12;margin:4px 0 1px}
.rec .by{font-style:italic;font-size:13px;color:var(--gold);margin-bottom:10px}
.cyl{display:block;margin:2px 0 12px;filter:drop-shadow(0 6px 8px rgba(30,21,12,.35))}
.rec .row{display:grid;grid-template-columns:86px 1fr 40px;gap:3px 10px;align-items:baseline;font-size:12.5px;padding:4px 0;border-bottom:1px dotted var(--hair)}
.rec .row b{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.rec .row .wv{text-align:right;font-family:var(--mono);font-size:10px}
.rec .row .micro{font-size:10.5px;font-style:italic;color:var(--dim);grid-column:2/4}
.gauge{display:flex;gap:2.5px;align-items:center}
.gauge i{width:11px;height:8px;border:1px solid var(--ink)}
.gauge i.f{background:var(--ink)}
.rec .fmt{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.rec .fmt span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;border:1px solid var(--hair);padding:2px 8px;background:rgba(255,255,255,.3)}
.rec .press{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1.5px solid var(--ink);margin-top:11px;padding-top:8px}
.rec .press b{font-size:21px}
.rec .press small{font-size:10.5px;font-style:italic;color:var(--dim);text-align:right;max-width:220px}
.rec .cau{font-size:11.5px;font-style:italic;color:var(--gold);margin-top:8px}
.rec .cau b{font-style:normal;font-size:9px;letter-spacing:.24em}

/* §3 withdrawn */
.withd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.withd{grid-template-columns:1fr}}
.wd{border:1px solid var(--ink);background:var(--paper);padding:13px 15px;position:relative;overflow:hidden}
.wd::after{content:"WITHDRAWN";position:absolute;top:9px;right:-30px;transform:rotate(38deg);background:var(--ink);color:var(--paper);font-size:8.5px;letter-spacing:.3em;padding:3px 34px}
.wd h4{font-size:15px;font-weight:700}
.wd .ch{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:1px 0 6px}
.wd p{font-size:12px;font-style:italic;color:var(--dim);line-height:1.5}

/* §4 circular + proofs */
.rx{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(16px,3vw,26px)}
@media(max-width:760px){.rx{grid-template-columns:1fr}}
.circular{border:2px solid var(--ink);background:var(--paper2);padding:20px 22px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--hair);height:max-content}
.circular .k2{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);text-align:center}
.circular h3{font-size:clamp(20px,3vw,27px);font-weight:700;text-align:center;margin:6px 0 8px}
.circular .lede{font-style:italic;font-size:13px;text-align:center;color:var(--dim);border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:12px}
.circular dl{display:grid;grid-template-columns:88px 1fr;gap:6px 14px;font-size:12.5px}
.circular dt{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);padding-top:3px}
.circular dd{border-bottom:1px dotted var(--hair);padding-bottom:7px}
.circular .msg{font-weight:700;font-size:14px}
.circular .foot{margin-top:12px;text-align:center;font-style:italic;font-size:11.5px;color:var(--dim)}
.proofs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:440px){.proofs{grid-template-columns:1fr}}
.proof{border:1px solid var(--ink);background:var(--paper2);padding:8px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--ink);transition:transform .18s ease,box-shadow .18s ease}
.proof:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--gold),0 10px 22px rgba(30,21,12,.3)}
.proof .imgw{border:1px solid var(--ink);overflow:hidden}
.proof img{width:100%;aspect-ratio:1/1;object-fit:cover;filter:sepia(.42) contrast(.94) brightness(1.02)}
.proof figcaption{padding:7px 2px 2px}
.proof .h{font-size:11.5px;font-weight:700;display:block;line-height:1.3}
.proof .p{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-top:2px}

/* §5 waxes */
.waxes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:640px){.waxes{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.waxes{grid-template-columns:repeat(2,1fr)}}
.wax{text-align:center}
.wax .sw{height:58px;border:1.5px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper2),inset 0 0 0 4px var(--hair);margin-bottom:6px}
.wax .n{font-size:11.5px;font-weight:700}
.wax .h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--dim)}

/* §6 expedition */
.expo .mem{font-size:13.5px;font-style:italic;max-width:640px;margin-bottom:16px}
.expo .mem b{font-style:normal}
.exgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,28px)}
@media(max-width:760px){.exgrid{grid-template-columns:1fr}}
.log{width:100%;border-collapse:collapse;font-size:11.5px}
.log th{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:left;border-bottom:1.5px solid var(--ink);padding:5px 8px 5px 0}
.log td{border-bottom:1px dotted var(--hair);padding:6px 8px 6px 0;vertical-align:top}
.log .ep{font-family:var(--mono);font-size:10px}
.log .pm{display:block;font-family:var(--mono);font-size:8.5px;color:var(--dim);overflow-wrap:anywhere;max-width:210px}
.log .md{border:1px solid var(--ink);padding:0 6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.reg .g{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:12px 0 4px}
.reg .g:first-child{margin-top:0}
.reg .row{display:grid;grid-template-columns:minmax(0,1fr) 74px 30px;gap:8px;align-items:center;font-size:12px;padding:3.5px 0;border-bottom:1px dotted var(--hair)}
.reg .bar{height:7px;border:1px solid var(--ink);background:var(--paper)}
.reg .bar i{display:block;height:100%;background:var(--gold)}
.reg .v{font-family:var(--mono);font-size:9.5px;text-align:right}

/* §7 order blank */
.blank{display:flex;flex-wrap:wrap;gap:10px}
.blank button{
  border:1.5px solid var(--ink);background:var(--paper2);padding:9px 18px;font-size:12.5px;
  letter-spacing:.04em;box-shadow:2.5px 2.5px 0 rgba(58,44,24,.3);transition:transform .15s ease,box-shadow .15s ease,background .15s;
}
.blank button:hover{background:#FBF5E6;transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 rgba(138,100,20,.4)}
.blank button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(58,44,24,.3)}
.blank button .tick{color:var(--gold);margin-right:8px;font-weight:700}
.blank button:hover .tick{color:var(--ink)}
.blanknote{margin-top:12px;font-size:11.5px;font-style:italic;color:var(--dim)}

.empty{border:1.5px dashed var(--ink);padding:26px;text-align:center;font-style:italic;color:var(--dim);margin-top:30px}
.tails{text-align:center;margin-top:30px;font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--dim)}
@media(max-width:460px){.mast .horn,.mast .horn2{display:none}}
</style>
</head>
<body>
<div class="sheet">
<header class="mast">
  <svg class="horn" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 40c4-14 12-24 26-30" fill="none" stroke="#33271A" stroke-width="2"/><path d="M32 10c5-2 9-1 11 3 1 3-1 6-4 7-6-2-8-6-7-10z" fill="#8A6414" stroke="#33271A"/><path d="M6 40q3 2 6 0" fill="none" stroke="#33271A" stroke-width="2"/></svg>
  <svg class="horn2" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 40c4-14 12-24 26-30" fill="none" stroke="#33271A" stroke-width="2"/><path d="M32 10c5-2 9-1 11 3 1 3-1 6-4 7-6-2-8-6-7-10z" fill="#8A6414" stroke="#33271A"/><path d="M6 40q3 2 6 0" fill="none" stroke="#33271A" stroke-width="2"/></svg>
  <div class="co">Incorporated under the laws of the State of New Jersey</div>
  <h1>The Marque Phonograph <span class="amp">Company</span></h1>
  <div class="cat">Descriptive &amp; Illustrated Catalogue of Gold-Moulded Cylinder Records for the Autumn Trade</div>
  <div class="fleuron"><span>· ◆ ·</span></div>
  <div class="no">Catalogue No. 49 · Mailable under Second-Class Matter</div>
  <div class="ask" id="s-ask"></div>
  <div class="url" id="s-url"></div>
  <div class="src" id="s-src"></div>
</header>
<main id="app"></main>
<div class="tails" id="tails"></div>
</div>

<script src="../data.js"></script>
<script src="../media-data.js"></script>
<script src="../dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'../'):'';
const pct=x=>Math.round((x||0)*100);
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Barrier Cream',h:'#EDDFCE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[0,1,4,5].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-ask').innerHTML='<span class="q">To the Trade: the subscriber requests selections for <b>“'+esc((B.sub&&B.sub.prompt)||B.title||'').replace(/→/g,'→')+'”</b> — the same being recorded herewith.</span>';
document.getElementById('s-url').innerHTML=((B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url))?
  'Recorded from the works of <a href="'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'">'+esc((B.sub&&B.sub.url)||B.urlContext.url)+'</a>':'';
document.getElementById('s-src').textContent=(B.urlContext&&B.urlContext.title)?('Of the establishment styled '+B.urlContext.title+' — '+(B.urlContext.description||'')):'';
document.getElementById('tails').textContent='FORM '+String(B.id||'—').slice(0,8).toUpperCase()+' · ISSUED '+dt(B.createdAt||B.fetchedAt)+' · PRINTED AT THE ORANGE WORKS';

const M=document.getElementById('app');
const dept=(rn,title,sub,body)=>{
  if(!body)return;
  M.appendChild(el('<section class="dept"><div class="dept-h"><div class="rn">'+esc(rn)+'</div><h2>'+esc(title)+'</h2><div class="sub">'+esc(sub)+'</div></div><div class="dept-b">'+body+'</div></section>'));
};

/* cylinder engraving */
const cyl=(fit)=>{
  const n=22;let g='';
  for(let i=0;i<n;i++){const x=20+i*7.4;g+='<line x1="'+x+'" y1="18" x2="'+x+'" y2="66" stroke="rgba(240,230,205,'+(i%3?'.10':'.22')+')" stroke-width="1"/>';}
  const w=Math.max(4,Math.round((fit||0)*46));
  return '<svg class="cyl" viewBox="0 0 200 84" width="200" style="max-width:100%">'+
  '<rect x="14" y="12" width="172" height="60" rx="6" fill="#1E150C" stroke="#33271A"/>'+g+
  '<rect x="14" y="12" width="14" height="60" rx="6" fill="#8A6414"/><rect x="172" y="12" width="14" height="60" rx="6" fill="#8A6414"/>'+
  '<rect x="34" y="38" width="132" height="14" fill="rgba(240,230,205,.12)"/>'+
  '<rect x="34" y="44" width="'+w+'" height="2.5" fill="#C9A44C"/>'+
  '<text x="100" y="33" text-anchor="middle" font-family="Georgia" font-size="7" letter-spacing="3" fill="#C9A44C">GOLD MOULDED · '+(fit?fit.toFixed(2):'—')+'</text>'+
  '<text x="100" y="80" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="6.5" fill="#7A6A4C">each groove a surveyed signal</text></svg>';
};

/* §1 — the parlour */
if(AR&&AR.lean){
  dept('Department the First','The Parlour, Examined','a condition of the modern listener',
  '<div class="parlour"><div>'+
  '<span class="k">Predominant taste</span><div class="lean">'+esc(AR.lean.label||'—')+'</div>'+
  '<div class="audiometer"><div class="grad"><i class="needle" style="left:'+pct(AR.lean.confidence)+'%"></i></div><div class="cap"><span>THE AUDIOMETER REGISTERS</span><span>'+f2(AR.lean.confidence)+' OF UNITY</span></div></div>'+
  '<span class="k">Inclinations observed</span><ul class="siglist">'+(AR.lean.signals||[]).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'+
  '<div class="colophon">SERIAL '+String(B.id||'—').slice(0,8).toUpperCase()+' · PRESSED '+dt(B.createdAt||B.fetchedAt)+'</div></div>'+
  '<div><span class="k">Instruments most favoured</span><div class="habits">'+(AR.mediaHabits||[]).map(h=>'<b>'+esc(h.channel)+'</b><span>'+esc(h.note)+'</span>').join('')+'</div>'+
  '<div style="margin-top:16px"><span class="k">Names heard upon the programme</span><div class="vibes">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>'+
  '</div>');
}

/* §2 — new records */
if(strats.length){
  dept('Department the Second','New Records for the Season','four selections, gold-moulded, of tested durability',
  '<div class="recs">'+strats.map((s,i)=>{
    const catno=1400+i*7;
    return '<article class="rec'+(i===sel?' choice':'')+'"><div class="no"><span>No. '+catno+' · TAKE '+(i+1)+'</span>'+(i===sel?'<span class="choicetag">Dealers’ Choice</span>':'')+'</div>'+
    '<h3>“'+esc(s.title)+'”</h3><div class="by">in the manner of '+esc(s.angle||'—')+'</div>'+cyl(s.audienceFit&&s.audienceFit.score)+
    '<div class="row"><b>Durability</b><span class="gauge">'+Array.from({length:5},(_,d)=>'<i'+(d<Math.round(((s.audienceFit&&s.audienceFit.score)||0)*5)?' class="f"':'')+'></i>').join('')+'</span><span class="wv">'+f2(s.audienceFit&&s.audienceFit.score)+'</span><span class="micro">withstands '+pct(s.audienceFit&&s.audienceFit.score)+' auditions of the parlour — '+(s.audienceFit&&s.audienceFit.notes||[]).map(esc).join('; ')+'</span></div>'+
    (s.channels||[]).map(c=>'<div class="row"><b>'+esc(c.name)+'</b><span class="gauge">'+Array.from({length:5},(_,d)=>'<i'+(d<Math.round((c.fit||0)*5)?' class="f"':'')+'></i>').join('')+'</span><span class="wv">'+f2(c.fit)+'</span><span class="micro">orchestrated per '+esc(c.why||'—')+'</span></div>').join('')+
    '<div class="fmt">'+(s.formats||[]).map(f=>'<span>'+esc(f)+'</span>').join('')+'</div>'+
    '<div class="press"><span>Pressings: <b>'+views(s.reach&&s.reach.estViews)+'</b></span><small>'+esc(s.reach&&s.reach.basis||'')+'</small></div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="cau"><b>CAUTION TO DEALERS.</b> '+esc(s.watchouts[0])+'</div>':'')+
    '</article>'}).join('')+'</div>');
}

/* §3 — withdrawn masters */
if(anti.length){
  dept('Department the Third','Masters Withdrawn','melted down, the metal being wanted elsewhere',
  '<div class="withd">'+anti.map(a=>'<div class="wd"><h4>'+esc(a.title)+'</h4><div class="ch">late of the '+esc(a.channel)+' catalogue</div><p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>');
}

/* §4 — the circular & proofs */
const selS=strats[sel]||strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  dept('Department the Fourth','The Featured Selection','a descriptive circular with process proofs',
  '<div class="rx"><div class="circular"><div class="k2">Descriptive Circular · Gratis</div>'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Addressed to</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>The refrain</dt><dd class="msg">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Featured voice</dt><dd>'+esc(selS.heroSignal||'—')+'</dd></dl>':'<div class="lede">no circular printed</div>')+
  '<div class="foot">Copies mailed free to dealers upon application.</div></div>'+
  '<div class="proofs">'+CREAT.map((m,i)=>
    '<figure class="proof"><div class="imgw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" loading="lazy" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
    '<figcaption><span class="h">Proof '+['A','B','C','D'][i]+' — '+esc(m.head)+'</span><span class="p">process · '+esc(m.provider)+'</span></figcaption></figure>').join('')+
  '</div></div>');
}

/* §5 — waxes & pigments */
dept('Department the Fifth','Waxes & Pigments','compounded in our laboratory; shade guaranteed',
  '<div class="waxes">'+PALETTE.map((s,i)=>
    '<div class="wax"><div class="sw" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">No. '+(i+1)+' · '+s.h.toUpperCase()+'</div></div>').join('')+
  '</div>');

/* §6 — expedition report */
if(B.evidence||affs.length){
  dept('Department the Sixth','Report of the Recording Expedition','the Qloo field unit, sworn returns appended',
  '<div class="expo"><p class="mem"><b>MEMORANDUM.</b> The signals engraved herein were captured in the field by the <b>Qloo Acoustic Survey</b>, operating in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'—').toUpperCase()+' mode</b> across <b>'+calls.length+' expeditions</b>; no resonance was fabricated after the fact.</p>'+
  '<div class="exgrid"><div><table class="log"><thead><tr><th>Instrument</th><th>Takes</th><th>Ms.</th><th>Mode</th></tr></thead><tbody>'+
  calls.map(c=>'<tr><td><span class="ep">'+esc(c.endpoint)+'</span><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,20)).join(' '))+'</span></td>'+
    '<td>'+esc(c.n)+'</td><td>'+esc(c.tookMs)+'</td><td><span class="md">'+esc(c.mode)+'</span></td></tr>').join('')+
  '</tbody></table></div>'+
  '<div class="reg">'+affs.map(g=>'<div class="g">Register · '+esc(g.type.replace('urn:entity:',''))+'</div>'+
    g.entities.slice(0,4).map(e=>'<div class="row"><span class="nm">'+esc(e.name)+'</span><span class="bar"><i style="width:'+pct(e.affinity)+'%"></i></span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+
  '</div></div></div>');
}

/* §7 — order blank */
dept('Department the Seventh','Order Blank','tick the requisition & return by post',
  '<div class="blank">'+['Campaign microsite','Brandbook PDF','Video cut','Performance plan'].map(x=>'<button type="button"><span class="tick">✓</span>'+esc(x)+'</button>').join('')+'</div>'+
  '<div class="blanknote">Dealers are reminded that all requisitions are filled in strict rotation; terms cash with order.</div>');

if(!M.children.length)M.appendChild(el('<div class="empty">The catalogue is unprinted — data.js failed to arrive by post. No records may be ordered.</div>'));
})();
</script>
</body>
</html>
