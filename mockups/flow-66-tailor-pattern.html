<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marque &amp; Fil — Pattern Draft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F0E7D2'/%3E%3Cpath d='M20 12 C30 22 34 22 44 12 L52 20 C48 32 50 44 52 54 L12 54 C14 44 16 32 12 20 Z' fill='none' stroke='%23A93E2B' stroke-width='2.5' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --tissue:#F0E7D2;--tissue2:#E9DCBF;--paper:#FBF6E9;--ink:#3E382E;--mut:#8C8271;
  --pen:#A93E2B;--line:#CEC0A0;
  --f:'Karla','Segoe UI',Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#6B5B3E;color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:rgba(169,62,43,.2)}
a{color:var(--pen);text-decoration:none;border-bottom:1.5px solid var(--pen)}
a:hover{color:var(--ink);border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--pen);outline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;max-width:100%}

.sheet{
  max-width:1040px;margin:26px auto 80px;background:var(--tissue);
  background-image:
    repeating-linear-gradient(0deg,rgba(62,56,46,.05) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(90deg,rgba(62,56,46,.05) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(62,56,46,.09) 0 1px,transparent 1px 130px),
    repeating-linear-gradient(90deg,rgba(62,56,46,.09) 0 1px,transparent 1px 130px);
  border:1.5px solid #57492F;box-shadow:0 30px 70px rgba(0,0,0,.45);padding:clamp(12px,2.6vw,26px);
}

/* order ticket */
.ticket{display:grid;grid-template-columns:1fr auto;gap:14px;background:var(--paper);border:1.5px solid var(--ink);padding:16px 22px;position:relative}
.ticket::before{content:"";position:absolute;top:-7px;right:60px;width:70px;height:14px;background:rgba(169,62,43,.28);transform:rotate(2deg)}
.ticket .firm{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}
.ticket h1{font-size:clamp(23px,4.6vw,36px);font-weight:700;letter-spacing:.01em;line-height:1.08;margin-top:4px}
.ticket h1 em{font-style:italic;color:var(--pen)}
.ticket .ask{font-size:clamp(15px,2.6vw,19px);font-weight:600;margin-top:8px}
.ticket .url{font-family:var(--mono);font-size:10px;margin-top:5px;overflow-wrap:anywhere;color:var(--mut)}
.ticket .client{border-left:1.5px dashed var(--line);padding-left:16px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;justify-content:center;gap:3px}
.ticket .client b{color:var(--ink);font-size:13px}
@media(max-width:640px){.ticket{grid-template-columns:1fr}.ticket .client{border-left:none;border-top:1.5px dashed var(--line);padding:10px 0 0}}

section{margin-top:clamp(16px,3vw,26px)}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-h .no{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--paper);background:var(--pen);padding:3px 9px;letter-spacing:.2em}
.sec-h h2{font-size:clamp(20px,4vw,30px);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sec-h .sub{margin-left:auto;font-style:italic;color:#5E5138;font-size:13px}

/* measurement card = audience */
.meas{background:var(--paper);border:1.5px solid var(--ink);display:grid;grid-template-columns:auto 1fr;gap:0}
@media(max-width:660px){.meas{grid-template-columns:1fr}}
.meas .stub{background:var(--pen);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px;gap:6px}
.meas .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:9px;letter-spacing:.34em;text-transform:uppercase}
@media(max-width:660px){.meas .stub{padding:7px}.meas .stub span{writing-mode:horizontal-tb;transform:none}}
.meas table{width:100%;border-collapse:collapse;font-size:14px}
.meas td{padding:7px 16px;border-bottom:1px dashed var(--line);vertical-align:top}
.meas tr:last-child td{border-bottom:none}
.meas td.k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--pen);width:132px;padding-top:11px;font-weight:700}
.meas .big{font-size:clamp(19px,3vw,26px);font-weight:700}
.meas .cb{display:inline-flex;align-items:center;gap:8px}
.meas .cb .tg{width:130px;height:9px;border:1.5px solid var(--ink);background:#fff}
.meas .cb .tg i{display:block;height:100%;background:var(--pen)}
.meas .words span{display:inline-block;font-style:italic;border:1.5px solid var(--pen);color:var(--pen);border-radius:999px;padding:1px 11px;margin:2px 6px 2px 0;font-size:13px}

/* pattern pieces */
.draft{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2.6vw,24px)}
@media(max-width:720px){.draft{grid-template-columns:1fr}}
.piece{background:var(--tissue2);border:1.5px solid var(--line);padding:10px 14px 14px;position:relative}
.piece .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1.5px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
.piece .ph .pn{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--pen);font-weight:700}
.piece .ph h3{font-size:clamp(18px,3.2vw,25px);font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.piece svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.piece .spec{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:4px}
.piece .spec b{font-weight:700}
.piece .alt{font-style:italic;color:var(--pen);font-size:13px;margin-top:5px}
.piece .alt::before{content:"ALTER — ";font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.22em}
.piece .fmt span{font-size:11.5px;font-style:italic;border:1px solid var(--mut);color:#5E5138;border-radius:999px;padding:1px 9px;margin-right:5px;display:inline-block;margin-top:5px}
.piece.star{background:linear-gradient(135deg,rgba(169,62,43,.06),transparent 60%),var(--tissue2)}

/* rejected muslins */
.bin{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:660px){.bin{grid-template-columns:1fr}}
.muslin{background:var(--tissue2);border:1.5px dashed var(--ink);padding:12px 16px;position:relative;opacity:.92}
.muslin::after{content:"";position:absolute;inset:0;background:
  linear-gradient(35deg,transparent 46%,rgba(169,62,43,.7) 46% 54%,transparent 54%),
  linear-gradient(-35deg,transparent 46%,rgba(169,62,43,.7) 46% 54%,transparent 54%);
  opacity:.5;pointer-events:none}
.muslin h4{font-size:18px;font-weight:700;text-transform:uppercase}
.muslin h4 s{text-decoration-color:var(--pen);text-decoration-thickness:2.5px}
.muslin .ch{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.muslin p{font-size:13px;font-style:italic;color:#5E5138;margin-top:4px;position:relative;z-index:1;background:rgba(240,231,210,.7);display:inline}

/* finished garment + fittings */
.garment{display:grid;grid-template-columns:1fr;gap:16px}
.spec-card{background:var(--paper);border:2px solid var(--ink);padding:16px 22px;position:relative}
.spec-card::after{content:"FINISHED GARMENT";position:absolute;top:-11px;right:18px;background:var(--ink);color:var(--tissue);font-family:var(--mono);font-size:9px;letter-spacing:.24em;padding:3px 10px}
.spec-card h3{font-size:clamp(24px,4.4vw,36px);font-weight:700;line-height:1.08}
.spec-card .lede{font-style:italic;margin:7px 0 12px;font-size:15.5px}
.spec-card dl{display:grid;grid-template-columns:122px 1fr;gap:5px 16px;font-size:14px}
.spec-card dt{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--pen);padding-top:4px}
.spec-card dd{border-bottom:1px dashed var(--line);padding-bottom:7px}
.spec-card .km{font-weight:700;font-size:17px}
.fits{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.fits{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.fits{grid-template-columns:1fr}}
.fitting{background:#fff;border:1.5px solid var(--ink);padding:7px 7px 0;transform:rotate(-.5deg);transition:transform .15s ease}
.fitting:nth-child(2n){transform:rotate(.6deg)}
.fitting:hover{transform:rotate(0) scale(1.03)}
.fitting .tape{width:78px;height:18px;background:rgba(169,62,43,.16);border:1px dashed var(--pen);margin:-16px auto 4px;position:relative;transform:rotate(-2deg)}
.fitting .iw{aspect-ratio:1/1;overflow:hidden;border:1px solid var(--line)}
.fitting .iw img{width:100%;height:100%;object-fit:cover}
.fitting figcaption{padding:8px 2px}
.fitting .h{font-size:12.5px;font-weight:600;line-height:1.4}
.fitting .p{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--pen);text-transform:uppercase;margin-top:2px}

/* fabric bolts */
.bolts{display:flex;flex-wrap:wrap;gap:16px}
.bolt{width:126px}
.bolt .roll{height:52px;border:1.5px solid var(--ink);border-radius:999px;position:relative;overflow:hidden}
.bolt .roll::after{content:"";position:absolute;top:0;bottom:0;right:12px;width:12px;background:rgba(0,0,0,.14);border-radius:0 999px 999px 0}
.bolt .n{font-size:13.5px;font-weight:700;margin-top:7px;text-align:center}
.bolt .h{font-family:var(--mono);font-size:9px;color:var(--mut);text-align:center}

/* mill records = qloo */
.mill{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(14px,3vw,26px);background:var(--paper);border:1.5px solid var(--ink);padding:16px 20px}
@media(max-width:760px){.mill{grid-template-columns:1fr}}
.mill .mem{font-style:italic;font-size:14px;margin-bottom:10px}
.mill .mem b{color:var(--pen)}
.inv{font-family:var(--mono);font-size:10.5px}
.inv .lr{padding:6px 0;border-bottom:1px dashed var(--line)}
.inv b{color:var(--pen);font-size:11px}
.inv .pm{color:var(--mut);overflow-wrap:anywhere;display:block}
.inv .me{display:flex;gap:12px;color:var(--mut);flex-wrap:wrap}
.lib{border:1.5px solid var(--ink);background:var(--tissue);padding:12px 16px}
.lib h4{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--pen);margin-bottom:6px}
.lib .dv{font-weight:700;text-transform:uppercase;font-size:13px;border-bottom:1.5px solid var(--ink);padding:7px 0 3px}
.lib .rw{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line)}
.lib .rw:last-child{border-bottom:none}
.lib .rw .v{font-family:var(--mono);font-size:10.5px;color:var(--mut)}

/* cut again */
.nextrow{display:flex;flex-wrap:wrap;gap:10px}
.nextrow button{border:1.5px solid var(--ink);background:var(--paper);padding:10px 20px;font-family:var(--f);font-weight:700;font-size:14px;font-style:italic;transition:background .12s ease,color .12s ease,transform .12s ease}
.nextrow button:hover{background:var(--pen);border-color:var(--pen);color:var(--paper)}
.nextrow button:active{transform:translateY(2px)}
.nextrow .sub{width:100%;font-style:italic;color:#5E5138;font-size:13px}
.rail{margin-top:12px;font-size:13.5px;color:#5E5138}
.rail b{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--pen);display:block;margin-bottom:4px}
.rail span{display:inline-block;margin-right:14px;font-style:italic;border-bottom:1px dashed var(--mut)}
.foot{text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#57492F;margin-top:26px}
.empty{background:var(--paper);padding:40px;text-align:center;font-style:italic;color:var(--mut)}
</style>
</head>
<body>
<div class="sheet">
  <header class="ticket">
    <div>
      <div class="firm">Marque &amp; Fil · Tailors &amp; Cutters · Pattern Room</div>
      <h1>Pattern Draft — <em>cut on the cross</em></h1>
      <div class="ask" id="s-ask"></div>
      <div class="url" id="s-url"></div>
      <div class="url" id="s-note" style="font-style:italic"></div>
    </div>
    <div class="client">Order ticket<b id="s-no"></b><span id="s-date"></span><span>Client: The Campaign</span></div>
  </header>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script src="./data.js"></script>
<script src="./media-data.js"></script>
<script src="./dash-data.js"></script>
<script>
(function(){
"use strict";
const B=(window.DATA&&window.DATA.board)||{};
const POOL=(window.MEDIA&&window.MEDIA.pool)||[];
const DASH=window.DASH||{};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fix=p=>p?String(p).replace(/^\.\//,'./'):'';
const f2=x=>(x||0).toFixed(2);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const dt=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}catch(e){return '—'}};

const PALETTE=[
  {n:'Peptide Blush',h:'#EFB7AE'},{n:'Glaze Milk',h:'#F7F0E5'},{n:'Crème Fraîche',h:'#F3E6CE'},
  {n:'Toasted Almond',h:'#B98A6F'},{n:'Espresso Bean',h:'#4E362B'}
];
const CREAT=[1,4,8,13].map(i=>POOL[i]).filter(Boolean);
const strats=B.strategies||[];
const sel=strats.reduce((b,s,i)=>b===null||((s.reach&&s.reach.estViews)||0)>((strats[b].reach&&strats[b].reach.estViews)||0)?i:b,null);
const calls=(B.evidence&&B.evidence.calls)||[];
const AR=B.audienceRead;
const anti=B.antiStrategies||[];
const affs=(B.qlooBundle&&B.qlooBundle.affinities)||[];

document.getElementById('s-ask').textContent='Commissioned: “'+((B.sub&&B.sub.prompt)||B.title||'')+'”';
const U=(B.sub&&B.sub.url)||(B.urlContext&&B.urlContext.url);
document.getElementById('s-url').innerHTML=U?'cloth sourced from: <a href="'+esc(U)+'">'+esc(U)+'</a>':'';
document.getElementById('s-note').textContent=(B.urlContext&&B.urlContext.title)?('the bolt reads — '+B.urlContext.title+': '+(B.urlContext.description||'').slice(0,90)+'…'):'';
document.getElementById('s-no').textContent='№ '+String(B.id||'—').slice(0,8).toUpperCase();
document.getElementById('s-date').textContent=dt(B.createdAt||B.fetchedAt);
document.getElementById('foot').textContent='MARQUE & FIL · PATTERN № '+String(B.id||'—').slice(0,8).toUpperCase()+' · MEASURE TWICE, CUT ONCE';

const M=document.getElementById('app');
const sec=(no,title,sub,body)=>{if(!body)return;M.appendChild(el('<section><div class="sec-h"><span class="no">'+esc(no)+'</span><h2>'+esc(title)+'</h2><span class="sub">'+esc(sub)+'</span></div>'+body+'</section>'))};

/* measurement card = audience */
if(AR&&AR.lean){
  sec('FIG 1','Client Measurements','taken at the last fitting — do not pad',
  '<div class="meas"><div class="stub"><span>Measured · Gen Z</span></div><table>'+
  '<tr><td class="k">Frame</td><td><span class="big">'+esc(AR.lean.label)+'</span></td></tr>'+
  '<tr><td class="k">Certainty</td><td><span class="cb"><b>'+Math.round((AR.lean.confidence||0)*100)+' cm</b><span class="tg"><i style="width:'+Math.round((AR.lean.confidence||0)*100)+'%"></i></span>of read confidence</span></td></tr>'+
  '<tr><td class="k">Proportions</td><td>'+(AR.lean.signals||[]).map(esc).join(' · ')+'</td></tr>'+
  '<tr><td class="k">Fittings held at</td><td>'+(AR.mediaHabits||[]).map(h=>'<b>'+esc(h.channel)+'</b> — '+esc(h.note)).join('<br>')+'</td></tr>'+
  '<tr><td class="k">Wears</td><td class="words">'+(AR.vibeWords||[]).map(w=>'<span>'+esc(w)+'</span>').join('')+'</td></tr>'+
  '</table></div>');
}

/* the draft = strategies as pattern pieces */
const PIECES=[
  {name:'BODICE FRONT',cut:'CUT 1 SELF + 1 LINING',
   d:'M95,32 C130,72 170,72 205,32 L242,58 C235,140 248,222 250,300 L50,300 C52,222 65,140 58,58 Z',
   grain:{x:150,y1:120,y2:270},notchPos:[[238,150,'right'],[58,180,'left']],note:{x:150,y:196}},
  {name:'SLEEVE',cut:'CUT 2',
   d:'M80,22 C110,62 190,62 220,22 L225,62 C215,140 208,222 200,308 L100,308 C92,222 85,140 75,62 Z',
   grain:{x:150,y1:100,y2:282},notchPos:[[222,140,'right'],[76,160,'left']],note:{x:150,y:200}},
  {name:'COLLAR',cut:'CUT 2 SELF + 1 INTERFACING',
   d:'M58,140 C112,92 188,92 242,140 L228,176 C182,136 118,136 72,176 Z',
   grain:{x:150,y1:210,y2:300},notchPos:[[236,148,'right'],[64,152,'left']],note:{x:150,y:140}},
  {name:'SKIRT FRONT',cut:'CUT 1 ON FOLD',
   d:'M100,32 C130,47 170,47 200,32 L262,306 C192,322 108,322 38,306 Z',
   grain:{x:150,y1:80,y2:290},notchPos:[[252,180,'right'],[46,196,'left']],note:{x:150,y:190}}
];
if(strats.length){
  sec('FIG 2','The Draft — Four Pieces','each piece carries the house signature',
  '<div class="draft">'+strats.map((s,i)=>{
    const fit=(s.audienceFit&&s.audienceFit.score)||0;
    const p=PIECES[i%PIECES.length];
    const chans=s.channels||[];
    let svg='<svg viewBox="0 0 300 340" role="img" aria-label="'+esc(p.name)+' pattern piece for '+esc(s.title)+'">';
    svg+='<path d="'+p.d+'" fill="rgba(251,246,233,.55)" stroke="#3E382E" stroke-width="2.2" stroke-dasharray="7 4" stroke-linejoin="round"/>';
    /* grainline */
    svg+='<line x1="'+p.grain.x+'" y1="'+p.grain.y1+'" x2="'+p.grain.x+'" y2="'+p.grain.y2+'" stroke="#A93E2B" stroke-width="1.6"/>';
    svg+='<path d="M'+p.grain.x+','+p.grain.y1+' l-5,10 h10 z" fill="#A93E2B"/><path d="M'+p.grain.x+','+p.grain.y2+' l-5,-10 h10 z" fill="#A93E2B"/>';
    svg+='<text x="'+(p.grain.x+9)+'" y="'+((p.grain.y1+p.grain.y2)/2)+'" font-size="10" fill="#A93E2B" letter-spacing="2">GRAIN</text>';
    /* notches = channels */
    chans.slice(0,2).forEach((c,ci)=>{
      const np=p.notchPos[ci%p.notchPos.length];
      svg+='<circle cx="'+np[0]+'" cy="'+np[1]+'" r="4.5" fill="#FBF6E9" stroke="#3E382E" stroke-width="1.8"/>';
      const tx=np[2]==='right'?np[0]-8:np[0]+8;
      svg+='<text x="'+tx+'" y="'+(np[1]-8)+'" font-size="10.5" text-anchor="'+(np[2]==='right'?'end':'start')+'" fill="#3E382E" font-weight="700">'+esc(c.name)+' '+f2(c.fit)+'</text>';
    });
    /* inside labels */
    svg+='<text x="'+p.note.x+'" y="'+p.note.y+'" font-size="13" font-weight="700" text-anchor="middle" fill="#3E382E" letter-spacing="1.5">'+esc(p.name)+'</text>';
    svg+='<text x="'+p.note.x+'" y="'+(p.note.y+16)+'" font-size="10" text-anchor="middle" fill="#3E382E">'+esc(p.cut)+'</text>';
    svg+='<text x="'+p.note.x+'" y="'+(p.note.y+32)+'" font-size="10.5" font-style="italic" text-anchor="middle" fill="#A93E2B">finished '+views(s.reach&&s.reach.estViews)+' at the hem</text>';
    if(i===sel)svg+='<text x="'+p.note.x+'" y="'+(p.note.y+48)+'" font-size="9" text-anchor="middle" fill="#A93E2B" letter-spacing="2">— THE HOUSE BLOCK —</text>';
    svg+='</svg>';
    return '<div class="piece'+(i===sel?' star':'')+'"><div class="ph"><span class="pn">Piece '+String.fromCharCode(65+i)+' · '+esc(p.name)+'</span><h3>'+esc(s.title)+'</h3></div>'+svg+
    '<div class="spec"><span>drape: <b>'+esc(s.angle||'')+'</b></span><span>ease: <b>'+f2(fit)+'</b></span><span>cloth signal: <b>'+esc(s.heroSignal||'—')+'</b></span></div>'+
    '<div>'+(s.formats||[]).map(f=>'<span class="fmt"><span>'+esc(f)+'</span></span>').join('')+'</div>'+
    ((s.watchouts&&s.watchouts[0])?'<div class="alt">'+esc(s.watchouts[0])+'</div>':'')+'</div>';
  }).join('')+'</div>');
}

/* rejected muslins = anti */
if(anti.length){
  sec('FIG 3','Rejected Muslins','chalked for the rag bin — do not recut',
  '<div class="bin">'+anti.map(a=>'<div class="muslin"><div class="ch">muslin · cloth: '+esc(a.channel)+'</div><h4><s>'+esc(a.title)+'</s></h4><p>'+esc(a.whyNot)+'</p></div>').join('')+'</div>');
}

/* finished garment = brief + fittings */
const selS=sel!=null?strats[sel]:strats[0];
if(selS||CREAT.length){
  const br=selS&&selS.brief;
  sec('FIG 4','The Finished Garment','pressed, photographed, ready for the client',
  '<div class="garment"><div class="spec-card">'+
  (br?'<h3>'+esc(br.title)+'</h3><div class="lede">'+esc(br.angle)+'</div>'+
  '<dl><dt>Made for</dt><dd>'+esc(br.audience)+'</dd>'+
  '<dt>The fit line</dt><dd class="km">“'+esc(br.keyMessage)+'”</dd>'+
  '<dt>Cut from</dt><dd>Piece '+String.fromCharCode(65+((sel!=null?sel:0)))+', '+esc(selS.title)+' — cloth '+esc(selS.heroSignal||'—')+'</dd></dl>'
  :'<div class="lede">No garment left the workroom.</div>')+
  '</div>'+
  '<div class="fits">'+CREAT.map(m=>'<figure class="fitting"><div class="tape"></div><div class="iw"><img src="'+esc(fix(m.img))+'" alt="'+esc(m.head)+'" onerror="this.closest(\'figure\').style.display=\'none\'"></div>'+
  '<figcaption><div class="h">'+esc(m.head)+'</div><div class="p">stitched by '+esc(m.provider)+'</div></figcaption></figure>').join('')+'</div></div>');
}

/* fabric bolts = palette */
sec('FIG 5','Bolts on the Shelf','five cloths approved for the season',
  '<div class="bolts">'+PALETTE.map(s=>'<div class="bolt"><div class="roll" style="background:'+s.h+'"></div><div class="n">'+esc(s.n)+'</div><div class="h">'+s.h.toUpperCase()+'</div></div>').join('')+'</div>');

/* mill records = qloo */
if(calls.length||affs.length){
  sec('FIG 6','Mill & Mercer Records','where the cloth was tested — Qloo supply line, '+esc((B.qlooBundle&&B.qlooBundle.mode)||'live'),
  '<div class="mill"><div><p class="mem"><b>Stock-keeper’s note.</b> Before cutting, <b>'+calls.length+' bolts</b> were sent to the Qloo mill for testing, all in <b>'+esc((B.qlooBundle&&B.qlooBundle.mode)||'live')+' condition</b>. The delivery book records each one.</p>'+
  '<div class="inv">'+calls.map(c=>'<div class="lr"><b>'+esc(c.endpoint)+'</b><span class="pm">'+esc(Object.entries(c.params||{}).map(kv=>kv[0]+'='+String(kv[1]).slice(0,34)).join(' · '))+'</span><span class="me"><span>delivered '+esc((c.at||'').slice(11,19))+'Z</span><span>'+esc(c.tookMs)+' ms at the counter</span><span>'+esc(c.n)+' swatches</span><span>'+esc(c.mode)+'</span></span></div>').join('')+'</div></div>'+
  '<div class="lib"><h4>Swatch library — what they reach for</h4>'+affs.map(g=>'<div class="dv">'+esc(g.type.replace('urn:entity:',''))+'</div>'+
  g.entities.slice(0,4).map(e=>'<div class="rw"><span>'+esc(e.name)+'</span><span class="v">'+e.affinity.toFixed(2)+'</span></div>').join('')).join('')+'</div></div>');
}

/* cut again */
const others=(DASH.plans||[]).filter(p=>p.id!==B.id).slice(0,4);
sec('FIG 7','Cut Again','the table is cleared for the next pattern',
  '<div class="nextrow">'+['Made-to-measure tag','Lookbook spread','Fitting video','Alterations plan'].map(x=>'<button type="button">'+esc(x)+'</button>').join('')+
  '<div class="sub">Same measurements, new silhouette — every cut reuses the draft.</div></div>'+
  (others.length?'<div class="rail"><b>Other orders on the rail</b>'+others.map(p=>'<span>'+esc(p.title)+'</span>').join('')+'</div>':''));

if(!M.children.length)M.appendChild(el('<section><div class="empty">The workroom is empty — the bolt of data never arrived.</div></section>'));
})();
</script>
</body>
</html>
