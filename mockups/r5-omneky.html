<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marque — Agent Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235a4fd6'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='800' font-family='sans-serif' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1b26; --ink-2:#4b4a5c; --mut:#8a8899; --faint:#b6b4c4;
    --line:#e9e6f0; --line-2:#f0edf6;
    --lilac:#7b6cf0; --lilac-soft:#efedfd; --lilac-deep:#5a4fd6;
    --bubble:#453aa1;           /* deep indigo user bubble */
    --green:#22a06b; --green-bg:#e5f6ee;
    --paper:#faf8f4; --card:#ffffff; --rail:#fbfafc;
    --r-lg:18px; --r-md:12px; --r-sm:9px;
    --shadow:0 30px 80px -30px rgba(90,79,214,.28), 0 8px 28px -12px rgba(28,27,38,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(720px 480px at 8% 105%, rgba(196,181,253,.45), transparent 62%),
      radial-gradient(760px 500px at 96% 108%, rgba(251,207,232,.5), transparent 60%),
      radial-gradient(560px 380px at 55% 115%, rgba(221,214,254,.35), transparent 65%),
      var(--paper);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:18px 34px 34px; -webkit-font-smoothing:antialiased;
  }

  /* ---------- slim app bar ---------- */
  .appbar{width:min(1320px,100%); display:flex; align-items:center; gap:12px; padding:2px 6px 16px}
  .wordmark{display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; letter-spacing:-.02em}
  .wordmark .gem{width:24px;height:24px;border-radius:8px;background:conic-gradient(from 210deg,#8f7bff,#5a4fd6 45%,#c084fc 80%,#8f7bff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 3px 8px -2px rgba(90,79,214,.6);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
  .crumb{font-size:12px;color:var(--mut);border:1px solid var(--line);background:rgba(255,255,255,.7);padding:4px 10px;border-radius:99px}
  .appbar .sp{flex:1}
  .iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.75);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;transition:.18s}
  .iconbtn:hover{background:#fff;border-color:#d9d4ea;transform:translateY(-1px)}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#fda4af,#a78bfa);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}

  /* ---------- step tabs ---------- */
  .steps{display:flex;align-items:center;gap:10px;margin:2px 0 18px}
  .steptabs{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px;box-shadow:0 4px 14px -6px rgba(28,27,38,.12)}
  .stab{display:flex;align-items:center;gap:8px;padding:8px 17px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:.2s;white-space:nowrap}
  .stab .n{font-weight:800;font-size:12px;color:var(--faint)}
  .stab:hover{color:var(--ink)}
  .stab.done{color:var(--ink-2)}
  .stab.done .n{color:var(--green)}
  .stab.on{background:#221f33;color:#fff;box-shadow:0 6px 14px -4px rgba(34,31,51,.5)}
  .stab.on .n{color:#b7b3d9}
  .pause{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;box-shadow:0 4px 14px -6px rgba(28,27,38,.14);transition:.2s}
  .pause:hover{transform:scale(1.06);color:var(--lilac-deep)}

  /* ---------- window ---------- */
  .window{width:min(1320px,100%);height:min(808px,calc(100vh - 148px));min-height:620px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .chrome{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line-2);background:linear-gradient(#fff,#fcfbfe)}
  .tl{width:11px;height:11px;border-radius:50%}
  .tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
  .tl.p{background:var(--lilac);margin-left:8px;box-shadow:0 0 0 3px var(--lilac-soft)}
  .chrome .ttl{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
  .chrome .live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--green);background:var(--green-bg);padding:3px 9px;border-radius:99px;margin-left:2px}
  .live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .chrome .sp{flex:1}
  .gbtn{font-size:12.5px;font-weight:600;color:var(--ink-2);background:none;border:none;cursor:pointer;padding:7px 12px;border-radius:9px;transition:.15s}
  .gbtn:hover{background:var(--lilac-soft);color:var(--lilac-deep)}
  .gpill{font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:#fff;cursor:pointer;transition:.15s}
  .gpill:hover{border-color:#cfc9ea;background:var(--lilac-soft)}
  .gpill.mut{color:var(--faint);cursor:default}
  .gpill.mut:hover{border-color:var(--line);background:#fff}

  .wbody{flex:1;display:flex;min-height:0}

  /* ---------- left rail ---------- */
  .rail{width:248px;flex:none;background:var(--rail);border-right:1px solid var(--line-2);padding:16px 14px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .newplan{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;transition:.18s;box-shadow:0 2px 6px -2px rgba(28,27,38,.08)}
  .newplan:hover{border-color:var(--lilac);color:var(--lilac-deep);box-shadow:0 6px 16px -6px rgba(90,79,214,.35);transform:translateY(-1px)}
  .newplan .plus{font-size:16px;font-weight:500}
  .rail-label{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--faint);padding:0 6px;display:flex;justify-content:space-between;align-items:center}
  .rail-label .cnt{background:var(--lilac-soft);color:var(--lilac-deep);border-radius:99px;padding:1px 7px;font-size:10px;letter-spacing:0}
  .planlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:0 -4px;padding:0 4px}
  .planlist::-webkit-scrollbar{width:5px}.planlist::-webkit-scrollbar-thumb{background:#e2def0;border-radius:9px}
  .pitem{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.16s;position:relative}
  .pitem:hover{background:#f4f2fb}
  .pitem.on{background:var(--lilac-soft);border-color:#ddd6f8}
  .pitem.on::before{content:'';position:absolute;left:-4px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--lilac)}
  .pitem .ic{width:26px;height:26px;flex:none;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--lilac-deep);margin-top:1px}
  .pitem.on .ic{background:var(--lilac);color:#fff;border-color:var(--lilac)}
  .pitem .tx{min-width:0}
  .pitem .t{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pitem .m{font-size:10.5px;color:var(--mut);margin-top:3px;font-weight:500}
  .rail-foot{flex:none;border-top:1px solid var(--line-2);padding-top:12px;display:flex;align-items:center;gap:9px}
  .rail-foot .th{display:flex}
  .rail-foot .th img{width:30px;height:30px;border-radius:8px;object-fit:cover;border:2px solid #fff;margin-left:-8px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .rail-foot .th img:first-child{margin-left:0}
  .rail-foot .cap{font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.35}

  /* ---------- chat column ---------- */
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(#efeaf8 1px,transparent 1.1px) 0 0/22px 22px, #fff}
  .scroll{flex:1;overflow-y:auto;padding:20px 44px 14px;display:flex;flex-direction:column;gap:16px}
  .scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:#ddd8ee;border-radius:9px}

  .msg-user{align-self:flex-end;max-width:62%;display:flex;flex-direction:column;align-items:flex-end;animation:rise .5s .05s both}
  .bubble{background:var(--bubble);color:#fff;font-size:14.5px;line-height:1.5;font-weight:500;padding:14px 18px;border-radius:18px 18px 5px 18px;box-shadow:0 10px 26px -10px rgba(69,58,161,.55)}
  .stamp{font-size:10.5px;color:var(--faint);margin-top:6px;font-weight:600}

  .msg-agent{display:flex;gap:13px;max-width:97%;animation:rise .5s .18s both}
  .aav{width:32px;height:32px;flex:none;border-radius:50%;background:conic-gradient(from 200deg,#8f7bff,#5a4fd6 50%,#c084fc 85%,#8f7bff);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 10px -2px rgba(90,79,214,.5);margin-top:2px}
  .astack{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
  .atext{font-size:14px;color:var(--ink-2);line-height:1.55}
  .atext b{color:var(--ink)}

  /* checklist card */
  .checkcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px 9px;box-shadow:0 4px 14px -8px rgba(28,27,38,.12);max-width:440px}
  .checkcard .ch{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--faint);margin-bottom:7px}
  .step{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);font-weight:500;padding:3px 0;opacity:0;animation:stepin .45s both;animation-delay:calc(.55s + var(--i)*.42s)}
  @keyframes stepin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .step .ck{width:18px;height:18px;flex:none;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center}
  .step.pending{color:var(--mut)}
  .spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #e2def2;border-top-color:var(--lilac);animation:rot 1s linear infinite;margin:1px}
  @keyframes rot{to{transform:rotate(360deg)}}
  .step .more{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:600}

  /* results */
  .res-head{display:flex;align-items:baseline;gap:10px;margin-top:2px}
  .res-head .t{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .res-head .s{font-size:11.5px;color:var(--mut);font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;max-width:1100px}
  .scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.2s;opacity:0;animation:rise .5s both;animation-delay:calc(1.1s + var(--i)*.16s);position:relative;overflow:hidden}
  .scard::after{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--lilac),#c084fc);opacity:0;transition:.2s}
  .scard:hover{transform:translateY(-3px);border-color:#d6cff2;box-shadow:0 14px 30px -14px rgba(90,79,214,.4)}
  .scard:hover::after{opacity:1}
  .scard .no{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--lilac-deep);background:var(--lilac-soft);display:inline-block;padding:3px 8px;border-radius:6px;margin-bottom:8px}
  .scard .st{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3;margin-bottom:9px;min-height:26px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .chip{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ink-2);background:#f6f4fb;border:1px solid #eeebf8;padding:3px 8px;border-radius:99px}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--c,#999)}
  .scard .views{font-size:11.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:5px}
  .scard .views b{color:var(--ink)}
  .scard.ghost{border-style:dashed;display:grid;place-items:center;color:var(--faint);font-size:12px;font-weight:700;min-height:96px;background:#fcfbfe}
  .scard.ghost:hover{color:var(--lilac-deep);border-color:#d6cff2}

  /* attachments strip */
  .attach{max-width:820px}
  .attach .ah{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.11em;color:var(--faint);margin-bottom:9px}
  .attach .ah .cnt{background:var(--lilac-soft);color:var(--lilac-deep);border-radius:99px;padding:1px 8px;font-size:10px}
  .athumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
  .athumbs::-webkit-scrollbar{height:5px}.athumbs::-webkit-scrollbar-thumb{background:#ddd8ee;border-radius:9px}
  .thumb{flex:none;width:106px;opacity:0;animation:rise .5s both;animation-delay:calc(1.5s + var(--i)*.1s)}
  .thumb .im{width:106px;height:74px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#f3f1f9;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
  .thumb:hover img{transform:scale(1.07)}
  .thumb .im .nb{position:absolute;right:5px;bottom:5px;background:rgba(28,27,38,.78);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px}
  .thumb .tc{font-size:10px;color:var(--mut);font-weight:500;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* composer */
  .composer{flex:none;padding:10px 44px 13px;border-top:1px solid var(--line-2);background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
  .cbox{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:8px 8px 8px 18px;transition:.2s;box-shadow:0 6px 18px -10px rgba(28,27,38,.15)}
  .cbox:focus-within{border-color:var(--lilac);box-shadow:0 8px 24px -10px rgba(90,79,214,.45)}
  .cbox input{flex:1;border:none;outline:none;font:inherit;font-size:14px;color:var(--ink);background:none}
  .cbox input::placeholder{color:var(--faint)}
  .cbtn{width:36px;height:36px;border-radius:11px;border:none;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .cbtn:hover{background:var(--lilac-soft);color:var(--lilac-deep)}
  .send{width:40px;height:36px;border-radius:11px;border:none;background:linear-gradient(135deg,var(--lilac),var(--lilac-deep));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 14px -4px rgba(90,79,214,.55);transition:.18s}
  .send:hover{transform:translateY(-1px);box-shadow:0 10px 20px -6px rgba(90,79,214,.6)}
  .chint{text-align:center;font-size:10.5px;color:var(--faint);margin-top:6px;font-weight:500}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media(max-width:1180px){.msg-agent{max-width:100%}.scroll,.composer{padding-left:26px;padding-right:26px}}
</style>
</head>
<body>

  <!-- slim app bar -->
  <div class="appbar">
    <div class="wordmark"><span class="gem">M</span>Marque</div>
    <div class="crumb">Agent workspace</div>
    <div class="sp"></div>
    <button class="iconbtn" title="Search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="iconbtn" title="Notifications"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
    <div class="avatar"></div>
  </div>

  <!-- step tabs -->
  <div class="steps">
    <div class="steptabs" id="steptabs"></div>
    <button class="pause" title="Pause agent"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
  </div>

  <!-- window -->
  <div class="window">
    <div class="chrome">
      <span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="tl p"></span>
      <span class="ttl">Marque Agent</span>
      <span class="live"><span class="dot"></span>Working</span>
      <div class="sp"></div>
      <button class="gbtn">＋ New chat</button>
      <button class="gpill">Assets</button>
      <span class="gpill mut">Dashboard demo</span>
    </div>
    <div class="wbody">
      <aside class="rail">
        <button class="newplan"><span class="plus">＋</span> New plan</button>
        <div class="rail-label">PLANS <span class="cnt" id="plancnt"></span></div>
        <div class="planlist" id="planlist"></div>
        <div class="rail-foot" id="railfoot"></div>
      </aside>
      <main class="chat">
        <div class="scroll" id="scroll"></div>
        <div class="composer">
          <div class="cbox">
            <input type="text" placeholder="Ask Marque…" id="ask">
            <button class="cbtn" title="Attach"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
            <button class="cbtn" title="Voice"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg></button>
            <button class="send" title="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
          </div>
          <div class="chint">Marque reads your brand's taste graph, then drafts strategies, creatives &amp; launch plans.</div>
        </div>
      </main>
    </div>
  </div>

<script src="dash-data.js"></script>
<script src="media-data.js"></script>
<script>
(function(){
  'use strict';
  var DASH = window.DASH || {plans:[], recent:[]};
  var MEDIA = (window.MEDIA && window.MEDIA.pool) || [];
  var plans = DASH.plans || [];
  var CH_COLOR = {tiktok:'#fe2c55', instagram:'#c13584', guerrilla:'#f59e0b', streaming:'#8b5cf6', youtube:'#ff0033', meta:'#0081fb', x:'#111111', web:'#64748b', pinterest:'#e60023', snapchat:'#eab308'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
  function kfmt(n){return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':n>=1e3?Math.round(n/1e3)+'K':String(n)}
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function stamp(iso){var d=new Date(iso);if(isNaN(d))return '';var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;
    return MONTHS[d.getMonth()]+' '+d.getDate()+' · '+h+':'+(m<10?'0':'')+m+' '+ap}

  /* ---------- step tabs ---------- */
  var STEP_NAMES=['Strategy','Creatives','References','Launch'];
  var ACTIVE_STEP=2; // references pulling (0-based) — matches in-flight checklist row
  document.getElementById('steptabs').innerHTML = STEP_NAMES.map(function(n,i){
    var cls = i<ACTIVE_STEP?'stab done':(i===ACTIVE_STEP?'stab on':'stab');
    var num = i<ACTIVE_STEP?'✓':(i+1);
    return '<div class="'+cls+'"><span class="n">'+num+'</span>'+n+'</div>';
  }).join('');

  /* ---------- rail ---------- */
  document.getElementById('plancnt').textContent = plans.length;
  var listEl = document.getElementById('planlist');
  var selId = (plans.find(function(p){return p.active})||plans[0]||{}).id;

  function planIcon(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>';
  }
  function renderRail(){
    listEl.innerHTML = plans.map(function(p,i){
      return '<div class="pitem'+(p.id===selId?' on':'')+'" data-id="'+esc(p.id)+'" style="animation:rise .4s '+(i*0.05)+'s both">'
        +'<span class="ic">'+planIcon()+'</span>'
        +'<span class="tx"><span class="t">'+esc(p.title)+'</span>'
        +'<span class="m">'+(p.strategyCount||0)+' strategies · ~'+kfmt(p.estViews||0)+' views</span></span></div>';
    }).join('');
    Array.prototype.forEach.call(listEl.children,function(el){
      el.addEventListener('click',function(){selId=el.getAttribute('data-id');renderRail();renderChat();});
    });
  }

  /* rail footer — recent work mini thumbs */
  var recent = DASH.recent||[];
  document.getElementById('railfoot').innerHTML =
    '<span class="th">'+recent.slice(0,3).map(function(r){
      return '<img src="'+esc(r.thumb)+'" alt="" onerror="this.remove()">';
    }).join('')+'</span>'
    +'<span class="cap">Recent work<br>'+recent.reduce(function(a,r){return a+(r.n||0)},0)+' assets generated</span>';

  /* ---------- chat ---------- */
  var scrollEl = document.getElementById('scroll');
  var CK='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var EYE='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';

  function channelsHTML(chs){
    return '<div class="chips">'+chs.map(function(c){
      var key=String(c).toLowerCase();
      return '<span class="chip"><i style="--c:'+(CH_COLOR[key]||'#8a8899')+'"></i>'+esc(cap(c))+'</span>';
    }).join('')+'</div>';
  }

  function renderChat(){
    var p = plans.find(function(x){return x.id===selId}) || plans[0];
    if(!p){scrollEl.innerHTML='';return}
    var isLive = !!p.active;
    var n = p.strategyCount||((p.strategies||[]).length);
    var per = n? Math.round((p.estViews||0)/n):0;

    /* checklist — real pipeline: Qloo → scrape → strategies → references */
    var steps = [
      {t:'Read Qloo taste graph', done:true},
      {t:'Scraped product site', done:true},
      {t:'Drafted '+n+' strategies', done:true},
      {t:isLive?'Pulling references':'Pulled references', done:!isLive, more:isLive?'running':''}
    ];
    var stepsHTML = steps.map(function(s,i){
      return '<div class="step'+(s.done?'':' pending')+'" style="--i:'+i+'">'
        +(s.done?'<span class="ck">'+CK+'</span>':'<span class="spin"></span>')
        +esc(s.t)+(s.more?'<span class="more">'+esc(s.more)+'</span>':'')+'</div>';
    }).join('');

    /* strategy cards */
    var titles = p.strategies||[];
    var cardsHTML = titles.map(function(t,i){
      return '<div class="scard" style="--i:'+i+'">'
        +'<span class="no">STRATEGY '+(i+1)+'</span>'
        +'<div class="st">'+esc(t)+'</div>'
        +channelsHTML(p.channels||[])
        +'<div class="views">'+EYE+'<b>~'+kfmt(per)+'</b>&nbsp;est. views</div></div>';
    }).join('');
    if(titles.length < n){
      cardsHTML += '<div class="scard ghost" style="--i:'+titles.length+'">+'+(n-titles.length)+' more strateg'+(n-titles.length>1?'ies':'y')+'</div>';
    }

    /* attachments — recent work + media pool, deduped */
    var seen={}, items=[];
    recent.forEach(function(r){ if(r.thumb&&!seen[r.thumb]){seen[r.thumb]=1;items.push({img:r.thumb,cap:(r.n||'')+' assets · '+r.title,badge:'×'+r.n});} });
    MEDIA.forEach(function(m){ if(items.length>=8)return; if(m.img&&!seen[m.img]){seen[m.img]=1;items.push({img:m.img,cap:m.head||m.provider});} });
    var thumbsHTML = items.map(function(it,i){
      return '<div class="thumb" style="--i:'+i+'"><div class="im"><img src="'+esc(it.img)+'" alt="" loading="lazy" onerror="this.closest(\'.thumb\').remove()">'
        +(it.badge?'<span class="nb">'+esc(it.badge)+'</span>':'')+'</div><div class="tc">'+esc(it.cap)+'</div></div>';
    }).join('');

    scrollEl.innerHTML =
      '<div class="msg-user"><div class="bubble">'+esc(p.title)+'</div><div class="stamp">'+stamp(p.createdAt)+'</div></div>'
      +'<div class="msg-agent"><div class="aav">M</div><div class="astack">'
        +'<div class="atext">On it. I mapped <b>'+esc(p.title.split('→')[0].trim())+'</b> against the audience taste graph and drafted <b>'+n+' strategy routes</b> — ~'+kfmt(p.estViews||0)+' est. views combined.</div>'
        +'<div class="checkcard"><div class="ch">AGENT STEPS</div>'+stepsHTML+'</div>'
        +'<div class="res-head"><span class="t">Strategies</span><span class="s">'+n+' routes · ~'+kfmt(p.estViews||0)+' est. views</span></div>'
        +'<div class="cards">'+cardsHTML+'</div>'
        +'<div class="attach"><div class="ah"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>PULLED REFERENCES<span class="cnt">'+items.length+'</span></div>'
        +'<div class="athumbs">'+thumbsHTML+'</div></div>'
      +'</div></div>';
    scrollEl.scrollTop = 0;
  }

  renderRail();
  renderChat();

  /* composer: enter = playful ack bubble */
  document.getElementById('ask').addEventListener('keydown',function(e){
    if(e.key!=='Enter'||!this.value.trim())return;
    var b=document.createElement('div');b.className='msg-user';
    b.innerHTML='<div class="bubble">'+esc(this.value)+'</div><div class="stamp">just now</div>';
    scrollEl.appendChild(b);this.value='';scrollEl.scrollTop=scrollEl.scrollHeight;
  });
})();
</script>
</body>
</html>
